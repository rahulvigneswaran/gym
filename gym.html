:root{
  --bg:#FFFFFF; --surface:#F4F4F6; --surface2:#E9E9EE; --line:#E0E0E6;
  --ink:#111214; --ink2:#5B5E68; --ink3:#8B8E99;
  --accent:#4F46E5; --accent-ink:#FFFFFF; --accent-soft:#ECEBFC;
  --good:#127A43; --good-soft:#E4F3EA;
  --bad:#C62828; --bad-soft:#FBE9E9;
  --ease-calm:cubic-bezier(.22,1,.36,1);
  --ease-swift:cubic-bezier(.4,0,.2,1);
  --ease-spring:cubic-bezier(.34,1.4,.64,1);
  --t1:120ms; --t2:240ms; --t3:360ms;
  --font-d:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --font-t:"Archivo",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  --font-r:"Fraunces","Iowan Old Style",Charter,Georgia,serif;
  --font-n:"JetBrains Mono",ui-monospace,"SF Mono","Roboto Mono",monospace;
}
html[data-theme=dark]{
  --bg:#000000; --surface:#0C0C0F; --surface2:#17171D; --line:#26262E;
  --ink:#F2F2F5; --ink2:#9B9EA8; --ink3:#6C6F79;
  --accent:#8B8CFF; --accent-ink:#08080A; --accent-soft:#17172C;
  --good:#3DD68C; --good-soft:#0C2018;
  --bad:#FF6B6B; --bad-soft:#261012;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-t);
  font-size:16px;line-height:1.5;overflow:hidden;
  font-feature-settings:"cv05" 1,"ss03" 1;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}

/* ---------- layout ---------- */
.screen{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;
  padding:max(env(safe-area-inset-top),18px) 18px calc(214px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch}
.glass{background:var(--surface);border:1px solid var(--line);border-radius:26px}

/* ---------- today ---------- */
.hero{padding:26px 24px 24px;margin:10px 0 16px;transition:transform var(--t3) var(--ease-calm),opacity var(--t2)}
.hero .kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);font-weight:600;font-stretch:92%}
.hero h1{font-family:var(--font-d);font-size:clamp(40px,12vw,54px);line-height:.98;margin:12px 0 16px;
  letter-spacing:-.025em;font-weight:600;font-variation-settings:"opsz" 120,"SOFT" 0,"WONK" 1}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;padding:7px 13px;border-radius:999px;background:var(--surface2);color:var(--ink2);font-variant-numeric:tabular-nums}
.upnext{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink3);font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.upnext b{color:var(--ink2);font-weight:600}
.rest .hero h1{font-size:44px}
.sinking{transform:translateY(46vh) scale(.82);opacity:0}

/* ---------- day closed: done / rest ---------- */
.sumrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:11px 2px;border-bottom:1px solid var(--line)}
.sumrow:last-child{border-bottom:0}
.sumrow b{font-weight:600;font-size:14.5px;flex:1;min-width:0}
.sumrow span{font-family:var(--font-n);font-size:12px;color:var(--ink3);white-space:nowrap}
.nextcard{padding:18px 20px;border-radius:22px;border:1px solid var(--line);
  background:var(--surface);margin-top:14px}
.nextcard .tk{margin-bottom:7px}
.nextcard b{font-family:var(--font-d);font-size:24px;font-weight:600;letter-spacing:-.02em;display:block;
  font-variation-settings:"opsz" 60,"WONK" 0}
.nextcard span{font-family:var(--font-n);font-size:12.5px;color:var(--ink3);display:block;margin-top:5px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;
  background:var(--good-soft);color:var(--good);font-size:12px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase}

/* ---------- muscle map ---------- */
.mmap{display:block;width:100%;max-width:250px;height:auto;margin:0 auto}
.mmap .mq{fill:var(--surface2)}
.mmap .mh{fill:var(--accent)}
.mlegend{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;margin-top:12px}
.mlegend span{font-family:var(--font-n);font-size:10.5px;padding:3px 9px;border-radius:999px;
  background:var(--surface2);color:var(--ink2);white-space:nowrap}
.mcap{text-align:center;font-family:var(--font-n);font-size:10px;color:var(--ink3);
  letter-spacing:.12em;text-transform:uppercase;margin-top:10px}

/* ---------- technique ---------- */
.tech{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:11px 12px;
  border-radius:16px;border:1px solid var(--line);background:var(--surface);margin-top:14px;
  transition:transform var(--t1)}
.tech:active{transform:scale(.985)}
.tech .thumb{width:64px;height:64px;flex:none;border-radius:12px;overflow:hidden;background:var(--surface2)}
.tech .thumb img{width:100%;height:100%;object-fit:contain;display:block}
.tech .tt{flex:1;min-width:0}
.tech .tt b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.tech .tt span{font-family:var(--font-n);font-size:11.5px;color:var(--ink3)}
.tech .chev{color:var(--ink3);font-size:18px;flex:none}
.gifbig{width:100%;max-width:280px;aspect-ratio:1;margin:0 auto 6px;display:block;
  border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.gifbig img{width:100%;height:100%;object-fit:contain;display:block}
.steps{counter-reset:s;margin:6px 0 0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:13px 0 13px 34px;border-bottom:1px solid var(--line);
  font-size:14.5px;line-height:1.6;color:var(--ink2)}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:14px;
  font-family:var(--font-n);font-size:11px;color:var(--accent);font-weight:700}
.attrib{font-family:var(--font-n);font-size:10px;color:var(--ink3);text-align:center;margin-top:8px}
.attrib a{color:var(--ink3)}

/* ---------- exercise cards ---------- */
.exlist{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.ex{display:block;width:100%;text-align:left;padding:15px 18px;border-radius:22px;
  transition:transform var(--t1) var(--ease-swift)}
.ex:active{transform:scale(.985)}
.ex.cur{border-color:var(--accent)}
.ex.done .exname{opacity:.42;text-decoration:line-through}
.exhead{display:flex;align-items:center;gap:12px;width:100%}
.exidx{font-family:var(--font-n);font-size:12px;color:var(--ink3);min-width:18px;font-variant-numeric:tabular-nums}
.exname{font-weight:600;font-size:15.5px;flex:1;letter-spacing:-.011em}
.extarget{font-family:var(--font-n);font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.exsub{display:flex;align-items:center;gap:10px;margin:9px 0 0 30px}
.pips{display:flex;gap:4px;flex:none}
.pips i{width:14px;height:5px;border-radius:3px;background:var(--surface2);display:block}
.pips i.f{background:var(--accent)}
.pips i.n{background:var(--ink3)}
.exlast{font-family:var(--font-n);font-size:11.5px;color:var(--ink3);flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}

/* the same card, grown to fill the screen */
.ex.expanded{position:fixed;inset:0;z-index:35;border:0;border-radius:0;padding:0;
  background:var(--bg);display:flex;flex-direction:column}
.ex.expanded:active{transform:none}
.xhead{flex:none;width:100%;text-align:left;border-bottom:1px solid var(--line);
  padding:max(env(safe-area-inset-top),16px) 20px 15px}
.xkick{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-stretch:92%}
.xkick svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:2.8;
  stroke-linecap:round;stroke-linejoin:round}
.xname{font-family:var(--font-d);font-size:clamp(23px,6.5vw,28px);font-weight:600;
  letter-spacing:-.02em;line-height:1.1;margin:10px 0 12px;
  font-variation-settings:"opsz" 48,"WONK" 0}
.xtags{display:flex;gap:6px;flex-wrap:wrap}
.xtags span{font-size:11.5px;padding:4px 11px;border-radius:999px;
  background:var(--surface2);color:var(--ink2)}
.xbar{height:4px;border-radius:3px;margin-top:14px;overflow:hidden;
  background:var(--surface2)}
.xbar i{display:block;height:100%;border-radius:3px;background:var(--accent);
  transition:width var(--t3) var(--ease-calm)}
.xbody{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:14px 20px calc(186px + env(safe-area-inset-bottom))}

::view-transition-group(card){animation-duration:400ms;animation-timing-function:cubic-bezier(.22,1,.36,1)}
::view-transition-old(card),::view-transition-new(card){
  width:100%;height:100%;object-fit:cover;object-position:top left;animation-duration:280ms}
::view-transition-old(root),::view-transition-new(root){animation-duration:240ms}

/* ---------- logging ---------- */
.shead{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin:22px 0 11px;font-stretch:92%}
.setrow{display:grid;grid-template-columns:22px 1fr 1fr 66px;gap:3px 9px;align-items:center;margin-bottom:10px}
.thead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 11px}
.thead .shead{margin:0}
.barchip{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-n);font-size:11.5px;
  color:var(--ink2);background:var(--surface2);border:1px solid var(--line);border-radius:999px;
  padding:7px 13px;white-space:nowrap;font-variant-numeric:tabular-nums;transition:all var(--t1)}
.barchip svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.barchip:active{transform:scale(.95)}
.barchip.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.baredit{background:var(--surface2);border:1px solid var(--line);border-radius:17px;
  padding:13px 14px 14px;margin:0 0 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.baredit .bk{flex:1 1 100%;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);font-weight:700}
.baredit .seg{flex:1 1 190px;background:var(--bg)}
.baredit .seg button{flex:1;padding:9px 4px;font-family:var(--font-n);font-size:13px}
.bother{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3)}
.bother input{width:64px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);
  color:var(--ink);font-family:var(--font-n);font-size:14.5px;text-align:center;outline:none;padding:0;
  font-variant-numeric:tabular-nums}
.bother input:focus{border-color:var(--accent)}
.setcalc{grid-column:2/3;font-family:var(--font-n);font-size:11.5px;color:var(--ink3);
  text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.setcalc b{color:var(--accent);font-weight:700}
.setrow.done .setcalc{opacity:.7}
.setn{font-family:var(--font-n);font-size:13px;color:var(--ink3)}
.setrow.next .setn{color:var(--accent);font-weight:700}
.fld{position:relative}
.fld input{width:100%;height:66px;border-radius:18px;border:1px solid var(--line);
  background:var(--surface);padding:20px 8px 4px;font-family:var(--font-n);
  font-size:23px;text-align:center;font-variant-numeric:tabular-nums;outline:none;transition:border-color var(--t1)}
.fld input:focus{border-color:var(--accent)}
.fld input::placeholder{color:var(--ink3);opacity:.6;font-style:italic}
.setrow.next .fld input{border-color:var(--accent);background:var(--accent-soft)}
.fld label{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink3);pointer-events:none}
.tick{height:66px;border-radius:18px;border:1px solid var(--line);display:grid;place-items:center;
  background:var(--surface);transition:all var(--t1) var(--ease-swift)}
.tick:active{transform:scale(.94)}
.tick svg{width:24px;height:24px;stroke:var(--ink3);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.setrow.done .tick{background:var(--accent);border-color:var(--accent)}
.setrow.done .tick svg{stroke:var(--accent-ink)}
.setrow.done .fld input{opacity:.45}
.cues{margin:0;padding:0 0 0 16px;color:var(--ink3);font-size:13px;line-height:1.6}
.cues li{margin:6px 0}
.xnote{font-size:13.5px;color:var(--ink2);margin:14px 0 0;padding-left:12px;border-left:2px solid var(--accent)}

/* ---------- opening brief ---------- */
.intro{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;justify-content:center;
  padding:max(env(safe-area-inset-top),30px) 28px calc(28px + env(safe-area-inset-bottom));
  background:var(--bg);
  transition:opacity 600ms var(--ease-calm),transform 600ms var(--ease-calm)}
.intro.out{opacity:0;transform:scale(1.05);pointer-events:none}
.intro > *{animation:rise 720ms var(--ease-calm) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.i-greet{font-family:var(--font-d);font-size:clamp(26px,7.5vw,32px);font-weight:500;letter-spacing:-.02em;line-height:1.14;
  font-variation-settings:"opsz" 72,"WONK" 0}
.i-date{color:var(--ink3);font-size:13px;margin-top:6px;letter-spacing:.01em}
.i-rule{height:1px;background:var(--line);margin:24px 0}
.i-kick{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3);font-weight:600;font-stretch:92%}
.i-focus{font-family:var(--font-d);font-size:clamp(48px,16vw,72px);font-weight:600;letter-spacing:-.035em;
  line-height:.95;margin:12px 0 14px;font-variation-settings:"opsz" 144,"WONK" 1}
.i-meta{font-family:var(--font-n);font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.i-moves{font-size:13.5px;color:var(--ink3);line-height:1.75;margin-top:9px}
.i-open{font-size:14px;font-weight:600;color:var(--accent);line-height:1.5;margin-top:14px}
.i-stats{display:flex;gap:12px}
.i-stats div{flex:1;min-width:0}
.i-stats b{display:block;font-family:var(--font-n);font-size:clamp(22px,7vw,28px);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.i-stats span{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3)}
.i-line{font-family:var(--font-r);font-size:17px;font-weight:400;line-height:1.55;color:var(--ink2);margin-top:20px;
  font-variation-settings:"opsz" 18,"WONK" 0}

/* ---------- last time + trend ---------- */
.trend{padding:14px 15px;border-radius:18px;border:1px solid var(--line);
  background:var(--surface)}
.trend .th{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tk{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:700;display:block;font-stretch:92%}
.tv{font-family:var(--font-n);font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:3px;display:block}
.td{font-family:var(--font-n);font-size:11.5px;color:var(--ink3);line-height:1.6}
.delta{font-family:var(--font-n);font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:8px;
  background:var(--surface2);color:var(--ink2);white-space:nowrap}
.delta.up{color:var(--good);background:var(--good-soft)}
.delta.down{color:var(--bad);background:var(--bad-soft)}
.sets-prev{font-family:var(--font-n);font-size:12px;color:var(--ink2);margin-top:8px;line-height:1.7}
.spark{display:block;width:100%;height:48px;margin-top:10px;overflow:visible}
.sparkfoot{display:flex;justify-content:space-between;font-family:var(--font-n);font-size:10.5px;color:var(--ink3);margin-top:5px}

/* ---------- dock ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;pointer-events:none;
  padding:15px 18px calc(14px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:10px}
.dock::before{content:"";position:absolute;inset:0 0 0;pointer-events:none;
  background:var(--bg);border-top:1px solid var(--line)}
.puck,.handle,.acts{position:relative;pointer-events:auto}
.puck{width:100%;max-width:420px;height:64px;border-radius:22px;background:var(--accent);color:var(--accent-ink);
  font-family:var(--font-t);font-size:16.5px;font-weight:600;letter-spacing:-.005em;
  transition:transform var(--t2) var(--ease-spring),background var(--t2),opacity var(--t2);
  display:flex;align-items:center;justify-content:center;gap:10px}
.puck:active{transform:scale(.965)}
.puck.pulse{animation:pulse 420ms var(--ease-spring)}
@keyframes pulse{40%{transform:scale(1.045)}to{transform:scale(1)}}
.puck.ghost{background:var(--surface2);color:var(--ink2)}
.puck.resting{background:var(--surface2);color:var(--ink);position:relative;overflow:hidden}
.puck.resting::after{content:"";position:absolute;left:0;top:0;height:3px;
  width:var(--restpct,100%);background:var(--accent)}
.puck .sub{font-family:var(--font-n);font-size:12px;color:var(--ink3);font-weight:400;margin-left:2px}
.handle{display:flex;align-items:center;gap:8px;height:34px;padding:0 18px;border-radius:999px;
  background:var(--surface);color:var(--ink2);font-size:12.5px;font-weight:600;letter-spacing:.02em}
.handle[hidden]{display:none}
.handle .bar{width:22px;height:3px;border-radius:2px;background:var(--ink3);opacity:.6}

/* contextual pills above the puck */
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:420px;width:100%}
.acts:empty{display:none}
.act{height:36px;padding:0 15px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink2);
  background:var(--surface);border:1px solid var(--line);
  display:inline-flex;align-items:center;gap:7px;transition:transform var(--t1)}
.act:active{transform:scale(.95)}
.act.warn{color:var(--bad);background:var(--bad-soft);border-color:var(--bad-soft)}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;
  transition:opacity var(--t2) var(--ease-swift)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;height:92vh;height:92dvh;
  border-radius:30px 30px 0 0;transform:translateY(101%);
  transition:transform var(--t3) var(--ease-calm);display:flex;flex-direction:column;overflow:hidden}
.sheet.on{transform:translateY(0)}
.sheet .grab{padding:12px 0 6px;display:grid;place-items:center;flex:none;touch-action:none}
.sheet .grab i{width:40px;height:4px;border-radius:3px;background:var(--ink3);opacity:.45;display:block}
.sheet h2{font-family:var(--font-d);font-size:24px;font-weight:600;margin:2px 22px 12px;letter-spacing:-.02em;flex:none;
  font-variation-settings:"opsz" 60,"WONK" 0}
.sbody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 22px calc(30px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}

/* menu cards */
.mcard{display:block;width:100%;text-align:left;padding:20px;border-radius:22px;margin-bottom:12px;
  border:1px solid var(--line);background:var(--surface);transition:transform var(--t1)}
.mcard:active{transform:scale(.985)}
.mcard.bad{margin-top:20px;background:var(--bad-soft);border-color:var(--bad-soft)}
.mcard.bad b{color:var(--bad)}
.mcard b{font-family:var(--font-t);font-size:16.5px;font-weight:600;display:block;letter-spacing:-.012em}
.mcard span{color:var(--ink2);font-size:13.5px}

/* learn */
.search{width:100%;height:48px;border-radius:16px;border:1px solid var(--line);
  background:var(--surface);padding:0 16px;outline:none;margin-bottom:14px;font-size:15px}
.search:focus{border-color:var(--accent)}
.chap{display:flex;gap:14px;align-items:baseline;width:100%;text-align:left;padding:15px 4px;border-bottom:1px solid var(--line)}
.chap .n{font-family:var(--font-n);font-size:12px;color:var(--ink3);min-width:22px}
.chap .t{font-weight:600;flex:1;font-size:15.5px;letter-spacing:-.01em}
.chap .w{font-family:var(--font-n);font-size:11px;color:var(--ink3)}
.read{font-family:var(--font-r);font-size:17.5px;font-weight:400;line-height:1.7;color:var(--ink);
  font-variation-settings:"opsz" 18,"WONK" 0}
.read h3{font-family:var(--font-t);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);margin:32px 0 12px;font-weight:600;line-height:1.4}
.read p{margin:0 0 17px}
.read ul{margin:0 0 17px;padding-left:20px}
.read li{margin:8px 0}
.read .epi{font-style:italic;color:var(--ink2);border-left:2px solid var(--accent);padding-left:16px;margin:0 0 26px}
.read .epi cite{display:block;font-style:normal;font-size:13px;font-family:var(--font-t);color:var(--ink3);margin-top:8px}
.tbl{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}
.tbl span{font-family:var(--font-n);font-size:11.5px;padding:5px 10px;border-radius:8px;
  background:var(--surface2);color:var(--ink2)}
.hit{width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line)}
.hit b{font-size:11.5px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:5px}
.hit p{margin:0;font-size:14px;color:var(--ink2);line-height:1.55}
.hit mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 2px;font-weight:600}
.back{font-size:13.5px;color:var(--accent);font-weight:600;padding:8px 0;margin-bottom:6px;display:inline-block}

/* progress */
.stat{display:flex;gap:10px;margin-bottom:18px}
.stat div{flex:1;padding:15px;border-radius:18px;border:1px solid var(--line);background:var(--surface)}
.stat b{display:block;font-family:var(--font-n);font-size:23px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:11px;color:var(--ink3);letter-spacing:.07em;text-transform:uppercase}
.sess{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.sess .f{font-weight:600;flex:1;font-size:15px}
.sess .d{font-family:var(--font-n);font-size:12px;color:var(--ink3)}
.empty{color:var(--ink3);font-size:14.5px;text-align:center;padding:44px 20px;line-height:1.6}

/* ---------- progress charts ---------- */
.psub{font-size:12px;line-height:1.55;color:var(--ink3);margin:-6px 0 13px}
.wbars{display:flex;align-items:flex-end;gap:3px;height:104px;position:relative;border-bottom:1px solid var(--line)}
.wb{flex:1;height:100%;display:flex;align-items:flex-end}
.wb i{display:block;width:100%;min-height:2px;border-radius:3px 3px 0 0;background:var(--accent);opacity:.45}
.wb.now i{opacity:1}
.wb.zero i{background:var(--line);opacity:1;height:2px}
.wavg{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--ink3);opacity:.5}
.wfoot{display:flex;justify-content:space-between;font-family:var(--font-n);font-size:10.5px;
  color:var(--ink3);margin-top:7px;font-variant-numeric:tabular-nums}

.mrow{display:grid;grid-template-columns:74px 1fr 34px;align-items:center;gap:10px;margin-bottom:9px}
.mrow .mn{font-size:12.5px;color:var(--ink2)}
.mrow .mt{position:relative;height:13px;border-radius:7px;background:var(--surface2);overflow:hidden}
.mrow .mt .band{position:absolute;top:0;bottom:0;background:var(--accent-soft)}
.mrow .mt .fill{position:absolute;top:0;bottom:0;left:0;border-radius:7px;background:var(--accent)}
.mrow.low .mt .fill{background:var(--ink3)}
.mrow.over .mt .fill{background:var(--bad)}
.mrow .mv{font-family:var(--font-n);font-size:12px;text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}

.liftrow{display:grid;grid-template-columns:1fr 78px;gap:12px;align-items:center;width:100%;
  text-align:left;padding:13px 2px;border-bottom:1px solid var(--line)}
.liftrow:active{opacity:.6}
.liftrow .ln{font-size:14.5px;font-weight:600;letter-spacing:-.012em;display:block;margin-bottom:4px}
.liftrow .lm{font-family:var(--font-n);font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.liftrow .lm b{color:var(--ink);font-weight:700}
.liftrow .lm em{font-style:normal;font-weight:700}
.liftrow .lm em.up{color:var(--good)}
.liftrow .lm em.down{color:var(--bad)}
.liftrow .spark{height:32px;margin:0}

.cgrid{display:grid;grid-template-columns:repeat(7,24px) auto;justify-content:start;gap:5px}
.cgrid .ch{font-family:var(--font-n);font-size:9.5px;color:var(--ink3);text-align:center;padding-bottom:2px}
.cgrid i{width:24px;height:24px;border-radius:7px;background:var(--surface2)}
.cgrid i.on{background:var(--accent)}
.cgrid i.now{box-shadow:inset 0 0 0 1.5px var(--ink3)}
.cgrid .cn{font-family:var(--font-n);font-size:10.5px;color:var(--ink3);align-self:center;
  padding-left:7px;font-variant-numeric:tabular-nums}

.pbrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:11px 2px;
  border-bottom:1px solid var(--line)}
.pbrow .pn{font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbrow .pv{font-family:var(--font-n);font-size:12px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
.pbrow .pv b{color:var(--ink);font-weight:700}

/* programme guide */
.lede{font-family:var(--font-r);font-size:18px;font-weight:400;line-height:1.58;color:var(--ink2);margin:0 0 24px;
  font-variation-settings:"opsz" 20,"WONK" 0}
.rule{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}
.rule-n{font-family:var(--font-n);font-size:11px;color:var(--accent);font-weight:700;
  padding-top:3px;min-width:22px;font-variant-numeric:tabular-nums}
.rule b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.012em;margin-bottom:5px}
.rule p{margin:0;font-size:14px;line-height:1.6;color:var(--ink2)}

/* settings */
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}
.row label{font-size:15px;font-weight:500}
.row label .sub{display:block;font-size:11.5px;font-weight:400;color:var(--ink3);margin-top:3px}
.row input[type=number]{height:44px;width:96px;border-radius:13px;border:1px solid var(--line);
  background:var(--surface);padding:0 10px;outline:none;font-size:15px;font-family:var(--font-n);
  color:var(--ink);text-align:center;font-variant-numeric:tabular-nums;flex:none}
.row input[type=number]:focus{border-color:var(--accent)}
.row input[type=text],.row select{height:44px;border-radius:13px;border:1px solid var(--line);
  background:var(--surface);padding:0 12px;max-width:60%;outline:none;font-size:14.5px}
.seg{display:flex;gap:4px;padding:4px;border-radius:13px;background:var(--surface2)}
.seg button{padding:8px 14px;border-radius:10px;font-size:13.5px;color:var(--ink2);font-weight:600}
.seg button.on{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.danger{color:var(--bad);font-weight:600;font-size:14.5px;padding:17px 0;display:block;width:100%;text-align:left}
.note{color:var(--ink3);font-size:12.5px;line-height:1.6;margin:18px 0 4px}

/* ---------- data / export ---------- */
.dbtns{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 4px}
.dbtn{flex:1 1 auto;min-width:120px;height:48px;border-radius:15px;font-size:14px;font-weight:600;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform var(--t1)}
.dbtn:active{transform:scale(.97)}
.dbtn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dbtn:disabled{opacity:.4}
.ta{width:100%;min-height:118px;border-radius:16px;border:1px solid var(--line);resize:vertical;
  background:var(--surface);padding:13px;outline:none;
  font-family:var(--font-n);font-size:12px;line-height:1.5;color:var(--ink)}
.ta:focus{border-color:var(--accent)}
.rpt{border-radius:16px;border:1px solid var(--line);padding:14px;margin:12px 0;
  background:var(--surface);font-size:13.5px;line-height:1.7}
.rpt.bad{background:var(--bad-soft);border-color:var(--bad-soft);color:var(--bad)}
.rpt b{font-family:var(--font-n);font-size:12.5px}
.pill-ok{color:var(--good);font-weight:600}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:1ms!important;animation-duration:1ms!important}
}
</style>
</head>
<body>
<div class="screen" id="screen"></div>

<div class="dock">
  <div class="acts" id="acts"></div>
  <button class="puck" id="puck">Begin</button>
  <button class="handle" id="handle"><i class="bar"></i>Learn · Progress · Data</button>
</div>

<div class="scrim" id="scrim"></div>
<div class="intro" id="intro"></div>
<div class="sheet glass" id="sheet">
  <div class="grab" id="grab"><i></i></div>
  <h2 id="sheetTitle"></h2>

<script type="application/json" id="data-book">{"meta":{"source_file":"notes.pdf","converted_with":"markitdown 0.1.5","intermediate":"notes.md","generated_at":"2026-08-20T08:27:05+00:00","note":"Personal-use structured extraction of a purchased commercial e-book."},"book":{"title":"The Ultimate Guide to Body Recomposition","subtitle":"How to Build Muscle & Lose Fat at the Same Time","authors":["Jeff Nippard, BS","Chris Barakat, MS, ATC, CISSN"]},"table_of_contents":[{"number":0,"title":"Introduction","page":5},{"number":1,"title":"The Start Line","page":8},{"number":2,"title":"Tools of Titans","page":19},{"number":3,"title":"Belief Busting","page":35},{"number":4,"title":"Decoding Metabolism","page":47},{"number":5,"title":"Setting up the Diet: Calorie Intake","page":56},{"number":6,"title":"The Art Of Self-Coaching","page":77},{"number":7,"title":"The Skinny Fat Dilemma","page":84},{"number":8,"title":"Unpacking Macros and Micros","page":92},{"number":9,"title":"Solving the Mysteries of Protein","page":115},{"number":10,"title":"Solving the Mysteries of Carbohydrates","page":140},{"number":11,"title":"The Nutrition-Workout Link","page":152},{"number":12,"title":"Cardio: To-do or Not-to-do","page":174},{"number":13,"title":"Settling the Supplement Dilemma","page":183},{"number":14,"title":"Sleep: The Dark Horse of Body Recomp","page":200},{"number":15,"title":"Weight Training - The Driving Force of Body Recomp","page":215},{"number":16,"title":"Conclusion","page":229},{"number":17,"title":"Supplemental Materials","page":231},{"number":18,"title":"About the Authors","page":242},{"number":19,"title":"References","page":247}],"chapters":[{"number":0,"title":"Introduction","start_page":5,"epigraph":null,"sections":[{"paragraphs":["Congrats on purchasing your Ultimate Guide To Body Recomposition! We are pumped about your decision to optimize your body composition and thrilled to assist you in complementing your hard work in the gym with the latest nutritional science.","In the pages ahead, you will learn to separate the gym hearsay and daresay from the voice of current science. Then, once you have grasped the key nutritional tenets of building muscle and losing fat, we will guide you through an easy-to-implement application of this science. Our goal in writing this e-book is not to present a humdrum regurgitation of “bodybuilding nutrition 101” basics. We will not merely teach you about energy balance, how to track macros and tell you that you should eat one gram of protein per pound of bodyweight. While we will do a quick recap of the nutrition fundamentals at the beginning of each chapter to make sure everyone is keeping up with the plot, our goal is to teach you how to optimize your body composition. This means that most of the content in this book will be dedicated to digging a layer deeper.","As Beverly Sills points out, “There are no shortcuts to any place worth going.” This of course does not mean the longer route has to be arduous. Nor does it mean that understanding the essentials of nutrition to the degree that it will shift your body composition towards optimization requires a PhD in nutritional science.","We will present knowledge on how to optimize your nutritional approach as a means to improve your performance in the gym, maximize your recovery out of the gym and make the greatest gains possible. When we say optimize, we mean that we are valuing the most effective approach over the most time-efficient approach.","There are surely simpler nutritional approaches that can get you good results for less work than the ones laid out here. We will indeed outline those basics. We believe however, that to get the best results you can, it is important to cross more t’s and dot more i’s than what following the simplest path will provide.","As you will see, body recomposition (building muscle while losing fat) is not quite as straightforward as merely losing fat or merely building muscle. In our opinion, achieving both of these goals at the same time will require more attention to detail and a more optimized approach than your typical run-of-the-mill bulking or cutting diet. In this book, our goal is to get everything just right. This is what we mean when we say optimization.","From the outset, it’s worth noting that what is most optimal for you may not necessarily be most optimal for your gym buddy, or even for us. That’s mostly because your genetic ability to build muscle and lose fat may be different than someone else’s ability. In light of these individual differences, we will lay out specific principles and tools and teach you how to tailor them to your specific needs.","We are grateful for your confidence in us to provide you with the most current and relevant knowledge that will empower you along your fitness journey. Please know that we will be on the sidelines cheering for you every rep of the way."]}],"word_count":541},{"number":1,"title":"The Start Line","start_page":8,"epigraph":{"quote":"EVERYTHING SHOULD BE MADE AS SIMPLE AS POSSIBLE, NOT SIMPLER","attribution":"Albert Einstein"},"sections":[{"paragraphs":["Sometimes I get a rush watching sprinters as they stand at their start line, ready to explode from their starting block. Have you ever noticed that look in their eyes? The concentration ... the resolve … the pinned up potential, ready to launch … It’s inspiring to see. For the athlete, there is something special, even motivating, about being at the start line.","There is an old adage that says, “It’s not how you start that matters, but rather how you finish.” Maybe you have heard it, or even said it yourself.","Although there is certainly some truth to this platitude, it’s not our favorite line because it robs value from the importance of the start of any initiative. At the risk of propagating a cliché, or sounding overly philosophical, in some sense, every day is a new beginning - a new start line to reassess, adjust and aim to improve. We would rather proclaim, “Pay attention to how you start because it will not only determine how you finish, but determine your fulfillment along the way.” As we see it, one of the reasons so many people end up not finishing what they started is because they didn’t start the right, or most optimal, way. As you begin this book, it may help to think of it as your start block - a launching pad that can catapult you toward progress you may have previously thought unattainable. Gathering new knowledge is vital to the acquisition of new gains. We are hopeful that this book will be the source of that new knowledge.","For some, the information you read here may be a means of focusing your attention to what you already know and if so, can serve as an injection of motivation to get you applying that knowledge. When it comes to optimizing your approach to get to your goals, knowledge without application places you no further ahead than those who do not know.","So why not embrace the information and tools in these pages to spring from today’s start line with a resolve to build the best physique you can; one for which you have dreamed about for too long?","Go ahead. Get that Usain Bolt, Florence Griffith-Joyner look in your eye and let’s begin."]},{"heading":"KEEP IT SIMPLE, BUT NOT TOO SIMPLE","paragraphs":["One of the things we like about taking a science-based approach to training and nutrition is that it allows you to cut through the noise. In today’s influencer-based fitness landscape you have trainers and gurus throwing so much information out there that it can be difficult to figure out what actually matters.","In our opinion, the best way to figure out what really matters is through science. In this sense, the science of exercise and nutrition serves to simplify one’s approach. It cancels out the noise. Unfortunately, many people in the fitness industry have taken this simplification too far. Now, many are oversimplifying the many complexities of the human body to such a degree that they are falsifying how it really works.","If you’ve heard that it’s impossible to build muscle and lose fat at the same time, you have been presented with such oversimplified, misleading and false information. If you’ve heard that you MUST be in a calorie surplus to gain muscle or that you MUST be in a calorie deficit to lose fat, you have once again been nudged towards oversimplification.","In the spirit of optimizing your approach, in this book we will be taking a closer, more accurate look at the many variables that drive progress. Paying attention to more variables then, will require more of a conscious effort, especially in the early stages of a new approach to body recomposition.","Once your radars have been turned on to detect these previously undetected success factors, with time, the power of habit will release you from a more intentional focus. This closer attention to detail will reward you by yielding greater returns (gains) over time. Before we continue, those of you now bemoaning the presumption that we are about to unleash a super strict diet plan with an extremely rigid structure, or a needlessly convoluted approach before “majoring in the minors,” may exhale at this point. That is far from our approach.","Unless you are a dietary masochist, restrictive and rigid diets simply aren’t sustainable. We are assuming you are in this for the long haul, not just for the next month or two, so our approach will deviate from this method of deprivation or overcomplication.","Our goal is to provide you with a deeper understanding of the foundational body recomposition principles, as well as the finer details of nutrition necessary for not only getting you good results, but the best results you can achieve.","With this increased level of knowledge, you’ll gain power and control of your body composition without having to acquire the discipline of a stoic monk."]},{"heading":"RECOGNIZE YOUR STARTING PLACE","paragraphs":["Like most facets of life, experience matters. To get to where you want to be, you first need to know where you are right now. Your starting line will most likely be different than others’, meaning the route to your end point may also differ.","With this understanding, pause and decide where on the beginner-veteran spectrum you are currently positioned. Your experience level, both in the gym and in the kitchen, is going to significantly impact how detail-oriented you need to be with your approach."]},{"heading":"BEGINNER (0-2 YEARS OF LIFTING EXPERIENCE)","paragraphs":["The truth of the matter is, a true beginner can concurrently build muscle and lose fat quite easily. This is because as a new lifter, your physiology is the most primed for muscle growth that it will ever be.","As you accrue more and more lifting experience in the gym, your muscles become more and more adapted (that is, less and less responsive) to training stimuli. As a result, with increasing training advancement, building new muscle becomes slower and harder. Also, because building muscle is an energetically-demanding process, and beginners have the ability to build muscle faster, calories can be pulled from stored body fat to fuel the muscle building process. This implies that newbies can achieve impressive body recomposition without paying attention to every detail of their nutrition. Recomposition is both easier and simpler for a beginner.","As long as you meet the three criteria outlined below, you should be able to build muscle and lose fat as a beginner without the same level of optimization that an intermediate or advanced trainee would need:","1. Your caloric intake isn’t too high or too low (meaning, you are eating either in a small caloric deficit or a small caloric surplus). We will revisit specific examples later, when we set up the diet.","2. Your protein intake is adequate. We will outline the specifics in Chapter Eight when we set up macronutrients.","3. You are weight training with a focus on progressive overload (incrementally adding either weight, volume or improving technique over time). We will later outline the specifics of training for recomposition.","Of course, that isn’t to say that as a beginner you can put the book down now. Following the recommendations outlined in the upcoming pages will yield even more impressive results for the beginner who begins with a certain inherent advantage. These strategies have the power to take you from getting good results to getting great results."]},{"heading":"INTERMEDIATE (~2-5 YEARS LIFTING) TO ADVANCED (~5 OR MORE YEARS LIFTING EXPERIENCE)","paragraphs":["Progressing towards the other end of the spectrum, the longer you’ve been resistance training, the closer you are to your genetic potential. If you are a weight room veteran, you will have to fight for continued progress. We believe this is where the often overlooked and oversimplified details of nutritional science really move the needle to optimize results. For an intermediate to advanced level lifter, simply meeting the three criteria outlined above will most likely not be sufficient to optimize results. Sure, they will get you part of the way there, but since your body will become more and more resistant to progress with time, more fine-tuning may be necessary to get the best results possible.","So while reductionistic fitness industry thought may work just fine for the beginner, the intermediate-advanced trainee will need to think harder. Concepts like “calories-in versus calories-out,” “a carb is a carb” and “eat according to your schedule” can be powerful approximations for a beginner, but can be misleading and limiting to those with more experience. We want to lift topics from the soup of fitness discourse, put them on the table, shine a light on them and have a closer look than most do.","In addition to unpacking topics that are often overlooked and misunderstood, we will bring some new nutritional concepts to the forefront. We’re going to combine scientific findings with our time-tested strategies so you can optimize your nutritional approach, regardless of your beginner or veteran standing!"]},{"heading":"UNDERSTANDING RECOMPOSITION","paragraphs":["To be clear, when we say body recomposition, we are referring to a reduction in body fat percentage alongside an increase in lean body mass (more specifically, muscle mass). In both women and men, this is most commonly achieved under four circumstances:","1. NEW LIFTERS (BEGINNERS): As we discussed above, the body is most primed for growth when weight training is still a new stimulus. To fuel the speedy muscle building process, the body can “easily” tap into body fat stores to yield impressive recomposition. 2. DETRAINED LIFTERS (DETRAINEES): The detrained lifter is anyone who has lifted for a significant period of time, built a significant amount of muscle but then stopped training due to injury, lack of motivation or some other impediment to regular lifting. Similar to the new trainee, the detrainee is able to build a lot of muscle very quickly, making recomposition common. We will revisit this phenomenon later when we discuss muscle memory.","3. OBESE INDIVIDUALS: Because obese individuals have a very large energy reserve (bodyfat), it’s simple enough for them to eat in a caloric deficit and still have plenty of stored energy to fuel the muscle building process. As a result, when obese individuals train, it’s common for them to build muscle and lose fat at the same time.","4. ANABOLIC STEROID USERS: Using anabolic steroids puts you in a similar camp to the new trainee and the detrainee in that it allows most people to build relatively large amounts of muscle mass very quickly. Again, to fuel that speedy muscle building process, the body can tap into body fat stores, resulting in impressive recomposition.","Although these are the most common routes to recomposition, they do not exhaust all possible routes to that destination. As we will explain throughout this book, even if neither of those four scenarios applies to you, you can still build muscle and lose fat at the same time. We affirm that body recomposition can happen at any stage throughout one’s training career and there are indeed various ways to achieve this highly sought after outcome."]},{"heading":"UNDERSTANDING RECOMPOSITION - ONE LAYER DEEPER","paragraphs":["If you turn to the internet to figure out the definition of body recomposition, you will most likely find an answer something like, “Body recomposition: to build muscle while losing body fat.” For our intents and purposes, this is a good definition. However, for the sake of completeness (this is the Ultimate Guide to Body Recomposition, after all) we would like to expand this definition to include three possible scenarios that will all count as body recomposition in our books:"]},{"heading":"1. YOU BUILD MUSCLE WHILE SIMULTANEOUSLY LOSING FAT.","paragraphs":["This is the most straight-forward type of body recomposition and the most commonly considered scenario. In a perfect world, this is also the most ideal outcome in that you look more jacked and shredded at the same time. This scenario will be most common in the four circumstances outlined above and while many of you who follow this plan will get exactly this result, this isn’t the only route to recomp."]},{"heading":"2. YOU BUILD MUSCLE MASS WHILE MAINTAINING BODY FAT MASS.","paragraphs":["In this scenario, although you aren’t actually losing fat mass, you are still lowering your body fat percentage because you are building new lean mass. Let’s illustrate this scenario with some numbers. Let’s say you currently weigh 180 pounds and are 20 percent body fat. This means you have 36 pounds of fat on your body.","After following our plan, you build 10 pounds of muscle and lose 0 pounds of fat. So you have built muscle, but neither lost nor gained any fat. Now you weigh 190 pounds and still have 36 pounds of fat on your body. Because your lean mass increased, even though you still have the same amount of total fat, your bodyfat percentage is now lower.","36 LBS FAT MASS / 190 LBS TOTAL MASS = 18.9% BODY FAT In this example, you went from 20 percent body fat to 18.9 percent body fat, even though you didn’t technically lose any fat. So, you may not have technically built muscle and lost fat on an absolute scale, but you have still built muscle while getting leaner.","We will therefore count this scenario as body recomposition. Under this scenario, your body will look more aesthetic as the muscle gained in the absence of any fat gain will still lead to a more muscular and tighter appearance. This scenario will be more common in trainees who are already quite lean."]},{"heading":"3. YOU LOSE FAT WHILE MAINTAINING MUSCLE MASS.","paragraphs":["Although you aren’t building new muscle mass here, you are still lowering your body fat percentage by getting leaner. To clarify, let’s run some numbers again.","Let’s say you weigh 180 pounds at 20 percent body fat (36 pounds of fat on your body). After implementing the information in this book, you lose five pounds of fat and neither gain nor lose any muscle. You have lost fat while maintaining your muscle mass. After the fat loss, you now weigh 175 pounds and have 31 pounds of fat on your body. Once again, your body fat percentage has lowered.","31 LBS FAT MASS / 175 LBS = 17.7% BODY FAT.","Because your body fat has decreased while holding onto all of your existing muscle, you will create the appearance of being both leaner and more muscular. This is because your ratios, balance and overall aesthetics will improve.","The reason we are counting this as body recomposition is because typically when people lose weight, they will lose a combination of lean mass and fat mass. This can be due to a multitude of factors including decreased training performance (strength) and poor nutritional approach (inadequate daily protein intake, infrequent feedings, et cetera).","So, if one can maintain all the muscle mass they’ve already built while losing pure fat mass (or near pure fat mass) on a cut, we will count that as body recomposition as well. This third scenario will be most common in highly advanced trainees who have the goal of being very lean, but who have already maxed out (or nearly maxed out) their natural genetic potential for muscle mass, or anyone who has optimized their dietary approach, but isn’t weight training hard or smart enough to spark new muscle growth.","Now that we’ve clearly defined what body recomposition is and under what circumstances it can occur, it’s time to turn to application and implementation. Because body recomposition is much more complex than just losing weight or gaining weight, to accurately track your progress over time, you will need to utilize various tools and monitor a few variables. In the following chapter, we will discuss two compartments in your metaphorical toolbox for your recomposition project. We also outline what specific variables we need to track."]}],"word_count":2563},{"number":2,"title":"Tools of Titans","start_page":19,"epigraph":{"quote":"GIVE ORDINARY PEOPLE THE RIGHT TOOLS AND THEY WILL BUILD THE MOST EXTRAORDINARY THINGS.","attribution":"Neil Gershenfeld"},"sections":[{"paragraphs":["In this chapter, you will be introduced to tools that will assist you in measuring and tracking your body recomposition. This is vital to our success because if we are setting out with the goal of building muscle and losing fat, we are going to need some gauge by which to measure whether or not we’re actually following through with that goal.","As we lay out various tools and assessment methods, keep in mind that body composition assessment is at its basic level, an attempt to simplify an inherently complex process. Also, be aware that each assessment method varies in its level of precision, reliability, cost and availability. In other words, each method has its respective strengths and weaknesses. Measuring weight loss is super simple: stand on a body weight scale. If the number is going down, you’re losing weight. Good job (assuming you’re cutting).","Measuring weight gain is equally simple: Stand on the same scale. If the numbers go up, you’re gaining weight. Good job (assuming you’re bulking).","Measuring body recomposition is a bit more tricky, however. How exactly should we do that? Well, having the number go down on the scale might hint toward fat loss, but then how are we supposed to tell if we’re gaining muscle or not?","Similarly, having the number go up on the scale might hint toward muscle gain. But, how are we supposed to tell if not not merely gaining fat?","As a third possibility, maybe the number on the scale stays exactly the same. Does that imply that we’re gaining muscle at the exact same rate that we’re losing fat? This would be the perfect recomp! But then again, maybe it means that progress has completely stalled and we’re neither gaining any new muscle nor losing any fat at all. Yikes!","Clearly, the body weight scale can be difficult to interpret in the context of body recomposition and isn’t going to be a sufficient tool on its own for measuring and tracking progress. Still, we believe that it has an important place in the “body recomp toolkit” and as such, will be the first tool we discuss.","As we peek inside our toolbox, we will first of all split the toolkit into two different compartments. One will contain “mandatory tools” that everyone can and should use consistently. These will be our day-to-day assessment tools for tracking progress. The second compartment we will label our “special tools.” Here, we will find the less accessible instruments that many readers will either have to purchase, rent, or find special access to. Although they can be quite helpful, they are by no means required to achieve and track a successful recomp. Since the Mandatory Toolbox is more generally applicable, accessible and suitable to our needs, let’s begin here."]},{"heading":"MANDATORY TOOLS","paragraphs":["This compartment of our metaphorical toolbox contains four key tools: Body weight Scale, Measuring Tape, Camera (Progress Photos) and a Food Scale."]},{"heading":"1. WEIGHT SCALE","paragraphs":["The weight scale is about as common in the typical home as is the television. Interestingly enough, information from both can be misleading. It is extremely common to see trainees develop an unhealthy relationship with the scale and create an attachment to specific body weight values.","While it’s normal to have this tendency to strive toward being a certain weight, we encourage you to avoid any kind of emotional attachment to specific numbers on the scale. They are only data points. And, because the weight scale is one of the bluntest instruments of them all, the data points it collects can be the most misleading and unnecessarily disappointing. It’s important to realize that one’s weight speaks little, if anything, to the composition of the body. As mentioned above, weight gain on the scale could mean many different things, not limited to:","But despite its shortcomings, changes in body weight are nonetheless very easy to track and when combined with the other tools outlined in the following pages, can provide some very valuable insights and estimations.","For consistency purposes, we recommend tracking your body weight for four-seven days per week at the same time of day for consistency purposes.","For the most accurate weigh ins, we suggest weighing as soon as you wake up, after using the bathroom and before drinking any water or eating any food.","We also recommend using a digital scale that is sensitive enough to measure in 0.2 pound increments. Using those four-seven body weight measurements, you will tabulate a weekly average. You will then compare that weekly average to future weekly averages to determine whether your weight is trending up or down over time. Let’s use the first two weeks in October as an example and assume these were your morning weigh-ins:","OCT 1 – 170.4 LBS OCT 2 - 171.2 LBS OCT 3 – 169.8 LBS OCT 5 – 170.2 LBS OCT 7 - 170.6 LBS From this set of five weigh-ins across the week, you would calculate the first weekly average weigh-in of the month to be 170.4 pounds.","The next week, you would collect more weigh ins:","OCT 8 – 170.8 LBS OCT 9 – 171.4 LBS OCT 11 – 169.8 LBS OCT 12 – 170.6 LBS OCT 13 – 170.6 LBS OCT 14 – 171.0 LBS For this set of six weigh-ins across the week, you would calculate the second weekly average weigh in of the month to be 170.7 pounds.","Over time, you will collect average weekly weigh-ins to assess whether your bodyweight is trending up or down. Note that you do not need to weigh in every single day to get an average measurement (unless you find that convenient). Also, the fact that the weigh-ins fluctuate is completely normal and to be expected.","Every individual weigh-in doesn’t need to trend in a given direction for the averages to trend in a given direction. Keep in mind that many variables like stress levels, water intake, sodium intake, carbohydrate intake, food volume, the menstrual cycle (for women) and bowel movements can impact your body weight on a daily basis.","Because merely measuring body weight will not be enough to tell us about body composition, let’s now turn our attention to the rest of the “mandatory toolbox.”"],"list_items":["Pure fat gain","Pure muscle gain","A combination of fat gain and muscle gain","A lot of muscle gain combined with a little bit of fat loss (so that bodyweight still increases)"]},{"heading":"2. MEASURING TAPE","paragraphs":["The ying to the weight scale’s yang is the old-school measuring tape. A measuring tape will be used to obtain two primary bits of information: waist circumference and other body measurements (shoulders, glutes, chest, legs, arms and calves).","Waist Circumference: A waist measurement will help indicate whether or not fat is being lost. For example, if your body weight is increasing but your waist circumference is decreasing, that is a very reliable sign that you are building muscle while losing fat and as a result, reshaping your body.","To ensure consistency, when taking waist measurements, take the measurement at the belly button or at the smallest site on your waist. The most important thing is to be consistent with the measurement location over time.","Other Body Measurements: While taking individual body measurements are not required, they can provide a very simple, yet accurate way of tracking exactly where you’re building muscle.","When taking body part measurements, measure at the largest site on the muscle. For the Legs-Thighs, Biceps, Triceps and Calves, be sure to record both a left and a right measurement. This will allow you to track any asymmetry and thereby modify your training to correct for imbalances.","Similar to the scale, realize that body part measurements are not a perfect science. For example, as you lose fat, many of these measurements may actually decrease, despite a gain in muscle to the area (if you happen to lose more fat from the area than you added muscle to the area). As such, you should use this information to compliment the weight and waist measurements.","When losing body fat, waist circumference is the one area that seems to change the most and even if you’re adding muscle to your abdominals, it will not drastically change the size of your waist. For all intents and purposes, a reduction in waist circumference is a very good indicator of fat loss.","Phrased another way, in a body recomposition context, waist measurements are a more reliable indicator of fat loss than other body part measurements.","To avoid fluctuations due to water retention, we suggest taking waist circumference measurements one to two times per month, on the same days each month.","The other body part measurements can be taken once every one to three months when assessing muscular progress on specific areas or weak points."]},{"heading":"3. CAMERA (PROGRESS PHOTOS)","paragraphs":["Sometimes referred to as the Bodybuilder’s Selfie, progress photos may be the most valuable tool of all. One of the all-time natural bodybuilding greats, Brian Whitacre, insists on using only visual tracking methods, so as to not get too consumed with numbers.","At the end of the day, as bodybuilders of one sort or another, we are mostly concerned with achieving a certain look; not a certain number on the scale or measurement on the tape. So if you want to assess how your physique is progressing, you need to be looking at your physique!","Rather than constantly checking yourself in the mirror, which can lead to false and inaccurate assessments due to changes in lighting, level of hydration, et cetera, we recommend taking progress photos at regular intervals with consistent lighting and camera set up. This video from science-based natural pro bodybuilding collective 3DMJ, explains how to position the camera and light source to take quality, consistent progress photos. Here is a basic explanation of the set up: YOU - CAMERA/PHONE - LIGHT SOURCE/ WINDOW Although extremely valuable, tracking progress using photos can be tricky. This is because the visual significance of any changes is going to depend on several factors, including:"]},{"heading":"A. GENETIC FACTORS:","paragraphs":["Some people build muscle and lose fat much more easily than others."]},{"heading":"B. YOUR EXPERIENCE LEVEL:","paragraphs":["As you get increasingly more advanced (and near your “natural genetic limitation”), it will become increasingly difficult to notice visual changes in your physique. For example, someone with only one year of training experience will be able to literally see muscles grow on their physique from month to month much more easily than someone who has already been lifting for 10 years.","The key point with regard to the first two factors is to not be discouraged by your progress photos. If you are not immediately seeing noticeable visual changes due to your genetics or experience level, it is important to recognize that these factors are out of your control. They also will not hold you back from making any progress at all. They simply can make progress occur more or less quickly, in which case it is important to practice patience and stick-to- itiveness."]},{"heading":"C. YOUR CURRENT BODY FAT PERCENTAGE:","paragraphs":["This may seem counterintuitive to some. The leaner you currently are, the more likely you are to see noticeable changes in your progress photos. For example, if you are a 250 pound male at 30 percent body fat, chances are you won’t look much different if you were to lose five pounds of body fat.","Conversely, someone who weighs 160 pounds at 10 percent body fat, will look much leaner after losing five pounds of body fat. As you get leaner, each pound of fat loss makes up a larger percentage of your total fat mass, making visual changes much more apparent. Therefore, it is important to be more forgiving on your first few months of progress photos, especially if you have significant fat to lose.","It may take several months before you start to visually detect how much fat you’ve actually lost (again highlighting the importance of having multiple tools in your toolbox). We recommend taking progress photos one to four times monthly.","Because taking progress photos can be an annoyance, you should get into the habit of taking them on the same day each week, or on the same day every month. For example, every Sunday could be your “progress photo day” or as another example, you could shoot pics on the first of every month.","The problem with shooting pics too frequently is that changes will be less detectable. The problem with shooting too infrequently is that you may start forgetting to take photos at all. The bottom line is finding a sweet spot that allows you to be consistent with this very important progress tool.","Follow the suggestions below to ensure you take the most accurate and useful progress photos possible:"],"list_items":["A) Use the same environment/location (ideally using natural light from a window or doorway);","B) Shoot at the same time of the day (preferably fasted on an empty stomach);","C) Shoot on the same day of the week;","D) Use the same angle for each picture. Set up your camera in the same spot, at the same height;","E) Use a self-timer or record a video and take screen shots, and","F) Include your full body in several different poses. Include front, back and side pics. If you can perform mandatory bodybuilding poses, they are ideal for assessing muscular detail and balance."]},{"heading":"4. FOOD SCALE","paragraphs":["Tracking macronutrient (fat, carbohydrate and protein) intake is a very powerful and effective way to manipulate body composition. In Chapter Eight, we will provide detailed macro recommendations, so it is important that you are able to accurately track what you’re consuming.","It’s worth mentioning that you do not need to track everything you eat to achieve some progress. It’s fine to have periods of time where you choose not to track macros and will still be able to make progress by ball parking intake mentally, paying close attention to internal signals (hunger/appetite) and being consistent with food choices (eating meals of similar size and composition day to day). While progress can still occur using these intuitive or auto- regulated eating methods, we think that this approach may be too blunt for those with body recomposition goals.","If you just so happen to be eating the appropriate amount of each macronutrient, body recomposition can still occur without tracking macros. However, we think that to optimize your results, you need to be more intentional and proactive about your intake. For this reason, we recommend a fairly rigorous tracking-based approach when body recomposition is the goal.","We highly recommend you use a food scale when possible rather than using volumetric tools such as a measuring cup. A food scale can cost anywhere from ten to thirty dollars and is an extremely valuable tool to ensure you’re consuming the proper portions of each food source for your specific goals.","Volume metrics can be much more inaccurate and unintentionally over or under consuming calories can slow your rate of progress. Due to the dehydration effect cooking has on many foods, we recommend weighing food raw (before cooking) since this is a more precise way to measure.","As an example, consider one serving of oatmeal. Typically, it is listed as 45 grams or one half of a cup. If you were to use a measuring cup, you may end up with 60 grams of oats for the same half of a cup. This unaccounted mistake might lead you to consuming an additional 58 calories (1g fat, 9.9g carbs and 2.5g pro) per day.","If you were to make such a relatively small mistake with many of your food sources, incrementally, you could be missing your calorie and macro goals by a fairly large margin. It is essential that you track your protein, fat and carbohydrate intake from all foods you eat. For the food sources that have nutrition facts labels, there should always be a specified weight that corresponds to each serving size. For foods that don’t have a food label (such as fruits and vegetables), you can easily search for their nutritional information on various websites and apps (i.e. http://nutritiondata.self.com/ or MyFitnessPal).","For the sake of convenience, we recommend tracking your food intake through mobile apps like MyFitnessPal, My Macros+, FitGenie or Calorie King. These apps also have technology that enables you to scan the barcode of whatever food product you’re eating and provide the relevant nutrition facts. They also have many corporate franchise restaurants in their database, so when dining out, you can get a fair estimate on the calorie/macronutrient profiles of various dishes.","The more experience you have with tracking, the more flexible you can be and the better job you’ll likely do at estimating your food intake. If you don’t have much experience with tracking, we recommend doing your best to be as accurate as possible until you gain more general nutritional IQ.","Throughout this tracking period you will learn a great deal about the nutritional profiles of different foods, and as you gain experience, you’ll become much more proficient at estimating the macronutrient content of different dishes.","As a general rule, we recommend hitting macros within +/-10 grams for carbs and protein and +/-5 grams for fats. If you plan on eating out frequently, make an effort to stick to lower fat meals, which will decrease the margin of error between the reported nutritional content and the actual nutritional content."]},{"heading":"SPECIAL TOOLS","paragraphs":["Now that we’ve looked inside the Mandatory Toolbox, we would like to describe three special tools that can be useful under certain circumstances, but may also be more inconvenient for some."]},{"heading":"1. SKIN CALIPERS","paragraphs":["While not as accurate as some of the more high-tech tools we will discuss next, a skinfold caliper is still an incredible tool for estimating body fat percentage. In fact, it is the only tool that directly calculates subcutaneous body fat (the fat directly underneath your skin) – exactly the type of fat we are most concerned with losing! If your skin-fold thickness decreases, you will look leaner, no question.","There are several different types of skin fold calipers available including disposable, plastic, digital, professional and scientific models. They all do the same basic thing: obtain “skinfold thickness” measurements by pinching a roll of skin and the underlying fat tissue (but not any muscle).","This can then be used to estimate body fat percentage by use of formulas that extend beyond the scope of this book. Skinfold measurements can be taken from different sites on the body, although for consistency purposes, we suggest pinching one inch to the side of your belly button. Simply measure changes in thickness (in mm) over time in that same spot to measure how your level of body fat is changing over time.","Using the tracking sheet provided (see Supplemental Materials – Chapter 17), you can complete either a three-site or seven-site skinfold assessment to estimate body fat percentage. If you decide to use the three site assessment, pinch the belly, tricep and anterior thigh. If using the seven test assessment, pinch the chest, belly, thigh, tricep, subscap, hip and midaxillary areas.","We recommend taking skinfold measurements as frequently as once or twice per month or according to your personal preference for tracking."]},{"heading":"2. BIOELECTRICAL IMPEDANCE (BIA)","paragraphs":["BIA sends a low level, imperceptible electrical current through the body to estimate body fat mass in relation to lean mass. Roughly speaking, because fat mass and lean mass have different densities, the electrical current will travel at different speeds through different body tissues to register information about body composition.","Although different models vary with regard to accuracy, BIAs are fairly accessible and often quite cost effective. There are two common household models of BIA equipment: bodyweight/ BIA hybrid scales and handheld BIA devices.","The body scale option will only collect information from the lower body and use that information to estimate the bodyfat percentage of your entire body. As a result, if you store more fat on your legs than your upper body, the body fat reading may be higher than the true value.","The other common BIA tool is a handheld device which only sends a current through the upper body and then creates a full body estimation off that information. Even though these devices will not be 100 percent accurate, they are still quite useful for tracking changes. For example, let’s say your true body fat percentage is 15 percent, but your at-home BIA scale registers an estimate of 20 percent. As you lose bodyfat in the coming months, the estimated reading drops to 17 percent which implies that your true body fat is now somewhere around 12 percent. The specific numbers are not of particular importance. It is the trend we observe by tracking changes over time that makes this tool useful.","The best BIA tool to date is the InBody technology that analyzes both upper and lower body information to give you specific skeletal muscle mass data, fat mass, and body fat percentage. Since these InBody scans are becoming more readily available, it may be worth doing a simple search to see if you can access this technology locally.","Similar to the caliper measurements, you can optionally use a BIA device to estimate body fat percentage as frequently as once or twice per month, or according to your personal preference for tracking detail."]},{"heading":"3. DUAL ENERGY X-RAY ABSORPTIOMETRY (DEXA)","paragraphs":["A DEXA scan sends a beam of low dose X-ray energy through the body, separating body composition into three components: bone mass, lean mass and fat mass. Typically, the scan takes about six minutes to complete and most importantly, is painless and safe. Because it uses X-ray energy, we advise against pregnant women using this tool. Granted, the level of radiation from a DEXA scan is not particularly concerning: It provides a similar level of radiation as a flight from NY to Boston.","Although DEXAs aren’t extremely accessible, they are becoming more popular and availability to the general public has increased with some commercial businesses now offering assessment. For further insight on how a dexa scan operates, you can check out Jeff getting a DEXA at Chris’ lab in Tampa back in 2016 (7.4 percent body fat). Watch the full vlog from that day.","If you are looking to get really objective and accurate with your tracking and have the ability to get a DEXA scan, this is a tool we suggest you use. Similar to the other special tools, it is by no means required to assess whether or not body recomposition is occurring."]}],"word_count":3709},{"number":3,"title":"Belief Busting","start_page":35,"epigraph":{"quote":"A WISE MAN PROPORTIONS HIS BELIEF TO THE EVIDENCE.","attribution":"David Hume"},"sections":[{"paragraphs":["The “calories in versus calories out” debate (also known as the “is a calorie a calorie?” debate) has been the source of many an internet brawl. Five years ago or so, it was a near daily occurrence in online fitness circles to see two bros going at it over whether or not you can get just as lean eating nothing but junk food as you can eating a chicken-and-broccoli diet, as long as calories are matched.","On one side, you had flexible dieters/IIFYM-ers/If-It-Fits-Your-Macros-ers arguing that calories, proteins, carbs, and fats (the macros) are all that matters for fat loss. On the other side, you had “clean eaters” yelling just as loudly that the macros don’t matter: you need to eat clean foods in order to lose fat or build muscle.","Flash forward to present day, and I think most people who engaged in this grand debate can confidently say that neither side got it perfectly right. It isn’t our goal to argue for one position or the other because as you will see, as the chapters unfold, a truly optimized nutritional approach cannot be simplified into a single soundbite.","Clearly calories and macronutrients matter for body composition, but we definitely cannot say that they are the only things that matter. As such, we will quickly outline the fundamentals of energy balance as the foundation upon which to build our tower of nutritional knowledge. In a nutshell, energy balance is the relationship between the calories you consume (by eating food) and the calories you expend (by exercising, having a heartbeat, digesting food, fidgeting at your desk, running to the car, et cetera).","A calorie is simply a unit of energy. And “energy balance” simply refers to the relationship between energy coming in and energy going out. Over a specific time scale, energy balance is said to be positive if you are storing more calories than you are burning. Generally speaking, this means you are in a caloric surplus and should gain weight.","Conversely, energy balance is said to be negative if you are burning more calories than you are storing. In this case, you are in a caloric deficit and should lose weight. Again, for the most part, bigger caloric surpluses will lead to faster weight gain and bigger caloric deficits will lead to faster weight loss.","Put simply, the energy balance equation in relation to calories and weight loss looks like this: WEIGHT CHANGE = CALORIES IN – CALORIES OUT.","However, the human body is a fascinating organism with thousands of complex metabolic reactions taking place simultaneously and while the energy balance equation does a great job of predicting changes in weight loss, it doesn’t paint the full picture of what is possible in terms of body recomposition on its own.","In other words, if your goal is to simply lose weight, then you simply need to focus on eating fewer calories and/or burning more calories. If your goal is to simply gain weight, then you need to simply focus on eating more calories and/or burning fewer calories. But since you’re reading this book, it’s probably safe to assume that what you really want is to lose fat and gain muscle, not to merely lose or gain weight."]},{"heading":"DEPOSITING AND WITHDRAWING","paragraphs":["Of course, we’re not implying that the laws of thermodynamics are somehow broken in cases of recomposition, but just that as a matter of practical application, only focusing on calories in and calories out will likely shortchange your results.","It’s also common to see people misapply the logic of the energy balance equation. For example, many folks will just assume that an anabolic process like building muscle can’t happen concurrently with a catabolic process like losing fat. But, as we’ll see, this simply isn’t true.","Because fat tissue and muscle tissue are separate systems, it’s perfectly possible to lose a significant amount of fat due to the caloric deficit, while still building muscle from the progressive training stimulus (and sufficient protein).","Let’s illustrate this by way of analogy. Imagine you have two different bank accounts. Let’s say you withdraw $20 from one account while at the same time depositing $5 into the other account. As a matter of net financial balance, you have withdrawn $15, despite monetary gain in one of the accounts.","Similarly, there is nothing written in the energy balance equation that would prevent you from “withdrawing” 20 pounds of fat from your “fat account” while “depositing” 5 pounds of muscle into your “muscle account.”","For the sake of being as precise as possible, it’s worth noting that fat and muscle tissues have different energy densities. Because muscle is made up mostly of water, it has much less stored energy than fat does. One kilogram (~2.2 pounds) of muscle contains 1,800 calories while one kilogram of fat has 9,400 calories.","Let’s run the net energy balance math on the example above, assuming you were to lose 20 pounds (9.1kg) of fat while gaining 5 pounds (2.3kg) of muscle over a full year: 9.1 KILOGRAMS OF FAT LOST = 85,540 CALORIES LOST 2.3 KILOGRAMS OF MUSCLE GAINED = 4,140 CALORIES GAINED NET ENERGY BALANCE = ENERGY GAINED – ENERGY EXPENDED = -81,400 CALORIES In other words, in order to achieve this body recomposition, you must have been in a 81,400 calorie deficit over the course of the year. Since there are 365 days in a year, that would amount to: 81,400 yearly calorie deficit / 365 days = a 223 calorie deficit per day. The point to take home here is that despite being in a net caloric deficit, muscle was still gained, proving that the energy balance equation does not imply that fat loss and muscle gain cannot occur at the same time. They simply CAN! And, as we’ll see below, they simply"]},{"heading":"DO!","paragraphs":[]},{"heading":"MEANWHILE, BACK AT THE LAB","paragraphs":
