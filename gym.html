ms":["Examples of one serving: Typically “1 cup” counts as a serving of vegetables. 1 cup of broccoli (more specifically: 100g raw), or ~10 broccoli florets; 100g raw spinach (~3 & ⅓ cups raw, or ½ cup cooked), or ½ cup asparagus (~65g or 6 spears).","Examples of one serving: one kiwi or one banana (typically 80-150g raw weight depending on fruit source)."]},{"heading":"HOW MUCH PROTEIN SHOULD WE EAT FOR RECOMP?","paragraphs":["The amount of protein you need to optimize your body composition is a controversial topic that is being continuously researched and updated by scientists.","What we do know for certain is that protein is the most essential macronutrient when it comes to repairing and building muscle (29). We also know that protein is the most thermogenic macronutrient, meaning it leads to more caloric expenditure than carbs or fats. In addition, protein tends to be the most satiating macronutrient (96), meaning you will feel fuller for a given number of calories consumed.","The combined effect of these properties is that protein is essentially the “super-macro”: It is the most important for both muscle gain and fat loss. So as trainees interested in both of these goals, it is of the utmost importance that we figure out how much of it we need to eat. Before proceeding with the scientific literature, we think it’s worth outlining our general philosophy on protein intake for body recomposition.","First, a short history lesson. For ages, people have been arguing that one gram of protein per pound of bodyweight is the magic number for maximum gains. This would mean that if you weigh 180 pounds, then you’ll want to eat 180 grams of protein per day, and there isn’t much more to it than that.","More recently, some science-minded folks have revolted back against this mainstream bodybuilding thought, insisting that, well, one gram per pound is actually a major overkill and you can “get away with” much less protein than that. Usually, this camp settles on a number somewhere around 0.75 grams per pound. So if you weighed 180 pounds, you’d get all the anabolic bang for your buck you could ever want out of just 130 grams of protein per day.","As it turns out, we don’t fit neatly into either of these camps. When it comes to body recomposition, we believe that protein is king. As alluded to above, protein is the best muscle- building and the best fat-burning macronutrient. For this reason, we think it is far better to have too much protein than too little.","If you consume too little, you could be leaving potential gains on the table and missing out on fat loss, just because you didn’t want to eat an extra chicken breast or protein shake. In this sense, we think of having a high protein intake as a sort of anabolic insurance. It covers you in a similar way as car insurance in that you may not necessarily need it, but it’s a good idea to have it just in case.","For the record, since we are advocating for a high protein diet, it’s worth noting that a high protein diet is very safe and the current literature has consistently shown no negative side effects of very high protein diets on blood lipids, liver, bone or kidney function (5,37). We also believe that just like people of different starting body fat percentages will require different calorie intakes, they will also require different protein intakes. How much protein YOU need to eat, depends not only on your bodyweight, but also on your body fat. So it isn’t quite as simple as just recommending a single target for everyone (like one gram per pound). We’ll discuss all of this and the relevant science in the next few pages. Because our daily protein intake calculations depend on an estimation of your bodyfat percentage (to determine lean body mass), we have provided a visual representation of various bodyfat percentages in Figure 8 below to help you estimate your bodyfat percentage in case you do not have access to the more reliable measurement tools laid out in Chapter 2. Your bodyfat percent estimation does not need to be precise in order for you to get in the right ball park for setting up your macronutrients. Being consistent and adjusting your intake appropriately over time will ultimately determine your success, so try not to get too bogged down with the initial estimation.","Figure 8: A Visual Representation of Various Bodyfat Percentages (Male and Female)"]},{"heading":"OUR SLIDING MODEL FOR PROTEIN INTAKE","paragraphs":["First up, there is direct evidence that increasing protein intake leads to body recomposition. Several studies have shown that very high protein intakes (protein overfeeding) leads to body recomposition by either reducing fat mass, increasing lean mass, or both (7,28). We will later dig into those studies in more detail.","Keep in mind that while the literature tends to express protein intakes in grams per kilogram of bodyweight (g/kg), we will be mainly using grams per pound of bodyweight (g/lb). Our reasoning for this is that historically, lifters always expressed protein figures this way and as a result, these units have become more accessible to the average reader. To convert to g/ kg, simply multiply any g/lb figures provided by 2.2.","Previous literature has suggested that consuming 0.54-1.0 gram per pound (1.2-2.2g/kg) of protein is enough to support training adaptations for those eating at maintenance or in a caloric surplus (75,100). So, as a high-end figure for those who are in a caloric surplus or at maintenance, the mainstream bodybuilding recommendation of one gram per pound was pretty spot on.","However, for those who are looking to optimize body composition, as we will see below, higher protein intakes are evidently warranted (4,28,56,62).","One limitation with general recommendations regarding protein intake in the scientific literature is that the suggested values utilize total body mass, not lean body mass. This is important to mention because, as previously noted, body composition and body weight are very different things.","The higher your body fat percentage, the less likely you are to lose muscle in a calorie deficit because your body has so much fat to use for fuel. On the other hand, the leaner you are, the more likely you are to lose muscle in a calorie deficit because there is more limited fat for fuel. Therefore, we propose that the leaner you are, the more protein you need to eat to preserve (or gain) muscle mass.","This is why we recommend a sliding protein target ranging between 1.2 - 1.6 grams per pound of lean body mass. This sliding scale takes into consideration your current body composition. The leaner you are, the closer you will want to be to the 1.6 grams per pound figure. The more body fat you have, the closer you will want to be to the 1.2 grams per pound figure.","Figure 8A: The Sliding Model of Protein Intake (Based On LBM)","To put this model in context, let’s compare two mock examples below."]},{"heading":"SEX & AGE HEIGHT WEIGHT","paragraphs":["BODY FAT %"]},{"heading":"LEAN BODY MASS (LBM) RECOMMENDED PROTEIN INTAKE PROTEIN PER DAY","paragraphs":[]},{"heading":"JUNIOR MALE - 25","paragraphs":["5’7 150 LBS 10%"]},{"heading":"135 POUNDS","paragraphs":[]},{"heading":"BILL MALE - 25","paragraphs":["5’7 240 LBS 30%"]},{"heading":"168 POUNDS","paragraphs":[]},{"heading":"1.5G/LB LEAN BODY MASS (LBM) 202.5G PROTEIN (~200G)","paragraphs":[]},{"heading":"1.2 G/LB LEAN BODY MASS (LBM) 201.6G PROTEIN (~200G)","paragraphs":["Table 8A: Two Examples of Protein Intake Calculations (Male)","As you can see in the table above, Junior and Bill are the same age and the same height, but have different body weights, different body fat percentages and different lean body masses (LBM). Junior is lean while Bill is carrying excess body fat.","In this example, if we told Junior to go with the mainstream recommendation to consume one gram of protein per pound of body weight (150 grams each day), this may be enough to keep his muscle hanging around, but we could be inhibiting his ability to maximize his muscle building capabilities due to his low body fat percentage (10 percent).","In this case, 150 grams of protein per day might not quite cut it, especially if he is also training very hard. And since we are thinking of protein as anabolic insurance, we’d much rather overshoot than undershoot on intake.","Continuing with the example, using the sliding scale outlined above, Junior would be better off consuming about 1.5 grams of protein per pound of lean body mass (since he is lean, he should be closer to the 1.6 figure to the far right of the spectrum). For Junior, plugging the numbers in would come out to 135 pounds (LBM) x 1.5 = 202.5 grams of protein per day. For practical purposes, he could just round this figure to the nearest whole number, setting his marker at 200 grams of daily protein. As we’ll discuss in Chapter Nine, it would be wise to split this intake evenly across four or five meals per day (that is, 40 grams of protein per meal, fives times per day).","On the other end of the spectrum, if we told Bill to go with the mainstream bodybuilding advice to consume one gram of protein per pound of body weight, he’d be consuming 240 grams of protein every day! For someone of Bill’s high body fat percentage, that high of a protein intake would undoubtedly be overkill.","Recall how we previously learned that the higher your body fat percentage, the less you need to worry about losing lean mass. In Bill’s case, it would be more appropriate to consume 1.2 grams per pound of lean body mass (since he is not lean, he should be closer to the 1.2 figure to the far left of the spectrum).","When Bill plugs his numbers in, it will look like this: 168 pounds (LBM) x 1.2 = 201.6 grams of protein per day. Like Junior, Bill could round this to be 200 grams per day. As you can see from the examples above, even though Junior and Bill are much different in terms of body weight and body fat, they both should end up eating the same amount of protein per day.","Clearly, while the mainstream recommendation of one gram of protein per pound of body weight may work well for some people to get them in the right ballpark, it surely is not specific enough to optimize progress for many.","Consider the two similar female examples in the table below."]},{"heading":"SEX & AGE HEIGHT WEIGHT","paragraphs":["BODY FAT %"]},{"heading":"LEAN BODY MASS (LBM) RECOMMENDED PROTEIN INTAKE PROTEIN PER DAY","paragraphs":[]},{"heading":"SALLY FEMALE - 25","paragraphs":["5’4 135 LBS 25% 101 LBS"]},{"heading":"HELGA FEMALE - 25","paragraphs":["5’4 200 LBS 40% 120 LBS"]},{"heading":"1.5G/LB LEAN BODY MASS (LBM) 151G PROTEIN (~150G)","paragraphs":[]},{"heading":"1.2G/LB LEAN BODY MASS (LBM) 144G PROTEIN (~145G)","paragraphs":["Table 8B: Two Examples of Protein Intake Calculations (Female)","Figure 8B - Setting Up Protein Intake Based on Bodyfat Percentage. The leaner you are, the more protein you need.","Body recomposition is not going to happen by accident. You need to make sure you are putting yourself in the best nutritional state to support this process. To expand on the figures laid out in the sliding model above, (1.2-1.6 g/lb LBM) we’d like to take a deeper look at what the scientific literature has found with regard to body recomposition and protein intake."]},{"heading":"WHAT THE SCIENCE REALLY SAYS","paragraphs":["A study by our friend Dr. Bill Campbell out of the University of South Florida compared the effects of a low versus high protein intake among aspiring female physique athletes undergoing an eight week resistance training protocol (28). In this study, the low protein group was not allowed to consume more than 0.55 grams of protein per pound of body weight. The high protein group was prescribed to consume a minimum of 1.1 grams of protein per pound of weight, but could exceed this amount if they wanted to.","To get more specific protein intake values, I (Chris) extrapolated the subjects’ body composition data and macronutrient intakes reported in the study to determine how much protein they were eating per pound of lean body mass (LBM) - the metric we are most interested in. On average, the low protein group consumed 0.52 grams of protein per pound of fat free mass, and the high protein group consumed an average of 1.44 grams of protein per pound of fat free mass. Interestingly, both groups gained muscle and lost fat, but the high protein group saw significantly more lean gain and fat loss.","Specifically, the high protein group gained 4.6 pounds of fat free mass while losing 2.4 pounds of fat mass, reducing their total body fat by two percent. The low protein group only gained 1.32 pounds of fat free mass while losing 1.76 pounds of fat mass, changing their body fat percent by 1.1 percent.","It is important to note these females had previous resistance training experience and were required to deadlift 1.5 times their body weight to participate in the study. Moreover, they were lean, compared to their societal peers, starting off this study at about 22 percent body fat, with the norm being about 30 percent.","Lastly, these researchers provided us with a great visual representation of how much individual responses to protein intake varied. It’s also worth noting that every single subject in the high protein group gained lean mass, whereas some subjects in the low protein group actually lost lean mass.","Although the group averages reported positive body composition changes for both groups, we should note that some subjects did in fact lose muscle when consuming the lower protein intake. This individual variability really highlights our point that it is better to “play it safe” and eat a higher protein intake, so you don’t end up like some of the subjects who lost muscle in the low protein group.","Lastly, worthy of consideration is that the high protein group was eating significantly more calories on a daily basis (1839kcal vs 1416kcal on average), yet still lost more fat mass. While it is possible that there was some misreporting of calorie intake, we do believe that this finding speaks to the power of protein and its thermogenic and satiating effects. Figure 8C: Individual Responses to a High Protein (left) vs Low Protein (Right) Diet (28) As you can see in the figure above, both groups gained fat free mass (muscle), but the high protein group gained significantly more (the lines showing lean mass gains all point upward, and at a greater slope in the high protein group).","Another study that demonstrated body recomposition through the use of increased protein intake was conducted by Dr. Jose Anontio at Nova Southeastern University. He compared the effects of an already high protein diet (labelled as the “control group”) to an even higher protein diet in seventy-three resistance trained individuals.","The control group was instructed to maintain the same dietary habits over the duration of the study. In other words, they were not instructed to consume any specific amount of protein, but rather to continue eating as they normally would. Subjects in the control group were consuming about 0.82-1.05 grams per pound of protein per day on average. When compared to the rest of the literature, this would already be considered a high protein intake. The experimental group was asked to consume a minimum of 1.36 grams of protein per pound each day but were allowed to eat more if they desired. On average, they ended up consuming 1.55 grams per pound each day.","Recall that we prefer to make protein recommendations based on lean body mass to account for differences in body fat. For context on the figures below, also recall our sliding model where we suggest eating between 1.2 - 1.6 grams of protein per pound of lean body mass. After extrapolating the data to account for lean body mass, the ‘normal protein’ group (which was technically high) was consuming 1.1 grams of protein per pound of lean body mass, whereas the ‘high protein’ group consumed about 1.88 grams of protein per pound of lean body mass (which is very, very high - even higher than our recommendations).","Interestingly, both groups gained about 3.3 pounds of lean body mass on average. However, the very high protein group lost significantly more fat compared to the control group (-3.52 pounds of fat mass versus -0.66 pounds of fat mass, respectively). This is even more interesting because the very high protein group was consuming more calories per day (~400kcal more), yet still lost more body fat!","These authors also provided a visual representation of the individual responses of their subjects, which you can see in Figure 8D below. Although both groups lowered their body fat percentage on average, the higher protein group decreased their body fat percentage by more.","As is the case with research, although not every subject experienced body recomposition, perhaps owing to a plethora of other factors including their training, nutrient timing, stress levels, sleep quality, et cetera, the trends clearly indicate that a higher protein intake is better for recomp.","Figure 8D: Individual Body Fat Responses To A Normal Protein (NP) vs High Protein (HP) Diet (Antonio et al, 2015)","After reviewing the literature, including the extrapolation of individual data, combined with our personal experiences as competitive natural bodybuilders and coaches, it should be clear why we recommend a high protein intake range of 1.2-1.6 grams of protein per pound of lean body mass.","We will return to the topic of protein quality when we discuss the different food sources in the following chapter. For now, having covered how much total protein you should eat per day, let’s move onto the remaining macronutrients so you can complete your daily macro targets."]},{"heading":"PROTEIN INTAKE SUMMARY:","paragraphs":[],"list_items":["Eat 1.2-1.6 grams of protein per lb of lean body mass (LBM).","Calculate your LBM using your bodyweight and bodyfat percentage (see examples in Tables 6A and 6B)","Be closer to 1.6 g/lb LBM the leaner you are. Be closer to 1.2 g/lb LBM the more bodyfat you have. (Use Figure 8B as a guide for more specific values)"]},{"heading":"LOW FAT? LOW CARB? OR NEITHER?","paragraphs":["Historically, fats and carbs have both been praised and demonized. Currently, within fitness culture, there seems to be a divide between those who hate carbohydrates and those who hate fats.","Without getting too off-topic over the respective roles of each of these macronutrients in the body, it is important that we not view either nutrient as ‘good’ or ‘bad’. We believe that both carbs and fats play an important role in fueling training performance and driving positive body composition change.","To keep things simple, fats are essential for survival and carbohydrates are not. This means that we must consume dietary fat, whereas our metabolism can adapt to a complete absence of carbohydrate intake by shifting the primary energy source to ketone bodies (a tangent we won’t explore in this book). Still, just because we can survive without carbs does not imply that eliminating them from the diet is the most effective route to body recomp. While carbs may be generally more frowned upon in the current fitness landscape, unfortunately, many folks still assume that dietary fat intake is the root of all body fat storage. Many people fear that “eating fat will make them fat.”","Of course, dietary fat serves many purposes in the human body apart from being stored as adipose tissue, including regulating many metabolic processes, playing a large role in hormonal production, and enabling our bodies to absorb and utilize certain vitamins (A, D, E, & K). Because of the many metabolic pathways that depend on fat availability, it is much more likely that fat-phobia will hinder your body recomposition goals rather than help them. We imagine that something as simple as changing the terminology from dietary fat to dietary lipids and from body fat to adipose tissue might help shift this negative connotation. We recommend that as long as body recomposition is the goal, one should never eliminate any macronutrient entirely. All three macros should be present in harmony with one another at the appropriate intake for the individual’s needs and goals."]},{"heading":"HOW MUCH FAT SHOULD WE EAT FOR RECOMP?","paragraphs":["The amount of fat you should eat for recomp will depend on three main factors: your current body fat percentage, your activity level and your personal preferences.","We generally advise that 20-35 percent of your total calories come from dietary fat. By ensuring you never drop your fats below 20 percent of total calories, you reduce your risk of becoming deficient in fat soluble vitamins and experiencing negative hormonal side effects such as reduced testosterone.","As we discuss in more detail below in our carbohydrate section, there is a strong relationship between body fat percentage and insulin sensitivity (87). The higher your body fat percentage, the lower your insulin sensitivity. Thus, the higher your starting body fat percentage is, the lower your carbohydrate intake should be. Therefore, we suggest those with higher levels of body fat stay toward the higher end of our recommended range of 20-35 percent of total calories.","Moreover, you should take your activity levels into consideration when determining how much of your caloric intake should come from fats. Those that are more active would benefit from a lower fat intake, as they can more easily utilize carbohydrates for energy, while those with less active lifestyles would be better off with a higher fat and lower carb intake. For example purposes, imagine there are two identical twins (same height, weight and body comp), but one has an office job where he sits down all day, and the other is a waiter, on his feet all day servings tables (high NEAT). The twin brother with the high physical activity level would likely feel better (in and out of the gym) with a lower fat, higher carb approach. We would suggest that the office twin stay closer to the 35 percent figure for fat intake and the waiter twin stay closer to the 20 percent figure for fat intake.","Lastly, considering personal preferences will ensure you actually adhere to the dietary plan. If you simply enjoy eating higher fat foods and don’t crave carbs that much, your adherence will likely be best on a higher fat diet. In contrast, if you prefer carbohydrates and regularly select low-fat foods, you should take that into consideration when establishing your macronutrient goals.","Once you determine your dietary fat and protein intake, you fill in the remaining calories of your daily goal from carbohydrates."]},{"heading":"HOW MUCH CARBOHYDRATE SHOULD WE EAT FOR RECOMP?","paragraphs":["Carbohydrates are our bodies’ preferred energy source as they are utilized most efficiently (especially for those of us who are not ‘fat adapted’ or in a state of dietary ketosis). Moreover, carbohydrates are a great tool for improving training performance (6), as plenty of research has shown that extreme carbohydrate restriction can negatively impact strength training (60,63,76).","As noted above, a strong relationship between body fat percentage and insulin resistance has been demonstrated in the scientific literature (21,36,45,68,84,87). This implies that those who carry more body fat have a decreased ability to utilize carbohydrates efficiently. Thus, they should reduce their total carbohydrate intake and consume a larger percentage of calories from fat. This relationship is why we suggest those of you with higher body fat levels consume fewer carbs and more fats, while those of you who are leaner and have less body fat should consume more carbs and less fat.","Figure 8E: Relationship Between Fat Intake Recommendations & Body Fat % (Male and Female) Figure 8F: Generalized Relationship Between Carb Intake Recommendations & Body Fat %. Those with lower body fat percentages should eat more carbs, and vice versa.","Similar to determining dietary fat, it is also important to take into consideration your daily activity level, NEAT, lifestyle, and dietary preferences so as to improve sustainability and adherence when setting up carbohydrate intake.","To conclude macronutrient set-up, several examples are provided for putting the information, evidence and methods provided so far to use.","Before we get to specific examples in the table below, it may be helpful to outline the exact steps from start to finish for calculating your calorie and macro targets for body recomposition."]},{"heading":"STEP-BY-STEP GUIDE FOR SETTING UP RECOMP MACROS:","paragraphs":[],"list_items":["Step 1: Weigh yourself and calculate your body fat % (via BIA, Skin Calipers, DEXA, or guesstimation)","Step 2. Calculate LBM: Bodyweight x (0.XX as % of lean mass) i.e. if you weigh 170lbs at 15% bodyfat, you have 85% lean mass. Your LBM would be: 170lbs x 0.85 = 144.5lbs"]},{"heading":"LBM","paragraphs":[],"list_items":["Step 3: Estimate your Basal Metabolic Rate (BMR) using the according to Mifflin St. Jeor Formula or (more roughly) bodyweight(lbs) x 10.","Step 4: Apply the appropriate activity multiplier to determine your theoretical maintenance calories. Alternatively, use a 2 week guess-and-check method to determine maintenance calories.","Step 5: Determine whether you should be in a caloric surplus, caloric deficit or at maintenance to drive body recomposition. Apply the surplus/deficit to your theoretical maintenance to determine your recomp calorie intake. (Important step!)","Step 6: Set up your protein intake by multiplying your LBM by 1.2-1.6 (closer to 1.6 the leaner you are).","Step 7: Determine what percentage of calories should come from fat (20-35%). Closer to 20 percent the leaner you are.","Step 8: Calculate your fat intake by multiplying your recomp calorie intake by the percentage in Step 7 and dividing by 9. (9 calories per gram of fat)","Step 9: Calculate your “remaining calories” by subtracting the calories from protein (protein intake x 4) and the calories from fat (fat intake x 9).","Step 10: Calculate your carb intake from the “remaining calories” by dividing by 4. (4 calories per gram of carbs)"]},{"heading":"","paragraphs":["Experience Level Beginner Beginner Intermediate Beginner Intermediate Advanced Sex Age Height Weight (lbs)","Body Fat % Lean Body Mass (LBM) (lbs)","Step 1: Estimate BMR (according to Mifflin St. Jeor Formula)","Step 2: Apply Ap- propriate Activity Level Multiplier"]},{"heading":"STEP 3: DETERMINE PREDICTED MAIN- TENANCE CALO- RIES","paragraphs":[]},{"heading":"STEP 4: SETTING CALORIE GOAL TO BEST RECOMP (THEORETICAL MAINTENANCE, DEFICIT, OR SUR- PLUS),","paragraphs":[]},{"heading":"STEP 5: SET PRO- TEIN INTAKE","paragraphs":["(1.2 - 1.6G / LBS OF"]},{"heading":"LBM)","paragraphs":[]},{"heading":"STEP 6: DETERMINE","paragraphs":["WHAT % OF TOTAL"]},{"heading":"CALS WILL COME FROM FAT","paragraphs":["(20-35%)"]},{"heading":"STEP 7: CALCULATE FAT INTAKE","paragraphs":["Male 25 5’7 150 10% 135 Male 25 5’7 240 30% 168 Male 18 6’2 200 14% 172 Female Female Female 20 5’3 130 25% 97.5 20 5’3 150 35% 97.5 35 5’5 145 22% 113.1 1624kcal 2032kcal 1997kcal 1329kcal 1420kcal 1354kcal 1.8 x BMR = 1.8 x 1624 1.5 x BMR = 1.5 x 2032 2.0 x BMR = 2.0 x 1997 1.5 x BMR = 1.5 x 1329 1.5 x BMR = 1.5 x 1420 1.8 x BMR = 1.8 x 1354 2923 3048 3994 1994 2130 2437 Maintenance to start, lean bulk over time Deficit (~20% below theo- retical main- tenance)","Maintenance Maintenance Deficit (~20% below theoret- ical mainte- nance)","3048 x 0.8 = 2438.4kcal 2130 x 0.8 = 1704kcal 1.5 x 135= 202.5 1.2 x 168 = 201.6 1.4 x 172 = 240.8 1.35 x 97.5 = 131.6 1.35 x 97.5 = 131.6 Surplus (~10% above theoretical mainte- nance)","2437 x 1.1 = 2680kcal 1.5 x 113.1 = 169.5 202.5 x 4 = 810kcal 201.6 x 4 = 806kcal 240.8 x 4 = 963.2kcal 131.6 x 4 = 526.5kcal 131.6 x 4 = 526.5kcal 169.5 x 4 = 678kcal 23 35 25 25 30 25 2923 x 0.23 = 627.29 kcal / 9 = 74g Fat 2438.4 x 0.35 = 853.44 kcal / 9 = 94g Fat 3994 x 0.25 = 998.5 kcal / 9 = 110.9g Fat 1994 x 0.25 = 498.5 kcal / 9 = 55.4g Fat 1704 x 0.3 = 511.2kcal / 9 = 56.8g Fat 2680 x 0.25 = 670kcal / 9 = 74.4g Fat"]},{"heading":"STEP 8: CALCULATE REMAINING CALS","paragraphs":["810 + 627.29 = 1437.29 806 + 853.44 = 1659.44 963.2 + 998.5 = 1961.7 526.5 + 498.5 = 1025 526.5 + 511.2 = 1037.7 678 + 670 = 1348 2923 - 1437.29 = 1485.71 2438.4 - 1659.44 = 778.96 3994 - 1961.7 = 2032.3 1994 - 1025 = 969 1704 - 1037.7 = 666.3 2680 - 1348 = 1332"]},{"heading":"STEP 9: CALCULATE CARB INTAKE","paragraphs":["1485.71 / 4 = 371.4 778.96 / 4 = 194.74 2032.3 / 4 = 508 969 / 4 = 242.25 666.3 / 4 = 166.57 1332 / 4 = 333"]},{"heading":"FINAL MACROS","paragraphs":["75g Fat/ 370g Carb/ 200g Pro 95g Fat/ 195g Carb/ 200g Pro 110g Fat/ 510g Carb/ 240g Pro 55g Fat/ 240g Carb/ 130g Pro 55g Fat/ 165g Carb/ 130g Pro 75g Fat/ 335g Carb/ 170g Pro Table 8C: Several Examples Of Macronutrient Setups For Body Recomposition Now that you understand how to set-up your macronutrient targets for recomp, let’s reveal how you can further optimize your protein intake by looking at what food sources to focus on in the next chapter."]}],"word_count":5177},{"number":9,"title":"Solving the Mysteries of Protein","start_page":115,"epigraph":{"quote":"WHEN LIFE GIVES YOU LEMONS, ASK FOR SOMETHING HIGHER IN PROTEIN.","attribution":"Unknown"},"sections":[{"paragraphs":["Where should your protein come from?","Ask a typical gym bro and you will likely get a knee-jerk response, “egg whites, chicken or whey protein”. Ask a more macro-savvy lifter and they may suggest that it doesn’t matter where your protein comes from, as long as you hit your macros.","While we would agree that hitting your daily protein target is the most important factor, it may not be enough to optimize progress on its own. In this chapter we will consider protein quality (Are some protein sources more anabolic per gram?), protein timing (What time of day should you eat protein?) and protein distribution (How should we space our protein intake our across the day?). First, let’s look at protein quality."]},{"heading":"1. PROTEIN QUALITY: WHAT FOOD SOURCES ARE MOST ANABOLIC?","paragraphs":["Are all proteins created equal? In short, no.","Protein quality is typically defined based on its amino acid profile (122). Generally speaking, complete proteins are food sources which provide you with all of the nine essential amino acids. These essential amino acids are exactly what they sound like: essential. We need to consume them in our diet for proper functioning and survival as they play critical roles in various metabolic pathways.","One such pathway we will discuss in detail is muscle protein synthesis (MPS). This process of synthesizing (or building) new muscle protein requires that all nine essential amino acids be present (see Table 9A), since skeletal muscle protein is itself made up of these nine essential amino acids. The same way we cannot build a brick house without bricks, we also cannot build muscle without essential amino acids.","But before we get ahead of ourselves in discussing the makeup of protein, how quality varies from food source to food source and the nitty gritty of muscle protein synthesis, let’s take a glimpse at the nine essential amino acids."]},{"type":"table","cells":["ESSENTIAL AMINO ACIDS HISTIDINE","NONESSENTIAL AMINO ACIDS ARGININE","ISOLEUCINE *","ALANINE","LEUCINE **","ASPARAGINE","LYSINE","ASPARTATE","METHIONINE","GLUTAMATE","PHENYLALANINE","GLUTAMINE","THREONINE","TRYPTOPHAN","VALINE *","GLYCINE"]},{"heading":"PROLINE","paragraphs":["Table 9A: The Essential and Non-Essential Amino Acids. * = Branch Chain Amino Acids, ** = Leucine: the key branch chain amino acid for MPS (93)","Since these essential amino acids (EAAs) will ultimately fuel muscle protein synthesis, it’s important to focus on consuming high-quality, complete protein sources. Although simply following our total daily protein recommendations outlined in Chapter Eight will almost guarantee that you will naturally consume plenty of complete protein sources with a full spectrum of essential amino acids, we still need to make sure we’re optimizing our approach as much as possible. Remember, our goal is to teach you how to get the MOST out of your diet."]},{"heading":"VEGAN CONSIDERATIONS FOR PROTEIN SOURCES","paragraphs":["The importance of focusing on consuming foods with a full spectrum of EAAs may present a challenge to some vegans. Generally speaking, it can be more difficult for vegans to reach our recommended intake of total protein per day and the quality of protein (based on amino acid profile) from vegan sources is typically lower when compared to animal products. One potential solution vegans use to overcome the quality problem is to pair two or more incomplete protein sources to create a complete meal. A common pairing of two incomplete food sources to create a complete meal would be rice and beans ( lentils).","As you can see in Figure 9A below, rice is an incomplete protein source as it’s missing the EAA lysine and lentils are missing the EAA methionine. But when they are paired together in a single meal, it’s possible to take in all nine essential amino acids.","So even though rice and beans on their own would be incomplete, when combined, they make a complete meal containing all nine essential amino acids required for muscle building. We demonstrate this in the example below.","Figure 9A: Essential Amino Acid Content of Complete vs Incomplete Protein Sources Unfortunately, this strategy still poses a slight problem: the total quantity of amino acids are still generally much lower from vegan protein sources. One serving of rice, as an example, only provides about four grams of protein; not nearly enough to maximize the anabolic response.","But, when combined with one serving of lentils, we get an additional 13 grams of protein. Of course, one must then deal with getting an extra 70 grams of carbs to go along with that protein from these two food sources.","To fully illustrate this, let’s quickly compare the difference in amino acid profile and total protein content of one serving of rice and lentils to one serving of chicken breast."]},{"heading":"AMINO ACID (MG) RICE (56G - 2OZ) TRYPTOPHAN","paragraphs":["56.6"]},{"type":"table","cells":["THREONINE","ISOLEUCINE*","LEUCINE**","LYSINE","METHIONINE","CYSTINE","PHENYLALANINE","TYROSINE","VALINE*","ARGININE","HISTIDINE","ALANINE","ASPARTIC ACID","GLUTAMIC ACID","GLYCINE","PROLINE"]},{"heading":"SERINE","paragraphs":["163 188.2 368 169.6 100.2 53.8 230 166.8 260 338 113.2 260 416 906 218 208 230"]},{"heading":"LENTILS (56G -2OZ) CHICKEN BREAST (4OZ)","paragraphs":[]},{"heading":"N/A","paragraphs":["506 502 966 1096 161.8 514 680 388 614 940 396 548 2208 1938 492 548 762 302.4 1092 1364 1940 2196 716 331.6 1028 872 1284 1560 804 1412 2304 3872 1272 1064 888"]},{"heading":"TOTAL PROTEIN (G)","paragraphs":["4.4454 13.2598 24.302 Table 9B: Comparing the Amino Acid Profiles of Vegan (Rice & Lentils) and Animal Protein Sources (Chicken Breast)","As you can see in Table 9B above, the animal source (chicken breast) is much richer in the nine EAAs and the branch chain amino acids (BCAAs). As such, it packs a much more powerful anabolic punch per gram of protein. And even though there certainly are some complete vegan protein sources, unfortunately, most of these foods are still higher in carbohydrates than they are in protein.","Quinoa, for example, receives a lot of praise for being a complete protein, yet contains 70 percent carbohydrate by weight. Further, to get the same twenty-four total grams of protein that you’d get from a four ounce serving of chicken breast (with ~0g of additional carbs), you’d end up consuming an additional 109 grams of carbohydrates from quinoa.","But don’t worry! If you are vegan, not all hope is lost. While it can be more challenging for vegans to hit total protein intakes and consume high protein meals of sufficient quality, it is still doable.","Fortunately, in recent years, many supplement companies have made large strides in improving high quality vegan protein powders with a full spectrum of essential amino acids. We therefore strongly recommend supplementing with a vegan protein blend that uses rice and pea protein as their primary sources. This specific blend has been coined “vegan whey”, as it has a comparable amino acid profile to whey protein!","In the early days, these vegan protein supplements would contain high levels of trace carbs, but more recently, supplement companies have been able to drastically increase the total protein by weight. Lastly, and importantly, because these supplemental options are so similar to whey, they are also rich in EAAs, BCAAs, and pack a powerful anabolic punch per gram. Apart from supplementing a rice and pea protein blend, BCAA supplementation is worth considering for vegans to maximize the protein synthetic response of each meal. Since any complete protein-containing meal will contain all three BCAAs by default, we would not say supplementation is required, but may assist in making the most of each meal, especially if it is naturally lower in total BCAA content.","We suggest that vegans consuming meals naturally low in leucine can optionally consume an additional five grams of BCAAs (2:1:1 ratio) via supplementation with meals (most importantly pre/postworkout) to maximize the muscle protein synthetic response."]},{"heading":"WHY ARE BCAA’S SO POPULAR & WHAT PURPOSE DO THEY SERVE?","paragraphs":["On the topic of branch chain amino acids (BCAAs), it’s no secret that they have become one of the most popular sports supplements on the market. Perhaps this is because the three BCAAs (leucine, isoleucine and valine) have been identified as the key amino acids for initiating muscle protein synthesis (20). Leucine in particular has been shown to be the main amino acid responsible upregulating this process (93). Sounds awesome, right? Well, don’t get out your wallet and buy a tub just yet."]},{"heading":"DO BCAAS ACTUALLY MATTER?","paragraphs":["Yes, and no. Every time you eat a meal, you have an opportunity to maximize MPS and over time, your muscle building potential. Since leucine is responsible for triggering MPS, if you’re consuming food sources that are low in BCAAs (especially leucine), you are leaving potential gains on the table.","Generally speaking, the more leucine in a meal the more MPS will be elevated, up to a point. This means that consuming protein sources higher in leucine (such as whey or other animal sources) will increase MPS more. It also means that, assuming you have two meals of equal leucine content, the meal with more total protein will increase MPS more.","However, there is a limit to how much you can crank MPS up. Past this limit, adding more leucine or more protein won’t do anything extra for synthesizing new muscle proteins. Let’s illustrate this by way of analogy. Think about turning up muscle protein synthesis (MPS) like turning up the dial on a light dimmer. Just like there is a limit to how bright you can turn up a lightbulb with a dimmer switch, there is a limit to how much you can turn up MPS by consuming more leucine. Turning the dial past maximum brightness won’t make the bulb any brighter.","Now we’d like to conceptualize the importance of having both BCAAs and a full spectrum of EAAs in a maximally anabolic meal by using the analogy of a car. In this case, you can think of BCAAs as the key to the car. The key is required to turn on the vehicle (just as BCAAs are required to turn on MPS) and gasoline is the fuel source required to keep the car running (just as EAAs are required to keep the muscle building process going).","Therefore, while BCAAs do play an important role in getting the muscle building process started, we cannot simply consume BCAAs on their own and expect to build new muscle. For this reason, we recommend consuming foods high in BCAAs and EAAs and, except for in the case of some vegan exceptions, recommend against BCAA supplementation.","This isn’t because additional BCAAs will hinder the muscle building process, but rather that they most likely won’t actually help a diet already high in protein build any extra muscle (remember the dimmer analogy) (41).","Figure 9C: Comparing Muscle Protein Synthesis To A Dimmer Dial"]},{"heading":"SUGGESTED PROTEIN SOURCES","paragraphs":["Below are a list of high quality, protein rich foods that we recommend including in your diet regularly. These foods were selected based on the completeness of their amino acid profile and total leucine content.","Because we endorse a flexible approach to nutrition, you do not need to restrict yourself to only these foods. It is also important that you track protein intake from all food sources, including those with trace or incomplete proteins and those not included on the list below."]},{"heading":"PROTEIN SOURCES LIST:","paragraphs":["Whey Protein Eggs Egg Whites Meat (Chicken, Beef, Pork, Turkey, Elk, Game, etc)","Fish (all kinds)","Dairy (i.e. yogurt, cheese)","Vegan Protein Powder (Rice + Pea Blends)","Soy Protein Isolate Seaweed, Spirulina"]},{"heading":"2. PROTEIN DISTRIBUTION: HOW SHOULD WE SPACE OUT OUR PROTEIN THROUGHOUT THE DAY?","paragraphs":["Now that we have established what sources of protein are best for maximizing muscle growth, it is important to consider how we should distribute that protein throughout the day."]},{"heading":"HOW MUCH PROTEIN CAN WE ABSORB IN ONE MEAL?","paragraphs":["A popular nutrition myth is that you can only absorb X amount of protein in one sitting. Some people say 20 grams, some say 30 while others say 40. They argue that if you eat more than this amount in a single sitting, the rest simply goes to waste.","Let’s clarify from the outset that we think this is a massive oversimplification. First of all, you technically can absorb an enormous amount of protein in a single meal, since absorption simply refers to the passage of nutrients from the intestine into the blood. You could eat 300 grams of protein or more in one sitting and absorb all (or almost all) of it just fine. What people really mean when they ask this question is, “How much protein can be used in a single meal for building muscle?” In order to answer this question, we need to look at what the scientific evidence has to say.","As it turns out, early studies actually supported the idea of the maximum amount landing somewhere in the 20-25 grams per meal range. Two studies showed that 20-25 grams of a high-quality protein source such as whey protein was enough to maximize post-workout muscle protein synthesis (90,137) and another study comparing 20 grams to 40 grams of protein found no difference in muscle protein synthesis between the two (136). At the time, this data seemed to imply that anything over 20 grams of protein in a single meal wouldn’t do anything additional for building muscle.","However, if we peel back a layer on this early research, we can see that the results may not apply to those of us seeking body recomposition, as their training protocols were far too basic. For example, subjects in these early studies would only perform one exercise for one muscle group, eat their post “workout” (note the quotation marks) protein and then have the anabolic response of their muscle measured. When was the last time you went to the gym, did four sets of leg extensions and called it a full workout? Hopefully, never. Us neither. To address this potential flaw, in 2016, another group of researchers designed a new and improved study with a training regimen more relevant to what the typical lifter would actually do in the gym (80).","Rather than doing a few sets for one muscle group and calling it a day, these subjects performed a full body workout including the bench press, leg press, lat pulldown, et cetera. After the workout, the researchers compared the MPS response of 20 grams of whey protein versus 40 grams.","In contrast to the earlier studies, this time, 40 grams of whey did significantly increase MPS compared to 20 grams. This data opened up the idea that maybe the upper limit of how much protein can be used in a single meal for building muscle may be higher than previously thought, depending on how you train.","”Line represents the mean for each condition. Mean ± SD of myofibrillar FSR following the ingestion of 20 and 40 g whey protein isolate for both groups combined (B). *Significant difference between doses with all participants of each group combined (P = 0.005). FSR was determined over the 0–5 h period following protein ingestion.”","Figure 9C: 40g Of Whey Protein Is More Effective Than 20g At Increasing FSR/MPS (80) This should make intuitive sense because if you only train one muscle (or do a very low volume session), you won’t break down nearly as much muscle during the workout as you would by doing a high volume full body training session. As such, you would not expect to utilize as much protein in a single post-workout meal after the low volume protocol. The amount of protein needed to recover from an intense leg day is likely more than what is needed after a quick arm-pump. So how much protein you can utilize in a single meal seems to depend on the type of training you do, with higher volume sessions involving more total muscle, utilizing more protein per meal.","How much protein you need per meal also depends on how much total muscle mass you have. For example, a 120 pound female will require less total daily protein than a 180 pound male, but will also be able to utilize less protein per meal for building new muscle. As you can see, how much protein you can utilize in a single meal for building muscle depends on a variety of factors, including your training style and muscle mass. The more muscle you train in a workout and the more total muscle you have, the more protein you should be able to utilize per meal.","With the research background and individual factors in mind (training style and total muscle mass), let’s turn to practical calculations for determining exactly how much protein YOU should be eating per meal."]},{"heading":"HOW MUCH PROTEIN SHOULD WE EAT PER MEAL?","paragraphs":["As mentioned previously, while we need a full spectrum of essential amino acids in order to actually build new muscle tissue, the branch chain amino acid leucine is the primary trigger (key) for sparking new muscle growth (MPS). If we are going to answer the question of how much protein we should eat per meal, it is important therefore to know how much leucine we should eat per meal. If we can determine the maximum amount of leucine (past which extra leucine doesn’t add extra MPS)","then we can figure out how much protein we would need from leucine-rich food sources to maximize the MPS response of any given meal.","Luckily for us, one of the world’s most renowned protein researchers has discovered what that leucine threshold in humans seems to be. As we sift through Dr. Stuart Phillips’ data and findings, we encourage you to not get too caught up in the numbers.","It isn’t important that you know the exact leucine content of every meal in order to know how much protein to eat per meal (that would drive us crazy too!). We are simply outlining all of the data to show clearly where our recommendations are coming from. If you prefer to skip to the bottom line, you may check out the “Main Takeaways for Protein Distribution” at the end of this section. For the rest of us, let’s carry on.","Dr. Phillips reported that 0.045 grams of leucine per kilogram of body weight (0.0205g/ lb) per meal is the amount needed to optimize muscle protein synthesis (99). For example, if you weigh 170 pounds (~77kg), you would need about 3.5 grams of leucine per meal to maximize the protein synthetic response. If you weigh 125 pounds (~55kg), you would need about 2.5 grams of leucine per meal to maximize the MPS response. For this person, 2.5 grams of leucine could be referred to as her leucine threshold.","Adding more leucine to this meal (either through more protein or a scoop of BCAAs) would be like turning the dimmer dial past the light bulb’s maximum brightness. You can turn the dial further, but it isn’t going to make the bulb any brighter.","With this information in mind, let’s have a look at the graph below comparing multiple food sources and how much of each would be necessary to consume 2.5 grams of Leucine."]},{"type":"table","cells":["FOOD SOURCE","SERVING SIZE","LEUCINE (G)","TOTAL CALORIES","WHEY PROTEIN ISOLATE","SOY PROTEIN ISOLATE","23G","31G","SKIM MILK","374 ML (3.7 SERVINGS)","BEEF (RAW WEIGH","WHOLE WHEAT BREAD","CHICKEN (RAW WEIGHT)","PEANUTS","GREEK YOGURT","EGGS","142G","641G","142G","149G","250G"]},{"heading":"4.6 EGGS","paragraphs":["2.5 2.5 2.5 2.5 2.5 2.5 2.5 2.5 2.5 Figure 9D: Servings of Different Foods Required To Reach 2.5g of Leucine 92 125 333 391 3462 147 876 143 321 The above figure is intended to show how much of various foods a 125 pound individual would have to eat per meal in order to maximize the MPS response of that meal. It should be clear that how much protein you need per meal, will depend in part on what foods that protein is coming from.","Although it’s smart to have an idea of what foods are high in leucine and be aware that not every 20-30 gram source of protein will have the same anabolic power (see our Protein Sources List for suggestions), we certainly do not expect you to determine the leucine content of every food and then use that to calculate how much protein you should eat in each meal. In fact, as you will see in the examples below, if you simply focus on hitting your total daily protein target, primarily choose food sources from our Protein Sources List and consume four to six evenly spaced meals per day, you will maximize the anabolic potential of each meal by default.","With the above theory in mind, let’s look at two examples of how much protein from various food sources that different individuals would need per meal to maximize muscle protein synthesis. Let’s roll with two of our mock subjects from Chapter Six. This time we’ll call Subject C, Charles and Subject F, Florence."]},{"heading":"CHARLES INTERMEDIATE MALE AGE - 18 HEIGHT - 6’2","paragraphs":["WEIGHT – 200 LBS"]},{"heading":"FLORENCE ADVANCED FEMALE","paragraphs":["35 5’5 145 LBS Table 9C: Two Example Subjects And Their Stats"]},{"heading":"EXAMPLE 1: CHARLES","paragraphs":["Let’s figure out how much protein 200 pound Charles should eat per meal, based on his stats above. Charles’ macro targets are set at 110 grams Fat/ 510 grams Carb/ 240 grams Pro. Using Dr. Stuart Phillip’s 0.045 g/kg/meal “leucine threshold,” we can calculate how much protein Charles would need per meal to maximize MPS. Charles’s “leucine threshold” calculation: 90.9kg x 0.045 = 4.09 grams of leucine per meal to maximize MPS.","Knowing the leucine content of various protein sources, we can now calculate how much protein Charles would need to eat from each food to hit 4.09 grams of leucine. To maximize the anabolic potential of each meal, he would need to eat 37 grams of whey, 8.29oz Top Round Beef, 8.29oz Chicken Breast, 7.5 whole eggs or 51 grams of soy protein isolate. 8.29OZ CHICKEN = 228 CALORIES, 51G PRO, 4.09G LEU 8.29OZ TOP ROUND BEEF =394 CALORIES, 51G PRO, 4.09G LEU 7.5 WHOLE EGGS = 525 CALORIES, 45G PRO, 4.09G LEU 51G SOY ISOLATE = 172 CALORIES, 41G PRO, 4.09G LEU 37G WHEY ISOLATE = 142 CALORIES, 31G PRO, 4.09G LEU So as you can see above, all of these protein servings have the same anabolic power in the amounts given (since they have the same total amount of leucine and a complete essential amino acid profile). Notice that the amount of protein needed ranges from 31 grams to 51 grams.","Generally speaking then, Charles should aim to consume about 30-50 grams of protein per meal, depending on what food source he’s eating.","However, calculating the leucine content of every meal would be annoying and impractical, so the best approach would be to evenly distribute his total protein goal of 240 grams per day across five meals. In doing so, he gets about 48 grams of protein per meal and is pretty much guaranteed to maximize the muscle protein synthetic response each time."]},{"heading":"EXAMPLE 2: FLORENCE","paragraphs":["Using one more example, let’s figure out how much protein 145 pound Florence should eat per meal based on her stats in Table 9C above. Florence’s macro targets are set at 75grams Fat/335grams carb/ 170grams pro.","Again, using Dr. Stuart Phillip’s 0.045 g/kg/meal “leucine threshold” we can calculate how much protein Florence would need per meal to maximize MPS. Florence’s leucine threshold calculation: 65.9 x 0.045 = 2.97 grams of leucine per meal to maximize MPS.","2.97 grams of leucine can be found in 27 grams of whey, 6oz Top Round Beef, 6oz Chicken Breast, 5.5 whole eggs or 36 grams of soy protein isolate.","Therefore, based on the range above, Florence should aim to consume anywhere between 24-38 grams of protein per meal, depending on the food source. The best and most practical approach for her would again be to simply evenly distribute her total protein intake across five meals, each containing about 34 grams of protein."]},{"heading":"HOW MANY MEALS SHOULD I EAT PER DAY?","paragraphs":["As you can probably tell from the examples above, we generally recommend splitting your protein up across multiple meals per day so as to maximize the anabolic potential of each meal. From an optimization standpoint, we believe that spreading protein intake more evenly throughout the day will have a better effect on both maintaining and building muscle than skewing your protein intake to be eaten in just one or two massive meals.","Of course, simply reaching your total daily protein target is still the most important thing, but may not be enough to maximize results. Theoretically speaking, since there is a maximum threshold for upregulating MPS in one feeding, increasing the frequency of feedings (up to a point) should enhance muscle building capabilities. Let’s have a look at what science has to say.","One group of researchers (9) looked at the effect of splitting a high protein diet across three meals per day versus six meals per day on body composition. To determine whether there was a difference between being in a caloric deficit or at caloric maintenance, they had subjects eat at caloric maintenance for 28 days and then put them in a 25 percent caloric deficit for 28 days.","Group 1 - Traditional (low protein) diet: 3 meals per day, macro ratio: ~24%fat/61%carb/16%pro Group 2 - High protein diet: 3 meals per day, macro ratio: ~22% fat/45% carb/34% pro Group 3 - High protein diet: 6 meals per day, macro ratio: ~22%fat/45%carb/33%pro During the first 28 days at caloric maintenance, both high protein groups achieved body recomposition and during the 25 percent caloric deficit phase, all groups lost weight. However, the high protein group that ate six meals per day (Group 3) saw the greatest decrease in body fat percentage (2.8 percent), abdominal fat, and was the only group that gained lean body mass from start to finish (1.32 pounds)!","This may be in part due to these subjects getting to stimulate muscle protein synthesis six times per day vs only three times per day. It is also important to note that these male and female subjects were either overweight or obese; not well trained, athletic subjects. Despite this potential limitation, the study’s control (9) was fantastic. Unlike many other studies based on dietary recall (which significantly increases error and lack of validity (53,97)), this study provided a seven day menu plan to all participants for the entire 62 day intervention.","We believe this study counts as evidence for the idea that consuming more than three protein-containing meals per day may be more anabolic than consuming three or fewer meals per day."]},{"heading":"INTERMITTENT FASTING","paragraphs":["The above theoretical discussion may pose some challenges for those of you practicing intermittent fasting.","So everyone is on the same page, intermittent fasting (IF) is a dietary practice in which you extend your fasting period, thus consuming fewer meals per day. This can come in more extreme forms such as having only one meal per day and less extreme forms such as having an eight hour eating window, which ultimately amounts to just skipping breakfast. The less extreme version, for example, might involve having three or four meals from 12pm-8pm and then fasting for the remaining 16 hours of the day.","While it should be clear from the above discussion that we do not think IF is the best way to optimize a body recomposition plan, it can certainly still work as long as total macronutrient targets are reached and training performance is not hindered.","Still, based on the data above, we suggest that if you are going to use intermittent fasting as an adherence tool on your body recomposition journey, you use the less extreme version that avoids very long fasts, coupled with very short feeding windows.","Furthermore, if using intermittent fasting, we recommend that you still try to space your protein out more evenly across your eating window.","For example, if you were restricting eating from 12pm-8pm, you could eat a serving of protein at 12pm, 3pm, 5pm, and 8pm so that you still stimulate MPS four times per day. Additionally, you can take advantage of different digestion rates to further mitigate the potential catabolic effects of fasting. For example, for your last meal at 8pm, you could consume a slow digesting protein source (such as beef or casein) as part of a high fiber meal so that protein digestion and absorption of amino acids extends well into the fasting period. We will address this in more detail in the next section on specific protein timing."]},{"heading":"MAIN TAKEAWAYS FOR PROTEIN DISTRIBUTION:","paragraphs":["To maximize the anabolic response of each meal, we suggest splitting your total protein intake across 4 to 6 high-protein meals per day, spaced by roughly 3-5 hours between meals (besides your overnight fast, when you’re sleeping (i.e. 6-9 hours)). Note that “meals” can also include protein shakes/meal replacements."]},{"heading":"3. PROTEIN TIMING: WHEN ARE THE IMPORTANT TIMES TO EAT PROTEIN?","paragraphs":["In the previous section, we outlined why it is wise to space your protein out somewhat evenly throughout the day. Next, we are going to answer the question of whether or not there are specific times during the day when it is more important to consume protein. For example, is it important to consume whey protein after training? Should we eat a slow-digesting protein before bed?","First, it is important to acknowledge that if you are already hitting your total daily protein targets and eating four to six high-protein meals per day, the specific timing of those meals is of relatively less importance. We believe that the exact times that you eat your meals can be dictated largely by personal preference, scheduling and your own biofeedback signals (such as hunger and satiety).","We do not recommend force-feeding just because “it’s time to eat!” We also do not recommend impatiently waiting by the clock for the appropriate amount of time to pass before you eat your next meal. These habits can be destructive to dietary adherence and lifestyle balance over time and may eventually lead to a negative relationship with food.","With that said, physiologically speaking, different protein sources and food combinations will have different rates of digestion, which can impact when they are most ideally consumed. Figure 9E: Rates of Digestion for Different Protein Sources As you can see in the figure above, different proteins have different digestion rates because of differences in the structure of the protein itself. Whey protein, for example, is digested very quickly, resulting in a rapid influx of amino acids into the bloodstream. For this reason, it has been heavily marketed as a post-workout supplement.","On the other hand, casein (another protein found in milk) digests much more slowly, providing a slower, steady drip of amino acids into the bloodstream. For this reason, casein protein powders have been heavily marketed as a pre-bed protein source.","As we will explain in Chapter Eleven, while there is nothing particularly urgent about consuming a fast-digesting protein immediately after training and while consuming a slow- digesting protein before bed is certainly not as important as hitting total protein intake, specific timing strategies are still worth considering as you organize your meals throughout the day.","For example, because cod fish has a faster digestion rate than steak, a meal containing six ounces of cod with white rice will digest more quickly than six ounces of beef with white rice. However, because increasing the fiber and fat content of any meal will slow digestion rate, if you were to add fibrous vegetables and butter to either meal, the digestion rate would decrease.","You can use these timing principles to your advantage when expecting to go longer durations without food (such as before bed or if you need to skip a meal). For example, you can extend the anabolic response of any meal by eating protein sources with slower digestion rates or by consuming meals that are higher in fat and/or fiber.","For this reason, we recommend consuming both a high quality and high quantity of protein before bed so as to maximize your muscle building and recovery potential as you sleep. You can slow the digestion rate of the pre-bed meal by simply eating more protein, choosing a slower-digesting protein such as casein or steak and/or by adding a serving of vegetables or some fats before hitting the hay."]},{"heading":"A NOTE ABOUT FAT","paragraphs":["Rather than devote an entire chapter to fats, we have decided to instead leave a note here reminding you about why fats are important.","While fats are essential for survival and can positively impact your health in many ways, we think they have a relatively smaller role in optimizing body composition than protein and carbohydrates.","As we have seen, protein is responsible for building new muscle protein, promoting an increased feeling of satiety and increasing dietary thermogenesis. As we will see in the next chapter, carbohydrates play a central role in fueling training performance, which will ultimately drive muscle growth. With that said, fats still play several key roles on our path to body recomposition.","Because fats, such as cholesterol, make up the building blocks for steroid hormones, dietary fat plays a crucial role in regulating natural levels of several anabolic hormones, including testosterone. A diet low in overall fat intake has also been shown to suppress testosterone levels and as a result may hinder the muscle building and fat loss process (127). Furthermore, omega-3 and omega-6 fatty acids are essential nutrients responsible for regulating several metabolic processes, including inflammation, which may have implications for recovery from training. For this reason, we recommend consuming one or two servings of fatty fish per week or consider fish oil supplementation (see Chapter Thirteen for details). All fat-soluble vitamins also require dietary fat to facilitate absorption. Since deficiency in these vitamins can lead to health and recovery problems, it’s clear that eating sufficient dietary fat is central to proper health and performance.","Because the biochemical complexities of dietary lipids are beyond the scope of this book and are not likely to have any practical relevance for body recomposition, we will end this short section with a reminder that not all fats are created equal and it would be short- sighted to avoid dietary fat out of fear of having them “make you fat”. We also suggest that you limit and avoid trans-fats whenever possible because of their negative impact on heart health (91).","Other than these clarifications, we suggest that you focus your attention on hitting your total daily fat intake, take into account pre- and post-workout considerations in Chapter Eleven and use a variety of the suggested fat sources below to balance out your meals."]},{"heading":"SUGGESTED FAT SOURCES","paragraphs":["Below are a list of fat-rich foods that we recommend including in your diet regularly. Because we endorse a flexible approach to nutrition, you do not need to restrict yourself to only these foods. We encourage you to eat a variety of foods and there are no foods that are off-limits (just some that are better reserved for moderation).","We recommend an 80/20 rule when it comes to food selection: ensure at least 80 percent of your fats are coming from whole, minimally processed foods such as those below. The other 20 percent can be filled in with foods you personally enjoy or find convenient."]},{"heading":"FAT SOURCES LIST:","paragraphs":[],"list_items":["salmon and other fatty fish (or fish oil supplements)","whole eggs","seeds (flax, chia, etc.)","nuts (walnuts, almonds, macadamia nuts, peanuts, etc.)","nut butters (peanut butter, almond butter, etc.)"]}],"word_count":5653},{"number":10,"title":"Solving the Mysteries of Carbohydrates","start_page":140,"epigraph":{"quote":"THE THREE MOST HARMFUL ADDICTIONS ARE HEROIN, CARBOHYDRATES AND A MONTHLY SALARY.","attribution":"Nassim Nicholas Taleb"},"sections":[{"paragraphs":["In the previous chapter, we discussed why protein quality and distribution matter for maximizing progress. In this chapter, we will cover the same ground with respect to carbohydrates.","Carbohydrates are a non-essential macronutrient. Unlike protein and certain fats, you can technically survive without eating any carbs for the rest of your life. Carbohydrates also do not have the same anabolic properties as protein, since they do not directly impact muscle protein synthesis.","Despite this, carbohydrates still play a crucial role in the body recomposition process by fueling training performance, which will ultimately drive muscle growth. Different types of carbohydrates can also differentially impact things like hunger, digestion and mood state - all of which we will unpack in this chapter."]},{"heading":"THE BEST CARB SOURCES FOR RECOMP","paragraphs":["Recall how we previously emphasized that not all proteins are created equal. In this chapter, we begin by saying, neither are all carbohydrates!","Let’s be clear about what we’re saying here. For simple weight loss purposes, you can certainly treat “a carb as a carb” and the caloric deficit will take care of the weight loss. Swapping brown rice for Gatorade, for example, may not significantly affect your weight loss progress, but, such a swap may very well negatively impact other variables like your training performance and your adherence to the diet protocol.","We encourage you to view carbohydrates neither in a black and white fashion (as good carbs or bad carbs), nor as being completely equal. Therefore, we want to expose why there are many shades of grey, so to speak.","Before digging into the best carb sources for fueling training, it is important to understand the basic carbohydrate science from a structural standpoint so that we can all achieve a better understanding of our practical recommendations.","All carbohydrates have a few things in common: They are all made up of carbon, hydrogen and oxygen atoms (hence the name Carb-OH-hydrates), they all hold about three grams of water per gram when stored as muscle glycogen and they all taste amazing (for the most part).","Carbohydrates can also be categorized in several different ways. For our recomp purposes here, we will focus on two such categorizations: simple versus complex carbs and high glycemic versus low glycemic carbs."]},{"heading":"SIMPLE VS COMPLEX CARBS","paragraphs":["The phrase “simple carbs” implies exactly what it sounds like: They are the smallest and simplest types of carbohydrates. For the most part, they make up what we collectively call sugars.","There are many different types of sugars. The simplest of all are the mono-saccharides. The prefix mono means alone and saccharide is science-speak for sugar. There are only three of these sugars that exist on their own: glucose - our body’s primary energy source under normal circumstances (6,19,48), fructose - as found in fruit and galactose (the sugar type mostly found in milk products).","Figure 10A: Simple Carbs - The Monosaccharides.","In certain foods, these monosaccharides link up with one another to form sugar pairs called di-saccharides. As you might guess from the di prefix, this involves two of the sugars above linking together to form a slightly bigger type of sugar (see Figure 10B below for examples). We still classify these sugar pairs as simple carbs.","Figure 10B: Simple Carbs - The Disaccharides While you do not need to understand all of the underlying chemistry to know what foods to eat, it is important to have a fundamental grasp on what makes a simple carb,“ simple. ”Because simple carbs are so small, they can be absorbed very quickly and without significant digestion.","This will be important later, when we discuss pre, intra and post workout nutrition in Chapter Eleven. Examples of simple carbs include: candy, table sugar, the sugar found in milk and the sugar found in fruit (although there are also complex carbs in fruit).","Complex carbs, on the other hand, are much bigger and bulkier. They are made up of chains of simple sugars linked together. These complex carbohydrate chains are referred to as poly-saccharides (poly, referring to many and saccharide, indicating sugar).","Figure 10C: Complex Carbs - The Polysaccharides Because complex carbs are so large and often branched, they must be broken down (digested) into their smaller, simple components before they can be absorbed and used for energy. This has two important implications: Complex carbs are absorbed more slowly, over a longer time frame - something to keep in mind for later when we discuss carb timing in Chapter Eleven - and complex carbs have a higher thermic effect (recall from Chapter Four that the thermic effect of food refers to how many calories the body burns to break down that food).","Examples of complex carbs include whole grains, vegetables, legumes, rice and pasta."]},{"heading":"UNTANGLING FIBER","paragraphs":["Some foods that are high in complex carbohydrates also contain fiber (a type of polysaccharide). Fiber is important to mention because it has profound impacts on gut functioning. From a recomposition perspective, foods higher in fiber will assist with regular bowel movements. This can help improve nutrient absorption and prevent inconsistent weigh ins, resulting in more accurate recomp tracking. Fiber also promotes a healthier gut in general. Insoluble fibers (found in whole grains, beans, potatoes and many fruits) are transformed into short chain fatty acids by our gut’s microbes, which confer a multitude of health benefits (102).","Despite fiber having many health benefits, there can be too much of a good thing. Excessive fiber intake can lead to bloating, poor nutrient absorption and irregular bowel movements. For these reasons, we recommend keeping fiber intake between 25 and 75 grams per day. The higher your total carb intake, the higher your fiber intake should be. Use the figures below for approximate daily carb intake as a rough guideline for determining daily fiber intake."]},{"type":"table","cells":["<200G CARB: ~25G FIBER","200G CARB: ~35G FIBER","300G CARB: ~45G FIBER","400G CARB: ~55G FIBER","500G CARB: ~65G FIBER"]},{"heading":"600G CARB: ~75G FIBER","paragraphs":["Before making specific food recommendations, let’s quickly look at another carbohydrate property worth considering: the glycemic index."]},{"heading":"GLYCEMIC INDEX","paragraphs":["The glycemic index has been the source of a lot of unnecessary dietary confusion. Many people seem to think that high-glycemic carbs are the “bad carbs”, destined to be stored as body fat the second they touch your tongue. Low-glycemic carbs on the other hand, are often referred to as the “good carbs”, hoarding all the health and performance benefits foods can offer.","While there are important relevant differences between these carb types, we encourage you to avoid black and white thinking on this topic and recognize that both types can be useful depending on context.","To keep it simple, the glycemic index (GI) is a measure of how much a given food impacts blood sugar levels on a scale of 1-100. The higher the number, the more eating that food will raise blood sugar.","High Glycemic Medium Glycemic Low Glycemic"]},{"heading":"GLYCEMIC INDEX","paragraphs":["> 70 55-69 < 55 Table 10A: High, Medium and Low Glycemic Values Table 10B: The Glycemic Index of Common Foods It’s important to note that the values in Table 10B only apply when these carbs are eaten on their own. The glycemic response of a full meal depends not only on the carb source in the meal, but everything else on your plate.","White rice, as an example, is considered a high-glycemic carb source on its own but can you think of the last time you ate a plate of white rice by itself? Chances are, you will be combining that white rice with a protein source, such as steak and (hopefully) a vegetable such as broccoli. Because the protein in the steak and the fiber in the broccoli will both require a large amount of digestion before they can be absorbed, the carbs from the rice will be absorbed much more slowly as well. As such, the blood sugar spike that would normally be high from eating white rice, will be significantly blunted. That is, the glycemic response of the meal will be much lower.","At this point, you may be wondering if the glycemic index matters at all. We believe that the glycemic response of any given meal or food in isolation is not a primary driver of either muscle gain or fat loss (those titles belong to resistance training and energy balance). However, the glycemic index of different carbohydrates is worth considering for two reasons: energy levels and hunger."]},{"heading":"1. ENERGY LEVELS","paragraphs":["About a year ago, just before we started writing this book, I (Jeff) started noticing that every time I trained, I would feel weak and dizzy about half way through the workout. Sometimes, when you get to extremely low levels of body fat (usually below seven to eight percent for me), this happens simply as a result of low energy availability. But this was happening deep in winter, during a period of self-experimentation I called “bear mode.”","Without getting into the details, I was definitely not short on total calories or body fat. Something else was definitely going on.","It was actually after several phone calls with Chris, that I discovered the issue. I was skipping breakfast in the morning and then having a pre-workout meal that consisted only of extra lean ground chicken, white rice and salsa. Because this was my only meal prior to training, and there was minimal fat or fiber present to slow digestion down, my blood sugar was sky- rocketing from the high glycemic white rice and then crashing mid-workout. After figuring out the problem, I did two things to fix it.","First, I stopped skipping breakfast. In other words, I started eating two meals before training. I realize not everyone can do this because of scheduling concerns, but this allowed me to replenish any lost glycogen from the overnight fast to provide more sustained energy during the workout. I also switched to a lower glycemic carb source. Rather than having chicken and white rice, I switched to whole wheat bread and made a chicken sandwich instead. There are other things I’ve done since then to further optimize my pre- and intra-workout nutrition that we will cover in the next chapter.","The main takeaway here is that something as simple and unsuspecting as the glycemic index of your carb sources can have an impact on your energy levels during your training session and at various time points throughout the day."]},{"heading":"2. HUNGER","paragraphs":["Another thing the glycemic index of a food can impact is hunger and satiety (how full you feel after eating). In 1999, Dr. Ludwig’s research group investigated the effects of glycemic index on hunger responses (79). The scientists had three groups of subjects consume a meal of similar caloric value. One group consumed a low-glycemic meal, one group a medium- glycemic meal, and the third, a high-glycemic meal.","Figure 10D: Glycemic Index and Hunger (Adapted from Ludwig et al, 1999) (79)","As expected, the high-glycemic group had the largest spike in insulin, followed by a blood sugar crash. They also demonstrated the greatest increase in adrenaline, which the authors attributed to the corresponding increase in hunger (perhaps due to mimicking a starvation response).","After the meal, all three groups were given free access to food and as you might expect, the high-glycemic group ended up eating approximately 650 extra calories in their next meal compared to the other two groups!","The implication for recomposition is that choosing low-glycemic carbohydrates for most of your meals will likely improve your adherence to the macronutrient targets by helping you feel more full after each meal."]},{"heading":"SUGGESTED CARB SOURCES","paragraphs":["Below are a list of carbohydrate rich foods that we recommend including in your diet regularly. Because we endorse a flexible approach to nutrition, you do not need to restrict yourself to only these foods. We encourage you to eat a variety of foods and there are no foods that are off-limits (just some that are better reserved for moderation).","We recommend an 80/20 rule when it comes to food selection: ensure about 80 percent of your carbs are coming from whole, minimally processed foods such as those below. The other 20 percent can be filled in with foods you personally enjoy or find convenient."]},{"heading":"CARB SOURCES LIST:","paragraphs":["Whole wheat bread, oatmeal, brown rice, long grain rice, all rice derivatives (i.e. cream of rice, rice crisp cereal, etc.) legumes (peas, beans, etc.), starchy vegetables (potatoes, carrots, corn), quinoa, bulgur (wheat derivatives), all fruit (kiwi, bananas, apples, oranges, etc.), all berries (raspberries, blueberries, blackberries, etc.), all fibrous vegetables (broccoli, spinach, kale, lettuce, etc.)"]},{"heading":"HOW MUCH SUGAR IS OKAY?","paragraphs":["While foods like ice cream, cookies and sugary cereals are fine in moderation, we do recommend limiting them to a time when they are less likely to result in a crash during training. For example, it would be much more appropriate to consume these foods as part of a post-workout meal than a pre-workout meal.","Furthermore, we suggest limiting total daily sugar intake to roughly 100 grams per day as a soft maximum. Of course, some of you with high caloric requirements will be fine exceeding this limit, and some of you with lower caloric intakes should rarely reach this amount if you are sticking to the 80/20 rule.","Also, if the majority of your sugar intake is coming from fruit, you may exceed the 100 gram limit. We wanted to include this as a ballpark figure to be aware of, as opposed to a universal limit that can never be exceeded.","You may now be wondering how all of this going to affect your ability to achieve body recomposition? In the next chapter, we will outline how to organize your macronutrient intake around training so as to optimize performance in the gym and recovery after training."]}],"word_count":2232},{"number":11,"title":"The Nutrition-Workout Link","start_page":152,"epigraph":{"quote":"WORK OUT. EAT WELL. BE PATIENT. YOUR BODY WILL THANK YOU!","a
