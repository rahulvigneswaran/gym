ttribution":"Anonymous"},"sections":[{"paragraphs":["Pre and post workout nutrition has been the source of much disagreement and controversy in the fitness and bodybuilding world. On the one hand, the bros will argue that if you do not chug back your protein shake within seconds of finishing your last set, you might as well have skipped your workout because you just missed the anabolic window of opportunity to build muscle.","As a response to this, some new-age practitioners have taken the extreme opposite stance by rebutting that nutrient timing around the workout doesn’t matter at all as long as you hit your daily macro targets. It does not matter when you eat, they say.","Let’s state from the outset that we strongly disagree with both of these oversimplified stances.","Remember that when it comes to body recomposition, the training stimulus will ultimately drive muscle growth. As such, the timing of nutrients around the workout to support performance and recovery is an important variable to account for.","As we will see, there is much more to nutrient timing than just drinking a post-workout shake. Pre-workout, intra-workout and post-workout nutrition all deserve to be treated separately and what you consume at each time point can impact your training performance and recovery differently.","We refer to the collective meals around and during the workout as periworkout nutrition."]},{"heading":"WHEN DOES PERIWORKOUT NUTRITION MATTER?","paragraphs":["There are various individual factors that can influence how important periworkout nutrition is for achieving recomposition: starting body fat percentage, total caloric intake and training style."]},{"heading":"1. BODY FAT PERCENTAGE","paragraphs":["The first factor that will impact the importance of peri-workout nutrition is your current level of body fat. The higher your body fat, the more energy your body has in reserve (in adipose tissue as fat and in muscle tissue as glycogen), making the timing of nutrients around the workout less urgent.","On the flip side, trainees with lower energy reserves (leaner individuals) would be wise to pay closer attention to their periworkout nutrition because they do not have an abundance of stored energy which increases the importance of optimizing energy utilization from food."]},{"heading":"2. TOTAL CALORIC INTAKE","paragraphs":["How many calories you are eating in total also impacts the importance of nutrient timing around training. An individual with a lower caloric intake would be advised to allocate a reasonable portion of their nutrient intake around the training session so their performance and recovery is not further impeded by the lower overall energy intake.","That isn’t to say those with a higher calorie target can ignore periworkout nutrition, but just that it is of relatively less importance for them."]},{"heading":"3. TRAINING STYLE","paragraphs":["Your specific style of training can also impact how much you should pay attention to nutrient timing. Let’s use a few examples to illustrate.","A powerlifter training with heavy weights for low reps (1-6 reps) will likely not deplete as much carbohydrate during their training session as a traditional bodybuilder who trains with more moderate to high reps (6-20 reps) and high volume. This is because high intensity, low volume training will rely more heavily on the phosphocreatine (PCr) energy system (using creatine phosphate for fuel), whereas the moderate intensity, high volume training will rely more heavily on the glycolytic system (burning carbohydrates for fuel).","Presumably, the bodybuilder in our example would deplete more glycogen during training and would stand to benefit more from timing carbohydrates around the workout.","The total length of the workout and type of split you’re running can also come into play. For example, the nutrients depleted and calories expended during an intense two hour leg day will be significantly higher than a 45 minute shoulder and arm workout.","Summing all three factors together, let’s consider Fred who has been eating in a caloric surplus and is at 20 percent body fat. Fred should be able to perform pretty well in the gym with or without a fully optimized pre-workout meal in his system.","Conversely, Joe, a male at six percent body fat, who has been in a caloric deficit for months and is very glycogen depleted, would likely perform much better with properly fine-tuned nutrition around the workout. Failure to optimize Joe’s periworkout nutrition would place him at a greater risk to lose muscle tissue as well.","With that information tucked away for future consideration, let’s discuss the goals of all three components of your periworkout nutrition and how to approach each aspect."]},{"heading":"PRE-WORKOUT NUTRITION","paragraphs":["In our opinion, THIS is the MOST important meal of the day for body recomposition. As such, we will give it the most attention. Optimizing the pre-workout meal will ensure that you are properly fueled to perform at your best and generate the ideal anabolic environment to maximize the muscle building process.","As such, there are two primary purposes of the pre-workout meal: to fuel training and to create an anabolic environment for building muscle. Let’s start with fuelling the workout."]},{"heading":"1. FUEL THE WORKOUT","paragraphs":["The preworkout meal should consist of all three macronutrients and water. Because the right carbohydrates in the right quantity will be most effective for providing sustainable energy throughout the workout (138), we will focus on carbs first.","What type of carbs should you eat pre-workout? Recall from Chapter Ten that choosing lower glycemic carbohydrates will be more likely to keep blood glucose levels stable during training. For this reason, we recommend selecting carb sources on the lower end of the glycemic index and/or composing a meal that will induce a lower glycemic response (such as by adding a protein with some fiber and fats) (138).","A pre-workout meal consisting primarily of high glycemic carbs may cause blood glucose levels to dip below baseline, putting you in a hypoglycemic state (139). Similar to the case when I (Jeff) was eating plain chicken and white rice as a pre-workout meal, this hypoglycemic state can lead to weakness, light-headedness, dizziness, and will definitely negatively impact your training performance if it occurs.","Figure 11A: High GI carbohydrates result in a rapid spike in blood glucose, followed by a faster fall, a dip below baseline (hypoglycemic), and less overall blood glucose stability (138)","Low glycemic carbohydrates have also demonstrated higher amounts of fat oxidation and improved time-to-exhaustion. Despite being an acute response, making better pre-workout carb choices will clearly improve body composition by enhancing workout quality over time! We also recommend including carbohydrate sources that require the use of multiple carbohydrate transporters for absorption in your pre-workout meal.","Remember the three different monosaccharides (simple sugars) we discussed earlier (glucose, fructose and galactose)? Well, these three sugars each use different transporters to get them from the digestive tract into the bloodstream where they can be used for energy. The main reason why it’s smart to include carbohydrates that utilize multiple transporters is that they will provide a more sustainable and consistent energy source throughout a training session (52). In other words, if you simply consume one type of carbohydrate, you will only be able to utilize one transporter for absorption. If you consume two (or more) types of carbohydrates, you will be able to utilize several different transporters that funnel the carbs through at different rates. This will result in a much more efficient influx of carbohydrates in the bloodstream and a more sustainable supply of energy.","Let’s illustrate this by way of analogy. Consuming 80 grams of carbohydrates from rice (a string of glucose molecules only), would be like trying to funnel 80 students in one classroom through one exit door. In this analogy, the single transport protein being used for absorption is the one exit door.","On the other hand, if you were to still consume 80 grams of carbohydrates, but this time split the carbs between 60 grams coming from rice (a string of glucose only) and 20 grams coming from fruit (a combination of glucose and fructose), you would now be able to absorb the glucose and fructose through different transporters.","This second scenario would be like creating a whole new exit door for 20 students. If all 80 students need to get out of the classroom, the scenario with two exit doors would clearly be more efficient.","While this analogy does not capture all of the complexity of nutrient absorption (since different transporters also have different transport rates), it serves to illustrate that including carbohydrate sources that utilize different transporters (such as fruit) in the pre-workout meal can have implications for energy availability and training performance.","This idea is supported in the scientific literature as well, where we see the use of multiple transportable carbs improving endurance performance (38). We suspect that a similar effect would be observed for resistance training performance, especially when considering difficult, high volume training sessions (52).","With all of this information provided, we recommend that your pre-workout meal consist of starchy, low glycemic carbohydrates and a fruit source. We further suggest eating at least two servings of fruit per day, with at least one of those servings coming from your pre-workout meal. It is important that you select food sources that you digest well and don’t cause any stomach discomfort. When resistance training, you don’t want to feel full or bloated. Consume food sources that you feel well eating and time the meal appropriately to ensure adequate digestion before training."]},{"heading":"HOW MANY CARBS TO EAT PRE-WORKOUT","paragraphs":["Now that we understand what kind of carbohydrate sources are best to include in your pre- workout meal, let’s turn our attention to how much of them we should eat.","While there will be individual differences, generally speaking, we recommend hitting a minimum of one gram of carbohydrate per kilogram of body weight. For example, a 175 pound male (~80kg) should consume approximately 80 grams of carbs in his pre-workout meal. A 120 pound female (~55kg) would perform best with at least 55 grams of carbs in her pre-workout meal.","Of course, depending on your total daily calorie and carb intake, you may be required to eat more or less than this amount. This however, is our soft minimum target for optimizing training performance.","As mentioned previously, higher volume and longer duration training sessions generally require higher amounts of carbohydrates to fuel properly, so use discretion when adjusting the one gram per kilogram figure to fit your specific training needs.","We also recommend consuming fiber in moderation in the pre-workout meal. To avoid interference with nutrient absorption and unnecessary bloating, fiber should be kept around 5-15 grams in the preworkout meal as a ballpark estimate. The further away your training session is, the more fiber you can get away with and even utilize as a tool in your favor. The sooner your training session is, the less fiber you should consume.","For similar reasons, we recommend consuming a more moderate fat intake before training. While this will be individual, we recommend keeping fat intake no higher than 0-20 grams in the pre-workout meal. Individuals with higher overall caloric intakes may require higher fat intakes in the pre-workout meal. Also, the closer the pre-workout meal is to the training session itself, the lower fat it should contain to prevent digestion-training overlap. With clarity on pre-workout carbohydrates and their vital role in lifting performance, let’s now turn to pre-workout protein intake."]},{"heading":"2. CREATE AN ANABOLIC ENVIRONMENT DURING TRAINING","paragraphs":["In addition to fueling performance, it’s also important that your pre-workout meal create an anabolic physiological environment leading into the training session. This is not primarily achieved through carbohydrates and the insulin response, but rather, the quality and quantity of protein in the pre-workout meal.","Consuming adequate protein in the pre-workout meal will stimulate the appropriate muscle protein synthetic machinery to crank up the anabolic dial during training (100,122). In addition, it will help tip the balance in favour of synthesis and anabolism over proteolysis and breakdown.","Based on information outlined previously, we recommend consuming approximately 0.45- 0.75 grams of protein per kilogram of bodyweight in the pre-workout meal, ideally coming from a complete protein source such as whey, meat, poultry or fish. (See Chapter Seven for vegan considerations).","Putting all of this information together, some example pre-workout meals are given in the table below."]},{"heading":"MEAL EXAMPLES (SITUATION DEPENDENT)","paragraphs":["SUBJECT 1: 175lbs Male, SUBJECT 2: 120lbs Female, SUBJECT 3: Weight N/A, Training in 60-90 mins Training in 90-120 mins Training in 30 mins (hasn’t"]},{"heading":"MACRO GOAL:","paragraphs":[]},{"heading":"MACRO GOAL:","paragraphs":["eaten in 3-5+ hours)"]},{"heading":"MACRO GOAL: N/A","paragraphs":["13.5g Pro)","30g Carb/ 4g Pro)","Carb/ 1g Pro)","0g Carb/ 20g Pro)","(~0g Fat/ 5g Carb/ 2g Pro)","Carb/ 1g Pro)"],"list_items":["10g Fat/ 80g Carb/ 45g Pro","9g Fat/ 55g Carb/ 30g Pro","100g Banana (0g Fat/ 22g","80g Oats (5.5g Fat/ 53g Carb/","150g Sweet Potato (0g Fat/ • Carb/ 1g Pro)","30g Whey Protein (0g Fat/ 3g","100g Banana (0g Fat/ 22g","4oz Salmon w/ skin (9g Fat/ Carb/ 25g Pro)","45g Whey (0g Fat/ 5g Carb/","80-100g Green Fibrous Veg 34g Pro)","5g Coconut Oil (4.6g Fat/ 0g","100g Apple (0g Fat/ 12g Carb/ 0g Pro)","1-5g Cinnamon","1-5g Cinnamon","1/8th- 1/4th tsp Pink/Sea","1/4th tsp Pink/Sea Salt/ Salt/Table Salt Table Salt Table 11A: Examples Of Pre-Workout Meals Depending on Context"]},{"heading":"WHEN SHOULD THE PRE-WORKOUT MEAL BE EATEN?","paragraphs":["In the examples above, you may have noticed that the carbohydrate and protein sources vary depending on how much time there is between the pre-workout meal and the training session itself. Sometimes you are forced to train on short notice and may eat your pre- workout meal within 30 minutes of training, while other times there will be one to two hours between eating and training.","Generally, we suggest eating 30-120 minutes before training, depending on your schedule, preferences and what you find provides the best energy while lifting. The composition of the pre-workout meal can then be fine-tuned to fit your particular needs.","The closer the meal is to the workout, the more you should focus on consuming faster digesting foods such as whey protein and a banana (which is lower in fiber than an apple). You may also reduce total carbohydrate intake when on a rushed schedule for faster energy availability and to avoid an overlap of digestion and training.","Notice how Subject 3, who only had 30 minutes between eating and training consumed only 25 grams of carbs, whereas Subjects 1 and 2 more than doubled that intake owing to more time separation."]},{"heading":"THERE ARE A FEW OTHER POINTS TO NOTE CONCERNING THE EXAMPLES ABOVE:","paragraphs":[],"list_items":["All meals utilize multiple transportable carbs by including a fruit source.","All subjects lightly salted their meals to improve electrolyte balance. You may notice that Subject 2 included a larger serving of salt, despite being the smallest person. This increase in salt is indented to optimize the sodium-potassium (Na+:K+) ratio of the meal. Subject 2 consumed sweet potato, which is extremely rich in potassium. When eating meals high in potassium, salting the meal slightly more liberally is acceptable.","All subjects also added a serving of cinnamon to their meal. Cinnamon has been shown to decrease the glycemic response of a meal and help keep blood sugar levels stable (3,12). Try adding cinnamon to your pre-workout meal and note if it improves how you feel and perform in the gym.","Having the essentials of your pre-workout meal determined, you can be confident that your training performance will improve."]},{"heading":"THE IMPORTANCE OF HYDRATION","paragraphs":["An underappreciated and often neglected component of fueling your training is proper hydration. Research has shown that a mere three percent dehydration status can significantly decrease strength, total volume/reps and recovery between sets, all while increasing perceived exertion scores (the workout feels harder) (72). So if you haven’t prioritized hydration in the past, below are some specific, science-based guidelines for those of you who like objective targets. (115)"]},{"heading":"GENERAL GUIDELINE FOR TO OPTIMIZE HYDRATION STATUS","paragraphs":["- Main Guideline: ~1ml fluids per 1kcal of energy needs throughout the day. (e.g. someone eating 2500 calories per day, should drink at least 2500ml (~84oz = 0.65 gallon))","- ~5-10ml/kg total body mass in 2-4 hours pre-workout (e.g. 160lbs male (72.7kg) should con- sume ~550ml of water (~18.5oz) leading into their training session)","- 0.4-0.8 liters/hour of activity (up to 2.4 liters/hour with outdoor activity) - Rehydration post-training (1.25-1.5 liters/kg of body weight lost during training) For the rest of us, meticulously tracking water intake can be cumbersome and unnecessary. The good news is that adhering to the specific guidelines above is not required if you simply make a guided effort to stay well-hydrated throughout the day.","Perhaps the simplest way to assess hydration status is by noting the color of your urine (142). Urine that is more clear and less yellow is indicative of proper hydration. The goal is to keep your urine looking more like lemonade and less like apple juice.","If gazing into the toilet at the hue of your urine doesn’t have much of an appeal, you can simply pay more attention to biofeedback. In order words, pay close attention to your subjective levels of thirst. The thirst mechanism is surprisingly reliable: if you’re thirsty, chances are you are already dehydrated. For many of us, the best advice is to keep it simple by making it a habit to drink fluids consistently throughout the day."]},{"heading":"PRE-WORKOUT NUTRITION: PUTTING IT ALL TOGETHER","paragraphs":["Your preworkout meal should consist of:"],"list_items":["~1g of carbohydrates per kg of bodyweight, coming from a low glycemic carb source plus a serving of fruit.","~0.5g of protein per kg of bodyweight coming from a high quality protein source (or combination of sources)","0-20g of fat, depending on total caloric intake and the length of time before training","Enough water to support proper hydration status before training without excessive interruption from frequent urination"]},{"heading":"INTRA-WORKOUT NUTRITION","paragraphs":["The purpose of intra-workout nutrition (nutrients consumed during the training session) is to improve performance and prolong time to fatigue. Similar to the pre-workout meal, those who have lower energy reserves (less body fat and glycogen) will likely yield the greatest benefit from utilizing intra-workout nutrition. The value of an intra-workout meal will also depend on the volume and duration of your training. We generally recommend intra-workout nutrition under the circumstances listed below. If none of the following considerations apply, an intra-workout feeding is not needed at all.","Assuming one of the three above considerations apply to you, providing your body with a fuel source such as glucose during training can help spare muscle glycogen and reduce muscle protein breakdown. It can also increase hyperemia, leading to better pumps in the gym. This will create more enjoyable training sessions and potentially improve the mind-muscle connection.","Furthermore, while debate is ongoing in academic circles as to its specific role, muscle cell swelling has been proposed as a contributing factor for hypertrophy (112). Paying attention to intra-workout nutrition will also help easily maintain adequate hydration status and electrolyte balance and can also improve mood and ability to focus.","Given all of these potential upsides and no obvious downsides, including a simple intra- workout feeding as part of your regular training routine seems like a no brainer."],"list_items":["Your workouts are longer than 60 minutes.","You train on an empty stomach (fasted).","It has been three to five hours since your pre-workout meal."]},{"heading":"WHAT TO EAT INTRA-WORKOUT","paragraphs":["We recommend that intra-workout nutrition come from liquid carbohydrates and optional liquid protein/amino acid supplements. Liquid sources are used for quick consumption and digestion and to prevent a full or bloated feeling while training.","In the table below, we have ranked some popular intra-workout options in order of practicality. It is worth noting that intra workout carb or protein powders are not required supplements. We are including our opinions on the most popular options for the sake of completeness."]},{"heading":"EXAMPLES OF CARBOHYDRATE POWDERS","paragraphs":["- Dextrose (ex. Gatorade)","- Simple, effective and affordable - Sucrose (ex. Kool-Aid)","- Simple, effective and affordable"]},{"heading":"EXAMPLES OF PROTEIN/AMINO ACIDS","paragraphs":["- Whey Protein Isolate - Very fast absorption, complete EAA profile, more affordable, but may not be worth the cost for some - Essential Amino Acids (EAA)","- May promote anabolism, but may not be worth the cost for some - High Fructose Corn Syrup (ex. Powerade)","- Simple, effective and affordable - Whey Protein Hydrolysate - Very fast absorption but may not be worth - Highly Branched Cyclic Dextrin - Low glycemic, quick absorption, but quite expensive - Maltodextrin - Not recommended due to gastric distress and cost the cost for some - Branch Chain Amino Acids (BCAA)","- Very little supporting research - Not recommended due to high cost Table 11B: Examples of Popular Intra-Workout Supplements & Powders Some of these supplements and powders have theoretical advantages, while others lack scientific support, despite their popularity. For example, the complex carbohydrate Highly Branched Cyclic Dextrin (HBCD) is a larger molecule compared to dextrose (the simple sugar found in Gatorade) and research has found it to have a faster gastric clearance rate than most other liquid carb sources (121). However, despite the fact that there may be some theoretical advantage to using HBCD, the financial cost difference is so substantial when compared to other intra-workout carb sources that we personally don’t recommend using it. A much simpler and more affordable option such as Gatorade, Powerade or Kool-Aid will confer similar benefits for a fraction of the cost.","One carb source that is undeservedly popular in the supplement industry is maltodextrin. Maltodextrin (which is essentially corn starch) is hyper-allergenic, often causes gastrointestinal distress and has been shown to cause post-meal glycaemia, which is generally less than desirable from a health perspective (59). Supplement companies often include it in their products as a cheap filler and we don’t recommend using it as an intra-workout carb source. Similarly, the different protein and amino acid supplements in Table 11B are not all created equal. For example, BCAAs remain one of the most popular sports supplements in the industry, despite minimal evidence supporting their efficacy (41). Although BCAAs are crucial for upregulating MPS, it is well understood that all nine EAAs are required to synthesize new muscle proteins (141). Therefore, rather than using intra-workout BCAAs, we recommend consuming an EAA supplement or a whey protein isolate shake instead.","For those interested in what can be found at the very tip of the iceberg, it is interesting that our bodies have the ability to absorb di- and tripeptides (two or three amino acids linked together) directly from the small intestine. Despite these molecules being larger in size compared to a single, free floating amino acid, they have a faster gastric clearance rate (116,123,130).","In theory, this could make something like hydrolyzed whey protein isolate the ideal intra- workout protein source. All things considered, given the price point for such a specialized protein powder, a cost-benefit analysis would be advised before purchasing a tub. Having covered background on the different sources of intra-workout nutrition, we must now consider the appropriate quantity of each source."]},{"heading":"HOW MUCH TO EAT INTRA-WORKOUT","paragraphs":["Consuming too many carbohydrates or too much protein during training can lead to gastrointestinal discomfort and negatively impact training performance. The literature has shown that carbohydrate oxidation rates tend to plateau at 1-1.2 grams per minute (65), so consuming more than one gram of carbohydrate per minute of training would be unnecessary for fueling performance.","We generally recommend 0.5 grams of carbs per minute of weight training, beginning about 30 minutes into the workout. For example, if training for 90 minutes, you would consume a total of 30 grams of carbs during the workout, starting 30 minutes in.","It seems that intra-workout carbs are more important than intra-workout protein for fueling performance and therefore we view intra-workout protein more as extra-protection anabolic insurance than a requirement for growth to occur. This is especially true if you have followed our advice in regard to the pre-workout meal."]},{"heading":"INTRA-WORKOUT EXAMPLES (CONTEXT DEPENDENT)","paragraphs":[]},{"heading":"SUBJECT 1","paragraphs":["Status: Fasted (no preworkout meal)"]},{"heading":"SUBJECT 2","paragraphs":["Status: Optimized Pre-WO meal 2 hours ago (currently in a calorie deficit)","Training: Full Body - 60 minutes Training: Shoulders & Arms - 60 minutes Suggested Nutrition:","20-30g Carbs via HBCD or Dextrose Gatorade) + 10g Whey Isolate or EAA Suggested Nutrition:","10-25g Carbs via HBCD or Dextrose Gatorade) + 10g op- tional Whey Isolate or EAA. Additional protein supplemen- tation is not re- quired."]},{"heading":"SUBJECT 3","paragraphs":["Status: Poor Pre- WO Nutrition, ate 3+ hours ago (in a caloric surplus & struggles to reach macros)","Training: Leg Hyper- trophy (high volume)","- 120 minutes Suggested Nutrition:","60g Carbs via HBCD or Dextrose (Gato- rade) + 20g Whey Isolate or EAA"]},{"heading":"SUBJECT 4","paragraphs":["Status: Optimized Pre-WO meal 2 hours ago (currently in a calorie deficit), on a tight money budget Training: Upper Body - 90 minutes Suggested Nutrition:","10-25g Carbs via Dextrose (Gatorade.","Additional protein supplementation is not required.","Table 11C: Intra-Workout Nutrition Examples Depending on Individual Context For those of you in a caloric deficit, you may not want to waste calories on liquid sources for satiety purposes. In this case, we would simply recommend consuming a very minimal amount (5-10 grams) of carbohydrates intra-workout. In our experience, even five grams of carbohydrates can be sufficient for stabilizing blood glucose and turning a bad workout around.","It may sound unbelievable, but there is also considerable data supporting the use of carbohydrate mouth rinsing (CHO-MR) as a way to improve performance in endurance activities such as cycling (22,30,33). One group of researchers also observed improved resistance training performance from CHO-MR (40).","The proposed mechanisms are likely neurologically mediated. Researchers have proposed that the presence of carbohydrates in the mouth can increase dopamine release (31) which cannot only increase feelings of pleasure and motivation, but also increase motor output. For those of you who would prefer not to waste precious carbs, you may be able to reap similar benefits by simply rinsing your mouth with Gatorade rather than actually drinking it."]},{"heading":"INTRA-WORKOUT NUTRITION: PUTTING IT ALL TOGETHER","paragraphs":["Intra-workout nutrition should consist of:"],"list_items":["~0.5g of liquid carbohydrates per minute, starting 30 minutes into the workout. - Sources include Gatorade, Powerade or HBCD","Optionally add 10-20g of whey protein isolate or EAA’s Intra-workout protein/amino acid supplementation is of less importance for those who have already optimized the pre-workout meal and/or if financial cost is a concern.","Intra-workout nutrition should be considered an optional optimization strategy of relatively less importance if a high quality pre-workout meal has been consumed."]},{"heading":"POST-WORKOUT NUTRITION","paragraphs":["While the post-workout anabolic window has gotten more attention than it deserves in bodybuilding circles, a post-workout meal still has a meaningful role in the peri-workout trio of feedings. Since the primary goal of the post-workout meal is to begin the recovery process, we will start with the most anabolic macronutrient, protein."]},{"heading":"PROTEIN","paragraphs":["The most important aspect of post-workout nutrition is stimulating muscle protein synthesis and sparking the muscle repair process for tissue that was damaged during training. To this end, we recommend consuming approximately 0.5 grams of protein per kilogram of bodyweight in the post-workout meal, ideally coming from a complete protein source such as whey, meat, poultry or fish (see Chapter Nine for vegan considerations). Of course, you can simply consume one of your evenly spaced protein-containing meals as discussed in Chapter Nine."]},{"heading":"CARBS","paragraphs":["A second objective of post-workout nutrition is to replenish glycogen stores. While it is unlikely that glycogen stores will be significantly depleted, assuming the pre- and intra- workout guidelines have been followed, ensuring full glycogen replenishment becomes more important if you are training multiple times per day or if you train the same muscle group on consecutive days such as when following a high frequency full body split. Because rates of glycogen synthesis are highest within the first two hours following training, we recommend consuming 1-1.5 grams of carbohydrate per kilogram of bodyweight post- workout. This may also be a good time to include a high glycemic carb source, since they have been shown to optimize glycogen synthesis compared to low-glycemic carbs following training (26).","Similar to your pre-workout meal, we suggest consuming another fruit source in your post workout meal. With our general nutrition goal of consuming two servings of fruit per day, placing them in your pre and post-workout meal is a simple and effective way to improve accountability."]},{"heading":"FATS/FIBER","paragraphs":["Mirroring the suggestions for the pre-workout meal, the post workout meal should contain roughly 0-20 grams of fat, depending on total caloric intake and food preferences. As a ballpark maximum, fiber should be kept around 5-15 grams in the post-workout meal. Since the workout is already completed and the anabolic machinery has already been activated from the weight training, higher fat or fiber content in the post-workout meal is of less consequence than in the pre-workout meal. In other words, because properly fueling training performance is most important for body recomposition, there is more room for flexibility with fats and fiber in the post workout meal."]},{"heading":"MEAL EXAMPLES (SITUATION DEPENDENT)","paragraphs":["Subject 1: 175lbs Male, full body training split Subject 2: 120lbs Female, full body training split Hypothetical Macro Goal (based on total daily targets)","0-5g Fat/ 120g Carb/ 50g Pro Hypothetical Macro Goal (based on total daily targets)","5g Fat/ 80g Carb/ 41g Pro - 60g Whey (0g Fat/ 8g Carb/ 44g Pro)","- 100g Cream of Rice (0g Fat/ 80g Carb/ 4.4g Pro)","- 100g Banana (0g Fat/ 22g Carb/ 1g Pro)","- 11g Honey (0/10/0)","- 1/8th- 1/4th tsp Pink/Sea Salt (if sweating a lot)","- 4oz Chicken Breast (1.5g Fat/ 0g Carb/ 24g Pro)","- 225g White Rice (0g Fat/ 55g Carb/ 6.5g Pro)","- 80-100g Green Fi- brous Veg (~0g Fat/ 5g Carb/ 2g Pro)","- 160g Watermelon (0g Fat/ 12g Carb/ 1g Pro)","- 1/4th tsp Pink/Sea Salt (if sweating a lot)","Subject 3: Weight N/A *Snack before whole food meal*, full body training split Macro Goal: N/A - 30g Whey Isolate (0g Fat/ 3g Carb/ 25g Pro)","- 100g Banana (0g Fat/ 22g Carb/ 1g Pro)","- 2 Rice Cakes (0g Fat/ 22g Carb/ 2g Pro)","*followed by a balanced whole food meal ~2 hours later Table 11D: Examples of Post-Workout Meals Depending On Context In the above examples, you can see that we have prioritized a high quality protein source and adequate carb intake (including fruit). Collectively, these components will accomplish the main goals of a post-workout meal!"]},{"heading":"WHEN TO EAT POST-WORKOUT","paragraphs":["While the bros may insist that the post-workout meal must be eaten immediately after training, recent evidence suggests that the anabolic window may be wider than previously thought (8).","In line with this evidence, the urgency of the post-workout meal seems to depend on how recently the pre-workout meal was consumed. We advise that the pre- and post-workout meals not be separated by more than four to five hours.","For example, if you consume your pre-workout meal two hours before training and then train for two hours, you should consume your post-workout meal within one hour following training. If you consume your pre-workout meal one hour before training and then only train for one hour, your post-workout meal is much less urgent and could be consumed two to three hours after the workout has ended.","We feel that it would be somewhat irresponsible to unnecessarily prolong the post-workout meal merely because there is evidence suggesting that you can do so. If there is potentially something to gain and nothing to lose by consuming your post workout meal as soon as you reasonably can after training, that sounds like the most logical advice."]},{"heading":"POST-WORKOUT NUTRITION: PUTTING IT ALL TOGETHER","paragraphs":["Post-workout nutrition should consist of:"],"list_items":["~0.5 g of protein per kg of bodyweight","~1-1.5 grams of carbohydrate per kilogram of bodyweight - High glycemic sources will expedite glycogen resynthesis if following high frequency/ full body training","0-20g of fat, depending on total caloric intake","Pre and post workout meals should be spaced apart by no more than 4-5 hours"]}],"word_count":5169},{"number":12,"title":"Cardio: To-do or Not-to-do","start_page":174,"epigraph":{"quote":"THERE ARE TWO THINGS I LIKE: 1. WEIGHTLIFTING AND 2. NOT CARDIO","attribution":"Unknown"},"sections":[{"paragraphs":["Remember that with the goal of body recomposition, we are trying to build muscle and lose fat. The muscle building component will be taken care of primarily through progressive resistance training and adequate protein intake. The fat loss component will come primarily through establishing a caloric deficit. Such a caloric deficit can be achieved by reducing your caloric intake, by increasing activity (including cardio) or through a combination of both (57). On a typical weight-loss program, cardio is often prescribed to help impose a caloric deficit so the individual doesn’t have to excessively restrict calories from their diet. However, where the aim of this book is to establish a plan for body recomposition, and not fat loss on its own, we are recommending very moderate caloric deficits (up to 20 percent) even if fat loss is the primary goal.","Additionally, given the fact that cardio has the potential to interfere with resistance training adaptations (135), we recommend keeping cardio to an effective minimum while seeking body recomposition. If cardio is to be used as a fat loss tool, we recommend performing it in such a way that muscle loss is minimized as much as possible.","The combination of resistance training and endurance exercise has been termed concurrent training in the scientific literature (134). Whether or not concurrent training will negatively impact your gains seems to depend on three main factors: frequency, intensity and modality."]},{"heading":"FREQUENCY","paragraphs":["Research shows that, with all else equal, the more cardio you do, the more likely it is to interfere with your muscle building potential. This may be due to some mechanistic interference at the molecular level, or something as simple as spreading your ability to recover too thin. While it will depend on the individual, we generally recommend keeping formal cardio sessions within the five sessions per week range. Individuals with significant weight to lose or those with less active lifestyles may want to be closer to the high end of that range, while leaner individuals or those with more active lifestyles, may want to stay closer to the low end of that range.","In general, it seems that the majority of your training energy should be allocated to weight training, since that is what will ultimately drive muscle growth. Furthermore, your fat loss goals should be achieved primarily through dietary measures rather than over-reliance on cardio. We have outlined specific examples to help you decide on the proper cardio frequency in Table 12A."]},{"heading":"INTENSITY","paragraphs":["Research has also suggested that higher intensity cardio is more likely to interfere with muscle building goals, especially when performed frequently.","In bodybuilding coaching circles, we generally split cardio into two groups based on intensity: Low Intensity Steady State (or LISS) and High Intensity Interval Training (or HIIT). An example of an HIIT session would be repeating 20-second all out sprints on a stationary bike for six times. Each sprint would be spaced with 40 seconds to two minutes of light cycling at a low intensity. This HIIT session would only last 10-20 minutes, including a light warm up and cool down. An example of a LISS session would be walking on an incline treadmill for 30 minutes at a moderate pace. There are pros and cons with each.","Many people praise the superior fat-burning effects of HIIT on the basis that you will supposedly burn more calories after the session is over because of the EPOC or caloric afterburn effect. However, according to a 2006 research review by Lyle McDonald, when subjects performed fully 80 minutes of HIIT (a very long session, indeed), it only amounted to approximately 80 extra calories burned. This was most likely due to EPOC (140). A more recent systematic review and meta-analysis examining 28 studies underplayed HIIT even more, concluding that “benefits may be short lived and diminish as little as one hour following exercise. Overall, it appears that EPOC is unlikely to account for any apparent greater fat loss potential with HIIT.” (66)","All in all, the main pros for HIIT are that it may be more time-efficient and can be less boring. A few cons are that it tends to be harder to recover from (meaning you can’t do them as often as low intensity sessions), it is more likely to interfere with resistance training and it may actually be redundant if you’re already doing intense weight training, which trains similar systems and yields similar adaptations.","The main pros for LISS are that it is much easier to recover from and less likely to interfere with muscle building. The cons are that it can be more boring and somewhat less time efficient.","Given all this, we would recommend limiting HIIT cardio to one or two sessions per week and seek to create any further caloric deficit required for fat loss through reduced food intake or steady state cardio."]},{"heading":"MODALITY","paragraphs":["The scientific literature generally finds that higher impact cardio is more likely to interfere with muscle building goals(135).","Running on pavement, for example, would qualify as higher impact exercise compared to cycling or swimming. Although there are many different cardio regimens you can implement, including running, cycling, swimming, hiking and rollerblading, we recommend making an effort to prioritize modalities that will have a lower impact on your musculoskeletal and nervous systems so as to reduce interference with weight training."]},{"heading":"LIFESTYLE FACTORS","paragraphs":["Assuming fat loss is your primary goal, it may also be worth considering your lifestyle and daily activity levels to help determine how much and what kind of cardio would be best for you. If you live a more sedentary lifestyle ( have a job that requires you to be seated most of the day), incorporating some cardio into your daily routine will likely improve your overall health, decrease stress, and ensure you are using physical activity to augment your diet. On the other hand, if you work a labor-intensive job and your NEAT is much higher (construction worker, landscaper, etc.), additional cardio would most likely be unnecessary and more likely to impede your muscle building goals."]},{"heading":"ACTIVITY TRACKERS","paragraphs":["In today’s world, we have a ton of tools that aim to monitor our daily activity levels. From smart watches to cell phones, there are many devices that can quantify our activity level to some degree. Using these tools can be beneficial to monitor your activity level and ensure you hit some sort of daily minimum. For example, if you live a very sedentary lifestyle and average 3,000 steps per day, you can easily increase your daily activity by aiming for 8,000 steps per day.","It is important though, to keep in mind that although these tools can be beneficial for goal setting and tracking changes in activity, they also have a large margin of error, especially when it comes to calculating calories expended (43).","Besides the lack of precision, many of these tools increase the risk of developing obsessive habits with compulsively tracking energy output or activity levels. For this reason, we suggest either setting up a weekly time goal for cardio (for example, 2 x 30minute LISS sessions per week) or a rough daily step goal (for example, 8,000 steps per day).","As you can see, how much cardio you perform will require fine-tuning to fit your specific needs and goals. In general, while seeking body recomposition, take the words “effective minimum” to heart and use the examples below to help you land on a figure that will work best for you."]},{"heading":"CONTEXT","paragraphs":[]},{"heading":"LEVEL OF IMPORTANCE (LOW/ MED/ HIGH)","paragraphs":[]},{"heading":"EXAMPLE OF APPROPRIATE CARDIO RECOMMENDATION (SPECIFICITY INCREASE)","paragraphs":["Mary Jane, 24 years old, High - 30 minutes of LISS 5x per week 35% body fat, resistance trains 5x/week, sedentary office job (2,500 steps per day)","Jane Doe, 24 years old, 25% body fat, resistance trains 5x/week, physically - Intensity @ ~120 BPM (~60% HR Max)","- Or aim for ~8,000 steps in per Low cardio session - LISS not needed - Optionally utilize HIIT post- workout 1-2x/week to maximize active job (waitress), 15,000 cardiovascular health steps per day John Smith, 19 years old, High 30% body fat, resistance trains 3x/week, sedentary lifestyle (college student), no job, low NEAT (3,000 steps per day)","- E.g. 6x 20-sec all stationary bike sprints with 40-sec light pedaling between sprints - 30 minutes of LISS 5x per week - Intensity @ ~120 BPM (~60% HR Max)","- ~8,000 steps in one cardio session John Smith, 19 years old, Medium - Play Basketball 2x/week on Non- 20% body fat, resistance trains 5x/week, sedentary lifestyle (college student), no job, low NEAT (3,000 steps per day), previously played basketball in high- school Training Days - Optionally do HIIT Post-workout 1-2x per week E.g. 6x 20-sec all stationary bike sprints with 40-sec light pedaling between sprints Bill Smith, 38-year-old, High - Take a walk during lunch break 28% Body Fat, Resistance Trains 3x/week, Sedentary lifestyle, Corporate Office Job, low NEAT (3,000 steps per day), pet owner (dog)","Jake Smith, 24-years- Low old,12% bodyfat, follows The Ultimate Body Recomposition Guide to a T, moderate NEAT (~8,000 steps/day), primary goal of building muscle - Take stairs instead of elevator - Park further away from grocery store to increase NEAT - Take dog on walks frequently - Increase average steps/day to ~10,00 - LISS not needed - Optionally utilize HIIT post workout 1x/week to maximize cardiovascular health - E.g. 6, 20-sec all out stationary bike sprints with 40-sec active recovery Table 12A: Examples of Different Cardio Regimes for Body Recomposition"]},{"heading":"WHEN SHOULD YOU DO CARDIO?","paragraphs":["Now that you understand that cardio is simply a tool that you can use to assist with establishing the appropriate energy balance for your goals, you may be wondering if the timing of your cardio matters. Should you do it pre- or post-workout? Does doing fasted cardio increase fat loss?","There is a substantial amount of scientific data that suggests the time of day you perform cardiovascular exercise will not impact your overall body composition and overall fat loss (1,57).","With this in mind, we recommend that you perform cardio whenever it best fits your schedule or at a time that will allow you to be consistent with the protocol. This can be something as simple as making a promise to yourself to use the stairs over the elevator in your apartment building (if that fits your needs) or doing 30 minutes of cycling after every leg day. The only time of day we generally advise against doing cardio is immediately before weight training. A short 5-10 minute warm up is a good idea, whereas long or intense cardio sessions can zap you of energy that will be required to lift weights with the appropriate intensity and volume. Remember that when it comes to training, we should prioritize building muscle first. It’s also worth noting that while fasted cardio may not have any additional benefits in terms of overall fat loss, it may have special application in the case of so-called “stubborn fat. ” Fasted cardio has not been shown to have any significant detriment either. Therefore, if you find that getting your cardio done first thing in the morning is an enjoyable and proactive way to get you energized for the day, then doing cardio on an empty stomach is perfectly reasonable."]},{"heading":"CARDIO: PUTTING IT ALL TOGETHER","paragraphs":[],"list_items":["Your cardio plan should be tailored to your specific needs and goals","In general, we recommend keeping cardio to an effective minimum for fat loss","Low intensity steady state (LISS) cardio can be performed for up to 30-45 minutes 0-5x per week (depending on your lifestyle and primary goal)","High intensity interval training (HIIT) should be used more sparingly at a maximum of 1-2 sessions per week","Individuals with low levels of NEAT and fat loss goals can set a ballpark step goal to increase daily activity levels (for ex. ~8,000 steps per day)"]}],"word_count":1942},{"number":13,"title":"Settling the Supplement Dilemma","start_page":183,"epigraph":{"quote":"IF YOU AREN’T TAKING SUPPLEMENTS, ENJOY YOUR LACK OF GAINS.","attribution":"Darren Hardy"},"sections":[{"paragraphs":["In this chapter, we want to highlight some of what we believe to be the more important supplements that will contribute to your recomposition goals. Hopefully, by now we have convinced you that your nutritional approach will be the primary means to support your training performance and recovery. At this point, we’d like to provide you with some general supplement suggestions that may help fill in the diet gaps.","It is important to note that supplements are not required to improve body composition. They are, by definition, supplemental. Investing more time, energy and money in improving your training and nutrition will positively impact your physique far more than any natural supplement ever could.","There are a few supplements nonetheless with sufficient scientific backing to make them worth taking. These supplements will be presented in their order of importance for body recomposition, starting with our favourite macronutrient, protein."]},{"heading":"WHICH SUPPLEMENTS SHOULD YOU CONSIDER TAKING?","paragraphs":["Not all supplements are created equal, and while this may seem pretty obvious when viewing the vast landscape of supplements available on the market, this statement holds true even for the one we are recommending in this book. For this reason, we’ve decided to breakdown these supplements into tiers. As opposed to a normal ranked list (best to worst), this approach does a better job of showing where the truly significant gaps in evidence and effectiveness between supplements lie. Basically, this means that supplements in the higher tiers (Tier 1 being the highest) are the ones you should first consider taking before looking at the lower tiers. That said, before we dive into Tier 1, let’s first quickly touch on the thought process of how these tiers were created.","When approaching supplements, it is important to consider three key factors: safety, efficacy, and cost.","1. Safety, although self-explanatory, is the most important. It appeases any concern whether or not taking a specific supplement will result in any negative side effects? Be assured that when taken at appropriate dosages, all of the supplements we are going to lay out have a very low risk of negative side effects. That said, we have still noted under a few of these supplements where you might want to be slightly more cautious.","2. Efficacy simply refers to whether or not the supplements actually work. That is, does the supplement actually do what it claims to do? Specifically, the two major factors that determine the efficacy of a supplement are: 1) How much does it improve performance, muscle growth, or overall health? 2) What is the quality and quantity of the research that supports its usage? For example, if a supplement has countless studies supporting it, many of which are very well controlled, and it also seems to improve performance, muscle growth, or overall health in a practically meaningful way, then this supplement would be ranked highly for efficacy, as it likely provides a meaningful benefit. On the other hand, a supplement with merely a few studies of mixed quality that report a small effect on strength, size or health, would be ranked lower on the list.","3. Lastly, there is the cost of the supplement: given the efficacy of this supplement, is it worth the price? For this factor, it is important to emphasize once again that supplements are not required to improve your physique or performance. However, if you have a larger budget and supplements are something you’re interested in to get some extra benefit, then this list should help you spend your money more wisely. For the most part, these rankings are based on efficacy (lack of safety having automatically excluded any supplement from being listed), so it will be up to you to determine if a supplement is worth the financial cost.","With all of that having been said, let’s finally jump into Tier 1!"]},{"heading":"TIER 1","paragraphs":["Tier 1 is where the three factors of safety, efficacy, and cost really shine. Not only are there mountains of quality research to support these supplements, but they are also fairly inexpensive and most likely to make a meaningful impact on your performance and/or physique. For most of you who have some extra money to spend on supplements, this is a perfectly reasonable tier to begin and end with. Taking just creatine, caffeine, and a protein powder will probably give you most of the benefits supplementation can offer."]},{"heading":"PROTEIN POWDER","paragraphs":["We have dedicated a large portion of this book to emphasizing the importance of sufficient protein intake for body recomposition, so it should come as no surprise that it makes the top of our supplement short list. Despite its importance however, consuming high levels of protein on a daily basis can be challenging, especially when eating only whole food sources. As you’ll recall from Chapter Nine, whey protein powder is at the very top of the list for leucine content and protein quality. Therefore, supplementing your diet with a high quality protein powder is a convenient and effective way to help you reach your daily protein target. High-quality whey protein (any time of day), casein protein (especially before bed), and vegan protein powders (such as soy, pea and brown rice protein powder) are all practical options to add to your diet arsenal (18,29,80,132,136)."]},{"heading":"CREATINE","paragraphs":["Being the most studied supplement in the world, the data on creatine is very clear. Creatine significantly improves strength and power performance, enhances muscle hydration and increases muscle size (24). The international society of sports nutrition deemed creatine to be the safest and most effective ergogenic aid. More recent data has even shown it to have neuroprotective properties as well (16).","Creatine is produced naturally by the liver and is stored in our skeletal muscle as phosphocreatine. Phosphocreatine is the fuel source for the Phosphagen Energy System - predominantly utilized for short duration, high intensity work such as heavy weight training, sprinting, et cetera.","Looking at the cellular level, ATP (adenosine triphosphate) breaks down to form ADP (adenosine diphosphate), a phosphate molecule and energy that can be used by our muscles. By supplementing creatine, we are able to increase phosphocreatine stores, allowing our bodies to rapidly replenish that lost phosphate molecule, meaning more ATP and ultimately more usable energy for quickly contracting muscles.","Figure 13A: The Phosphagen Energy System We recommend that anyone with muscle and strength building goals, supplement five grams of creatine monohydrate per day. This translates to about one teaspoon full.","Contrary to popular belief, loading phases such as taking 20 grams per day for one week are not necessary, but will increase creatine stores in those who have never supplemented with creatine before. So when it comes to loading, while it may help you reap the strength benefits slightly faster than someone just starting with five grams per day, over the course of a month, progress should be just about the same, whether you loaded or not. Some data has suggested that creatine uptake is slightly enhanced when taken post-workout with carbohydrates and protein (35). However, the body of literature as a whole hasn’t found a strong timing effect, so the time of day you supplement with creatine is certainly much less important than simply being consistent with actually taking that five grams per day dosage (24)."]},{"heading":"CAFFEINE","paragraphs":["Caffeine has a large body of evidence supporting its use for cognitive function, increasing strength, prolonging fatigue, maximizing acute fat oxidation, sparing glycogen and much more (25,73). These benefits are why you find it at the number three spot on our supplement list.","For those with the primary goal of fat loss or alertness, supplementing with a low dose of caffeine may be beneficial before doing cardio (1-2 mg/kg).","As an example, someone weighing 170 pounds (77 kg) would supplement 77-154 milligrams of caffeine. However, if you’re looking to maximize strength performance, a much higher dose (3-6mg/kg) can be utilized up to two times per week.","The same person weighing 170 pounds (77 kg) could supplement 231-462 milligrams of caffeine. While such a dose is recommended in the literature, it would be wise to assess your personal tolerance for the substance before jumping to this high of an intake. The more frequently you utilize high doses of caffeine for acute resistance training enhancements, the less effective it becomes and the faster you build a tolerance (10). Therefore, it may be wise to reserve caffeine supplementation for your heaviest and most demanding training sessions.","Before you get too excited about our praise for caffeine, keep in mind that excessive caffeine supplementation has been shown to decrease sleep quality. As we will see in the next chapter, poor sleep can derail a recomposition journey in a hurry! With this caveat in mind, be sure to use caffeine appropriately and responsibly."]},{"heading":"TIER 2","paragraphs":["The supplements in this tier (multivitamins and fish oil) are unique as their effectiveness will depend much more on your overall diet. Similar to how protein powder would not be needed if you can hit your protein target with whole foods, these supplements would likely be unnecessary if you already have a diverse diet filled with lots of fruits and vegetables and eat fatty fish once or twice a week. For most people, you can think of the supplements in Tier 2 as a kind of insurance policy: if you have low dietary quantities of omega 3 fatty acids or a certain vitamin or mineral, taking these two supplements will help insure your overall health requirements. The reason these two do not fall into Tier 1 is simply due to their lack of direct carryover to performance and body composition and the fact that their effectiveness will be more individual. Even so, in terms of general health, these two supplements are definitely still worth considering."]},{"heading":"MULTIVITAMINS","paragraphs":["Research reveals that it is not always easy to get micronutrient requirements from food alone, especially for athletes. Of course, if you follow the micronutrient and food choice guidelines laid out in this book, multivitamin supplementation may not be necessary. Still, eating a nutritionally optimal diet can be challenging, especially while in a caloric deficit. In one study examining nationally ranked bodybuilders, men consumed just 46 percent of the RDA for vitamin D (0 percent for women!), only 52 percent for calcium and fell short on zinc, copper and chromium, among others (70).","As we discussed earlier, being deficient in zinc may reduce testosterone levels and several other vitamins are important in regulating metabolic pathways linked to fat loss(70). For these reasons, and the fact that it is relatively cheap and low-risk, we recommend considering supplementation of a daily multivitamin to ensure you are getting a wide spectrum of water-soluble and fat-soluble vitamins. Whether you decide to take a multivitamin as a sort of micronutrient insurance or not, it is still important to consume a variety of food sources while rotating different fruits and vegetables in your diet.","Furthermore, there is a difference between an optimal and adequate micronutrient consumption (101). Many of the recommended daily allowances are based on amounts required to prevent diseases, not to optimize health.","Body recomposition aside, taking care of our health should be a top priority. Supplementing with a high-quality multivitamin may be a step toward enhancing your health, improving your energy levels, and minimizing your risk of micronutrient deficiency (2).","Figure 13B: The Difference Between Adequate and Optimal Intakes True for nearly all supplements, there can be a huge discrepancy in quality from one source to another. For example, the chemical form of each vitamin or mineral present can significantly impact their bioavailability. Some multivitamins include vitamins that are cheap and easy to produce, but significantly less bioavailable when consumed.","Also, consuming large doses in one pill (some one-a-day pills) may inhibit your body’s ability to absorb and utilize the micronutrients appropriately. We strongly recommend using resources such as Examine.com to learn about specific forms having the greatest bioavailability and what dosage is appropriate for your needs. We also recommend LabDoor. com for information on the quality and purity of different supplements."]},{"heading":"FISH OIL (ESSENTIAL FATTY ACIDS (EFA’S - EPA + DHA))","paragraphs":["The typical North American diet is deficient in omega-3 fatty acids (61). Omega-3 fatty acids, specifically eicosapentaenoic acid (EPA) and docosahexaenoic acid (DHA) are two fatty acids found in fish, seaweed, algae and can be synthesized from some vegetarian sources such as chia seeds and flax seeds.","Research indicates that you should at least consume 0.3-0.5 grams of combined EPA+DHA per day and that multiple health markers are optimized when consuming anywhere from four to six grams per day (94). Yet, most people only consume 0.1 - 0.2 grams per day. Again, it is important to highlight the difference between recommended daily intake (RDI) and optimal intake (44). RDIs are values suggested to prevent disease but there is a big difference between not being sick and being optimally healthy.","Deficiency in Omega 3 fatty acids can lead to fatigue, poor cognition/memory, distributed mood/depression, increased risk of cardiovascular disease and several other negative symptoms (78). Collectively, these effects may negatively impact your muscle building and fat loss goals as well. You can naturally increase your Omega-3 intake in your diet by consuming more fatty fish, grass-fed meats, free-range egg yolk, flaxseed, walnuts, chia seeds and spinach, to name a few sources.","Another way to increase your Omega 3 consumption is through supplementation. However, similar to multivitamins, some fish oil supplements on the market are of low quality, potentially high in mercury, and as such, may be more detrimental to your health than beneficial. Once again, it is important to research the brand you are using and make an effort to supplement either with a high-quality product, or rely on whole food sources. We suggest you aim for two grams per day of EPA/DHA combined."]},{"heading":"TIER 3","paragraphs":["This tier is where we will cover supplements that have the potential to be beneficial, but the effect is relatively small, the results are mixed, and there is a lower quality and/or lower quantity of studies supporting their use. For these supplements, it is especially important to consider the financial cost tobenefit ratio for your specific situation."]},{"heading":"GREEN TEA (EGCG)","paragraphs":["Green tea contains a high amount of catechin polyphenols, the most abundant and active of which being EpiGalloCatechin-3-Gallate, commonly known as EGCG. EGCG has demonstrated a multitude of positive health effects but since our focus here is body recomposition, we will alert you to some evidence supporting its use for fat loss.","One study examining the effects of green tea supplementation by Dulloo et al. (42) compared 90 milligrams of EGCG and 50 milligrams of caffeine combined, 50 milligrams of caffeine without EGCG and a placebo treatment which received neither caffeine nor EGCG. Researchers found that the group consuming EGCG showed four percent increased energy expenditure at rest when compared to the caffeine treatment alone. This may sound like a modest increase, but does nonetheless, demonstrate green tea’s positive thermogenic effect.","Another study by Maki et al. (82) examined the effects of EGCG on over 100 obese individuals over a 12 week period. One group consumed green tea with low-dose (39mg) caffeine and the other group consumed low-dose (39mg) caffeine on its own. Both groups exercised three hours per week.","While the results were not statistically significant, the group stacking EGCG with caffeine reported a greater trend for greater weight loss. More importantly, the group supplementing EGCG lost more abdominal fat (-7.7 percent vs -0.3 percent): a finding relevant to body recomposition goals.","This data shows that 125-250 milligrams of EGCG paired with only 50 milligrams of caffeine is sufficient to improve metabolic rate and fat loss.","Certainly more data is needed, especially in healthier, leaner, more athletic subjects, but at this point we can say with some confidence that supplementing green tea/EGCG might aid with body recomposition by enhancing fat loss."]},{"heading":"ASHWAGANDHA","paragraphs":["A natural herbal adaptogen, ashwagandha is commonly utilized to reduce stress and anxiety, as research has demonstrated its ability to decrease both objective (i.e. cortisol) and subjective (well-being) measures of stress (32). Further research has suggested it may improve strength performance, glucose uptake, and even testosterone levels (110). Wankhede et al. (129) observed increases in one rep max strength and reductions in muscle damage with ashwagandha supplementation. In a study on 64 subjects with chronic stress, Chandrasekhar et al. (32) found that ashwagandha was able to reduce serum cortisol levels (commonly labeled the stress hormone) by 27.9 percent. All subjective mood stress scores significantly improved as well!","As a potentially powerful, effective and safe herbal supplement, we recommend giving ashwagandha a try and assessing your own experience. Start with 500 milligrams per day. If you are not noticing any benefits at this intake, you can increase your dose to 1000 milligrams per day. Some studies have used 6000 milligrams daily (2000mg/3x/day) with no negative side effects.","When searching for an ashwagandha product, look for one that uses the KSM-66 strand, as it has been most studied in the literature. We suggest taking the supplement post-exercise (when cortisol levels are naturally going to be elevated) and/or with your final meal before bed."]},{"heading":"L-CITRULLINE","paragraphs":["Out of all the supplements that claim to enhance performance and gains over time, L-Citrulline is one of the few that has a reasonably large amount of scientific support (11,17,47,98). Unfortunately, many companies either underdose L-Citrulline in pre-workout formulations or hide the true amount behind what they call a proprietary blend.","Many pre workout pump products also make the mistake of using L-Arginine instead of L-Citrulline, under the faulty assumption that L-Arginine will significantly increase nitric oxide (NO) levels in the blood, resulting in skin-tearing pumps.","In reality, supplementing with L-Citrulline is actually more effective at increasing blood arginine levels than supplementing with arginine itself. This is because, unlike L-Arginine, L-Citrulline is able to bypass hepatic metabolism, meaning it doesn’t get broken down in the liver. Once in the bloodstream, L-Citrulline is able to increase blood vessel diameter (vasodilation) via nitric oxide production, allowing blood to flow to your tissues more effectively. This increase in blood flow leads to more efficient oxygen delivery. When exercising, your muscles need more oxygen to maintain performance, which is one reason why L-Citrulline has been shown to significantly increase muscular endurance during exercise. Also, with this increased blood flow, not only is oxygen delivery enhanced, but other nutrients such as glucose and amino acids can be transported to the exercising muscle more efficiently.","Like us, you may have taken a pre-workout supplement and noticed a great pump the first few times you use it, but over time the effects seem to diminish and you feel like the product no longer works.","This can happen for a few reasons. Perhaps your product doesn’t contain a clinically effective dose of four to ten grams. Or perhaps your body has grown less sensitive to the ingredients. With citrulline in particular, your body can upregulate arginase (an enzyme that breaks down arginine) and over time, may not produce the same response. To combat this, we recommend cycling on and off L-Citrulline periodically, such as during a deload block of training."]},{"heading":"TIER 4","paragraphs":["The reason that Yohimbine HCL is in its own tier, at the bottom of our recommended supplements list, is because while it may provide some benefit for fat loss, the lack of research compounded with a greater potential for negative side effects make it harder to recommend broadly. As with Tier 3 however, it is included so that you can make an educated decision for yourself on whether or not to take it based on your own cost - benefit calculation."]},{"heading":"YOHIMBINE HCL","paragraphs":["Yohimbine is a supplement derived from Yohimbe Tree Bark that has been shown to enhance fat loss (95) and decrease appetite by increasing adrenaline (also known as epinephrine) while inhibiting processes that suppress fat loss.","To oversimplify a lot of complex biochemistry, to maximize lipolysis (fat breakdown), basically we want epinephrine to bind to beta receptors (instead of alpha receptors) on fat cells. Yohimbine works by binding to alpha receptors, leaving more beta receptors open for epinephrine to bind to, ultimately increasing fat breakdown. Again, to keep things really simple, from a fat loss perspective, alpha receptors are “bad” and beta receptors are “good.” As you might expect, obese people tend to have more bad alpha receptors while lean people tend to have more good beta receptors. Interestingly, men and women differ in terms of where those bad alpha receptors are distributed in the body: women tend to have more on their hips, men tend to have more on their abdominals. This is probably part of the reason why men and women tend to store body fat in a different manner. You have most likely heard of the fat in these problematic areas referred to as stubborn body fat.","If you’ve been following the plot, you can probably guess that Yohimbine supplementation may have utility in mobilizing and breaking down these stubborn fat stores. This is especially the case when it is stacked with caffeine and taken on an empty stomach before performing fasted cardio or two hours after a low glycemic meal (insulin inhibits yohimbine’s lipolytic mechanism).","Most studies show a benefit with supplementation of 0.2 milligrams of Yohimbine per kilogram of bodyweight. However, taking an altered form such as Yohimbine HCl may provide the same benefit with a smaller dose due to increased bioavailability.","It’s worth mentioning that although yohimbine may help with appetite suppression and fat breakdown, it may also lead to increased anxiety, increased heart rate and mean arterial blood pressure. Because of this possibility, we suggest that you start with a low dose Yohimbine HCl (2.5mg/50lbs per day) as you assess your tolerance. If tolerated well, you can increase your dose to 2.5mg/25lbs 15 minutes before training. So for example, if you weigh approximately 150 pounds, start with 7.5mg of yohimbine. Over time, if you have no negative side effects, that same person can take 15mg of yohimbine pre workout.","With all of this information, while the data is incomplete, based on the above information a potentially helpful strategy for targeting so-called stubborn fat would be to take 1mg/kg of caffeine, 125-250mg of EGCG (or green tea) and 2.5mg/lb yohimbine HCl. Using the same 150lbs person for reference, that would translate to ~70mg caffeine, ~250mg EGCG and up to 15mg yohimbine hcl."]},{"heading":"SUPPLEMENTATION: PUTTING IT ALL TOGETHER","paragraphs":[]},{"heading":"HERE IS OUR BODY RECOMP SUPPLEMENT “CHEAT SHEET”:","paragraphs":["-1-2 mg/kg bodyweight for general alertness, cardio, and acute fat oxidation benefits -3-6mg/kg bodyweight for maximizing strength performance up to 1-2x per week (always gradually assess your own tolerance before jumping to a high dose)","- 125-250mg of EGCG paired with only 50mg of caffeine for fat loss - Ideally taken before cardio","- Start with 500mg per day. After assessing response, optionally increase dose to 1000mg per day"],"list_items":["High quality protein powder - As needed to hit daily protein targets","Creatine monohydrate - 5g (~1 tsp) per day","Caffeine:","Multivitamin - as needed to address gaps in diet","Fish Oil - 2g combined EPA/DHA per day","Green Tea (EGCG)","Ashwagandha (KSM-66)","Yohimbine HCl - (2.5mg/50lbs per day) per day - Ideally taken before cardio on an empty stomach - Only to be used as an “advanced” stubborn fat strategy","L-Citrulline - 4-10 g taken preworkout"]}],"word_count":3834},{"number":14,"title":"Sleep: The Dark Horse of Body Recomp","start_page":200,"epigraph":{"quote":"SLEEP IS THE GOLDEN CHAIN THAT TIES HEALTH AND OUR BODIES TOGETHER.","attribution":"Thomas Dekker"},"sections":[{"paragraphs":["For most of this book so far, we have focused on the variables that everyone thinks of when they think of losing fat and building muscle. How many calories should I eat? How much protein do I need? And so on.","Up until now there has been no talk of two painfully underrated variables that can impact your recomp success on an enormous scale: sleep and stress. We’re calling these combined factors the “dark horse” of body recomp because they are so infrequently acknowledged as the major factors that they are.","While many of us may wish it weren’t true, in terms of both muscle gain and fat loss, we cannot possibly overstate how critical sleep and stress are to your success.","In this chapter we will check out what the science has to say about sleep and stress and describe how even making small improvements in these areas can catapult your progress forward."]},{"heading":"SLEEP","paragraphs":["Despite the fact that today’s culture seems to glorify lack of sleep, as if sleeping less were synonymous with the hard-working, disciplined individual, the reality is that just because you prioritize sleep doesn’t mean you’re lazy. In fact, sleep is extremely important. It affects the functioning of almost every type of tissue and system in the body (the brain, heart, lungs, and others), and as such, nearly every physiological parameter, including metabolism and immune function. Research and coaching experience indicate that sleep is probably the most underappreciated and often neglected component of body recomposition. An incredibly fascinating study demonstrating the connection between sleep and body recomposition was published in 2018 by Wang and colleagues (128). The results are simply mind-blowing.","Participants went on an eight week fat loss diet. The researchers split the subjects up into a “sleep restricted” group and a “normal sleep” group. All things were equal except the sleep restricted group slept one hour less than the other group, five nights per week. The sleep restricted group was allowed to sleep one more hour per night on the weekends to test if it was possible to catch up on lost sleep. The other group slept normally the entire time. Brace yourself for the results: Although there were no significant differences in total weight lost, there was an enormous difference in where that weight was lost from (that is, whether weight was lost from fat or muscle). For the subjects that slept normally, 83 percent of weight loss was lost as fat. For the subjects that were sleep restricted, this completely flipped: approximately 85 percent of weight loss was lost as fat-free mass!","Put another way, subjects sleeping normally lost most of their weight as fat, while subjects sleeping poorly lost most of their weight as lean mass (including muscle). And all of this was from just one hour of sleep less per night, five days per week!","This finding really highlights just how much sleep matters for recomposition goals and provides yet another example of how weight loss and fat loss are not always synonymous in the real world. If we want as much of our weight loss to come from fat tissue as possible, we simply have to pay attention to how much sleep we’re getting.","It’s worth mentioning that the participants in this study were not weight training. They were merely placed in a calorie deficit. Undoubtedly, lifting weights would have shifted the results to some degree, but could not possibly offset the massive difference between the groups. Another study compared subjects getting either 8.5 or 5.5 hours of sleep per night while in a caloric deficit. (92) Once again the results were incredible. Even though both groups lost about 6.5 pounds of body weight on average, the sleep-restricted group only lost about 1.3 pounds of fat. This means that fully 80 percent of their weight loss came from fat-free mass (including muscle).","Figure 14A: Fat and Lean Mass Loss Differences Between 8.5 and 5.5 hours In Bed (92) It was actually even worse than this for the sleep restricted group. In addition to the unfavorable body composition results, there was also a significant spike in ghrelin (a hormone responsible for ramping up hunger levels). So sleeping less will not only negatively impact your body recomposition goals in its own right, it will also make hitting your calorie and macro targets even more difficult by making you feel hungrier than usual.","This really seems like a slam-dunk case that even though you can still lose the same weight with less sleep (assuming your will power is enough to overpower the spike in ghrelin), much more of that weight loss is going to come from lean mass: the exact opposite of what we want.","So why does sleep restriction cause more muscle loss as opposed to fat loss? This anti- recomposition effect is probably owed to the catabolic hormonal cocktail it imposes on the body: higher cortisol, lower myostatin, lower testosterone and lower IGF-1. (109) Collectively, these processes reduce muscle protein synthesis and increase muscle protein breakdown. As you likely know, any one of these hormonal changes on their own would have the potential to rob you of muscle, so combining all of these changes can be truly detrimental. Before you toss this book out and give up, because you’re simply unable to sleep as much as you’d like due to important personal, family or work-related demands, there is still hope for you! Keep in mind that the subjects in the research above were not optimizing their training and nutrition. While it isn’t likely that an optimized diet and training program would fully rescue the negative impacts of sleep restriction, they would undoubtedly make these results seem less scary. In fact, one of my (Jeff) most successful clients ever, achieved this amazing transformation getting only four to five hours of sleep per night.","Figure 14B: Client Transformation Getting Just 4-5 Hours Of Sleep Per Night While Optimizing Training and Nutrition Variables While I have no doubt that Patrick would’ve gotten even better results had he prioritized his sleep more, his results should provide some solace to those of you who simply won’t be able to prioritize sleep due to other demands in your life. Before looking at how many hours of sleep per night is enough and how much is optimal, let’s have a quick look at how sleep impacts training performance in the gym."]},{"heading":"SLEEP AND TRAINING","paragraphs":["Have you tried hitting a max set of deadlifts after pulling an all-nighter? If you have, it probably sucked and you’re not alone.","In 1994, researchers (106) restricted subjects who usually slept eight hours per night, to only three hours per night for three days in a row. Being sleep deprived, the participants performed 20 repetitions at 35-45 percent of their 1RM on the biceps curl, bench press, leg press and deadlift.","As you’d expect, there was a significant and linear decrement in the maximal weight lifted for bench, deadlift and leg press that got worse as the three days went by. Maximum strength on the bicep curl decreased as well, but did not reach statistical significance. This finding led the researchers to speculate that perhaps larger, more complicated movements are more negatively affected from missed sleep.","Partial sleep deprivation (PSD) also caused an increase in perception of effort with a given
