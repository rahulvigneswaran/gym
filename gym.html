function muscleMap(load) {
  const max = Math.max(1, ...Object.values(load));
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 212 112");
  svg.setAttribute("class", "mmap");
  const side = (which, dx) => {
    const base = NEUTRAL.map(s => s.replace(/^<(\w+)/, '<$1 class="mq"')).join("");
    const parts = BODY[which].map(([m, d]) => {
      const v = load[m] || 0;
      const op = v ? (0.35 + 0.65 * Math.min(1, v / max)).toFixed(2) : 1;
      return d.replace(/^<(\w+)/, `<$1 class="${v ? "mh" : "mq"}" fill-opacity="${op}"`);
    }).join("");
    return `<g transform="translate(${dx},2)">${base}${parts}</g>`;
  };
  svg.innerHTML = side("front", 0) + side("back", 108);
  return svg;
}

function muscleBlock(load, caption) {
  const box = el("div");
  box.appendChild(muscleMap(load));
  const top = Object.entries(load).sort((a, b) => b[1] - a[1]).slice(0, 5);
  if (top.length) {
    const lg = el("div", "mlegend");
    top.forEach(([m, v]) => lg.appendChild(el("span", null, `${REGION_LABEL[m] || m} ${Math.round(v)}`)));
    box.appendChild(lg);
  }
  if (caption) box.appendChild(el("div", "mcap", caption));
  return box;
}

const canMorph = () => !!document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches;
const morph = fn => { canMorph() ? document.startViewTransition(fn) : fn(); };

/* the card element itself is what grows, so the browser morphs one box into the other */
function toggleCard(i) {
  const next = openIdx === i ? null : i;
  barEdit = false;
  const run = () => { openIdx = next; render(); };
  if (!canMorph()) return run();
  namedIdx = i;
  const cur = document.querySelector(`.ex[data-i="${i}"]`);
  if (cur) cur.style.viewTransitionName = "card";
  const clear = () => {
    namedIdx = null;
    document.querySelectorAll(".ex").forEach(n => (n.style.viewTransitionName = ""));
  };
  document.startViewTransition(run).finished.then(clear, clear);
}

/* ---------------- dock ---------------- */
function paintDock() {
  const sess = S.session, acts = [], open = openIdx != null;

  if (!sess) {
    if (doneToday()) {
      const ti = tomorrowIndex();
      setPuck(isRest(focusAt(ti)) ? "Train anyway" : "Train again", () => startSession(isRest(focusAt(ti)) ? nextTrainIndex() : ti), true);
    } else if (isRest(focusAt(S.queueIndex))) {
      setPuck("Train anyway", () => startSession(nextTrainIndex()), true);
    } else {
      setPuck("Begin " + focusAt(S.queueIndex), () => startSession(S.queueIndex));
    }
    if (open) acts.unshift(["Overview", () => toggleCard(openIdx)]);
    setActs(acts); setHandle(!open); return;
  }

  const t = activeTarget();
  if (open) {
    const ex = sess.exercises[openIdx];
    if (S.rest && t) {
      const left = restLeft();
      setPuck(`Rest ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`,
        () => { stopRest(); paintDock(); }, false, {
          resting: true,
          pct: Math.max(0, Math.min(100, (left / S.rest.dur) * 100)),
          sub: "tap to skip"
        });
    } else if (t) setPuck(`Log set ${t.set + 1} of ${ex.sets.length}`, () => logSet(t.ex, t.set));
    else {
      const nx = nextUnfinished(openIdx);
      if (nx != null) setPuck("Next · " + exName(sess.exercises[nx].exerciseId), () => jumpCard(nx));
      else setPuck("Finish workout", () => finishSession());
    }
    acts.push(["Overview", () => toggleCard(openIdx)]);
    if (openIdx < sess.exercises.length - 1) acts.push(["Next", () => jumpCard(openIdx + 1)]);
  } else if (t) {
    setPuck("Continue · " + exName(sess.exercises[t.ex].exerciseId), () => toggleCard(t.ex));
  } else {
    setPuck("Finish workout", () => finishSession());
  }
  acts.push(["End workout", () => openSheet("end"), true]);
  setActs(acts); setHandle(!open);
}
function setPuck(label, fn, ghost, rest) {

/* ---------- import / export ----------
   The format is versioned and every older version stays readable. A v1 file has
   no per-side figures and no bar weights; both are worked back out of the totals
   when they are shown, so an export from an older build lands here up to date. */
const FORMAT = "recomp-workout/v2";
const READABLE = ["recomp-workout/v1", "recomp-workout/v2"];

/* JSON has no comments, so the shape travels inside the file itself */
const SCHEMA = {
  "//": "This block IS the documentation. Edit `program`, `settings`, `customExercises` or `history`, keep `_format`, and import the file back into the app.",
  "_format": "string — \"recomp-workout/v2\". Files written by v1 still import; their sets are upgraded automatically.",
  "settings": {
    "name": "string — who the app greets",
    "units": "\"kg\" | \"lb\"",
    "queueIndex": "integer — which entry of program.days comes next; it wraps around",
    "sound": "boolean, optional (v2) — ring a bell when the rest timer runs out",
    "bars": "object, optional (v2) — { kg: { olympic, ez, smith, fixed }, lb: {…} }. What an empty bar weighs at your gym. Omitted keys fall back to 20/10/15/15 kg and 45/25/35/35 lb."
  },
  "program": {
    "name": "string — shown as the kicker on the home screen",
    "days": "array, walked in order and then repeated from the top",
    "days[].focus": "string — e.g. \"Full Body #1\", \"Push\", \"Rest\". Any focus containing the word \"rest\" renders as a rest day",
    "days[].block": "string, optional — training block this day belongs to",
    "days[].week": "integer, optional — week number within the programme",
    "days[].exercises": "array — leave it empty ([]) on rest days",
    "days[].exercises[].exerciseId": "string — an id from _reference.exercises, or one you define in customExercises",
    "days[].exercises[].sets": "integer 1-12",
    "days[].exercises[].repMin": "integer 1-100 — bottom of the target rep range",
    "days[].exercises[].repMax": "integer 1-100 — top of the range; set equal to repMin for an exact target",
    "days[].exercises[].rpe": "number 5-10, optional — target effort for the set",
    "days[].exercises[].rest": "string, optional — rest in minutes, e.g. \"2-3\"",
    "days[].exercises[].note": "string, optional — a coaching note shown under the exercise name"
  },
  "customExercises": "array, optional — [{ id, name, muscle, equipment, type: \"compound\" | \"isolation\", cues: [string], load }]. Use this to add movements the built-in library does not have.",
  "customExercises[].load": "object, optional (v2) — { mode, bar }. mode is \"bar\" (you enter plates per side, the app doubles them and adds the bar), \"dbPair\" (you enter one dumbbell, it is doubled), \"dbOne\" (single-arm, one dumbbell is the whole load), \"stack\" (machine or cable, read straight off the pin) or \"body\" (bodyweight, blank counts as 0). bar is \"olympic\" | \"ez\" | \"smith\" | \"fixed\" and only applies to mode \"bar\". Leave `load` out and it is inferred from `equipment`.",
  "history": "array of finished sessions, oldest first. Safe to leave untouched.",
  "history[]": {
    "id": "number — unique, used to de-duplicate on merge",
    "date": "ISO 8601 timestamp",
    "focus": "string — the day's focus at the time",
    "durationMin": "integer, optional",
    "partial": "boolean, optional — true when the session was ended early",
    "entries": "[{ exerciseId: string, sets: [{ weight: string, reps: string, entry: string }] }]",
    "entries[].sets[].weight": "total load moved, in settings.units. \"0\" means bodyweight.",
    "entries[].sets[].entry": "string, optional (v2) — what was actually loaded: plates on one side, or one dumbbell. Absent on v1 files, where it is worked back out of `weight`."
  }
};

function buildExport() {
  const p = activeProgram();
  return {
    _format: FORMAT,
    _comment: "Recomp workout file. `_structure` describes every field — hand this whole file to an assistant, ask it to rewrite `program`, then import the result back into the app.",
    _structure: SCHEMA,
    exportedAt: new Date().toISOString(),
    settings: {
      name: S.name, units: S.units, queueIndex: S.queueIndex,
      sound: S.sound !== false,
      bars: { kg: { ...S.bars.kg }, lb: { ...S.bars.lb } }
    },
    program: {
      name: p.name,
      source: customProgram() ? "custom" : "book",
      days: p.days.map(d => ({
        focus: d.focus,
        ...(d.block ? { block: d.block } : {}),
        ...(d.week ? { week: d.week } : {}),
        exercises: d.exercises.map(x => ({
          exerciseId: x.exerciseId,
          sets: x.sets, repMin: x.repMin, repMax: x.repMax,
          ...(x.rpe ? { rpe: x.rpe } : {}),
          ...(x.rest ? { rest: x.rest } : {}),
          ...(x.note ? { note: x.note } : {})
        }))
      }))
    },
    customExercises: S.customExercises,
    history: S.logs,
    _reference: {
      exercises: Object.values(EX).map(e => `${e.id} — ${e.name} (${e.muscle || "?"}, ${e.equipment || "?"}, ${e.type || "?"}, loads as ${loadPlan(e.id).mode})`),
      bookSplits: SPLITS.map(s => `${s.name} — ${s.training_days} training days: ${s.days.map(d => d.focus).join(" / ")}`)
    }
  };
}
const exportText = () => JSON.stringify(buildExport(), null, 2);

function parseLoad(l) {
  if (!l || typeof l !== "object" || !LOAD_MODES.includes(l.mode)) return null;
  return { mode: l.mode, ...(l.mode === "bar" && BAR_KINDS.includes(l.bar) ? { bar: l.bar } : {}) };
}
/* v1 sets carry a total and nothing else; the per-side figure stays absent and is
   recovered from the total at display time, using whatever bar weights are set then */
function parseSet(s) {
  const entry = numOrStr(s && s.entry);
  return { weight: numOrStr(s && s.weight), reps: numOrStr(s && s.reps), ...(entry ? { entry } : {}) };
}

function parseImport(text) {
  const raw = JSON.parse(text);
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) throw new Error("The file must be a JSON object.");
  const warn = [], out = { program: null, settings: null, history: null, custom: null, warn };

  const fmt = str(raw._format, 40);
  if (fmt && !READABLE.includes(fmt)) warn.push(`Unknown _format "${fmt}" — importing anyway.`);
  else if (fmt && fmt !== FORMAT) warn.push(`Written by an older version (${fmt}). It will be brought up to date on import; per-side numbers are worked back out of the totals in your history.`);

  if (Array.isArray(raw.customExercises)) {
    out.custom = raw.customExercises.slice(0, 120).map(c => {
      const load = parseLoad(c && c.load);
      return {
        id: str(c && c.id, 60), name: str(c && c.name, 80) || str(c && c.id, 60),
        muscle: str(c && c.muscle, 40), equipment: str(c && c.equipment, 40),
        type: c && c.type === "isolation" ? "isolation" : "compound",
        cues: Array.isArray(c && c.cues) ? c.cues.slice(0, 8).map(t => str(t, 220)).filter(Boolean) : [],
        ...(load ? { load } : {})
      };
    }).filter(c => c.id);
  }
  const known = new Set([...Object.keys(BASE_EX), ...(out.custom || []).map(c => c.id)]);

  if (raw.program) {
    const p = raw.program;
    if (!Array.isArray(p.days) || !p.days.length) throw new Error("`program.days` must be a non-empty array.");
    const missing = new Set();
    const days = p.days.slice(0, 120).map((d, di) => {
      if (!d || typeof d.focus !== "string" || !d.focus.trim()) throw new Error(`Day ${di + 1} is missing a "focus".`);
      const list = Array.isArray(d.exercises) ? d.exercises : [];
      return {
        focus: str(d.focus, 40).trim(),
        ...(str(d.block, 40) ? { block: str(d.block, 40) } : {}),
        ...(Number.isFinite(Number(d.week)) ? { week: clampInt(d.week, 1, 99, 1) } : {}),
        exercises: list.slice(0, 24).map((x, xi) => {
          const id = str(x && x.exerciseId, 60).trim();
          if (!id) throw new Error(`Day ${di + 1}, exercise ${xi + 1} is missing an "exerciseId".`);
          if (!known.has(id)) missing.add(id);
          const lo = clampInt(x.repMin, 1, 100, 8);
          return {
            exerciseId: id,
            sets: clampInt(x.sets, 1, 12, 3),
            repMin: lo,
            repMax: Math.max(lo, clampInt(x.repMax, 1, 100, lo + 4)),
            ...(Number.isFinite(Number(x.rpe)) ? { rpe: clampInt(x.rpe, 5, 10, 8) } : {}),
            ...(str(x.rest, 12) ? { rest: str(x.rest, 12) } : {}),
            ...(str(x.note, 220) ? { note: str(x.note, 220) } : {})
          };
        })
      };
    });
    if (missing.size) warn.push(`${missing.size} unknown exercise id${missing.size === 1 ? "" : "s"} (${[...missing].slice(0, 4).join(", ")}${missing.size > 4 ? "…" : ""}). They will show up by their id — add them under customExercises for names and cues.`);
    out.program = { name: str(p.name, 60) || "Imported programme", source: "custom", days };
  }

  if (raw.settings && typeof raw.settings === "object") {
    const s = raw.settings;
    out.settings = {};
    if (str(s.name, 24)) out.settings.name = str(s.name, 24);
    if (s.units === "kg" || s.units === "lb") out.settings.units = s.units;
    if (Number.isFinite(Number(s.queueIndex))) out.settings.queueIndex = clampInt(s.queueIndex, 0, 9999, 0);
    if (typeof s.sound === "boolean") out.settings.sound = s.sound;
    if (s.bars && typeof s.bars === "object") {
      const bars = { kg: {}, lb: {} };
      ["kg", "lb"].forEach(u => BAR_KINDS.forEach(k => {
        const v = Number((s.bars[u] || {})[k]);
        if (Number.isFinite(v) && v >= 0 && v <= 100) bars[u][k] = round1(v);
      }));
      out.settings.bars = bars;
    }
  }

  if (Array.isArray(raw.history)) {
    out.history = raw.history.slice(-400).map((l, i) => {
      const d = new Date(l && l.date);
      return {
        id: Number.isFinite(Number(l && l.id)) ? Number(l.id) : Date.now() + i,
        date: isNaN(d) ? new Date().toISOString() : d.toISOString(),
        focus: str(l && l.focus, 40) || "Session",
        ...(Number.isFinite(Number(l && l.durationMin)) ? { durationMin: clampInt(l.durationMin, 1, 999, 45) } : {}),
        ...(l && l.partial ? { partial: true } : {}),
        entries: (Array.isArray(l && l.entries) ? l.entries : []).slice(0, 40).map(e => ({
          exerciseId: str(e && e.exerciseId, 60),
          sets: (Array.isArray(e && e.sets) ? e.sets : []).slice(0, 20).map(parseSet)
        })).filter(e => e.exerciseId && e.sets.length)
      };
    }).filter(l => l.entries.length);
  }

  if (!out.program && !out.history && !out.settings && !out.custom) throw new Error("Nothing importable found — expected a `program`, `history`, `settings` or `customExercises` key.");
  return out;
}

function applyImport(res, mode) {
  if (mode !== "history") {
    if (res.custom) { S.customExercises = res.custom; refreshEx(); }
    if (res.program) { S.program = res.program; S.session = null; S.startWeek = null; openIdx = null; }
    if (res.settings) Object.assign(S, res.settings);
  }
  if (mode !== "program" && res.history) {
    if (mode === "history") {
      const seen = new Set(S.logs.map(l => l.id));
      S.logs = S.logs.concat(res.history.filter(l => !seen.has(l.id)))
        .sort((a, b) => new Date(a.date) - new Date(b.date)).slice(-400);
    } else S.logs = res.history;
  }
  if (S.queueIndex == null || S.queueIndex < 0) S.queueIndex = 0;
  save(); render();
}

function download(text, filename) {
  const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ---------- progress ---------- */
/* ---------- progress ---------- */
const logVol = l => l.entries.reduce((a, e) => a + e.sets.reduce((b, s) => b + nWeight(s) * nReps(s), 0), 0);
const logSets = l => l.entries.reduce((a, e) => a + e.sets.length, 0);
/* Epley, the same estimate the per-exercise trend ranks its top set by */
const e1rm = (w, r) => (w > 0 && r > 0 ? w * (1 + r / 30) : 0);
const kFmt = n => (n >= 10000 ? Math.round(n / 1000) + "k" : n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(Math.round(n)));
const dmy = d => d.toLocaleDateString(undefined, { day: "numeric", month: "short" });

/* Monday-anchored buckets with the empty weeks kept, so a lay-off reads as a gap */
function weekBuckets(n) {
  const end = mondayOf(new Date()), out = [];
  for (let i = n - 1; i >= 0; i--) {
    const from = new Date(end); from.setDate(from.getDate() - i * 7);
    const to = new Date(from); to.setDate(to.getDate() + 7);
    const logs = S.logs.filter(l => { const d = new Date(l.date); return d >= from && d < to; });
    out.push({ from, to, logs, vol: logs.reduce((a, l) => a + logVol(l), 0) });
  }
  return out;
}

function volChart() {
  const weeks = weekBuckets(12);
  const max = Math.max(1, ...weeks.map(x => x.vol));
  const run = weeks.filter(x => x.vol > 0);
  const avg = run.length ? run.reduce((a, x) => a + x.vol, 0) / run.length : 0;

  const box = el("div");
  const bars = el("div", "wbars");
  weeks.forEach((x, i) => {
    const b = el("div", "wb" + (x.vol ? (i === weeks.length - 1 ? " now" : "") : " zero"));
    const f = el("i");
    f.style.height = x.vol ? Math.max(2, (x.vol / max) * 100) + "%" : "2px";
    b.title = `${dmy(x.from)} — ${kFmt(x.vol)} ${S.units}`;
    b.appendChild(f); bars.appendChild(b);
  });
  if (avg) {
    const line = el("div", "wavg");
    line.style.bottom = (avg / max) * 100 + "%";
    bars.appendChild(line);
  }
  box.appendChild(bars);
  const foot = el("div", "wfoot");
  foot.appendChild(el("span", null, dmy(weeks[0].from)));
  foot.appendChild(el("span", null, `avg ${kFmt(avg)} · peak ${kFmt(max)} ${S.units}`));
  foot.appendChild(el("span", null, "this week"));
  box.appendChild(foot);
  return box;
}

/* weighted sets per region over a rolling week, against the range the book prescribes */
function muscleChart() {
  const since = Date.now() - 7 * 864e5;
  const recent = S.logs.filter(l => new Date(l.date).getTime() >= since);
  const load = muscleLoad(recent.flatMap(l => l.entries.map(e => ({ exerciseId: e.exerciseId, sets: e.sets.length }))));
  const g = BOOK.training.guidelines.volume.sets_per_bodypart_per_week;
  const rows = Object.keys(REGION_LABEL)
    .map(r => [r, load[r] || 0])
    .filter(([, v]) => v > 0)
    .sort((a, b) => b[1] - a[1]);
  if (!rows.length) return null;

  const scale = Math.max(g.max * 1.2, ...rows.map(r => r[1]));
  const box = el("div");
  rows.forEach(([r, v]) => {
    const row = el("div", "mrow" + (v < g.min ? " low" : v > g.max ? " over" : ""));
    row.appendChild(el("span", "mn", REGION_LABEL[r]));
    const track = el("div", "mt");
    const band = el("span", "band");
    band.style.left = (g.min / scale) * 100 + "%";
    band.style.width = ((g.max - g.min) / scale) * 100 + "%";
    const fill = el("span", "fill");
    fill.style.width = Math.min(100, (v / scale) * 100) + "%";
    track.appendChild(band); track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el("span", "mv", String(Math.round(v * 10) / 10)));
    box.appendChild(row);
  });
  return box;
}

/* every movement in the log, newest-trained first */
function liftRows() {
  const ids = [...new Set(S.logs.flatMap(l => l.entries.map(e => e.exerciseId)))];
  return ids.map(id => {
    const h = exHistory(id);
    if (!h.length) return null;
    const byWeight = h.some(p => p.top > 0);
    const val = p => (byWeight ? p.top : p.topReps);
    return { id, h, byWeight, val, first: val(h[0]), last: val(h[h.length - 1]), date: h[h.length - 1].date };
  }).filter(Boolean).sort((a, b) => new Date(b.date) - new Date(a.date));
}

function personalBests() {
  return liftRows().map(({ id, h, byWeight }) => {
    let best = null;
    h.forEach(p => p.sets.forEach(s => {
      const w = nWeight(s), r = nReps(s);
      const score = byWeight ? e1rm(w, r) : r;
      if (!best || score > best.score) best = { score, w, r, date: p.date };
    }));
    return best && { id, byWeight, ...best };
  }).filter(Boolean).sort((a, b) => new Date(b.date) - new Date(a.date));
}

function consistencyGrid() {
  const weeks = weekBuckets(10);
  const trained = new Set(S.logs.map(l => dayKey(new Date(l.date))));
  const today = dayKey();
  const g = el("div", "cgrid");
  ["M", "T", "W", "T", "F", "S", "S"].forEach(d => g.appendChild(el("span", "ch", d)));
  g.appendChild(el("span", "ch", ""));
  weeks.forEach(wk => {
    let n = 0;
    for (let d = 0; d < 7; d++) {
      const day = new Date(wk.from); day.setDate(day.getDate() + d);
      const k = dayKey(day), on = trained.has(k);
      if (on) n++;
      const cell = el("i", (on ? "on" : "") + (k === today ? " now" : ""));
      cell.title = k;
      g.appendChild(cell);
    }
    g.appendChild(el("span", "cn", n ? String(n) : "·"));
  });
  return { node: g, weeks };
}

        : d === 0
          ? `<b>${last}${esc(u)}</b> · unchanged · ${h.length} sessions`
          : `${first} → <b>${last}${esc(u)}</b> <em class="${d > 0 ? "up" : "down"}">${d > 0 ? "+" : ""}${Math.round(d * 10) / 10}</em> · ${h.length} sessions`
    }));
    b.appendChild(left);
    if (h.length > 1) b.appendChild(sparkNode(h.map(val)));
    b.onclick = () => openSheet("lift", id);
    w.appendChild(b);
  });

  const mc = muscleChart();
  if (mc) {
    const g = BOOK.training.guidelines.volume.sets_per_bodypart_per_week;
    sec("Sets per muscle · last 7 days", `The shaded band is the ${g.min}–${g.max} working sets per muscle per week the book targets. Grey is under it, red is over. Secondary muscles count half a set.`);
    w.appendChild(mc);
  }

  sec("Weekly volume", `Weight × reps for every logged set, bucketed by week. The dashed line is your average across the weeks you trained.`);
  w.appendChild(volChart());

  const cg = consistencyGrid();
  const hit = cg.weeks.filter(x => x.logs.length >= 3).length;
  sec("Consistency", `Last ${cg.weeks.length} weeks, Monday to Sunday. ${hit} of them hit three or more sessions.`);
  w.appendChild(cg.node);

  const pbs = personalBests();
  if (pbs.length) {
    sec("Personal bests", "Your single best set on each movement, most recent first. Weighted lifts are ranked by estimated one-rep max.");
    pbs.forEach(p => {
      const r = el("div", "pbrow");
      r.appendChild(el("span", "pn", exName(p.id)));
      r.appendChild(Object.assign(el("span", "pv"), {
        innerHTML: p.byWeight
          ? `<b>${round1(p.w)}${esc(S.units)} × ${p.r}</b> · ${esc(dmy(new Date(p.date)))}`
          : `<b>${p.r} reps</b> · ${esc(dmy(new Date(p.date)))}`
      }));
      w.appendChild(r);
    });
  }

  sec("Sessions", null);
  [...S.logs].reverse().forEach(l => {
    const b = el("button", "sess");
    const d = new Date(l.date);
    b.innerHTML = `<span class="f">${esc(l.focus)}${l.partial ? ' <span class="d">· cut short</span>' : ""}</span>
      <span class="d">${logSets(l)} set${logSets(l) === 1 ? "" : "s"} · ${kFmt(logVol(l))} ${esc(S.units)}</span>
      <span class="d">${esc(dmy(d))}</span>`;
    b.onclick = () => {
      const box = el("div", "read");
      l.entries.forEach(e => {
        box.appendChild(el("h3", null, exName(e.exerciseId)));
        box.appendChild(el("p", null, e.sets.map(s => setText(s)).join("   ·   ")));
      });
      if (l.durationMin) box.appendChild(el("p", null, `${l.durationMin} minutes${l.partial ? " · ended early" : ""}`));
      $("#sheetTitle").textContent = l.focus + " · " + d.toLocaleDateString();
      const bd = $("#sheetBody"); bd.innerHTML = "";
      const back = el("button", "back", "← Progress");
      back.onclick = () => { sheetStack = []; openSheet("progress"); };
      bd.appendChild(back); bd.appendChild(box);
    };
    w.appendChild(b);
  });

  const dl = el("div", "dbtns");
  const b = el("button", "dbtn", "Export everything as JSON");
  b.onclick = () => { sheetStack = []; openSheet("data"); };
  dl.appendChild(b);
  w.appendChild(dl);
  return { title: "Progress", node: w };
}

/* one movement, every session of it */
function vLift(exerciseId) {
  const w = el("div");
  const back = el("button", "back", "← Progress");
  back.onclick = () => { sheetStack = []; openSheet("progress"); };
  w.appendChild(back);
  w.appendChild(trendNode(exerciseId));

  const h = exHistory(exerciseId);
  const plan = loadPlan(exerciseId);
  w.appendChild(el("div", "shead", "Every session"));
  [...h].reverse().forEach(p => {
    const r = el("div", "pbrow");
    r.appendChild(el("span", "pn", dmy(new Date(p.date))));
    r.appendChild(Object.assign(el("span", "pv"), { textContent: prevLine(plan, p.sets) }));
    w.appendChild(r);
  });
  return { title: exName(exerciseId), node: w };
}

/* ---------- settings ---------- */
function vSettings() {
  const w = el("div");
  const row = (label, ctrl) => { const r = el("div", "row"); r.appendChild(el("label", null, label)); r.appendChild(ctrl); w.appendChild(r); };

  const name = el("input"); name.type = "text"; name.value = S.name;
  name.oninput = () => { S.name = name.value.slice(0, 24) || "there"; save(); };
  row("Name", name);

  if (customProgram()) {
    w.appendChild(Object.assign(el("div", "note"), {
      textContent: `Running the imported programme “${S.program.name}” — ${S.program.days.length} day cycle. Revert to a book split from Import / export.`
    }));
  } else {
    const sel = el("select");
    const o0 = el("option", null, FUND.name + " · 3d");
    o0.value = "fundamentals";
    if (S.splitId === "fundamentals") o0.selected = true;
    sel.appendChild(o0);
    SPLITS.forEach(s => { const o = el("option", null, `${s.name} · ${s.training_days}d`); o.value = s.id; if (s.id === S.splitId) o.selected = true; sel.appendChild(o); });
    sel.onchange = () => { S.splitId = sel.value; S.queueIndex = 0; S.startWeek = null; S.session = null; S.dayStamp = dayKey(); openIdx = null; save(); rollDays(); render(); };
    row("Programme", sel);
  }

  const seg = el("div", "seg");
  ["kg", "lb"].forEach(u => { const b = el("button", S.units === u ? "on" : "", u); b.onclick = () => { S.units = u; save(); openSheet("settings"); render(); }; seg.appendChild(b); });
  row("Units", seg);

  const th = el("div", "seg");
  [["auto", "Auto"], ["light", "Light"], ["dark", "Dark"]].forEach(([v, t]) => {
    const b = el("button", S.theme === v ? "on" : "", t);
    b.onclick = () => { S.theme = v; save(); applyTheme(); openSheet("settings"); };
    th.appendChild(b);
  });
  row("Theme", th);

  const snd = el("div", "seg");
  const soundOn = S.sound !== false;
  [[true, "On"], [false, "Off"]].forEach(([v, t]) => {
    const b = el("button", soundOn === v ? "on" : "", t);
    /* tapping On doubles as the preview and as the gesture that unlocks audio */
    b.onclick = () => { S.sound = v; save(); if (v) bell(); openSheet("settings"); };
    snd.appendChild(b);
  });
  row("Rest bell", snd);

  w.appendChild(el("div", "shead", "Bar weights"));
  w.appendChild(Object.assign(el("div", "note"), {
    textContent: `On barbell lifts you enter the plates on one side and the app adds the other side plus the bar. Correct these to whatever your gym actually racks — they are stored per unit, so the ${S.units} figures are the ones in play.`
  }));
  BAR_KINDS.forEach(kind => {
    const inp = el("input");
    inp.type = "number"; inp.inputMode = "decimal"; inp.step = "0.5"; inp.min = "0";
    inp.value = String(barWeight(kind));
    inp.onchange = () => {
      const v = parseFloat(inp.value);
      const u = unitKey();
      if (Number.isFinite(v) && v >= 0 && v <= 100) S.bars[u][kind] = round1(v);
      else delete S.bars[u][kind];
      save(); inp.value = String(barWeight(kind)); render();
    };
    const lab = el("label", null, BAR_LABEL[kind]);
    lab.appendChild(Object.assign(el("span", "sub"), {
      textContent: kind === "ez" ? "curls and skullcrushers" : kind === "olympic" ? "squat, bench, deadlift, press" : `default ${BAR_DEFAULTS[unitKey()][kind]}${S.units}`
    }));
    const r = el("div", "row"); r.appendChild(lab); r.appendChild(inp); w.appendChild(r);
  });

  w.appendChild(el("div", "shead", "Programme"));
  const p = activeProgram();
  w.appendChild(Object.assign(el("div", "note"), {
    textContent: `${p.name} — ${p.days.map(d => d.focus).join(" · ")}. Currently on day ${(S.queueIndex % cycleLen()) + 1} of ${cycleLen()}.`
  }));
  const dz = el("div", "dbtns");
  const io = el("button", "dbtn", "Import / export JSON");
  io.onclick = () => { sheetStack = []; openSheet("data"); };
  dz.appendChild(io);
  w.appendChild(dz);

  const r1 = el("button", "danger", "Restart the programme at week 1");
  r1.onclick = () => { S.queueIndex = 0; S.startWeek = null; S.session = null; openIdx = null; save(); rollDays(); render(); closeSheet(); };
  w.appendChild(r1);
  const r2 = el("button", "danger", "Erase all logged workouts");
  r2.onclick = () => { if (confirm("Delete every logged workout? This cannot be undone. Export a copy first if you want a backup.")) { S.logs = []; save(); render(); closeSheet(); } };
  w.appendChild(r2);

  w.appendChild(Object.assign(el("div", "note"), {
    textContent: "Training guidance follows the book: " +
      `${BOOK.training.guidelines.volume.sets_per_bodypart_per_week.min}–${BOOK.training.guidelines.volume.sets_per_bodypart_per_week.max} sets per muscle per week, ` +
      `${BOOK.training.guidelines.rep_ranges.practical_hypertrophy_zone.min}–${BOOK.training.guidelines.rep_ranges.practical_hypertrophy_zone.max} reps, ` +
      `${BOOK.training.guidelines.effort.reps_in_reserve_compounds.min}–${BOOK.training.guidelines.effort.reps_in_reserve_compounds.max} reps left in the tank on compounds. ` +
      "Everything is stored only on this device."
  }));
  return { title: "Settings", node: w };
}

/* ---------------- opening brief ---------------- */
let introOn = false;

const weekCount = () => S.logs.filter(l => Date.now() - new Date(l.date).getTime() < 7 * 864e5).length;
const totalVolume = () => S.logs.reduce((a, l) => a + l.entries.reduce((b, e) =>
  b + e.sets.reduce((c, s) => c + nWeight(s) * nReps(s), 0), 0), 0);

function briefLine() {
  const n = S.logs.length;
  if (!n) return "Day one. Whatever you write down today becomes the number everything after it is measured against.";
  const last = S.logs[n - 1];
  const gap = calDays(last.date);
  const wk = weekCount();
  if (gap >= 10) return `${gap} days away. Start lighter than your ego wants and earn it back over a fortnight.`;
  if (gap >= 5) return `${gap} days since the last session. Pick up where you left off, not where you wish you were.`;
  if (wk >= 5) return `${wk} sessions inside seven days. That is a lot of stimulus — guard your sleep.`;
  if (wk >= 3) return `${wk} sessions this week. The rhythm is the whole trick, and you have it.`;
  if (gap === 0) return "Second time in today. Keep it short and leave something in the tank.";
  return `Last session ${daysAgo(last.date)}. Right on schedule.`;
}
function openerLine(day) {
  for (const x of day.exercises) {
    const lp = lastPerf(x.exerciseId);
    if (lp && lp.top) return `${exName(x.exerciseId)} opens at ${lp.top}${S.units}. Beat one rep of that and the day counts.`;
  }
  return day.exercises.length ? `You open on ${exName(day.exercises[0].exerciseId)}.` : "";
}

function showIntro() {
  const box = $("#intro"), rows = [];
  const now = new Date(), hour = now.getHours();
  const hi = hour < 5 ? "Still up" : hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
  const sess = S.session, day = dayAt(S.queueIndex), resting = !sess && isRest(day.focus);
  const finished = !sess && doneToday();
  const log = lastLog();

  rows.push(el("div", "i-greet", `${hi}, ${S.name}`));
  rows.push(el("div", "i-date", now.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" })));
  rows.push(el("div", "i-rule"));
  rows.push(el("div", "i-kick", sess ? "Still going" : finished ? "Already done today" : resting ? "Nothing on the card" : "On the card today"));
  rows.push(el("div", "i-focus", sess ? sess.focus : finished ? log.focus : resting ? "Rest" : day.focus));

  if (sess) {
    const d = sess.exercises.reduce((a, e) => a + e.sets.filter(s => s.done).length, 0);
    const t = sess.exercises.reduce((a, e) => a + e.sets.length, 0);
    rows.push(el("div", "i-meta", `${d} of ${t} sets already down · ${Math.max(1, Math.round((Date.now() - sess.started) / 60000))} minutes in`));
  } else if (finished) {
    const sets = log.entries.reduce((a, e) => a + e.sets.length, 0);
    rows.push(el("div", "i-meta", `${sets} sets logged${log.durationMin ? " in " + log.durationMin + " minutes" : ""} · that is today handled`));
    rows.push(el("div", "i-open", "Tomorrow: " + (isRest(focusAt(tomorrowIndex())) ? "rest day" : focusAt(tomorrowIndex()))));
  } else if (resting) {
    rows.push(el("div", "i-meta", `${nextTrain()} is next up`));
  } else {
    rows.push(el("div", "i-meta", `${day.exercises.length} movements · ${totalSets(day.exercises)} sets · about ${estMins(day.exercises)} minutes`));
    rows.push(el("div", "i-moves", day.exercises.map(x => exName(x.exerciseId)).join("  ·  ")));
    const op = openerLine(day);
    if (op) rows.push(el("div", "i-open", op));
  }

  const load = sess ? liveLoad(sess) : finished ? loggedLoad(log) : resting ? null : plannedLoad(day);
  if (load && Object.keys(load).length) {
    rows.push(el("div", "i-rule"));
    rows.push(muscleBlock(load, finished ? "what you hit" : "where it lands"));
  }

  rows.push(el("div", "i-rule"));
  const st = el("div", "i-stats");
  const vol = totalVolume();
  [[String(S.logs.length), "sessions"],
   [String(weekCount()), "this week"],
   [vol >= 1000 ? Math.round(vol / 1000) + "k" : String(Math.round(vol)), S.units + " moved"]]
    .forEach(([v, l]) => { const d = el("div"); d.appendChild(el("b", null, v)); d.appendChild(el("span", null, l)); st.appendChild(d); });
  rows.push(st);
  rows.push(el("div", "i-line", resting ? "Rest is a training day you happen to spend lying down." : briefLine()));
  box.innerHTML = "";
  rows.forEach((n, i) => { n.style.animationDelay = 60 + i * 70 + "ms"; box.appendChild(n); });

  introOn = true;
  box.hidden = false;
  box.classList.remove("out");
  box.onclick = dismissIntro;
}
function dismissIntro() {
  if (!introOn) return;
  introOn = false;
  const box = $("#intro");
  box.classList.add("out");
  setTimeout(() => { box.innerHTML = ""; box.hidden = true; }, 700);
}

rollDays();
if (S.rest && S.session) runRest(); else S.rest = null;
render();
showIntro();
</script>
