<script type="application/json" id="data-lib">{"muscles":["Chest","Back","Shoulders","Biceps","Triceps","Quads","Hamstrings","Glutes","Calves","Core"],"exercises":[{"id":"bench-press","name":"Barbell Bench Press","muscle":"Chest","equipment":"Barbell","type":"compound","cues":["Shoulder blades pinned back and down into the bench","Lower to the lower chest with elbows ~45° from the torso","Drive the bar back over the shoulders, keep the feet planted"]},{"id":"incline-db-press","name":"Incline Dumbbell Press","muscle":"Chest","equipment":"Dumbbell","type":"compound","cues":["Set the bench to 30° — steeper shifts work to the shoulders","Lower until the dumbbells are level with the chest","Press up and slightly inward without clanging them together"]},{"id":"flat-db-press","name":"Flat Dumbbell Press","muscle":"Chest","equipment":"Dumbbell","type":"compound","cues":["Keep the wrists stacked over the elbows","Control the stretch at the bottom, no bouncing","Stop a couple of reps shy of failure on the first sets"]},{"id":"cable-fly","name":"Cable Chest Fly","muscle":"Chest","equipment":"Cable","type":"isolation","cues":["Soft, fixed elbow bend throughout","Sweep the hands together in an arc, not a press","Pause briefly where the chest is most squeezed"]},{"id":"pec-deck","name":"Pec Deck","muscle":"Chest","equipment":"Machine","type":"isolation","cues":["Set the handles level with mid-chest","Keep the back flat against the pad","Slow eccentric — three seconds back"]},{"id":"dips","name":"Chest Dip","muscle":"Chest","equipment":"Bodyweight","type":"compound","cues":["Lean the torso forward to bias the chest","Descend until the upper arms are parallel to the floor","Stop short if you feel a pinch at the front of the shoulder"]},{"id":"push-up","name":"Push-Up","muscle":"Chest","equipment":"Bodyweight","type":"compound","cues":["Body in one straight line from head to heels","Elbows at roughly 45°, not flared to 90°","Add load with a backpack once you pass 20 clean reps"]},{"id":"pull-up","name":"Pull-Up","muscle":"Back","equipment":"Bodyweight","type":"compound","cues":["Start from a full hang, shoulders active","Lead with the elbows down toward the ribs","Chin over the bar without craning the neck"]},{"id":"lat-pulldown","name":"Lat Pulldown","muscle":"Back","equipment":"Cable","type":"compound","cues":["Grip slightly wider than shoulder width","Pull the bar to the collarbone, chest tall","Let the shoulder blades rise fully at the top"]},{"id":"chest-supported-row","name":"Chest-Supported Row","muscle":"Back","equipment":"Machine","type":"compound","cues":["Chest stays glued to the pad — no heaving","Pull the elbows back and squeeze the blades together","Control the stretch, don't let the weight yank you"]},{"id":"barbell-row","name":"Barbell Row","muscle":"Back","equipment":"Barbell","type":"compound","cues":["Hinge to about 45°, neutral spine","Pull to the lower ribs, elbows tight-ish","Keep the torso angle fixed for the whole set"]},{"id":"seated-cable-row","name":"Seated Cable Row","muscle":"Back","equipment":"Cable","type":"compound","cues":["Sit tall, slight forward lean at the stretch","Drive the elbows past the torso","No rocking backwards to move the stack"]},{"id":"one-arm-db-row","name":"One-Arm Dumbbell Row","muscle":"Back","equipment":"Dumbbell","type":"compound","cues":["Brace the free hand on a bench, back flat","Row toward the hip, not the shoulder","Full stretch at the bottom each rep"]},{"id":"straight-arm-pulldown","name":"Straight-Arm Pulldown","muscle":"Back","equipment":"Cable","type":"isolation","cues":["Hinge slightly, arms nearly straight","Sweep the bar down to the thighs using the lats","Stop when the hands reach the hips"]},{"id":"face-pull","name":"Face Pull","muscle":"Back","equipment":"Cable","type":"isolation","cues":["Set the cable at upper-chest height","Pull toward the forehead, hands finishing wide","Externally rotate — think 'double biceps' pose"]},{"id":"ohp","name":"Overhead Press","muscle":"Shoulders","equipment":"Barbell","type":"compound","cues":["Squeeze the glutes to stop the lower back arching","Move the head back slightly as the bar passes the face","Finish with the bar stacked over the mid-foot"]},{"id":"db-shoulder-press","name":"Seated Dumbbell Shoulder Press","muscle":"Shoulders","equipment":"Dumbbell","type":"compound","cues":["Set the bench just off vertical","Lower until the elbows are level with the shoulders","Press without banging the dumbbells overhead"]},{"id":"lateral-raise","name":"Dumbbell Lateral Raise","muscle":"Shoulders","equipment":"Dumbbell","type":"isolation","cues":["Lead with the elbows, not the hands","Raise to shoulder height — no higher","Lower slowly; this one is about control, not load"]},{"id":"cable-lateral-raise","name":"Cable Lateral Raise","muscle":"Shoulders","equipment":"Cable","type":"isolation","cues":["Cable set at the lowest pin, behind the body","Slight forward lean away from the stack","Constant tension — pause at the top"]},{"id":"reverse-pec-deck","name":"Reverse Pec Deck","muscle":"Shoulders","equipment":"Machine","type":"isolation","cues":["Chest on the pad, slight elbow bend","Sweep the arms wide and back","Think about the rear delts, not the traps"]},{"id":"barbell-curl","name":"Barbell Curl","muscle":"Biceps","equipment":"Barbell","type":"isolation","cues":["Elbows pinned at the sides","Curl without swinging the hips","Lower over two to three seconds"]},{"id":"incline-db-curl","name":"Incline Dumbbell Curl","muscle":"Biceps","equipment":"Dumbbell","type":"isolation","cues":["Bench at ~60°, arms hanging behind the body","Keep the upper arm still — only the forearm moves","Full stretch at the bottom is the whole point"]},{"id":"hammer-curl","name":"Hammer Curl","muscle":"Biceps","equipment":"Dumbbell","type":"isolation","cues":["Neutral grip, thumbs up throughout","No shoulder shrug at the top","Alternate or go together, just stay strict"]},{"id":"cable-curl","name":"Cable Curl","muscle":"Biceps","equipment":"Cable","type":"isolation","cues":["Stand a step back from the pulley","Constant tension — don't rest at the bottom","Squeeze hard for a beat at the top"]},{"id":"preacher-curl","name":"Preacher Curl","muscle":"Biceps","equipment":"Machine","type":"isolation","cues":["Armpits pressed into the top of the pad","Do not fully lock out under heavy load","Control the lowering phase completely"]},{"id":"close-grip-bench","name":"Close-Grip Bench Press","muscle":"Triceps","equipment":"Barbell","type":"compound","cues":["Hands about shoulder width — not narrower","Tuck the elbows toward the ribs","Lower to the lower chest, press straight up"]},{"id":"triceps-pushdown","name":"Triceps Pushdown","muscle":"Triceps","equipment":"Cable","type":"isolation","cues":["Elbows locked at the sides","Extend fully and squeeze at the bottom","Let the forearms come up to at least 90°"]},{"id":"overhead-cable-ext","name":"Overhead Cable Triceps Extension","muscle":"Triceps","equipment":"Cable","type":"isolation","cues":["Face away from the stack, torso leaning forward","Upper arms stay beside the ears","Get a deep stretch behind the head"]},{"id":"skullcrusher","name":"EZ-Bar Skullcrusher","muscle":"Triceps","equipment":"Barbell","type":"isolation","cues":["Lower behind the head, not to the forehead","Keep the upper arms angled back slightly","Stop the set if the elbows complain"]},{"id":"back-squat","name":"Barbell Back Squat","muscle":"Quads","equipment":"Barbell","type":"compound","cues":["Brace hard, then break at the hips and knees together","Knees track over the toes, heels planted","Descend to at least parallel if mobility allows"]},{"id":"front-squat","name":"Front Squat","muscle":"Quads","equipment":"Barbell","type":"compound","cues":["Elbows high, bar resting on the front delts","Stay upright — the torso does not fold","Go only as deep as you can hold position"]},{"id":"hack-squat","name":"Hack Squat","muscle":"Quads","equipment":"Machine","type":"compound","cues":["Feet lower on the platform to bias the quads","Lower under control to a deep knee bend","Don't lock out hard at the top"]},{"id":"leg-press","name":"Leg Press","muscle":"Quads","equipment":"Machine","type":"compound","cues":["Feet shoulder width, mid-platform","Lower until the knees reach ~90° without the hips lifting","Never lock the knees out at the top"]},{"id":"bulgarian-split-squat","name":"Bulgarian Split Squat","muscle":"Quads","equipment":"Dumbbell","type":"compound","cues":["Rear foot on the bench, front foot far enough forward","Drop straight down, front knee tracking the toes","Finish all reps on one leg before switching"]},{"id":"walking-lunge","name":"Walking Lunge","muscle":"Quads","equipment":"Dumbbell","type":"compound","cues":["Long steps, torso upright","Back knee lightly kisses the floor","Push through the front heel to stand"]},{"id":"leg-extension","name":"Leg Extension","muscle":"Quads","equipment":"Machine","type":"isolation","cues":["Align the knee joint with the machine pivot","Squeeze hard at full extension","Lower slowly — don't let the stack drop"]},{"id":"romanian-deadlift","name":"Romanian Deadlift","muscle":"Hamstrings","equipment":"Barbell","type":"compound","cues":["Push the hips back, bar stays against the legs","Soft knees, flat back throughout","Stop when the hamstrings run out of stretch"]},{"id":"deadlift","name":"Conventional Deadlift","muscle":"Hamstrings","equipment":"Barbell","type":"compound","cues":["Bar over mid-foot, shoulders just ahead of it","Take the slack out before you pull","Push the floor away; lock out with the glutes"]},{"id":"lying-leg-curl","name":"Lying Leg Curl","muscle":"Hamstrings","equipment":"Machine","type":"isolation","cues":["Hips pressed into the pad","Curl all the way, squeeze at the top","Resist hard on the way down"]},{"id":"seated-leg-curl","name":"Seated Leg Curl","muscle":"Hamstrings","equipment":"Machine","type":"isolation","cues":["Strap tight across the thighs","Stretched hip position makes this one brutal — go lighter","Full range, controlled tempo"]},{"id":"hip-thrust","name":"Barbell Hip Thrust","muscle":"Glutes","equipment":"Barbell","type":"compound","cues":["Bench under the shoulder blades, chin tucked","Drive through the heels to full hip extension","Squeeze the glutes for a beat at the top"]},{"id":"back-extension","name":"45° Back Extension","muscle":"Glutes","equipment":"Bodyweight","type":"isolation","cues":["Round the upper back slightly to bias the glutes","Extend until the body is in line — no further","Add a plate to the chest when it gets easy"]},{"id":"standing-calf-raise","name":"Standing Calf Raise","muscle":"Calves","equipment":"Machine","type":"isolation","cues":["Full stretch at the bottom, heels well below the platform","Rise all the way onto the toes","Pause at both ends — no bouncing"]},{"id":"seated-calf-raise","name":"Seated Calf Raise","muscle":"Calves","equipment":"Machine","type":"isolation","cues":["Knees bent to target the soleus","Slow, deliberate reps","Higher reps work well here"]},{"id":"hanging-leg-raise","name":"Hanging Leg Raise","muscle":"Core","equipment":"Bodyweight","type":"isolation","cues":["Curl the pelvis up, don't just swing the legs","Control the descent completely","Bend the knees if the lower back arches"]},{"id":"cable-crunch","name":"Cable Crunch","muscle":"Core","equipment":"Cable","type":"isolation","cues":["Kneel below the pulley, rope beside the head","Crunch by rounding the spine, hips stay still","Squeeze the abs hard at the bottom"]},{"id":"plank","name":"Plank","muscle":"Core","equipment":"Bodyweight","type":"isolation","cues":["Elbows under the shoulders, ribs pulled down","Squeeze the glutes to keep a straight line","Log seconds in the reps field"]}],"templates":{"Upper":[{"exercise":"bench-press","sets":4,"repMin":6,"repMax":8},{"exercise":"chest-supported-row","sets":4,"repMin":8,"repMax":10},{"exercise":"db-shoulder-press","sets":3,"repMin":8,"repMax":10},{"exercise":"lat-pulldown","sets":3,"repMin":10,"repMax":12},{"exercise":"incline-db-press","sets":3,"repMin":10,"repMax":12},{"exercise":"cable-lateral-raise","sets":3,"repMin":12,"repMax":15},{"exercise":"incline-db-curl","sets":3,"repMin":8,"repMax":12},{"exercise":"triceps-pushdown","sets":3,"repMin":10,"repMax":15}],"Lower":[{"exercise":"back-squat","sets":4,"repMin":6,"repMax":8},{"exercise":"romanian-deadlift","sets":3,"repMin":8,"repMax":10},{"exercise":"leg-press","sets":3,"repMin":10,"repMax":12},{"exercise":"lying-leg-curl","sets":3,"repMin":10,"repMax":12},{"exercise":"leg-extension","sets":3,"repMin":12,"repMax":15},{"exercise":"standing-calf-raise","sets":4,"repMin":10,"repMax":15},{"exercise":"hanging-leg-raise","sets":3,"repMin":10,"repMax":15}],"Push":[{"exercise":"bench-press","sets":4,"repMin":6,"repMax":8},{"exercise":"db-shoulder-press","sets":3,"repMin":8,"repMax":10},{"exercise":"incline-db-press","sets":3,"repMin":10,"repMax":12},{"exercise":"cable-lateral-raise","sets":3,"repMin":12,"repMax":15},{"exercise":"triceps-pushdown","sets":3,"repMin":10,"repMax":12},{"exercise":"overhead-cable-ext","sets":3,"repMin":12,"repMax":15}],"Pull":[{"exercise":"pull-up","sets":4,"repMin":6,"repMax":10},{"exercise":"chest-supported-row","sets":4,"repMin":8,"repMax":10},{"exercise":"lat-pulldown","sets":3,"repMin":10,"repMax":12},{"exercise":"face-pull","sets":3,"repMin":12,"repMax":15},{"exercise":"barbell-curl","sets":3,"repMin":8,"repMax":12},{"exercise":"incline-db-curl","sets":3,"repMin":10,"repMax":15}],"Legs":[{"exercise":"back-squat","sets":4,"repMin":6,"repMax":8},{"exercise":"romanian-deadlift","sets":3,"repMin":8,"repMax":10},{"exercise":"bulgarian-split-squat","sets":3,"repMin":8,"repMax":12},{"exercise":"lying-leg-curl","sets":3,"repMin":10,"repMax":12},{"exercise":"leg-extension","sets":3,"repMin":12,"repMax":15},{"exercise":"standing-calf-raise","sets":4,"repMin":10,"repMax":15}],"Full Body":[{"exercise":"back-squat","sets":3,"repMin":6,"repMax":8},{"exercise":"bench-press","sets":3,"repMin":6,"repMax":8},{"exercise":"chest-supported-row","sets":3,"repMin":8,"repMax":10},{"exercise":"romanian-deadlift","sets":3,"repMin":8,"repMax":10},{"exercise":"cable-lateral-raise","sets":2,"repMin":12,"repMax":15},{"exercise":"barbell-curl","sets":2,"repMin":10,"repMax":12},{"exercise":"triceps-pushdown","sets":2,"repMin":10,"repMax":15}]},"splitScale":{"default":1.0,"byDaysPerWeek":{"3":1.0,"4":1.0,"5":0.6,"6":0.8}},"swaps":{"bench-press":["flat-db-press","dips","push-up"],"incline-db-press":["cable-fly","pec-deck"],"chest-supported-row":["barbell-row","seated-cable-row","one-arm-db-row"],"pull-up":["lat-pulldown"],"lat-pulldown":["pull-up","straight-arm-pulldown"],"db-shoulder-press":["ohp"],"cable-lateral-raise":["lateral-raise","reverse-pec-deck"],"barbell-curl":["cable-curl","preacher-curl","hammer-curl"],"incline-db-curl":["hammer-curl","cable-curl"],"triceps-pushdown":["close-grip-bench","skullcrusher"],"overhead-cable-ext":["skullcrusher"],"back-squat":["front-squat","hack-squat","leg-press"],"leg-press":["hack-squat","walking-lunge"],"romanian-deadlift":["deadlift","seated-leg-curl","hip-thrust"],"lying-leg-curl":["seated-leg-curl"],"bulgarian-split-squat":["walking-lunge","leg-press"],"standing-calf-raise":["seated-calf-raise"],"hanging-leg-raise":["cable-crunch","plank"],"face-pull":["reverse-pec-deck"]}}</script>
<script type="application/json" id="data-media">{"bench-press":{"n":"barbell bench press","m":"EIeI8Vf","i":"0025","t":"pectorals","s":["triceps","shoulders"],"steps":["Lie flat on a bench with your feet flat on the ground and your back pressed against the bench.","Grasp the barbell with an overhand grip slightly wider than shoulder-width apart.","Lift the barbell off the rack and hold it directly above your chest with your arms fully extended.","Lower the barbell slowly towards your chest, keeping your elbows tucked in.","Pause for a moment when the barbell touches your chest.","Push the barbell back up to the starting position by extending your arms.","Repeat for the desired number of repetitions."]},"incline-db-press":{"n":"dumbbell incline bench press","m":"ns0SIbU","i":"0314","t":"pectorals","s":["shoulders","triceps"],"steps":["Set up an incline bench at a 45-degree angle.","Sit on the bench with your feet flat on the ground and your back pressed firmly against the bench.","Hold a dumbbell in each hand, palms facing forward, and lift them to shoulder height.","Slowly lower the dumbbells to the sides of your chest, keeping your elbows at a 90-degree angle.","Push the dumbbells back up to the starting position, fully extending your arms.","Repeat for the desired number of repetitions."]},"flat-db-press":{"n":"dumbbell bench press","m":"SpYC0Kp","i":"0289","t":"pectorals","s":["triceps","shoulders"],"steps":["Lie flat on a bench with your feet flat on the ground and your back pressed against the bench.","Hold a dumbbell in each hand, with your palms facing forward and your arms extended above your chest.","Lower the dumbbells slowly to the sides of your chest, keeping your elbows at a 90-degree angle.","Pause for a moment, then push the dumbbells back up to the starting position, fully extending your arms.","Repeat for the desired number of repetitions."]},"cable-fly":{"n":"cable standing fly","m":"Pr9Rhf4","i":"0227","t":"pectorals","s":["deltoids","triceps"],"steps":["Attach the handles to the cables at chest height.","Stand with your feet shoulder-width apart, facing away from the cable machine.","Grasp the handles with an overhand grip, palms facing forward.","Step forward slightly to create tension in the cables.","Keep your core engaged and your back straight throughout the exercise.","With a slight bend in your elbows, slowly bring your arms forward and together in front of your chest.","Squeeze your chest muscles at the peak of the movement.","Slowly reverse the movement, returning your arms to the starting position.","Repeat for the desired number of repetitions."]},"pec-deck":{"n":"lever seated fly","m":"v3xmPAR","i":"0596","t":"pectorals","s":["deltoids","trapezius"],"steps":["Adjust the seat height and position yourself on the machine with your back against the pad.","Grasp the handles with a pronated grip and keep your elbows slightly bent.","Exhale and push the handles forward, bringing them together in front of your chest.","Pause for a moment, squeezing your chest muscles.","Inhale and slowly return to the starting position, allowing your chest muscles to stretch.","Repeat for the desired number of repetitions."]},"dips":{"n":"triceps dip","m":"X6C6i5Y","i":"0814","t":"triceps","s":["chest","shoulders"],"steps":["Sit on the edge of a bench or chair with your hands gripping the edge, fingers pointing forward.","Slide your butt off the bench, supporting your weight with your hands.","Bend your elbows and lower your body towards the ground, keeping your back close to the bench.","Pause for a moment at the bottom, then push yourself back up to the starting position.","Repeat for the desired number of repetitions."]},"push-up":{"n":"push-up","m":"I4hDWkc","i":"0662","t":"pectorals","s":["triceps","deltoids","core"],"steps":["Start in a high plank position with your hands slightly wider than shoulder-width apart and your feet together.","Engage your core and lower your body towards the ground by bending your elbows, keeping your body in a straight line.","Pause for a moment when your chest is just above the ground, then push yourself back up to the starting position by straightening your arms.","Repeat for the desired number of repetitions."]},"pull-up":{"n":"pull-up","m":"lBDjFxJ","i":"0652","t":"lats","s":["biceps","forearms"],"steps":["Hang from a pull-up bar with your palms facing away from you and your arms fully extended.","Engage your core and squeeze your shoulder blades together.","Pull your body up towards the bar by bending your elbows and bringing your chest towards the bar.","Pause at the top of the movement, then slowly lower your body back down to the starting position.","Repeat for the desired number of repetitions."]},"lat-pulldown":{"n":"cable pulldown","m":"RVwzP10","i":"0198","t":"lats","s":["biceps","forearms"],"steps":["Adjust the cable pulldown machine so that the seat is at a comfortable height and the knee pad is secured.","Sit on the seat with your back straight and your feet flat on the ground.","Grasp the cable bar with an overhand grip, slightly wider than shoulder-width apart.","Lean back slightly and engage your core.","Pull the cable bar down towards your chest, squeezing your shoulder blades together.","Pause for a moment at the bottom of the movement, then slowly release the bar back to the starting position.","Repeat for the desired number of repetitions."]},"chest-supported-row":{"n":"lever t bar row","m":"aaXr7ld","i":"0606","t":"upper back","s":["biceps","forearms"],"steps":["Adjust the seat height and footplate position to ensure proper alignment.","Sit on the machine with your chest against the pad and your feet flat on the footplate.","Grasp the handles with an overhand grip, slightly wider than shoulder-width apart.","Keep your back straight and engage your core.","Pull the handles towards your torso, squeezing your shoulder blades together.","Pause for a moment at the peak contraction, then slowly release the handles back to the starting position.","Repeat for the desired number of repetitions."]},"barbell-row":{"n":"barbell bent over row","m":"eZyBC3j","i":"0027","t":"upper back","s":["biceps","forearms"],"steps":["Stand with your feet shoulder-width apart and knees slightly bent.","Bend forward at the hips while keeping your back straight and chest up.","Grasp the barbell with an overhand grip, hands slightly wider than shoulder-width apart.","Pull the barbell towards your lower chest by retracting your shoulder blades and squeezing your back muscles.","Pause for a moment at the top, then slowly lower the barbell back to the starting position.","Repeat for the desired number of repetitions."]},"seated-cable-row":{"n":"cable seated row","m":"fUBheHs","i":"0861","t":"upper back","s":["biceps","forearms"],"steps":["Sit on the cable row machine with your feet flat on the footrests and your knees slightly bent.","Grasp the handles with an overhand grip, keeping your back straight and your shoulders relaxed.","Pull the handles towards your body, squeezing your shoulder blades together.","Pause for a moment at the peak of the movement, then slowly release the handles back to the starting position.","Repeat for the desired number of repetitions."]},"one-arm-db-row":{"n":"dumbbell one arm bent-over row","m":"C0MA9bC","i":"0292","t":"upper back","s":["biceps","forearms"],"steps":["Stand with your feet shoulder-width apart, holding a dumbbell in one hand with your palm facing your body.","Bend your knees slightly and hinge forward at the hips, keeping your back straight and your core engaged.","Let the dumbbell hang straight down towards the floor, with your arm fully extended.","Pull the dumbbell up towards your chest, keeping your elbow close to your body and squeezing your shoulder blades together.","Pause for a moment at the top, then slowly lower the dumbbell back down to the starting position.","Repeat for the desired number of repetitions, then switch sides."]},"straight-arm-pulldown":{"n":"cable straight arm pulldown","m":"x69MAlq","i":"0238","t":"lats","s":["shoulders","biceps"],"steps":["Attach a straight bar to the high pulley of a cable machine.","Stand facing the machine with your feet shoulder-width apart.","Grasp the bar with an overhand grip, keeping your arms straight and your palms facing down.","Engage your lats and pull the bar down towards your thighs, keeping your arms straight throughout the movement.","Pause for a moment at the bottom, then slowly return the bar to the starting position.","Repeat for the desired number of repetitions."]},"face-pull":{"n":"cable rear delt row (with rope)","m":"wqNPGCg","i":"0203","t":"delts","s":["trapezius","rhomboids","biceps"],"steps":["Attach a rope handle to a low pulley cable machine.","Stand facing the machine with your feet shoulder-width apart.","Grasp the rope handle with an overhand grip, palms facing each other.","Bend your knees slightly and hinge forward at the hips, keeping your back straight.","Keep your elbows slightly bent and pull the rope towards your chest, squeezing your shoulder blades together.","Pause for a moment at the top of the movement, then slowly release the tension and return to the starting position.","Repeat for the desired number of repetitions."]},"ohp":{"n":"barbell standing wide military press","m":"Kyd9Rz5","i":"1457","t":"delts","s":["triceps","upper back"],"steps":["Stand with your feet shoulder-width apart and hold the barbell with an overhand grip, slightly wider than shoulder-width.","Lift the barbell to shoulder height, keeping your elbows slightly in front of the bar.","Press the barbell overhead, extending your arms fully.","Lower the barbell back to shoulder height and repeat for the desired number of repetitions."]},"db-shoulder-press":{"n":"dumbbell seated shoulder press","m":"znQUdHY","i":"0405","t":"delts","s":["triceps","upper back"],"steps":["Sit on a bench with a dumbbell in each hand, resting on your thighs.","Raise the dumbbells to shoulder height, palms facing forward.","Press the dumbbells upward until your arms are fully extended overhead.","Pause for a moment at the top, then slowly lower the dumbbells back to shoulder height.","Repeat for the desired number of repetitions."]},"lateral-raise":{"n":"dumbbell lateral raise","m":"DsgkuIt","i":"0334","t":"delts","s":["traps"],"steps":["Stand with your feet shoulder-width apart and hold a dumbbell in each hand, palms facing your body.","Keep your back straight and engage your core.","Raise your arms out to the sides until they are parallel to the floor, keeping a slight bend in your elbows.","Pause for a moment at the top, then slowly lower your arms back down to the starting position.","Repeat for the desired number of repetitions."]},"cable-lateral-raise":{"n":"cable lateral raise","m":"goJ6ezq","i":"0178","t":"delts","s":["traps","triceps"],"steps":["Stand with your feet shoulder-width apart and grasp the cable handles with an overhand grip.","Keep your arms straight and your core engaged.","Raise your arms out to the sides until they are parallel to the floor.","Pause for a moment at the top, then slowly lower your arms back down to the starting position.","Repeat for the desired number of repetitions."]},"reverse-pec-deck":{"n":"lever seated reverse fly","m":"myfUsKf","i":"0602","t":"delts","s":["trapezius","rhomboids"],"steps":["Adjust the seat height and position yourself on the machine with your chest against the pad and your feet flat on the floor.","Grasp the handles with an overhand grip and keep your arms slightly bent.","Exhale and squeeze your shoulder blades together as you pull the handles back and outward, away from your body.","Pause for a moment at the peak contraction, then inhale and slowly return to the starting position.","Repeat for the desired number of repetitions."]},"barbell-curl":{"n":"barbell curl","m":"25GPyDY","i":"0031","t":"biceps","s":["forearms"],"steps":["Stand up straight with your feet shoulder-width apart and hold a barbell with an underhand grip, palms facing forward.","Keep your elbows close to your torso and exhale as you curl the weights while contracting your biceps.","Continue to raise the bar until your biceps are fully contracted and the bar is at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale as you slowly begin to lower the bar back to the starting position.","Repeat for the desired number of repetitions."]},"incline-db-curl":{"n":"dumbbell incline curl","m":"ae9UoXQ","i":"0318","t":"biceps","s":["forearms"],"steps":["Set an incline bench to a 45-degree angle and sit on it with a dumbbell in each hand, palms facing forward.","Rest your upper arms on the incline bench and let your elbows hang down, fully extending your arms.","Keeping your upper arms stationary, exhale and curl the weights while contracting your biceps.","Continue to raise the dumbbells until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},"hammer-curl":{"n":"dumbbell hammer curl","m":"slDvUAU","i":"0313","t":"biceps","s":["forearms"],"steps":["Stand up straight with a dumbbell in each hand, palms facing your torso.","Keep your elbows close to your torso and rotate the palms of your hands until they are facing forward.","This will be your starting position.","Now, keeping the upper arms stationary, exhale and curl the weights while contracting your biceps.","Continue to raise the weights until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Then, inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the recommended amount of repetitions."]},"cable-curl":{"n":"cable curl","m":"G08RZcQ","i":"0868","t":"biceps","s":["forearms"],"steps":["Stand facing the cable machine with your feet shoulder-width apart.","Grasp the cable attachment with an underhand grip, palms facing up.","Keep your elbows close to your sides and your upper arms stationary.","Exhale and curl the cable attachment towards your shoulders, contracting your biceps.","Pause for a moment at the top of the movement, squeezing your biceps.","Inhale and slowly lower the cable attachment back to the starting position.","Repeat for the desired number of repetitions."]},"preacher-curl":{"n":"barbell preacher curl","m":"qOgPVf6","i":"0070","t":"biceps","s":["forearms"],"steps":["Sit on a preacher bench with your upper arms resting on the pad and your chest against the support.","Grasp the barbell with an underhand grip, slightly wider than shoulder-width apart.","Keeping your upper arms stationary, exhale and curl the barbell up towards your shoulders.","Pause for a moment at the top, squeezing your biceps.","Inhale and slowly lower the barbell back down to the starting position.","Repeat for the desired number of repetitions."]},"close-grip-bench":{"n":"barbell close-grip bench press","m":"J6Dx1Mu","i":"0030","t":"triceps","s":["chest","shoulders"],"steps":["Lie flat on a bench with your feet flat on the ground and your back pressed against the bench.","Grasp the barbell with a close grip, slightly narrower than shoulder-width apart.","Unrack the barbell and lower it slowly towards your chest, keeping your elbows close to your body.","Pause for a moment when the barbell touches your chest.","Push the barbell back up to the starting position, fully extending your arms.","Repeat for the desired number of repetitions."]},"triceps-pushdown":{"n":"cable pushdown","m":"3ZflifB","i":"0201","t":"triceps","s":["forearms"],"steps":["Attach a straight bar to a high pulley cable machine.","Stand facing the machine with your feet shoulder-width apart and a slight bend in your knees.","Grasp the bar with an overhand grip, hands shoulder-width apart.","Keep your elbows close to your sides and your upper arms stationary.","Exhale and push the bar down until your elbows are fully extended.","Pause for a moment, then inhale and slowly return the bar to the starting position.","Repeat for the desired number of repetitions."]},"overhead-cable-ext":{"n":"cable overhead triceps extension (rope attachment)","m":"2IxROQ1","i":"0194","t":"triceps","s":["shoulders"],"steps":["Attach a rope to a cable machine at a high position.","Stand facing away from the machine with your feet shoulder-width apart.","Grasp the rope with both hands, palms facing each other, and bring your hands above your head.","Keep your upper arms close to your head and your elbows pointing forward.","Slowly lower the rope behind your head by bending your elbows.","Pause for a moment, then extend your arms back up to the starting position.","Repeat for the desired number of repetitions."]},"skullcrusher":{"n":"barbell lying triceps extension skull crusher","m":"h8LFzo9","i":"0060","t":"triceps","s":["shoulders"],"steps":["Lie flat on a bench with your feet flat on the ground and your head at the end of the bench.","Hold the barbell with an overhand grip, hands shoulder-width apart, and extend your arms straight up over your chest.","Keeping your upper arms stationary, slowly lower the barbell towards your forehead by bending your elbows.","Pause for a moment when the barbell is just above your forehead, then extend your arms back up to the starting position.","Repeat for the desired number of repetitions."]},"back-squat":{"n":"barbell full squat","m":"qXTaZnJ","i":"0043","t":"glutes","s":["quadriceps","hamstrings","calves","core"],"steps":["Stand with your feet shoulder-width apart, toes slightly turned out.","Hold the barbell across your upper back, resting it on your traps or rear delts.","Engage your core and keep your chest up as you begin to lower your body down.","Bend at the knees and hips, pushing your hips back and down as if sitting into a chair.","Lower yourself until your thighs are parallel to the ground or slightly below.","Keep your knees in line with your toes and your weight in your heels.","Drive through your heels to stand back up, extending your hips and knees.","Repeat for the desired number of repetitions."]},"front-squat":{"n":"barbell front squat","m":"zG0zs85","i":"0042","t":"glutes","s":["quadriceps","hamstrings","calves","core"],"steps":["Start by standing with your feet shoulder-width apart, toes slightly turned out.","Hold the barbell in front of your shoulders, resting it on your collarbone and shoulders.","Engage your core and keep your chest up as you lower your body down into a squat position, pushing your hips back and bending your knees.","Lower until your thighs are parallel to the ground, or as low as you can comfortably go.","Pause for a moment at the bottom, then push through your heels to return to the starting position.","Repeat for the desired number of repetitions."]},"hack-squat":{"n":"sled hack squat","m":"Qa55kX1","i":"0743","t":"glutes","s":["quadriceps","hamstrings","calves"],"steps":["Adjust the sled machine to a comfortable position for your height.","Stand with your feet shoulder-width apart on the platform, toes slightly pointed outwards.","Hold onto the handles or bars for stability.","Lower your body by bending your knees and hips, keeping your back straight and chest up.","Continue lowering until your thighs are parallel to the ground or slightly below.","Pause for a moment, then push through your heels to raise your body back up to the starting position.","Repeat for the desired number of repetitions."]},"leg-press":{"n":"sled 45в° leg press","m":"10Z2DXU","i":"0739","t":"glutes","s":["quadriceps","hamstrings","calves"],"steps":["Adjust the seat and footplate of the sled machine to a comfortable position.","Sit on the sled machine with your back against the backrest and your feet shoulder-width apart on the footplate.","Grip the handles on the sides of the seat for stability.","Push the footplate away from your body by extending your legs, keeping your heels on the footplate.","Continue pushing until your legs are almost fully extended, but without locking your knees.","Pause for a moment at the top of the movement, then slowly lower the footplate back towards your body by bending your knees.","Repeat for the desired number of repetitions."]},"bulgarian-split-squat":{"n":"dumbbell single leg split squat","m":"qx4fgX7","i":"0410","t":"quads","s":["glutes","hamstrings","calves"],"steps":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand.","Take a step forward with one foot and position your feet so that your front foot is flat on the ground and your back foot is elevated on a bench or step.","Lower your body by bending your front knee and hip, keeping your back knee slightly bent and your back heel off the ground.","Continue lowering until your front thigh is parallel to the ground, then push through your front heel to return to the starting position.","Repeat for the desired number of repetitions, then switch legs and repeat."]},"walking-lunge":{"n":"walking lunge","m":"IZVHb27","i":"1460","t":"glutes","s":["quadriceps","hamstrings","calves"],"steps":["Stand with your feet shoulder-width apart.","Take a step forward with your right leg, lowering your body into a lunge position.","Keep your torso upright and your front knee aligned with your ankle.","Push off with your right foot and bring your left foot forward, stepping into a lunge position with your left leg.","Continue alternating legs and walking forward, maintaining a controlled and steady pace.","Repeat for the desired number of repetitions."]},"leg-extension":{"n":"lever leg extension","m":"my33uHU","i":"0585","t":"quads","s":["hamstrings"],"steps":["Adjust the seat height and backrest of the machine to fit your body.","Sit on the machine with your back against the backrest and your feet on the footpad.","Grasp the handles or sidebars for stability.","Extend your legs forward by straightening your knees, lifting the weight.","Pause for a moment at the top, then slowly lower the weight back to the starting position.","Repeat for the desired number of repetitions."]},"romanian-deadlift":{"n":"barbell romanian deadlift","m":"wQ2c4XD","i":"0085","t":"glutes","s":["hamstrings","lower back"],"steps":["Stand with your feet shoulder-width apart and your toes pointing forward.","Hold the barbell with an overhand grip, hands slightly wider than shoulder-width apart.","Bend at the hips, keeping your back straight and your knees slightly bent.","Lower the barbell towards the ground, keeping it close to your body.","Feel the stretch in your hamstrings as you lower the barbell.","Once you feel a stretch in your hamstrings, push your hips forward and stand up straight.","Squeeze your glutes at the top of the movement.","Lower the barbell back down to the starting position and repeat for the desired number of repetitions."]},"deadlift":{"n":"barbell deadlift","m":"ila4NZS","i":"0032","t":"glutes","s":["hamstrings","lower back"],"steps":["Stand with your feet shoulder-width apart and the barbell on the ground in front of you.","Bend your knees and hinge at the hips to lower your torso and grip the barbell with an overhand grip, hands slightly wider than shoulder-width apart.","Keep your back straight and chest lifted as you drive through your heels to lift the barbell off the ground, extending your hips and knees.","As you stand up straight, squeeze your glutes and keep your core engaged.","Lower the barbell back down to the ground by bending at the hips and knees, keeping your back straight.","Repeat for the desired number of repetitions."]},"lying-leg-curl":{"n":"lever lying leg curl","m":"17lJ1kr","i":"0586","t":"hamstrings","s":["calves"],"steps":["Adjust the machine to fit your body and select the desired weight.","Lie face down on the machine with your legs straight and your heels against the padded lever.","Grasp the handles or the sides of the machine for stability.","Keeping your upper body stationary, exhale and curl your legs up as far as possible without lifting your hips off the pad.","Hold the contracted position for a brief pause as you squeeze your hamstrings.","Inhale and slowly lower the lever back to the starting position.","Repeat for the desired number of repetitions."]},"seated-leg-curl":{"n":"lever seated leg curl","m":"Zg3XY7P","i":"0599","t":"hamstrings","s":["calves"],"steps":["Adjust the machine to fit your body and sit on it with your back against the backrest.","Place your lower legs under the padded lever, just above your ankles.","Grasp the handles on the sides of the machine for support.","Keeping your upper legs stationary, exhale and curl your legs up as far as possible.","Hold the contracted position for a brief pause as you squeeze your hamstrings.","Inhale and slowly lower the lever back to the starting position.","Repeat for the desired number of repetitions."]},"hip-thrust":{"n":"barbell glute bridge","m":"qKBpF7I","i":"1409","t":"glutes","s":["hamstrings","lower back"],"steps":["Start by lying flat on your back on the ground with your knees bent and feet flat on the floor.","Place a barbell across your hips, holding it securely with both hands.","Engage your glutes and core muscles, then lift your hips off the ground until your body forms a straight line from your knees to your shoulders.","Pause for a moment at the top, squeezing your glutes.","Slowly lower your hips back down to the starting position.","Repeat for the desired number of repetitions."]},"back-extension":{"n":"hyperextension","m":"zhMwOwE","i":"0489","t":"spine","s":["glutes","hamstrings"],"steps":["Adjust the hyperextension bench so that your upper thighs are resting on the pad and your feet are secured.","Cross your arms over your chest or place your hands behind your head.","Lower your upper body towards the ground while keeping your back straight.","Pause for a moment at the bottom, then raise your upper body back up until it is in line with your legs.","Repeat for the desired number of repetitions."]},"standing-calf-raise":{"n":"lever standing calf raise","m":"ykUOVze","i":"0605","t":"calves","s":["soleus","ankle stabilizers"],"steps":["Adjust the machine to your height and stand with your feet shoulder-width apart.","Place your shoulders under the pads and hold onto the handles for stability.","Raise your heels as high as possible by extending your ankles.","Pause for a moment at the top, then slowly lower your heels back down to the starting position.","Repeat for the desired number of repetitions."]},"seated-calf-raise":{"n":"lever seated calf raise","m":"bOOdeyc","i":"0594","t":"calves","s":["soleus","ankle stabilizers"],"steps":["Adjust the seat height so that your knees are slightly bent and your feet are flat on the footplate.","Place your toes on the footplate with your heels hanging off the edge.","Grasp the handles or the sides of the seat for stability.","Push through the balls of your feet to raise your heels as high as possible.","Pause for a moment at the top, then slowly lower your heels back down to the starting position.","Repeat for the desired number of repetitions."]},"hanging-leg-raise":{"n":"hanging straight leg raise","m":"4Ml7QFO","i":"0475","t":"abs","s":["hip flexors"],"steps":["Hang from a pull-up bar with your arms fully extended and your palms facing away from you.","Engage your core and lift your legs up in front of you, keeping them straight.","Continue lifting until your legs are parallel to the ground or as high as you can comfortably go.","Pause for a moment at the top, then slowly lower your legs back down to the starting position.","Repeat for the desired number of repetitions."]},"cable-crunch":{"n":"cable kneeling crunch","m":"WW95auq","i":"0175","t":"abs","s":["obliques"],"steps":["Attach a rope handle to a high pulley and kneel down facing away from the machine.","Hold the rope handle with both hands and place it behind your head, keeping your elbows out to the sides.","Keeping your hips stationary, flex your waist and crunch your torso down towards your thighs.","Pause for a moment at the bottom, then slowly return to the starting position.","Repeat for the desired number of repetitions."]},"plank":{"n":"front plank with twist","m":"CosupLu","i":"0464","t":"abs","s":["obliques","shoulders"],"steps":["Start in a high plank position with your hands directly under your shoulders and your body in a straight line from head to toe.","Engage your core and glutes to maintain a stable position.","Rotate your torso to the right, lifting your right arm and extending it towards the ceiling.","Keep your hips and legs stable as you twist.","Hold for a moment, then return to the starting position.","Repeat the twist on the left side.","Continue alternating sides for the desired number of repetitions."]},"assisted-dip":{"n":"assisted chest dip (kneeling)","m":"PAgTVaK","i":"0009","t":"pectorals","s":["triceps","shoulders"],"steps":["Adjust the machine to your desired height and secure your knees on the pad.","Grasp the handles with your palms facing down and your arms fully extended.","Lower your body by bending your elbows until your upper arms are parallel to the floor.","Pause for a moment, then push yourself back up to the starting position.","Repeat for the desired number of repetitions."]},"db-supinated-curl":{"n":"dumbbell biceps curl","m":"NbVPDMW","i":"0294","t":"biceps","s":["forearms"],"steps":["Stand up straight with a dumbbell in each hand, palms facing forward and arms fully extended.","Keeping your upper arms stationary, exhale and curl the weights while contracting your biceps.","Continue to raise the weights until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},"crunch":{"n":"crunch floor","m":"TFqbd8t","i":"0274","t":"abs","s":["hip flexors"],"steps":["Lie flat on your back with your knees bent and feet flat on the ground.","Place your hands behind your head with your elbows pointing outwards.","Engage your abs and lift your shoulders off the ground, curling forward towards your knees.","Pause for a moment at the top, then slowly lower your shoulders back down to the starting position.","Repeat for the desired number of repetitions."]},"bicycle-crunch":{"n":"air bike","m":"1ZFqTDN","i":"0003","t":"abs","s":["hip flexors"],"steps":["Lie flat on your back with your hands placed behind your head.","Lift your legs off the ground and bend your knees at a 90-degree angle.","Bring your right elbow towards your left knee while simultaneously straightening your right leg.","Return to the starting position and repeat the movement on the opposite side, bringing your left elbow towards your right knee while straightening your left leg.","Continue alternating sides in a pedaling motion for the desired number of repetitions."]},"reverse-grip-pulldown":{"n":"cable underhand pulldown","m":"xBYcQHj","i":"0245","t":"lats","s":["biceps","forearms"],"steps":["Adjust the cable machine so that the pulldown bar is at a height above your head.","Sit down on the seat and grab the pulldown bar with an underhand grip, hands slightly wider than shoulder-width apart.","Keep your back straight and lean back slightly.","Pull the bar down towards your chest, squeezing your shoulder blades together.","Pause for a moment at the bottom of the movement, then slowly release the bar back up to the starting position.","Repeat for the desired number of repetitions."]},"neutral-grip-pulldown":{"n":"cable lateral pulldown with v-bar","m":"4c9BhzB","i":"2616","t":"lats","s":["biceps","forearms"],"steps":["Sit down on the cable pulldown machine and grab the v-bar attachment with an overhand grip.","Adjust the knee pad so that your thighs are secured under it.","Keep your back straight and lean back slightly.","Pull the v-bar down towards your upper chest while keeping your elbows close to your body.","Squeeze your back muscles at the bottom of the movement.","Slowly return the v-bar to the starting position and repeat for the desired number of repetitions."]},"single-arm-pulldown":{"n":"cable one arm pulldown","m":"U5INZY6","i":"3563","t":"lats","s":["biceps","forearms"],"steps":["Attach a single handle to a high pulley cable machine.","Stand facing the machine with your feet shoulder-width apart.","Grasp the handle with an overhand grip and extend your arm fully.","Keep your back straight and your core engaged.","Pull the handle down towards your side while keeping your elbow close to your body.","Pause for a moment at the bottom of the movement, squeezing your lat muscle.","Slowly release the handle back to the starting position.","Repeat for the desired number of repetitions.","Switch sides and repeat the exercise with the other arm."]},"single-arm-rope-ext":{"n":"cable standing one arm triceps extension","m":"sYCcnon","i":"0231","t":"triceps","s":["shoulders"],"steps":["Stand with your feet shoulder-width apart, facing the cable machine.","Hold the cable handle with your right hand, palm facing down, and position your arm so that it is fully extended and parallel to the ground.","Keep your elbow stationary and close to your body.","Slowly bend your elbow, lowering the cable handle towards the back of your head.","Pause for a moment at the bottom of the movement, then extend your arm back to the starting position.","Repeat for the desired number of repetitions, then switch sides and perform the exercise with your left arm."]}}</script>

 {"name":"Modified Strength Base","days":[

<script>
"use strict";
const BOOK = JSON.parse(document.getElementById("data-book").textContent);
const LIB  = JSON.parse(document.getElementById("data-lib").textContent);
const FUND = JSON.parse(document.getElementById("data-fund").textContent);
const BASE_EX = Object.fromEntries(LIB.exercises.concat(FUND.newExercises).map(e => [e.id, e]));
let EX = { ...BASE_EX };
const SPLITS = BOOK.training.splits.map((s, i) => ({ ...s, id: "s" + i }));
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clampInt = (v, lo, hi, dflt) => { const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : dflt; };
const str = (v, max) => typeof v === "string" ? v.slice(0, max) : "";
const numOrStr = v => typeof v === "string" ? v.slice(0, 10) : (typeof v === "number" && Number.isFinite(v) ? String(v) : "");

/* ---------------- state ----------------
   The saved blob is versioned. Anything written by an older build is upgraded on
   load, and keys a newer build added are carried through untouched, so a file
   always opens in whichever version you happen to be running. */
const KEY = "recomp.v1";
const SCHEMA_VERSION = 2;
const DEFAULTS = {
  schema: SCHEMA_VERSION,
  name: "Rahul", splitId: "fundamentals", queueIndex: 0, units: "kg", theme: "auto",
  program: null, customExercises: [], logs: [], session: null,
  dayStamp: null, startWeek: null, rest: null, sound: true
};
let S = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    const p = raw ? JSON.parse(raw) : null;
    const s = { ...DEFAULTS, ...(p && typeof p === "object" ? p : {}) };
    if (s.splitId !== "fundamentals" && !SPLITS.some(x => x.id === s.splitId)) s.splitId = DEFAULTS.splitId;
    if (!Array.isArray(s.logs)) s.logs = [];
    if (!Array.isArray(s.customExercises)) s.customExercises = [];
    if (typeof s.queueIndex !== "number" || s.queueIndex < 0) s.queueIndex = 0;
    if (s.program && !validProgram(s.program)) s.program = null;
    return migrate(s);
  } catch (e) { return migrate({ ...DEFAULTS }); }
}

/* v1 knew only a single `weight` per set, which was the total on the bar. v2 also
   keeps `entry` — what you actually loaded per side or per bell — plus the bar
   weights it is added to. Older blobs simply arrive without them. */
function migrate(s) {
  const v = Number(s.schema) || 1;
  if (!s.bars || typeof s.bars !== "object") s.bars = {};
  if (!s.bars.kg || typeof s.bars.kg !== "object") s.bars.kg = {};
  if (!s.bars.lb || typeof s.bars.lb !== "object") s.bars.lb = {};
  if (typeof s.sound !== "boolean") s.sound = true;
  if (v < 2 && s.session && Array.isArray(s.session.exercises)) {
    s.session.exercises.forEach(e => (e.sets || []).forEach(st => {
      if (st && typeof st === "object" && st.entry == null) st.entry = "";
    }));
  }
  s.schema = SCHEMA_VERSION;
  return s;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* custom movements from an imported file are merged over the built-in library */
function refreshEx() {
  EX = { ...BASE_EX };
  S.customExercises.forEach(c => { if (c && c.id) EX[c.id] = c; });
}
refreshEx();


/* ---------------- loading maths ----------------
   You type what you actually loaded and the equipment supplies the rest:
     total = base + factor × entry
   `base` and `factor` are the whole of the arithmetic. `mode` only decides how
   the box is worded, which is why it is read in exactly one place, loadCopy().
     bar     plates on one side, doubled, on top of the bar
     dbPair  one bell, doubled, because both hands are working
     dbOne   one bell, single-arm
     stack   the pin, as the machine reads it
     body    added weight only — an empty box means bodyweight and settles at 0 */
const BAR_KINDS = ["olympic", "ez", "smith", "fixed"];
const BAR_LABEL = { olympic: "Olympic bar", ez: "EZ bar", smith: "Smith machine", fixed: "Fixed bar" };
const BAR_DEFAULTS = {
  kg: { olympic: 20, ez: 10, smith: 15, fixed: 15 },
  lb: { olympic: 45, ez: 25, smith: 35, fixed: 35 }
};
const LOAD_MODES = ["bar", "dbPair", "dbOne", "stack", "body"];

/* built-in movements whose loading does not follow from their `equipment` field */
const LOAD_OVERRIDE = {
  "skullcrusher": { mode: "bar", bar: "ez" },
  "barbell-curl": { mode: "bar", bar: "ez" },
  "one-arm-db-row": { mode: "dbOne" }
};
/* last resort for an imported movement that declared no `load` of its own */
const ONE_SIDED = /\b(one[-\s]?arm|single[-\s]?arm|1[-\s]?arm|one[-\s]?hand|goblet|landmine)\b/i;

const unitKey = () => (S.units === "lb" ? "lb" : "kg");
const round1 = n => Math.round(n * 10) / 10;
function barWeight(kind) {
  const u = unitKey();
  const v = Number(((S.bars || {})[u] || {})[kind]);
  return Number.isFinite(v) && v >= 0 ? v : BAR_DEFAULTS[u][kind];
}

function loadPlan(exerciseId) {
  const e = EX[exerciseId] || {};
  /* an imported definition wins, since it was written for this exact movement */
  const o = (e.load && typeof e.load === "object" ? e.load : null) || LOAD_OVERRIDE[exerciseId] || {};
  const eq = String(e.equipment || "").toLowerCase();
  let mode = LOAD_MODES.includes(o.mode) ? o.mode : null;
  if (!mode) {
    if (eq === "barbell") mode = "bar";
    else if (eq === "dumbbell") mode = ONE_SIDED.test(e.name || exerciseId) ? "dbOne" : "dbPair";
    else if (eq === "bodyweight") mode = "body";
    else mode = "stack";
  }
  const bar = mode === "bar" ? (BAR_KINDS.includes(o.bar) ? o.bar : "olympic") : null;
  return { mode, bar, base: bar ? barWeight(bar) : 0, factor: mode === "bar" || mode === "dbPair" ? 2 : 1 };
}

/* entry → total. null means nothing usable was typed. */
const totalFor = (plan, entry) => {
  const v = parseFloat(entry);
  return Number.isFinite(v) ? round1(plan.base + plan.factor * v) : null;
};
/* total → entry, so history written before this existed still pre-fills sanely */
const entryFromTotal = (plan, total) => {
  const v = parseFloat(total);
  return Number.isFinite(v) ? String(Math.max(0, round1((v - plan.base) / plan.factor))) : "";
};
/* what to pre-fill from last time. Bodyweight work never inherits: there, blank is an answer. */
const refEntry = (plan, ref) =>
  (!ref || plan.mode === "body") ? "" : ref.entry ? String(ref.entry) : entryFromTotal(plan, ref.weight);

/* the box asks for something other than the total, so both need saying */
const derived = plan => plan.factor !== 1 || plan.base !== 0;
/* what sits above the weight box; on its own it has to explain the whole model */
function entryLabel(plan) {
  const u = S.units;
  if (plan.mode === "bar") return u + "/side";
  if (plan.mode === "dbPair") return u + " each";
  if (plan.mode === "body") return "+" + u;
  return u;
}
/* the total, under the box it comes from. Never the arithmetic that got there. */
const showsCalc = plan => derived(plan) || plan.mode === "body";
function calcLine(plan, entry) {
  const v = parseFloat(entry);
  if (!Number.isFinite(v)) return plan.mode === "body" ? "bodyweight" : "";
  const t = totalFor(plan, entry);
  return plan.mode === "body" ? (v ? `<b>+${t}${S.units}</b>` : "bodyweight") : `= <b>${t}${S.units}</b>`;
}
/* a logged set quotes the weight that went in the book, not one recomputed from the box */
function loggedLine(plan, st) {
  const w = parseFloat(st.weight);
  if (!Number.isFinite(w)) return "";
  if (plan.mode === "body") return w ? `<b>+${round1(w)}${S.units}</b>` : "bodyweight";
  return `= <b>${round1(w)}${S.units}</b>`;
}
/* how a stored set reads back. 0 is bodyweight; blank is a load nobody wrote down. */
function setText(s, withUnit = true) {
  const w = parseFloat(s.weight);
  if (!Number.isFinite(w)) return `—×${s.reps}`;
  if (w === 0) return `bw×${s.reps}`;
  return `${round1(w)}${withUnit ? S.units : ""}×${s.reps}`;
}
/* last time's sets in the same terms the box will ask for, so nothing needs converting */
function prevLine(plan, sets) {
  const reps = sets.map(s => s.reps || "—").join(", ");
  const w = sets.map(s => s.weight);
  if (!w.every(v => v === w[0])) return sets.map(s => setText(s)).join("   ·   ");
  const n = parseFloat(w[0]);
  if (!Number.isFinite(n)) return reps + " reps";
  if (n === 0) return "bodyweight · " + reps;
  return `${round1(n)}${S.units}${derived(plan) ? " total" : ""} · ${reps}`;
}


/* ---------------- theme ---------------- */
function applyTheme() {
  const t = S.theme === "auto"
    ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
    : S.theme;
  document.documentElement.dataset.theme = t;
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
applyTheme();

/* ---------------- programme ---------------- */
const split = () => SPLITS.find(s => s.id === S.splitId) || SPLITS[0];
const isRest = f => /rest/i.test(f || "");
const scaleFor = sp => LIB.splitScale.byDaysPerWeek[String(sp.training_days)] ?? LIB.splitScale.default;

function validProgram(p) {
  return !!p && typeof p === "object" && Array.isArray(p.days) && p.days.length > 0 &&
    p.days.every(d => d && typeof d.focus === "string" && Array.isArray(d.exercises) &&
      d.exercises.every(x => x && typeof x.exerciseId === "string"));
}
function programFromSplit(sp) {
  const k = scaleFor(sp);
  return {
    name: sp.name, source: "book",
    days: sp.days.map(d => ({
      focus: d.focus,
      exercises: isRest(d.focus) ? [] : (LIB.templates[d.focus] || []).map(t => ({
        exerciseId: t.exercise,
        sets: Math.max(2, Math.round(t.sets * k)),
        repMin: t.repMin, repMax: t.repMax
      }))
    }))
  };
}
const customProgram = () => S.program && validProgram(S.program);

/* the eight weeks are flattened into one 56-day cycle, so an imported file and a
   built-in programme are exactly the same shape */
function fundamentalsProgram() {
  const days = [];
  FUND.blocks.forEach(block => {
    for (let w = 0; w < FUND.weeksPerBlock; w++) {
      let d = 0;
      FUND.schedule.forEach(slot => {
        if (slot === "rest") { days.push({ focus: "Rest", block: block.name, exercises: [] }); return; }
        const day = block.days[d++];
        days.push({
          focus: day.label,
          block: block.name,
          week: FUND.blocks.indexOf(block) * FUND.weeksPerBlock + w + 1,
          exercises: day.ex.map(([id, sets, reps, rpe, rest, note]) => ({
            exerciseId: id, sets, repMin: reps, repMax: reps, rpe, rest, note
          }))
        });
      });
    }
  });
  return { name: FUND.name, source: FUND.source, days };
}
const activeProgram = () =>
  customProgram() ? S.program
  : S.splitId === "fundamentals" ? fundamentalsProgram()
  : programFromSplit(split());
const dayAt = i => { const d = activeProgram().days; return d[((i % d.length) + d.length) % d.length]; };
const focusAt = i => dayAt(i).focus;
const cycleLen = () => activeProgram().days.length;
const totalSets = p => p.reduce((a, x) => a + (x.sets || 0), 0);
const estMins = p => Math.round(totalSets(p) * 3 + 6);
const exName = id => (EX[id] || {}).name || id;
const repLabel = x => (x.repMin && x.repMin === x.repMax ? String(x.repMin) : `${x.repMin || 8}-${x.repMax || 12}`);

/* ---------------- history ---------------- */
const nWeight = s => parseFloat(s.weight) || 0;
const nReps = s => parseInt(s.reps, 10) || 0;

/* one entry per past session that contained this movement, oldest first */
function exHistory(exerciseId) {
  const out = [];
  S.logs.forEach(l => {
    const e = (l.entries || []).find(x => x.exerciseId === exerciseId);
    if (!e) return;
    const sets = (e.sets || []).filter(s => nWeight(s) > 0 || nReps(s) > 0);
    if (!sets.length) return;
    let top = 0, topReps = 0, best = 0, vol = 0, topSet = null;
    sets.forEach(s => {
      const w = nWeight(s), r = nReps(s);
      vol += w * r;
      const e1 = w ? w * (1 + r / 30) : r;
      if (e1 >= best) { best = e1; top = w; topReps = r; topSet = s; }
    });
    out.push({ date: l.date, top, topReps, topSet, vol, sets });
  });
  return out;
}
const lastPerf = id => { const h = exHistory(id); return h.length ? h[h.length - 1] : null; };

/* whole calendar days apart, so 18:00 yesterday reads as "yesterday" all morning */
function calDays(iso) {
  const a = new Date(iso), b = new Date();
  const d0 = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const d1 = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((d1 - d0) / 864e5);
}
function daysAgo(iso) {
  const d = calDays(iso);
  if (d <= 0) return "today";
  if (d === 1) return "yesterday";
  if (d < 28) return d + " days ago";
  return new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short" });
}

/* ---------------- the day counter ---------------- */
const dayKey = d => {
  const x = d ? new Date(d) : new Date();
  return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
};
const nextKey = k => { const [y, m, d] = k.split("-").map(Number); return dayKey(new Date(y, m - 1, d + 1)); };
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
/* Monday is slot 0, which puts the three training days on Mon / Wed / Fri */
const weekdaySlot = d => (((d || new Date()).getDay() + 6) % 7);
const mondayOf = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - weekdaySlot(x)); return x; };
const lastLog = () => (S.logs.length ? S.logs[S.logs.length - 1] : null);
const loggedOn = key => S.logs.some(l => dayKey(l.date) === key);
const doneToday = () => loggedOn(dayKey());
const tomorrowIndex = () => S.queueIndex + 1;

/* The programme week advances every Monday; the weekday picks the session.
   Cycles that are not a whole number of weeks just step one slot per day. */
function rollDays() {
  const today = new Date();
  if (cycleLen() % 7 !== 0) {
    const stamp = S.dayStamp || dayKey(today);
    let guard = 0;
    while (stamp !== dayKey(today) && guard++ < 400) {
      S.queueIndex++;
      S.dayStamp = nextKey(S.dayStamp || stamp);
      if (S.dayStamp === dayKey(today)) break;
    }
    S.dayStamp = dayKey(today); save(); return;
  }
  if (!S.startWeek) S.startWeek = dayKey(mondayOf(today));
  const weeks = Math.max(0, Math.round((mondayOf(today) - parseKey(S.startWeek)) / 6048e5));
  S.queueIndex = (weeks * 7 + weekdaySlot(today)) % cycleLen();
  S.dayStamp = dayKey(today);
  save();
}

/* ---------------- session ---------------- */
function startSession(dayIndex) {
  const day = dayAt(dayIndex);
  S.queueIndex = dayIndex;
  S.session = {
    focus: day.focus,
    dayIndex,
    started: Date.now(),
    exercises: day.exercises.map(p => ({
      exerciseId: p.exerciseId, repMin: p.repMin || 8, repMax: p.repMax || 12, note: p.note || "",
      rpe: p.rpe || null, rest: p.rest || null,
      sets: Array.from({ length: clampInt(p.sets, 1, 12, 3) }, () => ({ weight: "", reps: "", entry: "", done: false }))
    }))
  };
  save(); openIdx = 0; render();
}
function cursor() {
  const s = S.session; if (!s) return null;
  for (let i = 0; i < s.exercises.length; i++) {
    const k = s.exercises[i].sets.findIndex(x => !x.done);
    if (k > -1) return { ex: i, set: k };
  }
  return null;
}
/* while a card is expanded the puck acts on that card, not the global cursor */
function activeTarget() {
  const s = S.session; if (!s) return null;
  if (openIdx != null && s.exercises[openIdx]) {
    const k = s.exercises[openIdx].sets.findIndex(x => !x.done);
    return k > -1 ? { ex: openIdx, set: k } : null;
  }
  return cursor();
}
function readField(i, k, kind) {
  const n = document.getElementById(`${kind}-${i}-${k}`);
  return n ? n.value.trim() : null;
}
function logSet(i, k) {
  const ex = S.session.exercises[i], st = ex.sets[k];
  const plan = loadPlan(ex.exerciseId);
  const w = readField(i, k, "w"), r = readField(i, k, "r");
  if (w != null) st.entry = w;
  if (r != null) st.reps = r;
  const lp = lastPerf(ex.exerciseId);
  const ref = lp && lp.sets[Math.min(k, lp.sets.length - 1)];
  if (!st.reps) st.reps = ref ? ref.reps : String(ex.repMax);
  if (!st.entry) st.entry = refEntry(plan, ref);
  /* only bodyweight work reads a blank box as zero; elsewhere it is a load nobody wrote down */
  const total = totalFor(plan, st.entry);
  st.weight = total != null ? String(total) : plan.mode === "body" ? "0" : "";
  st.done = true;
  save();
  if (!ex.sets.some(x => !x.done)) {
    stopRest();
    const nx = nextUnfinished(i);
    if (nx != null) return jumpCard(nx);
    return render();
  }
  startRest(ex);
  render();
}

/* ---------------- rest ----------------
   The programme already prescribes rest per exercise, so the timer needs no
   settings: it reads the low end of the window and runs inside the puck. */
let restId = null;
const restSeconds = ex => {
  const m = /(\d+)/.exec(ex && ex.rest || "");
  return m ? Math.max(30, parseInt(m[1], 10) * 60) : 0;
};
const restLeft = () => (S.rest ? Math.max(0, Math.round((S.rest.endsAt - Date.now()) / 1000)) : 0);

/* ---- bell ----
   Synthesised rather than shipped as a file so the page stays one offline
   document. Mobile browsers only allow audio from a gesture, so the context is
   opened on the tap that starts the rest and kept warm from then on. */
let audioCtx = null;
function primeAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  } catch (e) { return null; }
}
/* inharmonic partials over a long exponential tail — a struck bell, not a beep */
function strike(ac, at, gain) {
  const out = ac.createGain();
  out.gain.value = gain;
  out.connect(ac.destination);
  [[1, .5, 2.8], [2.01, .3, 2.1], [2.99, .17, 1.4], [4.21, .1, .85], [5.43, .055, .5]]
    .forEach(([ratio, amp, decay]) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine";
      o.frequency.value = 587.33 * ratio;
      g.gain.setValueAtTime(.0001, at);
      g.gain.exponentialRampToValueAtTime(amp, at + .008);
      g.gain.exponentialRampToValueAtTime(.0001, at + decay);
      o.connect(g); g.connect(out);
      o.start(at); o.stop(at + decay + .05);
    });
}
function bell() {
  if (S.sound === false) return;
  const ac = primeAudio();
  if (!ac) return;
  const t0 = ac.currentTime + .03;
  strike(ac, t0, .55);
  strike(ac, t0 + .58, .38);
}

function startRest(ex) {
  const dur = restSeconds(ex);
  if (!dur) return;
  primeAudio();
  S.rest = { dur, endsAt: Date.now() + dur * 1000 };
  save(); runRest();
}
function stopRest() {
  clearInterval(restId); restId = null;
  if (S.rest) { S.rest = null; save(); }
}
function runRest() {
  clearInterval(restId);
  restId = setInterval(() => {
    if (!S.rest || !S.session) return stopRest();
    if (restLeft() <= 0) {
      stopRest();
      bell();
      try { if (navigator.vibrate) navigator.vibrate([70, 60, 70]); } catch (e) {}
      paintDock();
      return;
    }
    paintDock();
  }, 500);
}
function nextUnfinished(from) {
  const s = S.session; if (!s) return null;
  for (let n = 1; n <= s.exercises.length; n++) {
    const i = (from + n) % s.exercises.length;
    if (s.exercises[i].sets.some(x => !x.done)) return i;
  }
  return null;
}
function finishSession() {
  const s = S.session; if (!s) return;
  const entries = s.exercises
    .map(e => ({
      exerciseId: e.exerciseId,
      sets: e.sets.filter(x => x.done).map(x => ({ weight: x.weight, reps: x.reps, ...(x.entry ? { entry: x.entry } : {}) }))
    }))
    .filter(e => e.sets.length);
  const planned = s.exercises.reduce((a, e) => a + e.sets.length, 0);
  const logged = entries.reduce((a, e) => a + e.sets.length, 0);
  if (entries.length) {
    S.logs.push({
      id: Date.now(), date: new Date().toISOString(), focus: s.focus,
      durationMin: Math.max(1, Math.round((Date.now() - s.started) / 60000)),
      partial: logged < planned, entries
    });
    if (S.logs.length > 400) S.logs = S.logs.slice(-400);
  }
  S.session = null;
  S.dayStamp = dayKey();
  openIdx = null; stopRest(); save();
  const hero = $(".hero");
  if (hero) { hero.classList.add("sinking"); setTimeout(render, 380); } else render();
}
function discardSession() {
  S.session = null; openIdx = null; stopRest(); save(); render();
}


/* ---------------- render: today ---------------- */
const shortDate = () => new Date().toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
const cardList = () => (S.session ? S.session.exercises : dayAt(S.queueIndex).exercises);

function render() {
  const scr = $("#screen");

    scr.appendChild(expandedCard(openIdx, list));

      <div class="meta"><span class="chip">${done} of ${tot} sets</span><span class="chip">${Math.round(done / tot * 100)}%</span><span class="chip">${mins} min</span></div>`;
  }

  const c = cursor();

  list.forEach((x, i) => wrap.appendChild(exCard(x, i, !!sess, !!c && c.ex === i)));

}

function dayClosed(scr, mode) {

        ${log.durationMin ? `<span class="chip">${log.durationMin} min</span>` : ""}
        ${vol ? `<span class="chip">${vol.toLocaleString()} ${esc(S.units)}</span>` : ""}
        ${log.partial ? '<span class="chip">ended early</span>' : ""}

    scr.appendChild(Object.assign(el("div", "badge"), { textContent: "Done for today" }));

      const r = el("div", "sumrow");

      r.appendChild(el("span", null, e.sets.map(s => setText(s, false)).join("  ")));
      scr.appendChild(r);
    });
  } else {
    h.innerHTML = `<div class="kicker">${esc(shortDate())} · Recovery</div><h1>Rest day</h1>
      <div class="meta"><span class="chip">${esc(activeProgram().name)}</span><span class="chip">day ${(S.queueIndex % cycleLen()) + 1} of ${cycleLen()}</span></div>`;
    scr.appendChild(h);
    scr.appendChild(Object.assign(el("p", "note"), {
      textContent: "Recovery is part of the programme — the book treats it as seriously as the session itself."
    }));

    if (log) {
      const y = el("div", "nextcard");
      y.appendChild(Object.assign(el("span", "tk"), { textContent: "Last session · " + daysAgo(log.date) }));
      y.appendChild(Object.assign(el("b"), { textContent: log.focus }));
      const sets = log.entries.reduce((a, e) => a + e.sets.length, 0);
      y.appendChild(Object.assign(el("span"), {
        textContent: `${sets} set${sets === 1 ? "" : "s"}${log.durationMin ? " in " + log.durationMin + " min" : ""}`
      }));
      scr.appendChild(y);
    }
  }

  const ti = tomorrowIndex();
  const tf = focusAt(ti);
  const n = el("div", "nextcard");
  n.appendChild(Object.assign(el("span", "tk"), { textContent: "Tomorrow" }));
  n.appendChild(Object.assign(el("b"), { textContent: isRest(tf) ? "Rest day" : tf }));
  n.appendChild(Object.assign(el("span"), {
    textContent: isRest(tf)
      ? "then " + focusAt(ti + 1)
      : `${dayAt(ti).exercises.length} movements · ${totalSets(dayAt(ti).exercises)} sets · about ${estMins(dayAt(ti).exercises)} min`
  }));
  scr.appendChild(n);
}

const nextTrainIndex = () => { let i = S.queueIndex; for (let n = 0; n < 21; n++, i++) if (!isRest(focusAt(i))) return i; return S.queueIndex; };
const nextTrain = () => focusAt(nextTrainIndex());
const peek = k => { let i = S.queueIndex + 1, seen = 0; for (let n = 0; n < 30; n++, i++) { if (!isRest(focusAt(i))) { seen++; if (seen === k) return focusAt(i); } } return "—"; };

/* ---------------- last time + trend ---------------- */
function sparkNode(vals) {
  const W = 320, H = 52, pad = 7;
  const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const n = vals.length;
  const px = i => (n === 1 ? W / 2 : (i / (n - 1)) * W);
  const py = v => H - pad - ((v - min) / span) * (H - pad * 2);
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("class", "spark");
  const pts = vals.map((v, i) => [px(i), py(v)]);
  const last = pts[pts.length - 1];
  let g = "";
  if (n > 1) {
    const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(2) + " " + p[1].toFixed(2)).join(" ");
    g += `<path d="${line} L${W} ${H} L0 ${H} Z" fill="var(--accent)" opacity=".12"/>`;
    g += `<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  }
  g += `<circle cx="${last[0].toFixed(2)}" cy="${last[1].toFixed(2)}" r="3" fill="var(--bg)" stroke="var(--accent)" stroke-width="5" vector-effect="non-scaling-stroke"/>`;
  svg.innerHTML = g;
  return svg;
}

function trendNode(exerciseId) {
  const box = el("div", "trend");
  const h = exHistory(exerciseId);
  if (!h.length) {
    box.appendChild(Object.assign(el("span", "tk"), { textContent: "First time" }));
    box.appendChild(Object.assign(el("div", "td"), { textContent: "No history for this movement yet — today's numbers become the baseline." }));
    return box;
  }
  const recent = h.slice(-14);
  const byWeight = h.some(p => p.top > 0);
  const val = p => (byWeight ? p.top : p.topReps);
  const last = h[h.length - 1];
  const prev = h.length > 1 ? h[h.length - 2] : null;
  const diff = prev ? val(last) - val(prev) : 0;
  const plan = loadPlan(exerciseId);
  const topEntry = refEntry(plan, last.topSet);

  const th = el("div", "th");
  const lcol = el("div");
  lcol.appendChild(Object.assign(el("span", "tk"), { textContent: "Last time · " + daysAgo(last.date) }));
  lcol.appendChild(Object.assign(el("span", "tv"), {
    textContent: !byWeight ? `${last.topReps} reps`
      : derived(plan) && topEntry ? `${topEntry}${entryLabel(plan)} × ${last.topReps}`
      : `${last.top}${S.units} × ${last.topReps}`
  }));
  th.appendChild(lcol);
  if (prev) {
    const d = el("span", "delta" + (diff > 0 ? " up" : diff < 0 ? " down" : ""));
    d.textContent = (diff > 0 ? "▲ +" : diff < 0 ? "▼ " : "= ") + (diff ? Math.round(diff * 10) / 10 : "same");
    th.appendChild(d);
  }
  box.appendChild(th);

  box.appendChild(Object.assign(el("div", "sets-prev"), { textContent: prevLine(plan, last.sets) }));

  if (recent.length > 1) {
    box.appendChild(sparkNode(recent.map(val)));
    const foot = el("div", "sparkfoot");
    const best = Math.max(...h.map(val));
    foot.appendChild(el("span", null, daysAgo(recent[0].date)));
    foot.appendChild(el("span", null, `best ${best}${byWeight ? S.units : " reps"} · ${h.length} sessions`));
    box.appendChild(foot);
  }
  return box;
}

/* media and step-by-step text: hasaneyldrm/exercises-dataset, GIFs © Gym Visual */
const MEDIA = JSON.parse(document.getElementById("data-media").textContent);
const CDN = "https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/";
const media = id => MEDIA[id] || null;
const gifUrl = m => CDN + "videos/" + m.i + "-" + m.m + ".gif";

/* ---------------- muscle map ---------------- */
/* the dataset names targets and secondary muscles differently, so both vocabularies map here */
const REGION = {
  pectorals: "chest", chest: "chest", "serratus anterior": "chest",
  delts: "delts", deltoids: "delts", shoulders: "delts",
  biceps: "biceps", triceps: "triceps", forearms: "forearms",
  lats: "lats",
  "upper back": "upperback", traps: "upperback", trapezius: "upperback",
  rhomboids: "upperback", "levator scapulae": "upperback",
  abs: "abs", core: "abs", obliques: "abs",
  spine: "lowerback", "lower back": "lowerback", "erector spinae": "lowerback",
  glutes: "glutes", abductors: "glutes",
  quads: "quads", quadriceps: "quads", adductors: "quads", "hip flexors": "quads",
  hamstrings: "hams",
  calves: "calves", soleus: "calves", "ankle stabilizers": "calves"
};
const REGION_LABEL = {
  chest: "Chest", delts: "Shoulders", biceps: "Biceps", triceps: "Triceps",
  lats: "Lats", upperback: "Upper back", abs: "Abs", lowerback: "Lower back",
  glutes: "Glutes", quads: "Quads", hams: "Hamstrings", calves: "Calves", forearms: "Forearms"
};

/* primary target counts full, synergists count half; a region scores once per
   exercise so movements listing several names for one area don't inflate it */
function muscleLoad(entries) {
  const out = {};
  entries.forEach(({ exerciseId, sets }) => {
    const m = media(exerciseId); if (!m || !sets) return;
    const seen = {};
    const put = (mu, w) => { const r = REGION[mu]; if (r) seen[r] = Math.max(seen[r] || 0, w); };
    put(m.t, 1);
    (m.s || []).forEach(s => put(s, 0.5));
    Object.entries(seen).forEach(([r, w]) => { out[r] = (out[r] || 0) + sets * w; });
  });
  return out;
}
const plannedLoad = day => muscleLoad(day.exercises.map(x => ({ exerciseId: x.exerciseId, sets: x.sets })));
const loggedLoad = log => muscleLoad(log.entries.map(e => ({ exerciseId: e.exerciseId, sets: e.sets.length })));
const liveLoad = sess => muscleLoad(sess.exercises.map(e => ({ exerciseId: e.exerciseId, sets: e.sets.filter(s => s.done).length })));
