 weight. (106) This rings true to anyone who has tried lifting on low sleep: even if you can move the weight, it just feels heavier."]},{"heading":"SLEEP EXTENSION","paragraphs":["Sleep extension has also been the subject of much excitement in the sports world, especially at the elite level. One such study on the elite Stanford University NCAA men’s and women’s swimming teams (125) found that when swimmers extended their sleep to 10 hours per night, their average sprint time, reaction time, turn time and kick speed all improved, with many of the swimmers setting personal, school and NCAA records throughout the study duration.","Study author Cheri Mah (81), concluded that “these results begin to elucidate the importance of sleep on athletic performance and, more importantly, how sleep is a significant factor in achieving peak performance. Athletes who get an extra amount of sleep are likely to improve their performance.”","Mah et al. 2011 (81) is another study worth taking a look at. Varsity NCAA female basketball players found that subjects improved shooting accuracy (a nine percent improvement on free throws and a 9.2 percent improvement on three-pointers) when they spent at least 10 hours per night in bed (and were encouraged to get as much sleep per night as possible). Researchers were convinced that it was far from a coincidence that The Stanford Women’s Basketball Team in this study went on to play for the NCAA Championship that year. “If people understood how much of a difference getting more sleep could make athletically, they’d incorporate it into their lives and not focus solely on nutrition and exercise,” remarked one of the researchers. It seems sleep really is a dark horse worth saddling!","By now, hopefully we have convinced you that how successful your recomp is will depend largely on how much sleep you are getting. Even if all of the relevant nutrition and training factors are perfectly in place, consistently poor sleep patterns can rob you of getting the results you deserve. The questions left unanswered is, “How much sleep is enough?” And “How little is too little?” These are the questions we will turn to next."]},{"heading":"HOW MUCH SLEEP DO WE NEED FOR BODY RECOMPOSITION?","paragraphs":["The National Sleep Foundation recommends seven to nine hours of sleep per night for young adults and adults seeking general health and well-being (58). However, based on the benefits seen in the literature in terms of performance and recovery with sleep extension and the fact that resistance training imposes a significant recovery demand, we recommend a slightly higher target of eight to nine hours of sleep per night to optimize progress. To be clear, we still believe that body recomposition is possible with lower levels of sleep. However this target range is an ideal we can strive for in hopes of attaining the most optimal result.","I (Jeff) am personally aiming for eight to nine hours per night in bed (11pm-7/8am) and recently read that Lebron James aims for 10-11 hours of sleep per night. Since this may not be a realistic standard for many readers, it is worth considering what to do if you fall short on sleep.","Let’s say you sleep poorly for a few nights during the week because of work or school. Researchers sometimes refer to this lack of optimal sleep as a “sleep debt.” So the question is, can a sleep debt be made up for by sleeping “extra” later on (such as over the weekend)? Well, the answer is, kind of, but not as easily as we might hope.","One study found that just one hour of sleep debt can take four days of optimal sleep time to fully recover from (69). So unless you’re really just sleeping the weekend away, the idea that you can make up for a full week of poor sleep in a single weekend may be a bit of a stretch. Still, making some kind of effort to rescue the negative impacts of sleep debt is worthwhile. For people who simply cannot reach the ideal target of eight to nine hours per night, we offer a few consolations:","If you are not sure about the amount of sleep you are getting, there are a few ways to determine your current standing."],"list_items":["Realize that any improvement in your nightly sleep duration is an improvement. Six hours is still better than five hours, and seven hours is still better than six. You don’t have to reach optimality to still get results, so don’t be too hard on yourself if our target is not doable or not worth it for you.","Naps are your friend. Research shows that napping has many benefits, especially for those who work night shifts or have sleep disorders (86). We recommend taking naps without restriction, as long as they don’t start interrupting your main sleep at night.","Make an effort to sleep extra on the weekends or whenever you can. Even though it may not be possible for you to fully repay a sleep debt in a single night or two, we believe that this will still likely have a beneficial impact on your training and overall body recomposition success."]},{"heading":"SLEEP TRACKING DEVICES","paragraphs":["Tracking sleep through smart technology has become a relatively novel means of assessing your sleep patterns and total sleeping hours. Utilizing smartphone apps and wearable objects such as Fitbits and smart watches to collect and analyze sleep data is becoming more popular. However, because these technologies are still so new, the accuracy of most remain questionable – especially compared to medical grade devices. At the time of writing, we are therefore, hesitant to make specific recommendations.","At the risk of sounding old-school, we believe there is some credence in using more subjective measures. If you are intentional enough to tune in to feedback from your body, those signals can provide some degree of certainty as to whether or not you are getting sufficient sleep. Consider your answers to these questions: Do you feel tired? Is your strength in the gym suffering? Are you waking up frequently during the night and having trouble falling back to sleep? Are you always waking up to an alarm? Answering “yes” to these questions, especially when combined, point toward less than ideal sleep. For completion sake, there is a caveat here worth mentioning.","We are often not as good as we’d like to think at self-assessing. Whether critiquing our own body language, determining our influence on others, assessing our own strengths/ weaknesses or guesstimating the effect our current sleep is having on our daily performances, there seem to exist too many biases and blind spots to accurately gauge the specifics. For our purposes here, we are reminded that as our sleep is disrupted, so is our ability to self-assess the effects it is having on our fitness and body recomp goals. This does not mean, of course, that self-analysis of how we feel and how we perform cannot be taken seriously but rather serves as a caveat. Experimenting with additional sleep and monitoring its effect on performance may be a more practical means in reaching a conclusion as to whether you are operating in a sleep-deprived state.","For ethical reasons, long term studies of the effects on people functioning in a state of sleep deprivation over extended time periods are extremely rare. We are quite certain however, we got the picture on this one.","Because sleep deprivation often overlaps and interconnects with corresponding stress levels, it is worth shedding some light on the perils of stress with regard to our recomp objectives."]},{"heading":"STRESS","paragraphs":["If you’re like us, you have probably noticed how stress negatively affects what would otherwise be routine endeavours. Exam time, tax audits, a death of a loved one, a major illness, a job loss or being the subject of a nasty rumor can all reign down on our well-being, including our muscle to fat ratios.","One 2008 study found that when subjects underwent a 12 week strength training program, (15) the subjects with higher levels of stress (as determined by a questionnaire that evaluates positive and negative life events experienced by each participant), gained significantly less strength in bench and squat. They also gained less size on their arms and thighs (the trend did not reach statistical significance, however).","Several other studies in this field have suggested that lifestyle stress can take a profound toll on recovery from training (39,118–120). It is a fair conclusion to say high stress levels are not doing your body recomposition goals any favours."]},{"heading":"SUGGESTIONS AND TIPS","paragraphs":["In dealing with the stressors in my life, I often resort to two main forms of relief: Meditation and an activity that evokes a state of “flow” - being in the zone.","Meditation relaxes my fragmented mind, reduces stress, helps with my concentration, brings be back to the present and centers my state of thinking and being.","If you are a beginner or simply curious about meditating, I suggest giving one of the various popular mindfulness meditation apps available a try. I would further recommend that you begin with short, 10 -15 minute guided meditations to help keep you on track.","Then, there is my second go-to means of reducing stress.","The idea here is to find some activity that puts you in a state of “flow”. For me (Jeff) this is playing basketball. When I am playing basketball, I forget about everything else that is going on in the back of my mind and focus completely on my game. This is not an intentional process, it simply happens (especially if I am actually playing a game and not just shooting around).","This sensation of flow where athletes tune out the noise in the crowd, the pressure of the game and all other distractions to become fully present in the moment, isn’t limited to sports. Gardeners, musicians, surgeons, artists, authors, singers and video gamers all report experiencing this same phenomenon from time to time. It’s a peculiar paradox where time seems to stand still, and yet the activity appears to be completed in an instant. Psychologist Mihaly Csikszentmihalyi coined this genuinely satisfying state of consciousness as flow. When the challenge of the task at hand is at its highest point and intersects with the highest level of your skillset, the activity itself becomes the reward. It is here, flow originates. For some, lifting weights itself is sufficient to elicit this flow state. For others, it is more monotonous. We recommend that you think about and experiment with enjoyable activities until you discover one that brings that similar stress-free experience.","In addition, give some thought to other common stress relievers such as the list we have compiled below:","In addition to stress busters, we have listed a few tips to improve your sleep as well:","If after trying some of these suggestions consistently and you continue to struggle with sleeping or if you feel unusually tired during each day, make an appointment with your family doctor and discuss the condition with him or her. Most sleep disorders, such as sleep apnea, can be treated and there is usually no need to live, suffering from insomnia or a chronic state of sleep deprivation without seeking help.","In conclusion, we challenge you to no longer think of your training as what happens in the gym. Consider sleep and the reduction of stress as part of the training regimen, equally important and demanding as much attention as the workout itself."],"list_items":["Use the supplement ashwagandha, as described in Chapter Thirteen.","Find a physical activity that you enjoy enough that it doesn’t require much discipline to regularly participate in.","Spend time with family and friends who add positivity to your life.","Referee your self-talk and train your thinking so that you can switch off any destructive or debilitating thoughts by replacing it with a more empowering thought.","Start a daily gratitude list (it is virtually impossible to be grateful and feel stressed at the same time)","Take an inventory of habits that steal from your long term joy. Then, adjust accordingly.","Learn to forgive yourself and be kind to yourself, as you would to others.","Celebrate often – even the smallest of victories!","Avoid unhealthy choices as a means of coping (substance abuse, smoking, overeating, gambling, et cetera).","If these steps fail to help reduce stress, consider enrolling in a stress management course or seeking medical help.","Set a schedule – go to bed and wake up at the same time each day.","Exercise, but no later than a few hours before going to bed.","Avoid caffeine late in the day (after 5pm) and alcoholic drinks before bed.","Relax before bed – try a warm bath, reading, or another relaxing routine.","Design the environment you are sleeping in for maximum facilitation towards sleeping: Get a comfortable mattress and pillow. Remove bright lights from computers, laptops or phones. Minimize or eliminate loud, irregular sounds. Adjust the room temperature to make it conducive to your sleeping. Avoid watching TV in your bedroom if you find it keeps you awake.","If you are worrying about something to the degree that it is keeping you awake, set a time in your mind – even get up and write it down – to deal with it the next day. You will deal with it at noon tomorrow, for example. This settles your worrying mind that the issue will be dealt with.","Don’t tackle big jobs or stressful topics before sleep.","Avoid going to bed on an empty stomach. Ensure you have saved enough calories/macros for a satiating meal before bed."]}],"word_count":3456},{"number":15,"title":"Weight Training - The Driving Force of Body Recomp","start_page":215,"epigraph":{"quote":"THE BARBELLS AND DUMBBELLS YOU HOLD IN YOUR HANDS AND THE WAY YOU USE THEM HAVE STORIES TO TELL.","attribution":"Craig Cecil"},"sections":[{"paragraphs":["Let’s start this chapter by saying that it is easy to lose fat by using diet alone, but nearly impossible to build muscle without weight training. This fact has led many experts in the field to conclude that when it comes to building muscle, nutrition is permissive to weight training. This means that you can have the most optimal diet, eat the ideal amount of perfectly distributed protein every day, and you still won’t build any appreciable muscle without a training stimulus.","As such, we believe that weight training can be considered the driving force of body recomposition. To better understand this, let’s use the analogy of a car. We can think of our training as the engine and our nutrition as the gasoline needed to fuel performance. The better the fuel (macronutrients, micronutrients, nutrient timing, et cetera), the better the performance. However, without the engine, the car simply won’t move, regardless of the fuel’s quality.","We can then think of other variables such as sleep and stress management as the tune-ups, oil changes and tire rotations required to keep the system moving along.","Clearly, weight training is paramount to building muscle and improving body composition. (46,112,126) However, similar to your nutritional approach, there are a virtually infinite number of variables that can impact how you should structure your training. Some of these variables include, but are not limited to, your primary goal, experience level, exercise preferences, preferred training style, scheduling concerns, equipment availability, previous injuries, and on and on.","Once these individual components have been identified, we can outline specific training recommendations in terms of key variables like volume, exercise selection, frequency, splits and more when constructing a training program.","Since nutrition is the primary focus of this book and we have limited our discussion of training to a single chapter, to do all of these factors justice would surely require a whole other book. With that said, because proper training is so crucial to body recomposition success, we would like to provide you with some insight, science, and clarity on the key training variables responsible for driving muscle growth. Let’s dig in!"]},{"heading":"PROGRESSIVE OVERLOAD IS KEY","paragraphs":["Progressive overload is the gradual increase in the amount of stress placed on the body from exercise (71). In other words, if no greater stress is placed on the muscle over time, the muscle has no reason to grow in order to overcome that stress.","In its most basic form, progressive overload simply means doing more, over time. Practically speaking, this usually takes the form of simply adding more weight to a given exercise from workout to workout. However, there are several different ways to apply progressive overload: 1) increase load 2) increase repetitions with same load 3) increase sets 4) improve form 5) increase rep duration (such as by slowing the eccentric/negative)","There are surely other creative ways to overload as well and it should be noted that these techniques can be used in combination. For true beginners, some form of progress should be achieved each and every workout. However, as an individual gains experience, progress will gradually slow.","As you become more advanced it may be important to apply progressive overload over a longer time scale and through less objective means such as by improving technique, lifting tempo and the mind-muscle connection on certain exercises.","When it comes to progression, we urge you to prioritize quality over quantity. The concept of progressive overload (more specifically, progressive tension overload) is effective mainly because it provides a simple method for increasing mechanical tension - a key player in muscle hypertrophy (112,126).","Adding load to the bar will only lead to progressive tension overload if form and execution are kept consistent. Therefore, it is well-advised to not add any load if it comes at the expense of hindering proper technique. While controlled cheating can be employed occasionally on specific exercises as an advanced training technique, generally speaking, adding more weight through the use of more momentum, by decreasing your range of motion, or by altering your lifting mechanics, does not count as true progressive overload in our books."]},{"heading":"VOLUME IS A DRIVER OF GROWTH","paragraphs":["At the most basic level, training volume refers to the amount of work you are doing. While volume load is calculated in the scientific literature according to the formula, sets x reps x load, in practical training circles, it is usually approximated as the number of working sets (not including warm up sets) performed per session or per week.","It has been suggested that there is a dose-response relationship between training volume and muscle hypertrophy (113,114), meaning more training volume tends to lead to more muscle growth. However, the literature is inconclusive as recent evidence suggests that more volume is not always better and how much you need depends on other training variables (14).","As we will see, not all volume is created equal and how much volume you need to maximize growth may also depend on the body part you’re training. The muscles of the back, for example, may require higher training volumes than the biceps in order to maximize growth. However, as a general rule, based on our coaching experience and the body of scientific research, most trainees should be performing somewhere in the range of 10-20 sets per body part per week. Some advanced trainees or trainees with impressive recovery abilities may require higher volumes for continued progress.","To explore these numbers further, my colleagues and I (Chris) recently investigated the effects of different training volumes on the lower body utilizing 12, 18, and 24 sets per week (Aube at al. 2019 - publication pending). Our hypertrophy results between all three groups were similar throughout the eight-week training study.","However, what I think is most important to extrapolate from our findings, is how different the individual responses were in all three groups!","Figure 15A: Individual Responses To Different Training Volumes (Aube at al. 2019 - publication pending) Regardless of the amount of volume they were performing, most people gained strength and size. However, the magnitude of gains was very different from person to person. We believe this implies that the amount of volume you need must be tailored to your specific goals and based on the individual variables laid out at the beginning of the chapter."]},{"heading":"GENERAL VOLUME PRINCIPLES","paragraphs":["Below are some figures to help explain that there is always a sweet spot for volume that will need to be fine-tuned to the individual.","Figure 15B: The Best Gains Are Not Always Found With The Highest Training Volumes"],"list_items":["Your current training status and previous training experience will play a large role in determining how much volume you should perform.","Generally, beginners should train with lower volumes than advanced trainees.","We recommend starting with relatively low volumes at the beginning of a program and gradually increasing volume over time.","Volume can be increased by adding working sets and/or by lifting more load (weight) and/or adding more reps per set.","More isn’t always better! Adding too much volume can result in overtraining or injury and can be counterproductive to body recomposition.","Increasing volume isn’t the only way to drive progress. We think it is better to underestimate your optimal volume initially and focus first on mastering variables like technique and effort before turning to increasing volume."]},{"heading":"KEY TERMS:","paragraphs":["MV = Maintenance volume. Volume required to maintain your current physique. (No loss, no gains)","MED = Minimum effective dose. This is the least volume you need to see some growth, but not maximize growth.","MAV = Maximum adaptive volume. This is the proverbial sweet spot for volume: You are able to maximize progress without accumulating excessive fatigue.","MRV = Maximum recoverable volume. This is the most volume you can do and still recover from. Increasing volume further would likely lead to a detriment in performance and/or muscle size.","FIGURE 15C: Too Much And Too Little Training Volume Can Lead To Suboptimal Gains"]},{"heading":"NOT ALL VOLUME IS CREATED EQUAL","paragraphs":["As one final note on volume, we would like to remind you that not all volume is created equal. There is a much higher level of skill and effort required to perform some lifts than others. For example, one set of bench press will offer more hypertrophic bang for your buck than one set of pec deck. Likewise, performing four sets of squats will impose a higher local and systemic fatigue demand than four sets of leg press.","Different exercises can also result in different patterns of hypertrophy across a given muscle group, even when volume is matched. This was exemplified in one 2014 study which showed that even when total volume was matched, a group performing four different exercises (squat, leg press, lunges and deadlift) saw significant hypertrophy in all four heads of the quadriceps, while the group performing only one exercise (squats), made significantly less gains in two heads of the quad (including the “tear-drop” head)(49).","This research implies that it is important to not only consider volume, but to also include a variety of exercises to maximize growth potential."]},{"heading":"NOT ALL EXERCISES ARE CREATED EQUAL","paragraphs":["It should be clear from the research above that including a variety of exercises is ideal for optimizing complete development of a muscle group. We also believe that some exercises are simply more effective at building muscle than others.","Generally speaking, it is important to emphasize multi-joint, compound movements that utilize large amounts of muscle mass in any complete training program. This will not only improve general strength that can then be carried over to other exercises but will also make training more time-efficient (since a single compound exercise is able to activate a large degree of muscle mass). Below are some basic compound exercises we suggest including in your program:","While compound exercises should make up the bread and butter of your training program, certain muscles are better targeted through single-joint isolation exercises. Below are some basic isolation exercises we suggest including in your program, especially if any of these muscles are lagging on your physique:"],"list_items":["Legs: Squat variation, lunge, leg press, deadlift variation, hip thrust","Back/biceps: Horizontal pull (row variation), vertical pull (pullup/pulldown)","Chest/triceps: Horizontal press (dumbbell, barbell, machine)","Shoulders: Vertical press (barbell, dumbbell)","Rear deltoids: Reverse pec deck, reverse flyes (cable or dumbbell)","Side deltoids: Lateral raise (cable, dumbbell, machine)","Biceps: Curl variation (dumbbell, barbell, cable)","Triceps: Cable pressdown, overhead extension, skullcrusher","Hamstrings: Leg curl variation (lying, seated, GHR)","Calves: Calf raise (standing, seated)","Abs/obliques: Crunch (cable, weighted), leg raise, planks, anti-rotation While these movements should be prioritized in your training, other exercises not included on this list certainly can be added to your program depending on your specific needs, goals and preferences."]},{"heading":"TRAINING HARD","paragraphs":["Another way that training volumes differ is in terms of how hard the sets are. Should we be pushing sets all the way to failure or should we stop shy of failure?","While the scientific literature is currently unclear as to exactly how often we should be taking sets to failure to maximize growth, it is clear that if you want to make continued progress past the beginner level, it is important to put in a high level of effort when training (54). This does not imply that every set should be taken to failure, since consistently taking sets to complete fatigue can lead to overtraining and reduced overall volume, potentially hindering growth. As a general rule, we recommend leaving one to three reps in the tank on most compound exercises. Isolation exercises can be taken more routinely to failure without the same risk of fatigue accumulation, however, we still recommend reserving failure for the last set of any given exercise."]},{"heading":"WHAT IS THE BEST REP RANGE FOR MUSCLE GROWTH?","paragraphs":["As long as you are applying appropriate effort, with appropriate volume, research shows that you can achieve very similar levels of hypertrophy with low reps (heavy weight) and high reps (light weight). So, again, assuming you’re training sufficiently hard, what specific rep range you work in may matter less for hypertrophy than many people think.","With that said, we still believe that there is a “practical hypertrophy zone” where the majority of working sets should come from. That practical rep zone is 6-15 reps. There are two main reasons why we believe this rep zone is preferable for the goal of building muscle. First, as you increase the rep count beyond 15 reps, you will begin to accumulate more metabolic fatigue, which can be very taxing, both psychologically and physiologically. As such, since you can achieve the same hypertrophy with lower reps, generally, we recommend reserving high rep work (15-25+ reps) for isolation exercises to be performed near the end of the workout.","By the same token, sets with a rep count lower than six tend to run a higher risk of injury due to heavy loading and can make it more difficult to accumulate an appropriate amount of total training volume.","So while in theory, there isn’t anything magical about the 6-15 rep range, in practice, it is the most reasonable, as it allows you to perform enough work safely and comfortably without running into the recovery issues that we tend to see at the rep range extremes. This also doesn’t imply that there is no place for “pure strength work” (i.e. <6 rep sets) or “pure pump work” (i.e. >15 rep sets). We suggest allocating approximately 75 percent of your weekly training volume to the 6-15 rep zone."]},{"heading":"TRAINING FREQUENCY AND TRAINING SPLITS","paragraphs":["Should you train each body part once a week? Twice a week? Every day?","It seems that as a whole, the scientific literature suggests that training each muscle twice per week is better than only training each muscle once per week. Whether or not frequencies higher than that are better, seems to depend on the individual.","This finding has a few implications for training splits. For example, the traditional bodybuilding bro split where chest is hit on Monday, back is hit on Tuesday, et cetera, is not likely to maximize progress due to suboptimal training frequency.","There are a virtually infinite number of ways that you can split up your training during the week to meet the two times frequency minimum. Below are a few examples of splits we have had success with:"]},{"heading":"THE UPPER LOWER SPLIT (BEGINNER-INTERMEDIATE)","paragraphs":[],"list_items":["Day 1 - Upper","Day 2 – Rest","Day 3 – Lower","Day 4 – Rest","Day 5 – Upper","Day 6 – Rest","Day 7 – Lower"]},{"heading":"THE UPPER LOWER SPLIT (INTERMEDIATE-ADVANCED)","paragraphs":[],"list_items":["Day 1 - Upper","Day 2 – Lower","Day 3 – Upper","Day 4 – Lower","Day 5 – Upper","Day 6 – Lower","Day 7 – Rest"]},{"heading":"THE PUSH PULL LEGS SPLIT (INTERMEDIATE-ADVANCED)","paragraphs":[],"list_items":["Day 1 – Push","Day 2 – Pull","Day 3 – Legs","Day 4 – Push","Day 5 – Pull","Day 6 – Legs","Day 7 – Rest"]},{"heading":"THE FULL BODY SPLIT (BEGINNER-INTERMEDIATE)","paragraphs":[],"list_items":["Day 1 – Full Body","Day 2 – Rest","Day 3 – Rest","Day 4 – Full Body","Day 5 – Rest","Day 6 – Full Body","Day 7 – Rest"]},{"heading":"THE FULL BODY SPLIT (ADVANCED-ELITE)","paragraphs":[],"list_items":["Day 1 – Full Body","Day 2 – Full Body","Day 3 – Full Body","Day 4 – Full Body","Day 5 – Full Body","Day 6 – Rest","Day 7 – Rest *note the volume and intensity (effort) should be reduced on all training days to ensure proper recovery There is so much more we could discuss regarding training. However, as mentioned at the beginning of the chapter, this would require another book entirely. The practical concepts in these pages will be sufficient to get your recomposition engine running properly. If you would like to further maximize your approach, we recommend checking out the training programs offered at JeffNippard.com and SchoolOfGainz.com. There, you will find comprehensive training programs based on years of coaching experience, scientific literature, and a community of trainees, working on becoming the best version of themselves."]}],"word_count":2595},{"number":16,"title":"Conclusion","start_page":229,"epigraph":{"quote":"WE ARE WHAT WE REPEATEDLY DO. EXCELLENCE THEN, IS NOT AN ACT, BUT A HABIT.","attribution":"Aristotle"},"sections":[{"paragraphs":["Congrats on making it through the volumes of information that we believe will serve as a reliable blueprint for sculpting your body through recomposition. If you have made it to this point, it indicates your desire to maximize your results by complementing your hard work in the gym with scientific nutrition application. We applaud you for that!","Because change is a process, rather than a single act, it is now time to take the information that is best applicable to you and begin turning your knowledge into results. Daily, utilizing one piece of new nutritional insight at a time, before long, new and rewarding results will start emerging from your persistent consistency of application.","As you begin to apply what you have learned throughout the book, you will likely have to revisit certain chapters and sections to review and reacquaint yourself with the specifics. This will be especially important for beginners who may be experiencing some information overload.","Regardless of your experience in the gym or knowledge of nutrition, we recommend going back through the chapters and highlighting your most relevant parts. This not only contributes to familiarity, but condenses all the information and data into your very own custom-designed nutritional guide.","Adding, adjusting and evaluating your acquisition of new habits and procedures will probably seem somewhat robotic, academic and maybe even awkward at first. This is the nature of change. Do not be discouraged if you find yourself struggling somewhat with the details and implementation.","Recall the first time you did a squat, drove a car or used a new computer program. Chances are, it felt strange and awkward at first. But by paying attention to detail, you developed a habit where over time, the effort needed to perform that feat became less and less demanding. So it may be with adjusting your protein intake, rearranging your macros or heeding the contents of your peri workout meals. Little by little, a little becomes a lot. You purchased this book to gain new insight that would help you add muscle and lose fat. As you work through the nuts and bolts of application, keep this goal in mind and remember that nothing can withstand the persistent and consistent application of a well designed plan. You now own that well designed plan! All that remains is the persistent consistency part. Your first choice towards a new goal of body recomposition was to purchase this book. Each day forward will demand more choices, including adjustments to your diet and nutritional requirements to get to the next level. Make no mistake about it, those choices will determine success or failure. We are confident that each of your daily choices to start doing something different will start new behaviors that compounded over time will become a habit; a new habit yielding new goals.","Equipped with new information and a new resolve to apply what you have learned, new results are just around the corner. Please know, we will be here cheering for you every step of the way. We look forward to hearing YOUR success story!"]}],"word_count":512}],"training":{"splits":[{"name":"Upper Lower Split","level":"Beginner-Intermediate","days":[{"day":1,"focus":"Upper"},{"day":2,"focus":"Rest"},{"day":3,"focus":"Lower"},{"day":4,"focus":"Rest"},{"day":5,"focus":"Upper"},{"day":6,"focus":"Rest"},{"day":7,"focus":"Lower"}],"note":null,"days_per_week":7,"training_days":4,"rest_days":3},{"name":"Upper Lower Split","level":"Intermediate-Advanced","days":[{"day":1,"focus":"Upper"},{"day":2,"focus":"Lower"},{"day":3,"focus":"Upper"},{"day":4,"focus":"Lower"},{"day":5,"focus":"Upper"},{"day":6,"focus":"Lower"},{"day":7,"focus":"Rest"}],"note":null,"days_per_week":7,"training_days":6,"rest_days":1},{"name":"Push Pull Legs Split","level":"Intermediate-Advanced","days":[{"day":1,"focus":"Push"},{"day":2,"focus":"Pull"},{"day":3,"focus":"Legs"},{"day":4,"focus":"Push"},{"day":5,"focus":"Pull"},{"day":6,"focus":"Legs"},{"day":7,"focus":"Rest"}],"note":null,"days_per_week":7,"training_days":6,"rest_days":1},{"name":"Full Body Split","level":"Beginner-Intermediate","days":[{"day":1,"focus":"Full Body"},{"day":2,"focus":"Rest"},{"day":3,"focus":"Rest"},{"day":4,"focus":"Full Body"},{"day":5,"focus":"Rest"},{"day":6,"focus":"Full Body"},{"day":7,"focus":"Rest"}],"note":null,"days_per_week":7,"training_days":3,"rest_days":4},{"name":"Full Body Split","level":"Advanced-Elite","days":[{"day":1,"focus":"Full Body"},{"day":2,"focus":"Full Body"},{"day":3,"focus":"Full Body"},{"day":4,"focus":"Full Body"},{"day":5,"focus":"Full Body"},{"day":6,"focus":"Rest"},{"day":7,"focus":"Rest"}],"note":"note the volume and intensity (effort) should be reduced on all training days to ensure proper recovery","days_per_week":7,"training_days":5,"rest_days":2}],"guidelines":{"frequency":{"times_per_muscle_per_week":2,"guidance":"Training each muscle twice per week beats once per week; higher frequencies depend on the individual."},"volume":{"sets_per_bodypart_per_week":{"min":10,"max":20},"definition":"Working sets (excluding warm-ups) per body part per week.","principles":["Your current training status and previous training experience will play a large role in determining how much volume you should perform.","Generally, beginners should train with lower volumes than advanced trainees.","We recommend starting with relatively low volumes at the beginning of a program and gradually increasing volume over time.","Volume can be increased by adding working sets and/or by lifting more load (weight) and/or adding more reps per set.","More isn’t always better! Adding too much volume can result in overtraining or injury and can be counterproductive to body recomposition.","Increasing volume isn’t the only way to drive progress. We think it is better to underestimate your optimal volume initially and focus first on mastering variables like technique and effort before turning to increasing volume."]},"effort":{"reps_in_reserve_compounds":{"min":1,"max":3},"guidance":"Leave reps in the tank on most compounds; save failure for the last set of isolation exercises."},"rep_ranges":{"practical_hypertrophy_zone":{"min":6,"max":15},"share_of_weekly_volume_pct":75,"high_rep_isolation":{"min":15,"max":25},"notes":["Below 6 reps: higher injury risk and harder to accumulate volume.","Above 15 reps: more metabolic fatigue; reserve for isolation work at the end of a session."]},"progressive_overload":{"definition":"Gradual increase in the amount of stress placed on the body from exercise.","methods":[{"n":1,"method":"increase load"},{"n":2,"method":"increase repetitions with same load"},{"n":3,"method":"increase sets"},{"n":4,"method":"improve form"},{"n":5,"method":"increase rep duration (such as by slowing the eccentric/negative)"}],"caveat":"Added load only counts if technique and range of motion stay consistent."}},"source_chapter":15},"supplemental_materials":{"meal_plans":[{"name":"MEAL PLAN #1","notes":["*This meal plan is ideal for an ~ 180-200 lbs m "fields":["DATE","CHEST","ABDOMEN","THIGH","TRICEPS","BICEPS","SUBSCAPULAR","SUPRAILIAC","AXILLA","CALF","BODY FAT %"]}]},"authors_about":[{"name":"Jeff Nippard","bio":"Jeff is a professional natural bodybuilder and powerlifter. Through his informative and entertaining Youtube channel which has gathered a fan-base of over 1 million subscribers, Jeff aims to share the knowledge he has gathered through university education and field experience with others who are passionate about the science behind building muscle, losing fat and getting healthier. He earned the title of Mr. Junior Canada for natural bodybuilding in 2012 and as a powerlifter, Jeff held the Canadian national record for the bench press in 2014. As a powerlifter, Jeff has claimed a 502 lb squat, 336 lb bench press and a 518 lb deadlift with an all time best Wilks score of 446. With a Bachelor of Science degree in biochemistry, Jeff has gathered the requisite scientific knowledge to compliment his practical experience acquired through training and coaching. Jeff has coached women’s bikini and men’s bodybuilding national and provincial champions, professional natural bodybuilders and nationally and IPF Worlds qualified raw powerlifters. He has presented seminars on Block Periodization, concurrent training and nutrition and training for natural bodybuilding in academic settings including the 2019 Ultimate Evidence- Based Conference, and at Lehman College and the University of Iowa. He has aspirations of completing a PhD in exercise science or a related field. Jeff currently lives in Kelowna, Canada where he is producing informative YouTube videos and podcasts."},{"name":"Christopher Barakat, Ms, Atc, Cissn","bio":"Christopher is a researcher in the Human Performance Lab at the University of Tampa where he teaches courses in Exercise & Nutritional Sciences. In 2007, he began his bodybuilding journey in his high-school weight room where he would train before basketball practice. As time passed, he started to enjoy weight training more than anything else, and although he was training hard, he will admit to not training smart. More importantly, he was not eating appropriately to support his goals. Spinning his wheels for the first three years (when he could have made the greatest progress) he barely gained any weight, therefore, hindering his ability to maximize muscle growth. At that time, he didn’t understand the most fundamental principles such as energy balance, and actually restricted his calorie intake by avoiding calorically dense, processed foods because of the conventional wisdom of his time that convinced him he should “eat clean and healthy.” The lack of progress, despite the time and effort he was putting into developing his physique, ironically is what led him to study and learn about exercise and nutritional sciences. During his undergraduate studies in Athletic Training, he became heavily involved with natural bodybuilding. As a 140 pound teenager, he started competing in 2011. In just 15 months, he gained 14 pounds of muscle mass and carried those gains to the stage for his second competition in 2013. At that time, with four years of weight training experience, he finally started implementing a sound nutritional approach to support his training and build muscle tissue. With newfound knowledge and resolve, he was most intentional to be in a calorie surplus, eat plenty of protein and distributed these protein feedings in five-six meals per day. While finishing up his bachelor of science degree, he started coaching others who sought to improve their body composition. So, invested and interested in this field, he committed to furthering his education and study exercise and nutritional science at the graduate level. While in graduate school, his passion for research grew with each scientific study he conducted and published. Being directly involved with research completely changed how he interpreted and valued scientific data. He truly grasped the strengths of exercise and nutritional science studies, but more importantly, realized the flaws and shortcomings of science as well. This realization dramatically enhanced his abilities to critically think, improve his coaching modalities, and rekindle an artistic perspective within. After graduating with top honors and earning the Outstanding Student Award, he began to teach at the University as an adjunct professor and continued working on research projects. Today, you will find him still working in the lab, teaching in the Health Science & Human Performance department, and coaching his clients. Chris has coached physique competitors in all categories earn professional status and works with many athletes competing at the world championship level of natural bodybuilding. He is delighted to have collaborated with Jeff Nippard on this project to give enthusiasts the best nutritional information that you can immediately apply to improve their performance, overall health, build muscle and lose fat!"}],"references":[{"n":1,"text":"Aird, TP, Davies, RW, and Carson, BP. Effects of fasted vs fed-state exercise on performance and post-exercise metabolism: A systematic review and meta-analysis. Scand J Med Sci Sports 28: 1476–1493, 2018."},{"n":2,"text":"Alexander, DD, Weed, DL, Chang, ET, Miller, PE, Mohamed, MA, and Elkayam, L. A Systematic Review of Multivitamin–Multimineral Use and Cardiovascular Disease and Cancer Incidence and Total Mortality. J Am Coll Nutr 32: 339–354, 2013."},{"n":3,"text":"Anderson, RA and Roussel, A-M. Cinnamon, Glucose, and Insulin Sensitivity. Nutraceuticals, Glycemic Health and Type 2 Diabetes. 127–140, 2009.Available from: http://dx.doi.org/10.1002/9780813804149.ch8","url":"http://dx.doi.org/10.1002/9780813804149.ch8"},{"n":4,"text":"Antonio, J, Ellerbroek, A, Silver, T, Orris, S, Scheiner, M, Gonzalez, A, et al. A high protein diet (3.4 g/kg/d) combined with a heavy resistance training program improves body composition in healthy trained men and women – a
