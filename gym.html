["When many people in the fitness industry talk about body recomposition, they typically mention how it is most common under the four circumstances we outlined in Chapter 1: beginners, detrainees, obese individuals, or steroid-users. It’s even common to hear statements like, “it’s impossible for well-trained individuals to lose fat and build muscle at the same time.”","Allow us to be very clear here when we affirm that this truly isn’t the case.","There is a popularly referenced 2016 study by Maltais et al. that took 26 overweight sarcopenic men (60 years +) and put them on a resistance training protocol while increasing their daily protein intake through protein supplementation (83).","On average, the subjects lost 2.4 pounds of fat mass while gaining 3.7 pounds of lean mass. And although this certainly serves as a well-cited, real-world example of pretty impressive body recomposition, this study is probably not the most convincing to readers of this book, as chances are, you’re not a 60 year old sarcopenic male picking up a dumbbell for the first time. Let’s keep looking.","I (Chris) see body recomposition occur frequently with subjects in the lab, with clients of mine, and even in collegiate athletes. Consider some of my published scientific data for instances of body recomposition.","In 2017, I was a co-investigator on a very interesting training study at the University of Tampa. We were looking at the effects of different training regimens on collegiate female volleyball players (104). Even though we didn’t find a difference between the two training styles tested, because we also tracked the athletes’ nutrition (monitored by a registered dietician), we discovered that in just seven weeks, these collegiate athletes achieved significant body recomposition.","One group lost nearly six pounds of fat mass while at the same time, gaining six lbs of lean mass over just seven weeks! Granted, while this level of recomposition is impressive, it is dealing with one specific population: elite female volleyball players. This study also used training styles focused on improving explosive power and muscular performance on the court, not high-volume resistance training like the typical gymrat reader of this book would use. And, while these subjects were incredible athletes, they were likely best classified as intermediates, having only a few years of training experience.","Yet, this data demonstrates the power of an evidence-based nutritional approach (subjects were consuming approximately 0.81 grams of protein/pound of body weight), coupled with a progressive training stimulus.","Having seen that recomposition is certainly possible, even common, in the literature, can it happen in more advanced trainees? The next study we’re about to look at shouts a resounding, yes!","This was actually the first research project I was a co-investigator on during my graduate studies and I think it has some really interesting pieces of data. As a side note, the point of the study was to figure out if autoregulating exercise selection would impact strength and size gains. Without realizing I was a co-author on this paper, Jeff covered the results in a video back in 2017 (here) if you’re interested in hearing a summary of what we found (105). More to the point, our subjects were 17 highly trained males with a minimum of three years of continuous training experience. As a minimum standard, they also had to be capable of squatting 1.75 times their bodyweight and bench pressing 1.3 times their body weight to even be included in the study (although many subjects well exceeded this standard). For example, if a subject weighed 180 pounds, he would have to be capable of squatting at least 315 pounds and bench pressing 235 pounds to participate.","These subjects spent the next nine weeks performing high volume, full body training sessions, three times per week. I personally tracked each subject’s nutritional intake to make sure that after each and every training session, subjects were provided with a serving of whey protein post workout. Their average protein intake was 1.8 grams per kilogram per day (~0.8g/lb). At the end of the nine weeks, we found that both groups gained lean body mass and fat mass on average. Now you’re probably thinking, “Wait! If they gained lean mass and fat mass, then that isn’t body recomposition!”","Well, it’s important to note that they gained significantly more lean mass than fat mass, thus lowering their average body fat percentage.","Similar to what we outlined in scenario three from Chapter One, because the subjects gained more muscle than fat, their body fat percentage decreased. They built muscle while getting leaner on a relative scale. In our opinion, this can be said to count as body recomposition. More importantly, what truly fascinated me at the end of data collection was the drastic individual differences between subjects! Five out of the seventeen subjects did in fact lose fat AND gain muscle at the same time. The most incredible recomposition from this study came from a subject who gained over eight pounds of lean mass while at the same time losing over four pounds of fat mass! Keep in mind, this was only a nine week transformation! For the sake of completeness, it’s worth mentioning that a few subjects experienced what we might call “reverse recomposition.” They lost lean mass and gained fat mass throughout the study. This is not an outcome anyone wants to see after nine weeks of intense training. We speculate that this was due to being under-recovered or over-trained. It’s possible that the training volume and/or intensity was simply too high for these subjects. Or perhaps their protein intake was too low to promote full recovery. Perhaps their sleep quality was poor, or there were outside stresses negatively impacting their recovery. These are just a few of the extraneous factors that can impact one’s ability to recomp that we will cover in the coming chapters.","Of course, it wasn’t the goal of this study to figure out if recomposition was possible or not. It was simply something we observed as a “side effect” of our protocol. If we were actually trying to create recomposition in these subjects, we could have done things differently (and more optimally). For our purposes in this book, the take-away from this study is to show that body recomposition can and does occur in highly trained individuals.","Before we wrap this section up, I want to share some fresh new data from our latest training study. At the time of this writing, it has yet to be published and will be presented at the 2019 NSCA National Conference. (Aube et al. Publication date TBD)","In this study, we examined the effects of different training volumes (12 sets, 18 sets, 24 sets per week) on highly trained individuals. This was a lower-body training study in which subjects trained legs twice per week. Once again, we tracked their nutritional intake to ensure subjects were getting enough protein to support their training demands. This time, after 10 weeks of training, all three groups experienced true, undisputed body recomposition where lean body mass was gained AND fat mass was lost. For example, the group with the best results (doing 12 sets of legs per week, for the record) gained nearly four pounds of lean mass while losing 1.5 pounds of fat mass. That’s some impressive recomposition in only 10 weeks!","Again, as before, a few individuals saw the opposite effect where they actually lost lean mass. This is pretty normal in training research because despite everyone having a unique recovery ability, every subject in any given group will be running the exact same program. Again, our goal in outlining this data is not to prove that everyone experiences body recomposition, but rather to show that recomposition is certainly possible – even in highly trained lifters.","In fact, one subject in this latest study gained over 20 pounds of lean mass and lost of fat admittedly, was the most outrageous thing I’ve ever witnessed in a research setting. He walked into our lab looking like a well-built college basketball player and left looking like a professional natural bodybuilder, ready to battle with the best. If we’re really checking our egos, this guy probably would’ve taken both of us out on a bodybuilding stage. I (Jeff) often hear in lifting circles that one of the advantages of staying natural (not taking steroids) is that you will be able to maintain your physique forever. Many folks are under the impression that if you “earn your muscle naturally,” you will be able to keep it for life. In my 13 years of training experience, I can confidently say that this is complete bogus. Certainly, there are many good reasons to stay natural, but the idea that it allows you to maintain the physique you built forever isn’t one of them. Throughout my training career I have noticed that my level of muscularity, hardness and definition waxes and wanes with the peak and valleys in my training and nutrition protocols.","In other words, when I am very serious and disciplined about training, my physique improves. When I am taking my training and nutrition less seriously, my physique worsens. Much of the time, this results in periods where I have clearly both lost muscle and gained fat (the “anti-recomp” effect) and other periods where I have clearly gained (or re-gained) muscle and lost fat.","Even as an advanced trainee, it’s perfectly clear that if you’re not being diligent with your training and nutrition, your physique can take a turn for the worse. I lay this out to say that if you believe the common trope that “if you built it naturally, you’ll always keep it,” you could be simply giving yourself an excuse to be lazy with your future training and diet habits. This could eventually derail what you worked so hard for.","But our outlook here doesn’t need to be grim! As long as we apply the principles laid out in this book, we’re guaranteed to make sure the body recomposition process is occuring in the right direction."]},{"heading":"THE POWER OF BELIEF","paragraphs":["The reason we’re sharing this with you is because it’s crucial to not impose self-limiting beliefs on what you can accomplish. We don’t mean “belief” in the vacuous sense that “if you just believe it hard enough, you can achieve anything you set your mind to.” That’s nonsense. Obviously there are limits to what the human body can do.","No matter how much we believe in the possibility of human flight, without the aid of technology, we will simply meet the pavement every time we try. Our human aerodynamics won’t permit it. When we refer to not imposing self-limiting beliefs we are referring to opening yourself up to what the evidence actually suggests. If you think you can only gain one pound of muscle per year, well guess what? That’s probably all you’ll accomplish. If you think you’re “too well trained” to achieve body recomposition, then you might as well be. In this context, Henry Ford’s take on this is enlightening: “Whether you think you can or you think you can’t, you are probably right.”","The first reminder of just how powerful self-imposed cultural groupthink can be is the 4-minute barrier imposed on runners prior to 1954. At the time, society as a whole submitted to the belief that it was humanly impossible for anyone to run a mile in less than four minutes. That was until 1954, when Roger Bannister broke through this barrier of perception. Since that famous day, thousands have accomplished this previously “impossible” goal. Although we no longer struggle with belief in the four minute mile, in the fitness industry it is still commonly thought that we cannot build muscle while losing fat. We believe this is due to reductionist thinking about energy balance, lack of research data awareness and the inevitable groupthink effect. Just because many people believe something, doesn’t mean it is necessarily true.","Body recomposition is ultimately achieved through the construction of one new tissue (muscle) and the breakdown of another tissue (fat). In order to understand how this process works, it’s important that we first understand how energy is handled by the body. Straight ahead, we will turn our attention to the topic of metabolism. What is it that people mean when they say “my metabolism”? And how does having a “fast” or “slow” metabolism impact your ability to build muscle and lose fat?"]}],"word_count":3023},{"number":4,"title":"Decoding Metabolism","start_page":47,"epigraph":{"quote":"I DON’T HAVE A WEIGHT PROBLEM. I HAVE A METABOLISM PROBLEM.","attribution":"Unknown"},"sections":[{"paragraphs":["Recall from the previous chapter that we’re setting up the energy balance equation like this: Weight change = calories in – calories out.","The ‘calories in’ part of this equation is very straightforward:","you eat food - and that pretty much covers that segment. The ‘calories out’ aspect is much more complex and requires further explanation to understand how each of these two factors influence body recomposition.","When scientists or fitness enthusiasts speak of metabolism or metabolic rate they are usually loosely referring to total daily energy expenditure (TDEE): the total number of calories you burn each day. It is sometimes referred to as your net metabolic rate. As shown in the chart below, three key factors determine the number of calories we burn each day.","Total Daily Energy Expenditure"]},{"heading":"TEF","paragraphs":["Physical Activity Level 1. Basal Metabolic Rate (BMR)","2. Physical Activity Level 3. Thermic Effect of Food"]},{"heading":"BMR","paragraphs":["Figure 4A: Three Components of your Total Daily Energy Expenditure (TDEE)","Let’s have a look at each of the three components of metabolism separately, to gain a better understanding of how we burn calories."]},{"heading":"1. BASAL METABOLIC RATE (BMR).","paragraphs":["Your BMR is essentially how many calories your body burns per day in order to perform all of its basic metabolic functions and maintain its body mass at rest. If you sat on the couch all day long and did nothing but breathe, this would be roughly the number of calories you’d burn.","As shown in Figure 4A above, BMR typically accounts for 50-70 percent of your daily energy needs. The other two components demanding energy are your physical activity level and the thermic effect of the food you’re consuming.","Since your BMR comprises such a large portion of your total daily energy outflow, it is worthwhile to determine roughly how many calories it contributes to the total daily burn. There are multiple ways to assess and calculate your basal metabolic rate. In scientific laboratories, an expensive piece of technology called the metabolic cart can assess your resting metabolic rate by measuring the exchange ratio between oxygen and carbon dioxide when exhaling at rest.","Fortunately, after assessing thousands of people, scientists have been able to create equations so that anybody can obtain a very close estimation of their BMR.","For those of you who like math and objective numbers, we recommend using the Mifflin St. Jeor formula (below) to calculate your BMR. As you can see, this formula takes four variables into consideration: gender, age, height and weight. However, there are additional variables that are not, and can not be accounted for. This is one reason why this formula is very good, but not perfect."]},{"heading":"BELOW ARE THE MIFFLIN ST. JEOR FORMULA FOR MALES & FEMALES:","paragraphs":["BMR = 10 x weight(kg) + 6.25 x height(cm) - 5 x age(y) + 5 (man)","BMR = 10 x weight(kg) + 6.25 x height(cm) - 5 x age(y) - 161 (woman)","For those less interested in math, a more practical way to estimate BMR is to take your body weight (lbs) and multiply it by 10. For example, if you are 160 pounds your BMR would be roughly: 160lbs x 10 = 1600 Calories. In other words if you just sat around all day, you’d burn about 1600 calories.","As you’d probably expect, while this rule of thumb is generally accurate for getting a ballpark figure, there are still individual differences in BMR due to the variables listed below:"],"list_items":["Gender (85)","Age","Height","Weight","Body composition. This isn’t taken into consideration with any BMR formula, despite the fact that lean body mass (such as muscle) is more metabolically active and therefore demands more energy to maintain. If, for example, you took two individuals of the same gender, age, height, and weight but one was 20 percent body fat and the other was 10 percent body fat, the leaner individual will most likely have a higher BMR and require more calories to maintain their weight.","Genetics","Dietary History (124)","Gut Microbiome (50,64,107)","Overall ‘health’ - diseased states(103)","Prescription Medications and/or Drugs","Ambient & Body Temperature","Hormonal Factors","Sympathetic Nervous System Activity Since there are a plethora of factors that can impact your individual calorie requirements, it’s important to recognize that your calorie intake may not be comparable to someone else’s, even if you are the same weight and have the same goals. We also do not want you to get too caught up in the specific number just yet. Remember that BMR is just one of three components of metabolic rate."]},{"heading":"2. PHYSICAL ACTIVITY LEVELS.","paragraphs":["The second component of your metabolic rate is captured through how many calories you burn by “moving around”. For most people, daily physical activity makes up 20-35 percent of total caloric expenditure. These values can be lower if you are more sedentary or higher if you’re more active than average.","It’s worth highlighting that this component of metabolism is not limited to the number of calories you burn while formally exercising (lifting weights and cardio). It includes the calories burned from all of your daily activities, including typing at your desk, bringing groceries to the car and singing in the shower.","The calories burned from these non-exercise activities make up NEAT: Non-Exercise Activity Thermogenesis. NEAT can vary greatly between individuals, directly impacting the number of calories they burn through daily physical activity (77).","High levels of NEAT is advantageous from a fat loss perspective and is believed to be largely responsible for the massive differences in total metabolic rate we see.","Did you ever wonder why your friend who is exactly the same age, weight and bodyfat as you can eat 1,000 calories more than you and still stay just as lean? It’s probably largely because he or she has higher levels of NEAT. But NEAT isn’t only good for burning extra calories. It also improves hormonal factors such as insulin sensitivity and may improve carbohydrate tolerance (13).","With this in mind, if you live a very sedentary lifestyle and have fat loss goals, it would be important to create some active habits to increase levels of NEAT. For example, taking a walk first thing in the morning, taking the stairs instead of the elevator, parking far away from the grocery store, or even getting a standing desk (111) can all assist in increasing total daily caloric burn.","This component of metabolism also explains why there is a drastic difference in caloric expenditure when comparing someone who works a labor intensive job, such as a construction worker, to someone who is regularly sitting at a desk job. With these metabolic factors in mind, we will make specific recommendations for formal cardio in Chapter 12.","Interestingly enough, when in a caloric deficit for an extended period of time, your body senses the decline in food intake and automatically decreases energy expenditure by downregulating NEAT. This can result in something as simple as fidgeting less, but can also present as severe fatigue if you diet for too hard or too long.","This is part of the reason why your net metabolic rate is not a fixed number. As you diet longer and get leaner, your body finds intriguing subconscious ways to preserve energy. This is a key driver of the slowed metabolism that you often see with chronic dieters and is one of the reasons why throughout the book, we recommend more moderate caloric deficits and surpluses.","In the next chapter, we will put this information to use by determining your caloric needs based on your net metabolic rate. Keep your daily activity levels (including NEAT) in mind when we introduce you to the “activity multiplier” which is intended to individualize activity levels when calculating metabolic rate. (see Chapter Five for details)."]},{"heading":"3. THERMIC EFFECT OF FOOD.","paragraphs":["Sometimes referred to as dietary thermogenesis, the third component of your Total Daily Energy Expenditure is the amount of energy expended by breaking down and processing food for use and storage. Simply put, your body burns calories as it digests, absorbs, transports and stores food that you eat.","Just as each macronutrient (carbohydrates, fats or proteins) provides us with a different number of calories (see Table 4A below), they also require different amounts of energy to digest, absorb, and utilize. Because of this, each macronutrient has a different thermic effect. In fact, every food source is slightly different in this regard. Some foods require more energy to digest and absorb than others.","It’s important to understand that each macronutrient provides us with a different amount of energy (calories), as seen in the chart below, and each macronutrient differs from a thermogenic standpoint."]},{"heading":"MACRONUTRIENT","paragraphs":[]},{"heading":"CALORIES/GRAM","paragraphs":[]},{"heading":"THERMIC EFFECT (RANKED)","paragraphs":["Fat Carbohydrates Protein ~9 Cal/gram ~4 Cal/gram ~4 Cal/gram Lowest TEF (burns the least calories while being digested/absorbed)","Medium TEF Highest TEF (burns the most calories while being digested/absorbed)","Table 4A: The Caloric Content and Thermic Effect of Different Macronutrients Protein is the most thermogenic macronutrient. This means eating a higher protein diet will result in more calories burned because it requires more energy to digest and absorb that protein. This is one of the many reasons why high protein diets typically result in greater fat loss and better improvements in body composition, even when caloric intakes are equated. (7,29,88)","This fact serves as another example of why the expression “a calorie is a calorie” fails to capture the more complex and nuanced ways in which each of the different macronutrients are handled by our bodies.","To illustrate, let’s compare complex carbohydrates and simple carbohydrates. Complex carbohydrates are primarily made up of long chains of carbs (polysaccharides) that need to be digested and broken down into smaller molecules (disaccharides, monosaccharides) before being used for energy. On the other hand, most simple carbohydrates are already in a usable form and do not need to be digested per se. They simply need to be absorbed and can be utilized for energy or stored right away.","For example, 200 grams of sweet potato and 43 grams of Gatorade will both deliver roughly 40 grams of carbohydrates. However, the thermic effect of these two foods are quite different. Your body will expend more energy digesting and absorbing the carbohydrates from the sweet potato than it will the Gatorade.","This isn’t to say that one of these carbohydrate sources is good and the other is bad, but rather that they may be more and less suitable in certain contexts. We will revisit this topic in later chapters when we discuss carbohydrate sources and peri-workout nutrition."]},{"heading":"METABOLISM DEMYSTIFIED","paragraphs":["By now, it should be clear that the ‘calories out’ side of the energy balance equation is not as simple as merely the number of calories you burn while doing cardio. How many calories you burn in a day is determined by your body’s baseline functions (BMR), your activity (both exercise and non-exercise (NEAT)) and even the types of foods you consume (TEF). These are important truths to keep in mind as we move forward with setting up the diet and cardio protocols in the following chapters."]}],"word_count":1806},{"number":5,"title":"Setting up the Diet: Calorie Intake","start_page":56,"epigraph":{"quote":"FAILING TO PLAN IS PLANNING TO FAIL.","attribution":"Alan Lakein"},"sections":[{"paragraphs":["Now that we have covered the basic fundamentals of body recomposition and the tools required for tracking progress, it is time to set up the specific strategy to make that goal a reality.","When setting up a diet that will cause the simultaneous loss of one tissue (fat) and gain of another tissue (muscle) we need to consider four different dietary tenants, organized in order of importance:","Before digging into calorie intake, it is important to establish that these nutrition recommendations are intended to optimize body composition. While having a relatively lean body composition is strongly linked to positive health outcomes, the hierarchy is arranged in the particular order above with the goal of optimizing body composition.","As such, while we do not want to undermine the importance of eating for health, our attention will be focused on eating for body recomposition. Of course, these two goals can (and should) be in perfect sync with one another, even if their primary areas of focus slightly differ."],"list_items":["1. CALORIE INTAKE: As mentioned previously, whole body changes in energy balance will be driven primarily by total calorie intake. In this chapter, we will determine how many calories to eat for body composition based on your personal needs.","2. MACRONUTRIENT BREAKDOWN: After determining calorie intake, it is crucial to know where those calories are coming from. In Chapter Eight we will set up the best ratios of protein, carbs and fat to optimize muscle mass and training performance.","3. NUTRIENT TIMING AND MEAL DISTRIBUTION: Once we know what calories and macros will yield the best body recomp, we need to figure out how to organize those macros into meals so that we can maximize muscle gain/retention and fuel performance and recovery. This will be the topic of Chapters Nine and Eleven.","4. FOOD SOURCES: Where our calories and macronutrients are coming from also matter for driving positive body composition changes forward. We will discuss this in the context of nutrient quality in Chapter Nine and Ten."]},{"heading":"CALORIE INTAKE: HOW MANY CALORIES SHOULD I EAT?","paragraphs":["Although some people may prefer a black and white, on-the-nose answer for a calorie target, simply giving a cookie cutter calculation isn’t going to cut it for the Ultimate Guide to Body Recomposition.","Exactly how many calories you need to eat for body recomposition will depend primarily on three individual factors: your primary goal, your current body composition and your level of training experience. Although these three factors are outlined with specific examples in Table 5A, it is important to understand their conceptual basis first. Let’s start with the primary goal."]},{"heading":"1. YOUR PRIMARY GOAL","paragraphs":["Obviously, the goal with body recomposition is to build muscle AND lose fat (not to pick one or the other). However, we think it is important that even if you have the goal of achieving both, it is still important to pick what goal is more important to you.","For example, if you currently feel small and lacking in the muscularity department but are also already decently lean, even though you may want to remain lean, you might decide that building muscle is a more important goal to you.","But, if you are currently overweight, even though you want to be more muscular as well, it might be more important that you get leaner.","Then there is another scenario where you may be “skinny fat” (meaning you have a very low level of muscularity but also have a relatively high body fat percentage). Even in this situation, it is important to decide what is most important to you. Will your primary goal be to look more muscular or to look leaner?","The reason we insist on choosing a primary goal is that it will contribute to the determination of how many calories you should eat. If your primary goal is to lose fat, we recommend a moderate caloric deficit, whereas if you mostly want to build muscle, then a moderate caloric surplus is best suited for your goal. If both objectives are equally important, eating at caloric maintenance is our suggestion for you.","While this is simple enough, we will see that your current body composition and experience level can also influence how you set up your calorie intake."]},{"heading":"2. CURRENT BODY COMPOSITION","paragraphs":["Your current body composition ties in strongly to your primary goal factor. Surely, people with a higher starting body fat percentage will be wise to select the primary goal of losing fat and people with a low starting body fat percentage will be wise to select the primary goal of building muscle. Still, for the sake of being as thorough as possible, we have separated these factors into separate categories because your primary goal may not always be obvious to you.","For example, at 12 percent body fat, Joe may be satisfied with his level of leanness and decide that building muscle is more important to him. 12 percent body fat, Jim however, may decide that he’d still rather be a bit leaner. In this situation, Joe would want to favor a slight caloric surplus, while Jim would want to favor a slight caloric deficit, despite being at the same body fat percentage and training age.","Defining Body Composition: For our purposes here, we will split body composition into three categories:","Low Bodyfat: 8-12% bodyfat for men, 18-22% for women Moderate Bodyfat: 12-18% bodyfat for men, 22-28% for women High Bodyfat: 18-20+% bodyfat for men, 28-30%+ for women As a general rule of thumb, we suggest that for those with a lean physique, the best way for you to transform your physique and achieve body recomp is to enter a caloric surplus. If an already lean individual was to enter a caloric deficit, or even stay at maintenance, he or she would inhibit the ability to build muscle at an appropriate rate. This could end up in the person not making any significant progress with either muscle gain or fat loss. On the other end of the spectrum, if you’re currently at a higher body fat percentage, entering a caloric surplus would be detrimental to your goal of recomping since it will stunt fat loss. In this case, a caloric deficit will ensure that fat loss occurs as the progressive resistance training and adequate protein intake facilitate muscle growth.","As a third scenario, some of you may fall in between these two body fat categorizations into a sort of moderate body fat classification. In this case, we recommend staying closer to maintenance calories, with the goal of losing fat and building muscle being on roughly even footing. In this case, you can also default to your primary goal determinant to decide whether you should stay at true maintenance, or enter a slight surplus, or a slight deficit."]},{"heading":"3. TRAINING EXPERIENCE","paragraphs":["As mentioned previously, the more training experience you have, the closer you will be to your natural genetic limitation for muscle mass and consequently, it will be more difficult for you to gain lean mass. Conversely, someone who is still relatively new to weight training will be able to gain muscle mass much faster.","This is important to keep in mind because it implies that beginners can use larger surpluses to build muscle without accruing excessive fat mass. In other words, the more advanced you are, the more likely it is that large caloric surpluses will lead to fat gain rather than muscle gain (since you will be more resistant to muscle gain). For the purposes of this section, we will define beginner, intermediate and advanced as follows:","As an example, consider someone with only six months of lifting experience whose primary goal is to build muscle (let’s assume they are already pretty lean). Because their body is so primed for muscle growth, a relatively large (25 percent) caloric surplus will return much more lean gains than a 25 percent caloric surplus would for an advanced trainee. So, assuming their caloric maintenance (calories needed to maintain weight) is 2500 calories, a 25 percent caloric surplus would be: 2,500 calories (maintenance) + 25 percent = 3,125 calories for recomp.","Compare this with someone with five years of lifting experience. Because they are much closer to their genetic muscular ceiling, a large caloric surplus will yield more fat gain than muscle gain - not ideal for someone with a body recomp goal. Assuming they also have the primary goal of building muscle, in this case, we would recommend a smaller (~10 percent) caloric surplus: 2,500 calories (maintenance) + 10 percent = 2,750 calories for recomp. On the other hand, your training age will not directly impact how big your deficit should be since one’s ability to lose fat is not diminished with increased training experience. For the most part, beginners and veterans to the weight room will not differ in their ability to lose fat. For this reason, experience level only impacts the recommended size of a caloric surplus, not a caloric deficit."],"list_items":["BEGINNER - Making progressive overload gains on a week to week basis and significant visual changes month to month (usually 0-2 years of lifting).","INTERMEDIATE - Able to progressively overload on a month to month basis. Physique progress is evident every couple of months (usually 2-5 years of lifting).","ADVANCED - Takes multiple months or even years to see visual progress and ability to overload lifts is much more difficult (usually 5+ years of serious lifting)."]},{"heading":"4. OTHER FACTORS","paragraphs":["While the three primary factors outlined above will mostly determine how many calories you should eat (whether you should be in a caloric surplus, deficit or at maintenance), there are still a few other factors that may influence this decision."]},{"heading":"BIOFEEDBACK.","paragraphs":["Throughout the process of recomping, it is important to pay attention to biofeedback (your recovery and hunger). If your training volume or intensity is higher than normal for example, it may be necessary to increase your caloric intake during this period of increased training demands. Also, sometimes an amplified training stimulus will result in an increased appetite, perhaps as a signal that you require more nutrients to fuel proper recovery.","While you should be cautious with using your appetite to dictate your calorie intake (since your appetite generally doesn’t care about your goals), paying attention to this biofeedback can provide useful information when it comes to adjusting calorie intake."]},{"heading":"THE DETRAINEE.","paragraphs":["Body recomposition is extremely common for those who previously resistance trained, built a lot of muscle, but later stopped resistance training for an extended period of time and ended up losing muscle as a result.","Long before scientific research was able to explain it, bodybuilders talked about the phenomenon of “muscle memory.” Basically, it’s much easier to build muscle back than it was to build that muscle from scratch. Back in the day, bodybuilders simply noticed that it happened. Today, we have a much deeper understanding of how and why it works.","When we weight train and cause muscle fibers to grow in size (hypertrophy), we also increase the number of nuclei (myonuclei) in the muscle (34). You can think of myonuclei as the control center of the muscle fiber. Even though the muscle fiber itself loses size (atrophy) when we skip the gym for too long, these control centers (myonuclei) are never lost (23). As soon as we get back to training again, myonuclei that were built months or years ago can now start cranking out commands to ramp up the production of new muscle much faster than if you had never trained in the past.","Figure 5A: “Muscle Memory” - A Model for the Connection Between Muscle Size and Myonuclei (23) You may think of this like a 900 pound polar bear losing weight during hibernation season - a time of both inactivity and starvation. Once the bear resumes normal eating again, she quickly regains that lost body mass as both muscle and fat. It takes years for a bear to reach their full adult size, but after losing a significant amount of weight/mass during hibernation, it is able to get back to its full grown “physique” in just a few short months. This would be comparable to someone training for 10 years and getting close to their genetic potential in terms of muscle mass but then completely abandoning their training regimen for a year or two. They would probably lose almost all of their hard-earned decade’s worth of muscle mass and their body composition would change for the worse. However, thanks to those persistent myonuclei, they’d be able to regain that lost muscle mass in just a few short months, compared to the 10 years it took them to build it from ground zero!","While it will depend on the other factors we have just outlined (Does the detrainee have a specific primary goal? Are they starting at a high or low bodyfat?), eating at caloric maintenance is often a safe starting point to begin losing fat and building muscle for the detrainee. In many respects, the detrainee can be treated more like a beginner in the sense that they are often able to achieve impressive recomposition in a relatively short time frame."]},{"heading":"HITTING YOUR TARGET","paragraphs":["When it comes to making nutritional recommendations for weight loss or weight gain, it is common to see a specific number of calories added to or subtracted from maintenance. For example, it’s commonly suggested that if your goal is to lose one pound of fat per week, you should eat 500 calories below your maintenance. So, assuming you’d maintain your weight on 2,500 calories, if you eat 2,000 calories per day, you’ll supposedly lose about one pound per week. These suggestions are usually based on the concept that there are 3500 calories in one pound of fat, however, research indicates that this figure often overestimates predicted weight loss and undermines the adaptive nature of our metabolism (55). It is also common to see weight gain recommendations based on a target percentage of bodyweight gain per month. For example, one popular model suggests that lean beginners aim to gain 1 - 1.5 percent of body weight per month (89).","While these guidelines are valuable as rough approximations, they undermine the fact that the rate at which our bodies are capable of transforming is not the same from person to person. So for example, if we simply recommend that all lean beginners gain 1-1.5 percent of total body weight per month, we would inevitably be limiting some individuals from gaining as much muscle as they could have.","Let’s think of a lean male beginner who weighs 150 pounds. A gain of 1-1.5 percent of bodyweight per month, would translate to 1.5-2.25 pounds gained per month. This is a reasonable ballpark figure for many beginners seeking lean gains. However, this particular beginner might have been capable of gaining five pounds of lean mass per month! That would amount to 20 pounds of new lean mass in four months of training. So by following a generic percentage-based formula that spit out 1.5-2.25 pounds of recommended weight gain, he may have missed out on 11-14 pounds of lean mass over that four month period. For these reasons, we have set up calorie targets as percent changes from maintenance calories. For example, for a male beginner with a lean starting body fat (8-12 percent), we would recommend a caloric surplus of approximately 25 percent. This means he would add 25 percent to his maintenance calorie intake.","Table 5A condenses all of the information laid out above into a framework for application. To find the caloric target for your situation, simply determine your primary goal, current body composition and experience level. Keep in mind that this table, while very comprehensive, will not capture every possible scenario and that there will be some exceptions, which we will describe next."]},{"heading":"PRIMARY GOAL","paragraphs":[]},{"heading":"EXPERIENCE LEVEL","paragraphs":["Lose Fat Beginner Build Muscle Beginner Lose Fat & Build Muscle Equally Beginner Lose Fat Intermediate"]},{"heading":"CURRENT BODY COMPOSITION","paragraphs":["Male - Body Fat % ≥ 18-20 + Female - Body Fat & ≥ 28-30 + Male - Body Fat % ≤ 8-12 Female - Body Fat & ≤ 18-22 Male - Body Fat % ~12- 18 Female - Body Fat % ~22-28 Male - Body Fat % ≥ 18-20 + Female - Body Fat & ≥ 28-30 +"]},{"heading":"SUGGESTED APPROACH","paragraphs":["Caloric Deficit (~20% reduction below theoretical maintenance)","Caloric Surplus (~25% above theoretical maintenance)","Theoretical Caloric Maintenance Caloric Deficit (~20% reduction below theoretical maintenance)","Build Muscle Intermediate Lose Fat & Build Muscle Equally Intermediate Lose Fat Advanced Build Muscle Advanced See ‘Suggested Ap- proach’ for consider- ations See ‘Suggested Ap- proach’ for consider- ations Advanced Detrained See ‘Suggested Approach’","for considerations Detrained Male - Body Fat % ≤ 8-12 Female - Body Fat & ≤ 18-22 Male - Body Fat % ~12- 18 Female - Body Fat % ~22-28 Male - Body Fat % ≥ 18-20 + Female - Body Fat & ≥ 28-30 + Male - Body Fat % ≤ 8-12 Female - Body Fat & ≤ 18-22 Caloric Surplus (~15-20% above theoreti- cal maintenance)","Theoretical Caloric Maintenance Caloric Deficit (~20% reduction below theoretical maintenance)","Caloric Surplus (~10-15% above theoreti- cal maintenance)","Male - Body Fat % ~12- 18 Female - Body Fat % ~22-28 Either a small caloric deficit or surplus (+/- 5-10%) depending on the primary goal (fat loss: deficit, muscle gain: sur- plus)","Male - Body Fat % ~12- 18 Female - Body Fat % ~22-28 Male - Body Fat % ~18- 20+ Female - Body Fat % ~28-30+ If current body weight is lower than it was when you were trained, enter a caloric surplus (~20%). If body weight is similar, but body composition has regressed, start at theoretical mainte- nance.","If current body weight is higher than it was when you were trained, enter a small deficit (~20%). If body weight is similar, but body composition has regressed, start at theoretical mainte- nance.","Table 5A: Examples of Calorie Intake Based on Training Experience and Current Body Composition"]},{"heading":"EXCEPTIONS","paragraphs":["While the above table will capture the vast majority of you, there will be some cases that fall outside the purview of the recommendations above. According to the law of averages, these exceptions probably do not apply to you."]},{"heading":"EXCEPTION 1: THE MUSCLE FREAK","paragraphs":["Above, we recommended that a lean beginner enter an approximate 25 percent caloric surplus. For more than 90 percent of beginners, this intake will be high enough to fuel speedy muscle gain, yet not so high that it causes excessive fat gain.","However, some people are genetically blessed with an ability to add lean tissue much faster than average. While the technology is still in its infancy for accurate genetic testing as it pertains to muscular potential, there are still ways to estimate whether or not you have a high genetic ability to gain muscle. If most of the following apply to you, Exception 1 MAY apply:","If you decide that this exception applies to you, you may want to increase the recommended calorie surplus by 5-10 percent, especially as a beginner-intermediate, so as to maximize on your muscular potential."],"list_items":["You have a large frame: Broad shoulders, thick wrists and ankles.","You have muscular parents and/or multiple muscular relatives.","You are generally gifted at sports.","You have noticed you can build muscle quickly.","Men only: You have a high 2D:4D ratio (your ring finger is significantly longer than your index finger)"]},{"heading":"EXCEPTION 2: THE OVERWEIGHT/OBESE","paragraphs":["If you are currently well above 25 percent body fat for men or 35 percent for women, it may be wise for you to enter a larger caloric deficit than that set out in the recommendations above. For obese individuals, a caloric deficit in the range of 20-30 percent will facilitate faster fat loss as progressive weight training drives muscle growth.","Regardless of your primary goal, experience level and current body composition, all scenarios require an estimation of caloric maintenance. In order to know how many calories to eat per day, it is important to know how many calories you currently burn in a day (caloric maintenance). Once you determine your caloric maintenance, you can then determine your caloric goal based on the figures laid out in Table 5A above."]},{"heading":"ESTIMATING THEORETICAL MAINTENANCE","paragraphs":["Estimating theoretical maintenance is surprisingly straightforward. The goal is to simply determine how many calories you need to eat per day to maintain your current weight. As we discussed in Chapter Four, maintenance calories should not be thought of as a fixed number, but rather as a moving target that will change based on your changing body composition, NEAT levels and various other metabolic factors. At this point, we will present you with two ways to estimate your caloric maintenance: using a formula or using a guess-and-check method."]},{"heading":"1.USING A FORMULA.","paragraphs":["Remember the Mifflin St. Jeor formula we laid out in Chapter Four for determining BMR? Well, it’s time to put that to use. In case you forgot, here it is again:","BMR (MALE) = 10 X WEIGHT(KG) + 6.25 X HEIGHT(CM) - 5 X AGE(Y) + 5 BMR (FEMALE) = 10 X WEIGHT(KG) + 6.25 X HEIGHT(CM) - 5 X AGE(Y) - 161 As a rougher calculation of BMR, you can simply use the calculation, BMR (rough) = 10 x weight(lbs).","The above formulas are used to estimate your basal metabolic rate: how many calories you’d burn per day if you did nothing. However, to accurately determine maintenance calories, we also need an estimate of how many calories you’re burning per day through activity (both exercise and NEAT). We estimate this by using the “activity multipliers” laid out in Table 5B below."]},{"heading":"LIFESTYLE & TRAINING FREQUENCY EXAMPLE","paragraphs":[]},{"heading":"ACTIVITY MULTIPLIER","paragraphs":["Sedentary + Training 3-6x/wk Lightly Active + Training 3-6x/wk Moderately Active + Training 3-6x/ wk Highly Active + Training 3-6x/wk Works a desk job, very little activity outside of lifting Works a desk job, takes pet for a walk most days in addition to lifting Works as a full-time waitress, occa- sionally plays tennis in addition to lifting 1.2 - 1.5 1.5 - 1.8 1.8 - 2.0 Works as a construction worker, reg- ular hiking in addition to lifting 2.0 - 2.2 Table 5B: Activity Multipliers According To Lifestyle/Training Frequency (89)","For clarity on using the above table, consider a 5’7”, 150 pound male with a BMR of approximately 1,639 Calories according to the Mifflin St. Jeor formula. He works a desk job, but walks the dog on most days. According to Table 5B, he decides to use a “lightly active” activity multiplier based on this lifestyle.","GUESSTIMATED MAINTENANCE = BMR (DETERMINED USING MIFFLIN ST. JEOR)"]},{"heading":"X ACTIVITY MULTIPLIER","paragraphs":["GUESSTIMATED MAINTENANCE = 1639 X 1.6 GUESSTIMATED MAINTENANCE = 2,622 CALORIES"]},{"heading":"2. USING A GUESS-AND-CHECK METHOD.","paragraphs":["Another option you can use to estimate your maintenance calories is a guess-and-check method. The steps include:","1. Track your bodyweight and caloric intake every day for two weeks 2. Determine the average values for week one and week two.","3. Determine the average weight gained or lost from week one to week two.","4. Determine maintenance based off weight change.","a. If you maintained weight from week one to week two, then whatever your average caloric intake was can be set as your maintenance calories.","b. If you lost weight from week one to week two:","i. Assuming you need about a 500 calorie deficit per day to lose one pound of weight, you can determine maintenance by figuring out how much of a deficit you were in.","EXAMPLE 1: If you ate 3,000 calories per day on average and lost one pound from week one to week two, then your maintenance would be (3,000 + 500 calories = 3,500 calories).","EXAMPLE 2: If you ate 2,000 calories per day on average and lost 0.4 pounds from the first week to the second, then your maintenance would be (2,000 + 0.4 x 500 calories = 2,000+ 200 calories = 2,200 calories).","c. If you gained weight from week one to week two:","i. Assuming you need about a 500 calorie surplus per day to gain one pound of weight, you can determine maintenance by figuring out how much of a surplus you were in.","EXAMPLE 1: If you ate 3,000 calories per day on average and gained one pound from the first week to the second, then your maintenance would be (3,000 - 500 calories = 2,500 calories).","EXAMPLE 2: If you ate 2,600 calories per day on average and gained 0.4 pounds from week to week, then your maintenance would be (2,600 - 0.4 x 500 calories = 2,600 - 200 calories = 2,400 calories).","The benefit of using the formula-based approach is that you can figure out your maintenance calorie intake right away. The downside of using a generic calculation is that it may not be truly fine-tuned to your individual situation.","The benefit of using the guess-and-check method is that you are basing your estimation off your body’s actual response to food intake. The downside of using guess-and-check is that it takes at least two weeks to get a decent idea of what your maintenance is, which can be a drag if you are eager to get started right away.","Whatever method you choose, as long as you get a good idea of how many calories you need to maintain your weight, you can then use Table 5A to figure out whether you should increase calories, decrease calories (and by how much) or if you should eat exactly at maintenance intake.","Once you have adjusted your maintenance intake by adding or removing the appropriate percentage based on the factors in Table 5A, you officially have figured out how many calories you should eat per day to get you started on your recomp journey."]},{"heading":"CARB/CALORIE CYCLING & REFEEDS","paragraphs":["For the purposes of this book, we will define a refeed as a 24 hour period during which caloric intake is increased (normally through increased carb intake). Generally, refeeds are employed in dieters for four main reasons:","1. To acutely improve training performance (which is often impeded on low calorie/carb intakes);","2. To provide a mental break from the monotony of a fat loss diet;","3. To acutely reverse some of the negative hormonal adaptations associated with low caloric intakes and low body fat percentages, such as reduced leptin; and 4. To improve adherence to the diet.","Since our recommendations in this book are set toward achieving body recomposition, we are neither recommending very large caloric deficits nor very low end-goal body fat percentages. As such, scheduled weekly refeeds are not required, since they tend to offer benefit only to those who are very lean and/or on very low calories. Still, we believe that some would respond most optimally to a non-linear daily intake of carbohydrate (meaning carb intake will vary throughout the week) for reasons we will outline below.","In particular, we are recommending two options, depending on your specific goals and circumstances:"]},{"heading":"1. A LINEAR APPROACH (NO REFEEDS OR CARB CYCLING)","paragraphs":["A linear approach to daily caloric intake means that you will eat the same caloric intake and the same macros every day without refeeds, high carb days or calorie cycling. This approach would be most appropriate for anyone with the primary goal of building muscle and in a caloric surplus. When in a caloric surplus, it is of relatively less importance to vary your carbohydrate intake throughout the week. Since there is already an excess of nutrients to fuel performance, the diet should not be mentally strenuous and there should be no negative hormonal adaptations to reverse.","Additionally, for some individuals, establishing consistent daily habits and building trust in your ability to follow through each and every day will be better achieved by simply hitting a set target for a given period of time. (See Chapter 6 for examples of how your caloric requirements may change over time)","As long as you are being flexible with your food choices, not eating the exact same foods every day and not excessively restricting calories, high carb days may not feel necessary. If there is a particular event or special occasion that will make hitting your macronutrient targets more difficult, you can simply account for the increase in calorie intake by making a conscious effort to be more active that day (or in the coming few days), or by doing your best to estimate the nutritional content of the meal without stressing or obsessing over the specifics.","Sometimes, the best approach from a psychological perspective is to simply enjoy the occasional “free meal” or “cheat night” and get back on track the next day. In the grand scheme, the occasional missed day will not hold you back as long as you don’t allow it to derail your overall commitment to the plan.","Since a linear approach to calories and macros is the simplest approach, it is likely attractive to those who find adhering to the diet easier without having extra variables to worry about from day to day. This would mean that on training days, non-training days, the weekends, et cetera, you would have the same daily calorie and macro target to hit.","To recap, a linear approach would be best suited for individuals who are in a caloric surplus, looking for the simplest approach for adherence purposes or prefer stability and lack of change throughout the week."]},{"heading":"2. LOGICAL CARB CYCLING (NON-LINEAR CARB INTAKE)","paragraphs":["For those who are either in a deficit, or at caloric maintenance and are seeking to optimize every area of their diet, we are suggesting a “logical carb cycling” approach. We believe that, on the whole, carb-cycling has gotten more public attention than it deserves. The idea that you can somehow “trick your body” or “keep your metabolism” guessing by cycling through high carb, moderate carb and low carb days has no basis in the scientific literature. Ultimately, fat loss will be determined by energy balance throughout the week, so arbitrarily increasing and decreasing carb intakes throughout the week will not provide any extra metabolic benefits. For example, setting Monday as your high carb day, Tuesday as your moderate carb day and Wednesday as your low carb day, has no metabolic advantage from a fat loss perspective to simply eating a moderate carb intake on all three days. However, there may still be merit in cycling carb intake in a more logical fashion from a body recomposition perspective.","We have concluded that for those with more limited calories to spare, partitioning more of your energy intake on days that you train is a tool to prioritize the timing of nutrients around the workout (a concept we will revisit in Chapter 11 on peri-workout nutrition). It should be pretty intuitive: you will allocate more carbohydrates on days that you train, which will fuel your training better and may compound over time to yield greater results. This would imply that on days you are resting from the gym, you would eat slightly less carbohydrate (and slightly less calories overall).","As a simple rule of thumb for those taking the non-linear route, we recommend reducing total daily carb intake by to approximately 20 percent on non-training days.","You may also utilize this logical carb cycling approach by increasing your calories (primarily via carbs) on a day your caloric expenditure is abnormally high. For example, if you normally weight train 5x per week but happen to play two hours of basketball on top of your normal exercise regimen, you can adjust for that increased calorie expenditure by taking a refeed. If your physical activity is significantly higher than your norm, you can consider increasing carb intake by ~20% for that day.","To recap, a non-linear approach would be best suited for individuals who are in a caloric deficit or at maintenance, are looking for the most optimal approach for fueling training or prefer a more dynamic and less monotonous approach throughout the week.","For further clarification, we have provided sample meal plans for both training and non- training days at the end of the book.","Ultimately, our goal is to empower you to be your own scientist with your own physique. Our aim is to give you tools and knowledge to set up your own diet, without getting too attached to black and white suggestions.","We also want you to make adjustments to your calorie intake based on the feedback obtained from the body recomposition toolkit outlined in the second chapter. How is your physique looking? How are your strength levels in the gym? How is the number on the scale changing in response to your caloric intake?","In the next chapter, we will outline some suggestions on how to make adjustments to your caloric intake over time so you can avoid plateaus and continue driving progress forward as your physique and goals change."]}],"word_count":5383},{"number":6,"title":"The Art Of Self-Coaching","start_page":77,"epigraph":{"quote":"IF YOU COULD KICK THE PERSON IN THE PANTS RESPONSIBLE FOR MOST OF YOUR TROUBLE, YOU WOULDN’T SIT FOR A MONTH.","attribution":"Theodore Roosevelt"},"sections":[{"paragraphs":["At this point, you have set up your calorie target, which will be the main nutritional variable driving your progress forward. However, this number should be thought of as a moving target rather than a fixed total to follow for the rest of time.","On your recomposition journey, you will eventually have to make adjustments to caloric intake as your metabolism adapts, your body composition changes and as your goals change as well. If taking on this journey under the counsel of a coach, they will be responsible for determining if and when changes need to be made. However, if you are taking on this journey without the guiding eye of a coach, we think it will be useful to provide you with general guidelines for adjusting your approach as time goes by.","When self-coaching, it is important that you use the mandatory toolkit to periodically self- assess your progress, and use those periodic assessments to make adjustments to the diet when necessary.","It would also be wise to regularly remind yourself to trust the process throughout this journey. When self-coaching, it can often be tempting to second guess your methods and make adjustments to the plan more frequently than you should. While to do the entirety of self-coaching justice would require another book in itself, in this section we’d like to offer some guiding principles to help keep you going in the right direction as you move along. Below is a reminder of how frequently you should be using the mandatory toolkit to assess progress."]},{"heading":"FREQUENCY REQUIRED FOR MANDATORY TOOLS:","paragraphs":["1. Body weight Scale: 4-7x per week to calculate a 7-day avg.","2. Circumference Measurement: Biweekly or Monthly (the less experience your are, the more frequently you should implement)","3. Progress Photos: 1-4x per month (higher frequency for those with less experienced as progress is typically faster)"]},{"heading":"IF IT’S NOT BROKE, DON’T FIX IT","paragraphs":["In general, we recommend doing a complete self-assessment once or twice monthly, where you take a look at the collective data from your toolkit. If the tools collectively indicate that you are making progress with your primary goal, then we recommend not adjusting the plan. If it’s working, keep going. Making adjustments more frequently than this can result in flip-flopping on your goals, paralysis by analysis and less reflective judgement. Consider a few examples of when it would NOT be appropriate to adjust calories: 1. You’re losing fat. If your primary goal was to lose body fat and after one month you find that your waist circumference is down, your progress photos are looking leaner and tighter and your weekly bodyweight average is lower, the same or similar, then this feedback collectively indicates that you have lost fat while building muscle. It’s working. No need for an adjustment.","2. You’re building muscle. If building muscle is your primary goal and after one month the number on the scale is up, your waist circumference is lower or the same and you are looking wider across the shoulders in your progress photos, this indicates that you have definitely built muscle while losing or maintaining fat mass. It’s working. No need for an adjustment.","3. You’re losing fat and building muscle. Now let’s say your primary goal was to build muscle and lose fat equally. After one month, you find that the number on the scale is the same or slightly up, but your waist circumference is down and your progress photos are looking tighter and more muscular. This collective data indicates that you have built muscle while losing body fat. It’s working. No need for an adjustment.","Next, consider some examples of when it would be appropriate to adjust calories: 1. You’re NOT losing fat. If your primary goal was to lose body fat and after one month you find that your waist circumference is up or unchanged, your progress photos are looking exactly the same and your weekly bodyweight average is the same or up, then this feedback indicates that you have not lost fat, although you may have built some muscle! In this case, since your primary goal was to lose fat, an adjustment to caloric intake may be required to get fat loss moving at a faster rate.","We recommend increasing the caloric deficit through one of two means. You may want to simply reduce calories. To help get fat loss moving faster, why not increase the deficit by removing 100-250 calories from the diet? We suggest removing these calories from your carb and/or fat intake, but never protein. If increasing the deficit by removing fats, be sure to never let your total daily fat intake drop below 20 percent of total calories. Alternatively, you can make an adjustment by increasing cardio. If you would rather not remove calories further from your diet, you can also get fat loss moving faster by adding extra cardio. Add only one or two 30 minute low-intensity steady state (LISS) cardio sessions per week or make an effort to increase NEAT through simple strategies to move around more and fidget throughout the day. If making an increase to cardio, be sure not to exceed the maximum cardio recommendations laid out in Chapter Twelve.","2. You’re NOT building muscle. If your primary goal is to build muscle and after one month, you find that your bodyweight is the same (or down), your waist circumference is unchanged (or down) and your progress photos are looking a bit leaner but not more muscular, this feedback collectively indicates that you may have lost fat, but you may not have built much muscle.","Since muscle gain can be more difficult to detect than fat loss, before jumping to conclusions, you can look to other tools for guidance. For example, are you gaining strength in the gym? If so, despite the feedback from the other three tools, it is still possible that you have built muscle while losing fat. Keep going and stick to the plan. You can also check body part circumference measurements (chest, arms, thighs) to get a better idea of whether or not you have built muscle.","Muscle gain is also simply less detectable in more advanced trainees, so we advise that those with more training years under their belt be even more patient when making adjustments. Still, in this case, since your primary goal was to build muscle, an adjustment to caloric intake may be required to get you gaining lean mass at a faster rate. We recommend increasing the caloric surplus by adding 100-500 calories to the diet.","How many calories you add will depend on whether you were losing weight, maintaining weight, or gaining weight at a slower rate than you’d like. The faster you want to pick up the rate of progress, the more aggressive you should be with a caloric increase. We suggest adding these calories through the addition of carbs and/or fats, while still keeping the ratios in check with the numbers outlined in Chapter Eight.","Outside of these scenarios, we recommend being patient and trusting the process. Rather than constantly switching up your calories and macros, you should pay closer attention to peri-workout nutrition (Chapter Eleven), your quality of work in the gym (Chapter Fifteen) and your quality of sleep (Chapter Fourteen)."]},{"heading":"SWITCHING GOALS (LONG TERM ADJUSTMENTS)","paragraphs":["For this third aspect of self-coaching, let’s assume you’ve achieved a significant amount of body recomposition and are considering switching your primary goal from losing fat to building muscle (or vice versa). Below are some guiding principles for making such a switch. When you should switch from caloric deficit (recomp/cutting) to a caloric surplus (recomp/ lean-bulking):","At this point in time, we recommend going back through the steps laid out in Chapter 5 and setting yourself up with new calories based on your new goals. If you have been in a prolonged, aggressive caloric deficit, you may gradually increase calories over the course of two to three weeks as you transition from deficit to surplus, although such a transition is not required.","When you should switch from caloric surplus (recomp/lean-bulking) to a caloric deficit (recomp/cutting).","At this point in time, we also recommend going back through the steps laid out in Chapter 5 and setting yourself up with new calories based on your new goals. There is no need to gradually transition from a surplus intake to a deficit intake. Begin your new calories/ macros right away."],"list_items":["Your primary goal has shifted from fat loss to muscle building.","You have made significant progress and are happy with your current body fat level and overall composition.","You’ve been in a calorie deficit for a long period of time and are experiencing negative side effects (i.e. irritable, food-focused, hormonal disruption, poor gym performance, decreased mood, extreme fatigue) (74,124)","You’re extremely lean and it’s negatively impacting your health. (74,124)","You’ve been in a caloric deficit for a long period of time and are no longer progressing in the gym (27)","Your primary goal has shifted from building muscle to losing fat.","You’ve unintentionally accumulated more body fat than you’d like throughout your recomp process and are now decreasing your overall health, wellness and fitness levels.","You’ve been bulking for a while, previously made progress, but progress has significantly slowed.","You’re no longer getting good pumps in the gym, are feeling tired after your carbohydrate meals, and rarely have an appetite."]}],"word_count":1543},{"number":7,"title":"The Skinny Fat Dilemma","start_page":84,"epigraph":{"quote":"THE BEST PROJECT YOU WILL EVER WORK ON IS YOU","attribution":"Sonny Franco"},"sections":[{"paragraphs":["‘Skinny fat’ is a popular buzz-term used to describe someone who is of normal body weight but has a high level of body fat. In visual terms, it would describe an individual with low muscularity but relatively high bodyfat. We will define a skinny fat male as having more than 20 percent body fat with low muscularity and a skinny fat female as having more than 35 percent body fat with low muscularity.","Therefore, if your body fat levels are not this high, despite having low muscularity you would not qualify as being truly skinny fat and should instead simply set up your calories as outlined. If this label does fit, a bulking approach may be tempting because you would like to look more muscular. However, a bulking phase will most often lead to an even fatter appearance and exacerbate the potential health concerns associated with having a higher body fat percentage.","People who are skinny fat (despite their normal body weight) have an increased risk of developing metabolic syndrome. They also tend to have insulin-resistance, excess visceral fat, high blood triglycerides, elevated blood pressure and may be at a greater risk for developing cardiovascular disease (108,109). For this reason, we generally advise against a caloric surplus for skinny fat individuals.","Likewise, while an aggressive cutting approach may improve health outcomes by lowering body fat levels, it will also most likely result in an even skinnier appearance. This is why we believe body recomposition to be the ideal route for someone who is indeed skinny fat. First, if you fall within this criteria, just know you’re not alone. In 2008, the National Health and Nutrition Examination Survey found that 24 percent of normal-weight American adults were metabolically abnormal (133). An outstanding one in four individuals who are of normal weight, can be classified as skinny-fat.","Our objective is to help anyone who fits this criteria improve their body composition, overall health and build the physique of their dreams.","One important thing to note is that most people who lack muscle mass don’t have much resistance-training experience and as such, are far away from their genetic potential. Therefore, even if it may seem like the cards are stacked against you, in reality, you are in a superb position to recomp with a very high likelihood of gaining muscle while losing fat. For both body composition and health purposes, we generally advise that reducing body fat percentage be set as the primary dietary goal while the weight training and high protein intake drive the muscle building process.","Depending on whether you are “more skinny than fat” or “more fat than skinny”, it may be more important that you focus on losing fat first, building muscle first or do both concurrently. Below is a schematic of our recommended approach depending on which boat you find yourself in.","Figure 7A: Schematic For Skinny Fat As you can see in the figure above, as your body composition improves, you will enter different phases of recomposition. Below, we will outline one such example of a skinny-fat individual who prioritized looking leaner first.","PHASE 1: LOWER BODY FAT PERCENTAGE (~10-20% CALORIC DEFICIT)","As mentioned above, assuming the primary goal is to look leaner, we suggest a 10-20 percent deficit to start off your recomposition phase. Even if you would like to achieve both goals equally, it may be well-advised to put your overall health at the forefront. Also, prioritizing being leaner will allow measures like insulin sensitivity to improve, which can actually benefit body recomposition over the long run by improving nutrient partitioning. Of course, we do not recommend that you remain in a calorie deficit indefinitely, as this will eventually impede your muscle building potential. Once you have lost a significant amount of body fat, seen significant reductions in your waist circumference and leaner progress photos, we recommend transitioning out of a calorie deficit and into Phase 2: Caloric Maintenance. For context, it would be appropriate to begin the transition from Phase 1 to Phase 2 after going from approximately 20 percent body fat to approximately 15 percent as a male or from about 35 percent body fat to around 28 percent as a female. Generally, Phase 1 can last anywhere from two to six months, depending on the extent of fat loss required."]},{"heading":"PHASE 2: GAIN LEAN MASS AND LOWER BODY FAT PERCENTAGE (~CALORIC MAINTENANCE)","paragraphs":["Now that you have achieved a lower body fat percentage, it is time to transition to caloric maintenance so that muscle can be built at a faster rate. This may require recalculation of your current caloric needs based on your new body weight, body composition and activity level as covered earlier in this chapter.","By decreasing your fat mass in Phase 1, you will now be more insulin sensitive and can begin to shift your macronutrient ratios as well. We will cover macronutrients in detail in Chapter Eight, but for now, we generally recommend increasing your carbohydrate intake and decreasing your fat intake as you get leaner and more muscular.","For example, if your were consuming 35 percent of your total calories from fat in Phase 1, you may now reduce fat intake to make up 25-30 percent of total calories in Phase 2. This shift should lead to improved training performance, better pumps in the gym and increased muscle fullness.","Phase 2 would involve taking the male who got down to approximately 15 percent body fat in Phase 1, down even further to 10-12 percent (as muscle mass gain naturally lowers body fat percentage).","For the female that ended Phase 1 at about 28 percent, she may get down to 20-25 percent body fat in Phase 2. Generally, Phase 2 can take anywhere from 1-12 months depending on the individual’s needs and goals. For example, you may only need a few months at caloric maintenance before you are ready to prioritize building muscle and enter Phase 3. On the other hand, it is fine to stay in Phase 2 for an extended period of time if you would prefer to continue recomping by gradually losing fat and building muscle, without prioritizing one over the other.","It is common however, for people to notice their physique making the greatest progress when shifting from a fat loss-focused phase to a muscle building phase. A proper shift to Phase 3 can result in just about pure muscle gain, in a near absence of any fat gain. You are now primed to make the most impressive visual progress by shifting into Phase 3: a moderate caloric surplus.","PHASE 3: ESTABLISH NEW PRIMARY GOALS (~10-25% CALORIC"]},{"heading":"SURPLUS)","paragraphs":["At this point, you have prioritized fat loss in Phase 1, lowered your body fat percentage while increasing muscle mass more substantially in Phase 2 and may now be ready to prioritize a faster rate of muscle gain by entering a caloric surplus.","Just as with Phase 2, this may require recalculation of your current caloric needs as laid out earlier in this chapter. Also, since your body fat percentage continued to decrease during Phase 2, insulin sensitivity has continued to improve and macronutrient ratios can be further adjusted to include more carbohydrates with less fats (but never allowing fats to drop below 20 percent of your total calories).","At this point, we recommend gradually increasing your total calorie intake up to around 10-25 percent. If you are more concerned with staying leaner and avoiding fat gain, we recommend sticking to slower calorie increases and a smaller overall caloric surplus (closer to 10 percent). If you are more concerned with building muscle and are comfortable with adding some fat, we recommend going with faster calorie increases and a larger overall caloric surplus (closer to 25 percent).","Generally, Phase 3 can last anywhere from 2-12 months, depending on the individual’s needs and goals. After Phase 3, it is simply a matter of continuing to periodically reassess progress using the Tools of the Titans (Chapter Two) and updating your calorie and macronutrient needs based on your changing goals.","Please refer back to the “Art of Self-Coaching” chapter for further elaboration beyond Phase 3.","Now that target calorie intake has been determined and it’s clear how they should be adjusted over time, figuring out macronutrient targets is the next step.","Once you have set your macronutrient targets in place, we will take a dive deep into how to optimize your nutritional approach as a means to enhance performance in the gym, recovery out of the gym, and thus have the greatest impact on your body composition."]}],"word_count":1413},{"number":8,"title":"Unpacking Macros and Micros","start_page":92,"epigraph":{"quote":"THE HISTORY OF MODERN NUTRITIONISM HAS BEEN A HISTORY OF MACRONUTRIENTS AT WAR: PROTEIN AGAINST CARBS; CARBS AGAINST PROTEIN, AND THEN FATS; FATS AGAINST CARBS.","attribution":"Michael Pollon"},"sections":[{"paragraphs":["Now that we have established a baseline caloric intake to fuel positive body composition change based on your specific needs and goals, it is time to get even more specific and determine where those calories should be coming from.","In particular, we need to figure out the ideal amounts of each of the three macronutrients required to maximize lean mass, while minimizing fat mass. Although most of you will likely be familiar with the basic terminology, it’s important to make sure everyone is on the same page before digging into the scientific research and the deeper complexities therein."]},{"heading":"MACRONUTRIENTS","paragraphs":["There are three key macronutrients which make up the calories we consume in food. The prefix MACRO refers to the nutrients our bodies use in BIG amounts to function properly (on the scale of grams). The macros we will discuss in this chapter are protein, carbs and fats."]},{"heading":"MICRONUTRIENTS","paragraphs":["Micronutrients, on the other hand, are nutrients like vitamins and minerals that our bodies use in small amounts (on the scale of milligrams).","While vitamins and minerals are absolutely vital to a well-functioning and healthy human body, we aren’t going to spend a lot of time on them in this book. Granted, there are a few ways that deficiency in certain micronutrients could stunt or halt a recomp. As one example, a diet deficient in zinc has been linked to lower testosterone (67), impaired insulin sensitivity and depression (51).","Of course, the downstream effect of these possibilities include impaired training performance, lack of motivation, decreased dietary adherence and unfavorable changes in body composition. Clearly, getting enough Zinc in your diet matters for body recomposition. Still, with there being 13 essential vitamins and 16 essential minerals, to go through each one individually and speculate on its recomposition implications would require a separate book in its own right. Instead, we have laid out the Six Micronutrient Commandments to ensure that all micronutrient bases are covered.","It is safe to assume that if you follow the guidelines below, you probably don’t need to spend any more time worrying about missing out on micronutrient targets as far as body recomp is concerned. Whether or not these guidelines are sufficient on their own to maximize every area of health is not a dispute we will try to settle between these covers."]},{"heading":"THE SIX MICRONUTRIENT COMMANDMENTS:","paragraphs":["1. Aim for at least three or four servings of green vegetables per day.","2. Aim for at least two servings of fruit per day.","3. Try to regularly eat a variety of fruits and vegetables of different colours and rotate food sources.","4. Consume fatty fish once or twice per week (otherwise, consider fish oil supplements. See Chapter Thirteen).","5. Eat a varied, balanced diet. If eliminating grains, dairy or meat, consider supplementation of vitamin B12, vitamin D, omega-3 fatty acids, iodine, iron, calcium, and zinc under the guidance of a medical professional.","6. Generally, stick to a whole food, minimally-processed, nutrient-dense diet. With these commandments in mind, our main focus in this section will be aimed toward the macronutrients, since along with total calorie intake, they will be the main nutritional drivers of body recomposition. Let’s start with the most important macronutrient of the three - protein."],"list_ite
